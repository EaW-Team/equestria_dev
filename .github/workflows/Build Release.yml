name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  STEAM_APP_ID: "394360"
  STEAM_WORKSHOP_ITEM_ID: "1826643372"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Set up ImageMagick
        uses: mfinelli/setup-imagemagick@v8.0.0

      - name: Build release
        run: |
          chmod +x .github/scripts/prepare_for_upload.sh
          .github/scripts/prepare_for_upload.sh build/equestria equestria.jpg
          cd build
          zip -rq ../equestria.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: equestria
          path: equestria.zip

      - name: Upload files to GitHub release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          file: equestria.zip
          tag: ${{ github.event.release.tag_name }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: true

      - name: Prepare Steam Workshop metadata
        id: steam_metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/prepare_steam_workshop_metadata.py

      - name: Upload to Steam Workshop
        uses: Yard1/steam-mod-deploy@9a0b428545cae02fc498299b38a1d1ca4deea733
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ env.STEAM_APP_ID }}
          publishedFileId: ${{ env.STEAM_WORKSHOP_ITEM_ID }}
          contentPath: build/equestria
          description: ${{ steps.steam_metadata.outputs.description }}
          changeNote: ${{ steps.steam_metadata.outputs.change_note }}
