name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  STEAM_APP_ID: ${{ vars.HOI4_APP_ID }}
  VANILLA_FACTS_PATH: ${{ vars.HOI4_VANILLA_FACTS_PATH }}
  STEAM_WORKSHOP_ITEM_ID: "1826643372"

jobs:
  update-vanilla-facts:
    uses: ./.github/workflows/update-vanilla-facts.yml
    secrets: inherit

  build:
    needs: update-vanilla-facts
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Download latest vanilla checksum facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_facts_path="$(
            jq -rn --arg path "$VANILLA_FACTS_PATH" \
              '$path | split("/") | map(@uri) | join("/")'
          )"
          mkdir -p "$(dirname "$VANILLA_FACTS_PATH")"
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github.raw+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Cache-Control: no-cache" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --get \
            --data-urlencode \
              "ref=${{ github.event.repository.default_branch }}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/$encoded_facts_path" \
            --output "$VANILLA_FACTS_PATH"
          grep -Fxq "# hoi4-vanilla-facts-v1" "$VANILLA_FACTS_PATH" || {
            echo "::error::Downloaded vanilla facts are invalid."
            exit 1
          }
          awk -F '\t' '$1 == "version" {
            print "Vanilla facts version: " $2
          }' "$VANILLA_FACTS_PATH"

      - name: Set up ImageMagick
        uses: mfinelli/setup-imagemagick@v8.0.0

      - name: Build release
        run: |
          chmod +x .github/scripts/prepare_for_upload.sh
          .github/scripts/prepare_for_upload.sh build/equestria equestria.jpg
          cd build
          zip -rq ../equestria.zip .

      - name: Generate Hearts of Iron IV checksum
        id: hoi4_checksum
        run: |
          checksum="$(python3 .github/scripts/hoi4_checksum.py \
            "$VANILLA_FACTS_PATH" \
            build/equestria)"
          if [[ ! "$checksum" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::Checksum generator returned an invalid value: $checksum"
            exit 1
          fi
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "HOI4 checksum: $checksum"
          echo "HOI4 multiplayer checksum: ${checksum: -4}"

      - name: Update GitHub release checksum
        uses: actions/github-script@v7
        env:
          CHECKSUM: ${{ steps.hoi4_checksum.outputs.checksum }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const checksum = process.env.CHECKSUM;
            const checksumLine = `Checksum: \`${checksum.slice(-4)}\``;
            const placeholder = "Checksum: ``";
            const {data: release} = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
            });

            let body = release.body || "";
            if (body.includes(placeholder)) {
              body = body.split(placeholder).join(checksumLine);
            } else {
              body = body.replace(/(?:\r?\n)+$/, "");
              body = body ? `${body}\n\n${checksumLine}` : checksumLine;
            }

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body,
            });
            core.info(`GitHub release checksum: ${checksum.slice(-4)}`);

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: equestria
          path: equestria.zip

      - name: Upload files to GitHub release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          file: equestria.zip
          tag: ${{ github.event.release.tag_name }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          overwrite: true

      - name: Prepare Steam Workshop metadata
        id: steam_metadata
        env:
          CHECKSUM: ${{ steps.hoi4_checksum.outputs.checksum }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 .github/scripts/prepare_steam_workshop_metadata.py

      - name: Upload to Steam Workshop
        id: steam_upload
        uses: Yard1/steam-mod-deploy@d945af85372652b337695606e43502cd4c3ad794
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ env.STEAM_APP_ID }}
          publishedFileId: ${{ env.STEAM_WORKSHOP_ITEM_ID }}
          contentPath: build/equestria
          description: ${{ steps.steam_metadata.outputs.description }}
          changeNote: ${{ steps.steam_metadata.outputs.change_note }}

      - name: Encrypt Steam diagnostics
        continue-on-error: true
        id: steam_diagnostics
        if: ${{ failure() && steps.steam_upload.outcome == 'failure' }}
        shell: bash
        env:
          STEAM_LOGS_PASSWORD: ${{ secrets.STEAM_LOGS_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$STEAM_LOGS_PASSWORD" ]]; then
            echo "::error::Set the STEAM_LOGS_PASSWORD repository secret to encrypt Steam diagnostics."
            exit 1
          fi

          # Docker actions mount this runner directory at /github/home.
          steam_home="$RUNNER_TEMP/_github_home"
          if [[ ! -d "$steam_home" ]]; then
            echo "::warning::Steam home directory was not found."
            exit 0
          fi

          log_temp=$(mktemp -d "$RUNNER_TEMP/steam-diagnostics.XXXXXX")
          trap 'rm -rf "$log_temp"' EXIT
          cd "$steam_home"
          # Select only diagnostic logs, never config.vdf or other login files.
          find . -type f \
            \( -path '*/logs/connection_log.txt' \
            -o -path '*/logs/content_log.txt' \
            -o -path '*/logs/Workshop_log.txt' \
            -o -path '*/logs/workshop_log.txt' \
            -o -path '*/logs/stderr.txt' \
            -o -path '*/logs/bootstrap_log.txt' \
            -o -path "*/workshopbuilds/depot_build_${STEAM_APP_ID}.log" \) \
            -print0 > "$log_temp/files"
          if [[ ! -s "$log_temp/files" ]]; then
            echo "::warning::No Steam diagnostic logs were found."
            exit 0
          fi

          # Ubuntu's 7zip package provides 7z; standalone releases use 7zz.
          if ! seven_zip=$(command -v 7z || command -v 7zz); then
            sudo apt-get update
            sudo apt-get install --yes 7zip
            seven_zip=$(command -v 7z || command -v 7zz) || {
              echo "::error::7-Zip is unavailable after installing the 7zip package."
              exit 1
            }
          fi

          mapfile -d '' -t log_files < "$log_temp/files"
          # Read the password from stdin so it is not exposed in process arguments.
          "$seven_zip" a -tzip -spf -mem=AES256 -p -bso0 -bsp0 \
            "$log_temp/steam-diagnostics.zip" "${log_files[@]#./}" \
            <<< "$STEAM_LOGS_PASSWORD"
          encrypted_log="$RUNNER_TEMP/steam-diagnostics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          mv "$log_temp/steam-diagnostics.zip" "$encrypted_log"
          echo "path=$encrypted_log" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted Steam diagnostics
        continue-on-error: true
        if: ${{ always() && steps.steam_diagnostics.outputs.path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: steam-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.steam_diagnostics.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
