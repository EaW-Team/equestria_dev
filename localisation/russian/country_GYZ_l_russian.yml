### Designer Loc ###

GYZ_megacorp:0 "КВПК"
GYZ_megacorp_desc:0 "Каренский военно-промышленный кооператив – вполне законная и достойная промышленная корпорация, хотя вывеска кооператива для неё всего лишь ширма. На деле это насквозь коррумпированная структура, созданная верхушкой Карена для снабжения личных и государственных сил безопасности, что вызывает немалое раздражение у сторонних наблюдателей. Впрочем, рабочим на службе у сильных мира сего платят вполне достойно."

GYZ_karen_management:0 "Карени Менеджмент Солюшнз"
GYZ_karen_management_desc:0 "КМС, основанная за много лет до прихода Короля Шторма, заслужила репутацию одного из немногих процветающих предприятий йети и единственного, чья штаб-квартира по-прежнему остаётся в Карене. Во время правления Его Величества компания переживала не лучшие времена из-за своего смешанного, а не сугубо военного профиля, а также общего падения значимости региона по сравнению с Глазом Бури, но всё же сумела не обанкротиться. После внезапной смерти Короля Шторма и притока местных инвестиций корпорация пережила мощный подъём и готова вернуть себе влияние в экономике, какая бы судьба ни постигла королевство йети."

GYZ_karen_management_2:0 "Карени Менеджмент Солюшнз"
GYZ_karen_management_2_desc:0 "КМС, основанная за много лет до прихода Короля Шторма, заслужила репутацию одного из немногих процветающих предприятий йети и единственного, чья штаб-квартира по-прежнему остаётся в Карене. Во время правления Его Величества компания переживала не лучшие времена из-за своего смешанного, а не сугубо военного профиля, а также общего падения значимости региона по сравнению с Глазом Бури, но всё же сумела не обанкротиться. После внезапной смерти Короля Шторма и притока местных инвестиций корпорация пережила мощный подъём и готова вернуть себе влияние в экономике, какая бы судьба ни постигла королевство йети."

