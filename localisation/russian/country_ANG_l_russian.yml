l_russian:

### ideas ###
ANG_anarchists:0 "Армия Свободного Государства"
ANG_anarchists_desc:0 "Во время Республиканской революции 978 года Энгривер вступил в войну не только с республиканцами, но и с крестьянскими ополчениями Союза анархистов Энгривера.\n\nХотя революция и сами анархисты были быстро разгромлены уже через год, их уцелевшие бойцы, командиры и сторонники ушли в Шайсвальд, продолжая изводить нашу страну и по сей день."
ANG_cults:0 "Чёрный Коготь"
ANG_cults_desc:0 "Под тканью энгриверского общества скрывается зловещая тайная организация под названием «Чёрный Коготь». Несмотря на все усилия наших правителей на протяжении столетий, нам не удавалось раскрыть существование этой проблемной организации. По сей день их конечные цели и мотивы остаются полной загадкой. Для большинства Чёрный Коготь – это не более чем вероломные птицы и страшные сказки, которыми пугают птенцов перед сном."
ANG_underdeveloped_economy:0 "Недоразвитая экономика"
ANG_underdeveloped_economy_desc:0 "Энгривер имеет «честь» быть, пожалуй, наименее развитым графством в Сердце Империи – причина тому Шайсвальд, который на протяжении веков успешно препятствовал крупным инвестициям и служил рассадником множества отвратительных тварей и кровожадных бандитов."
ANG_underdeveloped_economy_2:0 "Недоразвитая экономика"
ANG_underdeveloped_economy_2_desc:0 "Энгривер имеет «честь» быть, пожалуй, наименее развитым графством в Сердце Империи – причина тому Шайсвальд, который на протяжении веков успешно препятствовал крупным инвестициям и служил рассадником множества отвратительных тварей и кровожадных бандитов."
ANG_our_traditions_idea:0 "Рейнджеры Шайсвальда"
ANG_our_traditions_idea_desc:0 "Адаптируйтесь, импровизируйте, превозмогайте – рейнджеры Энгривера отточили свои навыки за годы патрулирования Шайсвальда. Теперь они делятся своим опытом с остальной армией, делая её более расторопной и эффективной."
ANG_inspired_army_idea:0 "Тело и дух"
ANG_inspired_army_idea_desc:0 "Наш прогресс в модернизации вооружённых сил вдохновил грифонов, и они стали уделять больше времени тренировкам. Кроме того, число призывников начало расти, заполняя пробелы в нашей армии."
ANG_superior_army_idea:0 "Превосходство на поле битвы"
ANG_superior_army_idea_desc:0 "Муштра, тренировки и снова учения! Наши грифоны тренируются до изнеможения, восполняя былую нехватку опыта железной дисциплиной. Результаты уже налицо: армия Энгривера перестала быть жалким посмешищем и превратилась в грозную силу, с которой придётся считаться каждому!"
ANG_military_academy_idea:0 "Военная академия Аппенгена"
ANG_military_academy_idea_desc:0 "Новая военная академия уже начала подготовку нового поколения офицеров, а её независимость от Грифенхейма означает, что мы вольны разрабатывать собственные доктрины и стратегии, какие сочтём нужными."
ANG_napalm_idea:0 "Напалм"
ANG_napalm_idea_desc:0 "Напалм – летучая зажигательная смесь, сжигающая всё без разбора, будь то грифоны, транспортные средства или здания. Невероятно мощное и ужасное оружие, которое мы начали широко применять."
ANG_farmland_idea:0 "Сельхозугодья"
ANG_farmland_idea_desc:0 "Расширение сельскохозяйственных угодий принесло немало полезных плодов – таких как рост рождаемости, полные тарелки жаркого с фетизской капустой и более высокая производительность работников. Сытый грифон – счастливый грифон, и никто больше не будет голодать."
ANG_national_bank_idea:0 "Центральный банк"
ANG_national_bank_idea_desc:0 "Национальный банк управляет нашей валютой, денежной массой и процентными ставками, а также контролирует коммерческую банковскую систему. Он обладает надзорными полномочиями для предотвращения безрассудных или мошеннических действий банков и обеспечения их платёжеспособности."
ANG_republican_sentiments_idea:0 "Республиканизм на подъёме"
ANG_republican_sentiments_idea_desc:0 "Тяжёлая ситуация, в которой мы оказались, имеет побочный эффект в виде усиления ложных идеологий. Радикальные голоса звучат всё громче – отголоски того, чего не было слышно со времён неудавшейся революции."
ANG_reinforced_police_force:0 "Национальный полицейский комитет"
ANG_reinforced_police_force_desc:0 "Наша полиция была усилена и реорганизована в более сплочённую, централизованно управляемую структуру. Эти реформированные силы способны эффективнее выполнять правоохранительные задачи по всей стране."
ANG_reinforced_police_force_lar:0 "Национальный полицейский комитет"
ANG_reinforced_police_force_lar_desc:0 "Наша полиция была усилена и реорганизована в более сплочённую, централизованно управляемую структуру. Эти реформированные силы способны эффективнее выполнять правоохранительные задачи по всей стране."
ANG_free_press_idea:0 "Свободная пресса"
ANG_free_press_idea_desc:0 "Каждый грифон имеет право на свободу мнений и их свободное выражение, а также право распространять информацию и идеи через средства массовой информации. Разумеется, если эти идеи не подстрекают к свержению правительства."
ANG_welfare:0 "Социальный кодекс"
ANG_welfare_desc:0 "Социальный кодекс представляет собой комплекс программ, реализуемых Отмаром для поддержки рабочего класса и ослабления влияния социализма. Эти меры включают страхование на случай болезни, старости и инвалидности, а также другие гарантии защиты работников."
ANG_industrial_center:0 "Промышленный центр Грифинга"
ANG_industrial_center_desc:0 "Устойчивые государственные инвестиции превратили Грифинг в промышленный центр. В городе развернулась тяжёлая промышленность, и по многим дням небо затянуто смогом."
ANG_citizenship:0 "Открытость"
ANG_citizenship_desc:0 "Иммиграция в страну приветствуется и поощряется! Это не только проявление сострадания – эти новые жители также помогут нам в долгосрочной перспективе как в экономическом, так и в военном отношении."
ANG_national_guard_idea:0 "Национальная гвардия Энгривера"
ANG_national_guard_idea_desc:0 "Отмар счёл целесообразным создать Национальную гвардию, действующую в Энгривере в качестве ополчения. Мир и стабильность будут обеспечены под защитой этих доблестных грифонов."
ANG_our_homeland_idea:0 "За что мы сражаемся"
ANG_our_homeland_idea_desc:0 "Отмар спас нашу страну и дал нам свободу, которой у нас прежде не было! Наша родина процветает, и мы будем защищать её всеми силами. Пока наш добрый барон ведёт нас – победа неизбежна!"
ANG_local_councils_idea:0 "Сельскохозяйственные советы"
ANG_local_councils_idea_desc:0 "Крестьяне больше не находятся в рабстве и не подвергаются эксплуатации со стороны богатых и сильных. Местные советы созданы для того, чтобы общины могли сами управлять своими делами. Вместе они сплетут единую сеть по всей нашей великой земле!"
ANG_faith_and_ideology:0 "Вера и свобода"
ANG_faith_and_ideology_desc:0 "Граждан призывают подвергать сомнению мирскую власть, особенно власть деспотичного духовенства. Отныне каждый волен верить по-своему, не прибегая к услугам корыстных посредников."
ANG_red_rangers_idea:0 "Красные рейнджеры"
ANG_red_rangers_idea_desc:0 "Красные рейнджеры в основном состоят из ветеранов Армии Свободного Государства, имеющих большой опыт действий в Шайсвальде. Они привносят ценные навыки партизанской войны в наши вооружённые силы."
ANG_army_idea:0 "Коммунарская армия Энгривера"
ANG_army_idea_desc:0 "Структура нашей армии далека от традиционной и представляет собой демократическую организацию, основанную на солдатских комитетах и общих собраниях. Все командиры избираются, а для обсуждения политики регулярно проводятся общие собрания. Армия опирается на самодисциплину, поскольку все дисциплинарные нормы утверждаются солдатскими собраниями."
ANG_syndicates_idea:0 "Анархо-синдикализм"
ANG_syndicates_idea_desc:0 "Профсоюзы лежат в основе нашего общества и служат лучшим инструментом политического представительства и справедливого управления в интересах всех. Эти синдикаты должны управлять экономикой, поскольку государство по своей сути враждебно интересам трудящихся."
ANG_for_the_people_idea:0 "Свобода, демократия, процветание!"
ANG_for_the_people_idea_desc:0 "Три принципа – для народа, и мы сражаемся за народ. Они – сердце и душа нашей нации, и мы никогда не должны забывать, что наш долг – защищать их."
ANG_stronghold_of_republicanism_idea:0 "Республиканская крепость"
ANG_stronghold_of_republicanism_idea_desc:0 "Мы построили республику, и наши грифоны будут бороться за её сохранение. Теперь, когда они познали вкус свободы, горе любому, кто попытается отнять её у них!"
ANG_republican_army_idea:0 "Республиканская армия"
ANG_republican_army_idea_desc:0 "Солдаты нашей армии – прямые наследники славы Первой Республики. Само их присутствие на поле боя вселяет надежду в сердца угнетённых и вдохновляет каждого грифона, которому дорога свобода."
ANG_welfare_services:0 "Система социальной поддержки"
ANG_welfare_services_desc:0 "Для помощи нуждающимся и обездоленным была создана широкая система социального обеспечения. Наша цель – поднять этих грифонов на ноги и дать им достойное место в обществе, и первые шаги уже приносят небольшое снижение безработицы и бедности. Доходят и сообщения о хитрых дельцах, пытающихся злоупотреблять системой ради личной выгоды, но мы с этим разберёмся."
ANG_syndicates_cooperation:0 "Синдикатное сотрудничество"
ANG_syndicates_cooperation_desc:0 "Синдикаты – наши естественные союзники в борьбе за справедливость и равенство. При нашей поддержке они могут стать весомой политической силой в социальной сфере, образовании и охране окружающей среды. Взамен они помогут проводить экономическую политику, повышающую доходы и уровень жизни всех трудящихся."
ANG_free_society:0 "Свободное общество"
ANG_free_society_desc:0 "Угнетение, неволя и страх больше не мучают невинных энгриверцев. Воздух наполнен свободой, и наши граждане пользуются благами свободного общества, не скованного прошлым."
ANG_identity:0 "Национальная исключительность Энгривера"
ANG_identity_desc:0 "Энгриверцы обладают особым упорством и решимостью, рождёнными необходимостью выживать и процветать в суровых условиях. У нас не было иного выбора, кроме как бесстрашно принимать вызовы судьбы. Мы всегда боролись за лучшую жизнь, и эти черты помогут нам выстоять."
ANG_urbanisation_idea:0 "Урбанизация"
ANG_urbanisation_idea_desc:0 "Очевидно, что в городах экономическая активность выше, а наша программа поощрения переселения в города принесёт как экономические, так и культурные плоды. Урбанизация улучшает доступ к образованию, жилью и безопасности для рядового гражданина, а также расширяет возможности трудоустройства."
ANG_industrious_nation:0 "Индустриальная нация"
ANG_industrious_nation_desc:0 "Наши грифоны, никогда не привыкшие сидеть сложа когти, движимы сильным стремлением улучшить собственную жизнь и судьбу страны. Благодаря самоотверженности, новаторству и, прежде всего, упорному труду они строят более процветающее будущее."
ANG_resistance:0 "Республиканское сопротивление"
ANG_resistance_desc:0 "Республиканцы Энгривера и их союзники-анархисты видели, как всё, за что они боролись, было разрушено сразу после победы, и отказываются мириться с этим. Память о Республике жива в их сознании, и искоренить её будет непросто."
ANG_resistance_2:0 "Республиканское сопротивление"
ANG_resistance_2_desc:0 "Республиканцы Энгривера и их союзники-анархисты увидели, как все их надежды были отняты сразу после победы, и отказываются смиренно принять это. Память о Республике свежа в их умах, и выкорчевать её будет нелегко."
ANG_resistance_3:0 "Республиканское сопротивление"
ANG_resistance_3_desc:0 "Республиканцы Энгривера увидели, как все их надежды были отняты сразу после мига победы, и отказываются смиренно принять это. Память о Республике свежа в их умах, и выкорчевать её будет нелегко."
ANG_resistance_3_2:0 "Анархистское сопротивление"
ANG_resistance_3_2_desc:0 "Анархисты Энгривера увидели, как все их надежды были отняты сразу после мига победы, и отказываются смиренно принять это. В их сознании глубоко укоренились мечты об анархистской «утопии», и избавиться от них будет нелегко."
ANG_secret_council:0 "Камарилья"
ANG_secret_council_desc:0 "Таинственный Совет Когтя, приближённый к Эйхберг, – это группа самых богатых и влиятельных дворян в Энгривере. Их закулисные интриги позволяют Чёрному Когтю захватывать власть строго по плану."
ANG_secret_council_1:0 "Восстановить привилегии"
ANG_secret_council_1_desc:0 "Дворяне Энгривера вернули себе прежние привилегии. К ним относятся: освобождение от налогов, исключительное право на государственные должности, защита от конфискации имущества государством, монополия на покупку земли за пределами городов и посёлков, а также иммунитет от судебного преследования."
ANG_aristocratic_officers:0 "Аристократический офицерский корпус"
ANG_aristocratic_officers_desc:0 "Реформа Отмара Штойбера, позволявшая любым способным грифонам получать офицерские звания, была отменена. Теперь эти должности принадлежат исключительно аристократии. Тем не менее требования к способностям сохранились, что делает офицерский корпус хотя бы отчасти меритократическим."
ANG_spy_agency_idea_lr:0 "Длинная хватка Когтя"
ANG_spy_agency_idea_lr_desc:0 "Чёрный Коготь распространил своё влияние за пределы Энгривера в поисках связей среди грифоньей знати других земель – в особенности среди тех, кто лишился богатства и власти из-за бунтовщиков и предателей. Эти связи могут оказаться весьма полезными для самых разных тайных операций."
ANG_spy_agency_idea_no_lr:0 "Длинная хватка Когтя"
ANG_spy_agency_idea_no_lr_desc:0 "Чёрный Коготь распространил своё влияние за пределы Энгривера в поисках связей среди грифоньей знати других земель – в особенности среди тех, кто лишился богатства и власти из-за бунтовщиков и предателей. Эти связи могут оказаться весьма полезными для самых разных тайных операций."
ANG_restoratio_imperii_idea:0 "Restoratio Imperii"
ANG_restoratio_imperii_idea_desc:0 "Пришло время для Священной Империи Грифонов покарать тех, кто предал её, и вернуть всё, что принадлежит ей по праву. За веру, императора и отечество!"
ANG_crushed_spirit_idea:0 "Абсолютная власть"
ANG_crushed_spirit_idea_desc:0 "Хотя инакомыслящих никогда не удавалось полностью искоренить в Энгривере, все надежды на свержение Чёрного Когтя разбиты. Уставшим гражданам остаётся лишь опустить голову и повиноваться, чтобы не навлечь кару на себя и свои семьи..."
ANG_rangers_purged:0 "Опасный коридор"
ANG_rangers_purged_desc:0 "Разгром рейнджеров обернулся потерей опыта и ветеранов, что сказалось на всех наших вооружённых силах. Шайсвальд вновь стал диким, и потребуется время, чтобы вернуть прежние навыки и возобновить регулярное патрулирование."
ANG_claw_guard_idea:0 "Чёрная гвардия"
ANG_claw_guard_idea_desc:0 "Чёрная гвардия – военизированное крыло Чёрного Когтя. Действуя как своего рода добровольческое ополчение, её бойцы полностью преданы делу и считают своё насилие священным. Хотя многим этот фанатизм мешает, он делает их невероятно яростными в бою, поскольку они сражаются без страха смерти."
ANG_gas_weapons_idea:0 "Снаряды с биооружием"
ANG_gas_weapons_idea_desc:0 "После разрыва артиллерийских снарядов нового образца вокруг распространяется смертельная зараза. Хотя это оружие не всегда надёжно, оно, безусловно, весьма эффективно и разрушительно."
ANG_feudalism_idea:0 "Неофеодализм"
ANG_feudalism_idea_desc:0 "Крестьяне забыли, кому по праву принадлежит земля, на которой они трудятся. Чёрный Коготь должен напомнить им о многочисленных феодальных обязанностях перед сюзереном. Крестьяне должны быть благодарны уже за то, что сохранили жизнь и кров."
ANG_feudal_serfdom_idea:0 "Неофеодализм"
ANG_feudal_serfdom_idea_desc:0 "Хотя крепостное право в Энгривере так и не было полностью изжито из-за медленной индустриализации, крестьяне надеялись на скорые реформы. К несчастью для них, Чёрный Коготь полностью восстановил прежние порядки, и теперь крепостные гнут спину до изнеможения, лишённые почти всех прав."
ANG_feudal_knights_idea:0 "Неофеодализм"
ANG_feudal_knights_idea_desc:0 "Общество Священной Империи Грифонов напоминает уклад древней Грифонии. На вершине социальной иерархии возвышается монарх-автократ, а под ним – верные и могущественные священнослужители и аристократы-воины, господствующие над огромной массой нищих и бесправных крепостных."
ANG_fake_grover:0 "Гровер VI Грифонстоунский"
ANG_fake_grover_desc:0 "Каким-то образом Гровер VI вернулся. Лишь божественное вмешательство могло спасти наследника от злых когтей так называемого лорда-протектора. Это знак того, что боги благословили Чёрный Коготь и что его регентство действительно праведно и благочестиво!"
ANG_national_fervour_idea:0 "Национальный дух"
ANG_national_fervour_idea_desc:0 "Неразумно забывать свои корни. В жилах дворян течёт чистая герцландская кровь, которая и побуждает их повиноваться императору и богам. И крепостные воочию видят, что чуждые и порочные учения не способны запятнать их законных господ."
ANG_religious_fervour_idea:0 "Религиозная ортодоксальность"
ANG_religious_fervour_idea_desc:0 "Смерть еретикам."
ANG_questioned_aurhotiy:0 "Сомнительный авторитет"
ANG_questioned_aurhotiy_desc:0 "Несмотря на успешное усмирение банд, наводнявших Энгривер, многие богатые и влиятельные грифоны обеспокоены жёсткими действиями барона по укреплению своей власти, и главным источником этих опасений они считают Чёрный Коготь."
ANG_cults_government:0 "Чёрный Коготь"
ANG_cults_government_desc:0 "Чёрный Коготь – теневая организация, преданная идее жёсткого упорядочения грифоньего общества по образцу прежних феодальных порядков. Без колебаний прибегая к жестокому насилию ради своих целей, они вселяют страх в каждого, кто слышит их имя. Теперь, когда наши цели совпали, они станут для нас грозными союзниками."
ANG_control_information_idea:0 "Размытые границы"
ANG_control_information_idea_desc:0 "Наши осведомители скрываются в каждом городе Энгривера. Это наши глаза и уши, позволяющие быть на шаг впереди любых предателей-республиканцев и пресекать их заговоры ещё до того, как они перейдут к делу."
ANG_control_information_idea_lar:0 "Размытые границы"
ANG_control_information_idea_lar_desc:0 "Наши осведомители скрываются в каждом городе Энгривера. Это наши глаза и уши, позволяющие быть на шаг впереди любых предателей-республиканцев и пресекать их заговоры ещё до того, как они перейдут к делу."
ANG_loyatly_squads:0 "Офицеры лояльности"
ANG_loyatly_squads_desc:0 "Отряды офицеров лояльности прикреплены к армейским частям и отвечают за поддержание боевого духа среди солдат. Помимо контроля за лояльностью в армии, они опираются на широкую сеть осведомителей для сбора сведений о возможных внутренних волнениях."
ANG_loyatly_squads_lar:0 "Офицеры лояльности"
ANG_loyatly_squads_lar_desc:0 "Отряды офицеров лояльности прикреплены к армейским частям и отвечают за поддержание боевого духа среди солдат. Помимо контроля за лояльностью в армии, они опираются на широкую сеть осведомителей для сбора сведений о возможных внутренних волнениях."

ANG_war_chest_idea:0 "Финансовый резерв"
ANG_war_chest_idea_desc:0 "Наше тяжёлое положение требует введения специального налога, направленного на самых богатых грифонов страны, а также поощрения бережливости среди населения в целом. Полученные средства вкладываются в улучшение наших производственных возможностей."
ANG_bleed_for_me_idea:0 "Strafbataillone"
ANG_bleed_for_me_idea_desc:0 "Strafbataillone (штрафные батальоны) – это подразделения, состоящие из заключённых, которые были принуждены к военной службе. Эти подразделения плохо оснащены и часто используются для проведения опасных операций и самоубийственных миссий. Они также служат источником рабочей силы в прифронтовых районах."
ANG_fortify_my_country_idea:0 "Сражайтесь за свою страну!"
ANG_fortify_my_country_idea_desc:0 "Наша родина находится в осаде, ей угрожают со всех сторон враги, которые стремятся разрушить наш образ жизни. Если мы хотим выжить, каждый грифон должен внести свой вклад в защиту Энгривера. Это верно: барон нуждается в ВАС! Вы сделали свою часть сегодня?"
ANG_man_my_armies_idea:0 "Слава войны"
ANG_man_my_armies_idea_desc:0 "Патриотические грифоны Энгривера, лучшая жизнь ждёт вас на службе вашего баронства! Слава и богатство достанутся тем, кто достаточно храбр, чтобы вступить в армию. Прислушайтесь к призыву своего барона и запишитесь в армию сегодня!"
ANG_free_healthcare_idea:0 "Общее медицинское страхование"
ANG_free_healthcare_idea_desc:0 "Наша универсальная программа здравоохранения – это система защиты, которая обеспечивает равенство возможностей, чтобы все могли наслаждаться наивысшим уровнем здоровья."
ANG_worker_right_idea:0 "Трудовое законодательство"
ANG_worker_right_idea_desc:0 "Законы о труде устраняют фундаментальное неравенство в переговорной власти между рабочими и их работодателями и защищают права первых путём ограничения продолжительности рабочей недели, обеспечения соблюдения стандартов безопасности и установления минимальной заработной платы."
ANG_mass_contruction_projects:0 "План работы"
ANG_mass_contruction_projects_desc:0 "Мы начали программу масштабных общественных работ. По всему Герцланду строятся плотины, мосты, больницы и школы. Эти проекты обеспечивают занятость, а также помогают оживить экономику."
ANG_democratic_syndicates:0 "Анархо-синдикализм"
ANG_democratic_syndicates_desc:0 "Профсоюзы имеют основополагающее значение для нашего общества и служат идеальным инструментом политического представительства и справедливого управления обществом в интересах всех. Эти синдикаты должны управлять экономикой, поскольку государство по своей сути является институтом против рабочих."
ANG_free_education_idea:0 "Обязательное образование"
ANG_free_education_idea_desc:0 "Образование является правом каждого гражданина. Требуя обязательного школьного образования, мы можем сократить разрыв в возможностях между городскими и сельскими районами, чтобы ум каждого грифона мог процветать."
ANG_new_army_idea:0 "Коммунарная армия Герцланда"
ANG_new_army_idea_desc:0 "Структура нашей армии далека от традиционной и является демократической организацией, основанной на солдатских комитетах и общих собраниях. Все должностные лица избираются, и регулярно проводятся массовые собрания для обсуждения политики. Армия основана на самодисциплине, так как все дисциплинарные правила утверждаются солдатскими собраниями."
ANG_army_idea_2:0 "Коммунарная армия Герцланда"
ANG_army_idea_2_desc:0 "Структура нашей армии далека от традиционной и является демократической организацией, основанной на солдатских комитетах и общих собраниях. Все должностные лица избираются, и регулярно проводятся массовые собрания для обсуждения политики. Армия основана на самодисциплине, так как все дисциплинарные правила утверждаются солдатскими собраниями."
ANG_spec_ops:0 "RBHO"
ANG_spec_ops_desc:0 "В Revolutionäres Büro der Heimlichen Operationen (Революционном офисе секретных операций) задействованы специальные силы для выполнения действий с высокой степенью риска, таких как разведка, освобождение заложников и саботаж. Их операции выполняются с ограниченным количеством хорошо обученных грифонов, способных адаптироваться, быть самостоятельными и действовать в любых условиях, а также использовать нетрадиционные боевые навыки и оборудование."
ANG_peace_within_idea:0 "Мирное сосуществование"
ANG_peace_within_idea_desc:0 "Без угнетающих структур власти, которые так долго держали нас разделёнными, мы теперь можем видеть наших соседей такими, какие они есть: грифонами – такими же, как и мы. Сочувствие и сострадание свободно распространяются по нашей земле без необходимости насильственного принуждения."
ANG_state_eleos:0 "Социалисты Элеоса"
ANG_state_eleos_desc:0 "Отмена частной собственности и денег означает, что вместо того, чтобы жадно накапливать капитал, грифоны охотнее делятся щедростью наших коллективных усилий."
ANG_worker_congress:0 "РКГ"
ANG_worker_congress_desc:0 "Революционный Конгресс Герцланда включает в себя представителей всех местных советов коммун. Структура этого органа управления идеально подходит для того, чтобы позволять грифонам всех сообществ свободно высказываться о том, как ведутся дела."
ANG_anti_clericism:0 "Закон Эрхардта"
ANG_anti_clericism_desc:0 "Закон Эрхардта вводит ограничения в отношении религиозных учреждений в рамках насильственного разделения храма и государства. В настоящее время храмы облагаются налогами, и правительство конфискует большое количество храмового имущества."
ANG_safety_committee:0 "КпНБ"
ANG_safety_committee_desc:0 "Ausschuss für Staatssicherheit (Комитет по национальной безопасности) – разведывательное агентство, которому поручено поддерживать безопасность Герцланда. Обладая широкими полномочиями и действиями, не подлежащими судебному обжалованию, сотрудники комитета контролируют коммуникации и безжалостно пресекают любую крамольную деятельность."
ANG_safety_committee_lar:0 "КпНБ"
ANG_safety_committee_lar_desc:0 "Ausschuss für Staatssicherheit (Комитет по национальной безопасности) – разведывательное агентство, которому поручено поддерживать безопасность Герцланда. Обладая широкими полномочиями и действиями, не подлежащими судебному обжалованию, сотрудники комитета контролируют коммуникации и безжалостно пресекают любую крамольную деятельность."
ANG_internationalism_idea:0 "Интернационализм"
ANG_internationalism_idea_desc:0 "Националистическая идеология – это не более чем инструмент пропаганды привилегированных классов. Мы все являемся частью единой мировой классовой борьбы, и поэтому мы должны быть солидарны с угнетёнными народами, где бы они ни находились, и помогать им в их освобождении."
ANG_erhardt_doctrine:0 "Доктрина Эрхардта"
ANG_erhardt_doctrine_desc:0 "Наш интернационалистический долг – поддержать дело Революции и помочь освободить все угнетённые народы мира. Эрхардт придерживается нашей политики финансирования левых профсоюзов и партизанских повстанцев по всему миру и с гордостью заявляет, что революционное движение в каждом уголке мира может рассчитывать на отличных бойцов Герцланда."
ANG_army_idea_3:0 "Коммунарная армия Герцланда"
ANG_army_idea_3_desc:0 "Структура нашей армии далека от традиционной и является демократической организацией, основанной на солдатских комитетах и общих собраниях. Все должностные лица избираются, и регулярно проводятся массовые собрания для обсуждения политики. Армия основана на самодисциплине, так как все дисциплинарные правила утверждаются солдатскими собраниями."
ANG_army_reserves:0 "Национальная гвардия Герцланда"
ANG_army_reserves_desc:0 "Присягнувшая защищать народ Герцланда, Национальная гвардия является общественно сознательной организацией, призванной защищать Революцию. Будучи солидарными с городскими рабочими, сельскими фермерами и всеми остальными, эти храбрые добровольцы являются нашей первой линией защиты от любой угрозы, внутренней или внешней."
ANG_republican_army_1:0 "Республиканская гвардия Герцланда"
ANG_republican_army_1_desc:0 "Присягнувшая защищать народ Герцланда, Республиканская гвардия является общественно сознательной организацией, призванной защищать наши эгалитарные принципы. Будучи солидарными с городскими рабочими, сельскими фермерами и всеми остальными, эти храбрые добровольцы являются нашей первой линией защиты от любой угрозы, внутренней или внешней."
ANG_industrious_nation_idea_2:0 "Индустриальная нация"
ANG_industrious_nation_idea_2_desc:0 "Наши грифоны, которые никогда не собираются сидеть сложа когти, движимы сильным желанием улучшить себя и свою страну. Посредством самоотверженности, инноваций и, прежде всего, тяжёлой работы они стремятся создать более процветающее будущее."
ANG_urbanisation_idea_1:0 "Автономные меньшинства"
ANG_urbanisation_idea_1_desc:0 "Герцланд является домом для бесчисленного разнообразия существ, вероисповеданий и культур. Это разнообразие делает нас сильными, и оно не должно подавляться. Культурные ассоциации свободно создаются по всему Герцланду, что делает наши города благодатной почвой для большего сотрудничества и взаимопонимания."
ANG_urbanisation_idea_2:0 "Децентрализованная городская система"
ANG_urbanisation_idea_2_desc:0 "Стремясь исправить недостатки нашей предыдущей инициативы по урбанизации, мы реструктурировали её, чтобы стимулировать рост в более широком круге городов и посёлков. Диверсифицированное городское развитие помогает расширить участие большего числа граждан в гражданском обществе, а также повышает эффективность, справедливость и развитие по всей стране."
ANG_identity_2:0 "Буржуазный национализм"
ANG_identity_2_desc:0 "Мы отвергаем коварные усилия тех, кто пытается разделить нас по классовому или религиозному признаку, и вместо этого объединяем нас патриотической солидарностью. Будь мы богатыми или бедными, фетизцами или энгриверцами – все мы герцландцы!"
ANG_guardians_of_constitution_idea:0 "Стражи Конституции"
ANG_guardians_of_constitution_idea_desc:0 "Наша Конституция закрепляет права всех граждан и служит провозглашением нашей веры в свободу, равенство и демократию. Если никто не встанет на защиту этих прав, свобода в Грифонии будет потеряна. И поэтому мы должны быть солдатами свободы, вечно бдительными и никогда не позволяющими тирании завладеть Герцландом."
ANG_claw_guard_2_idea:0 "Schwarzestaffel"
ANG_claw_guard_2_idea_desc:0 "Schwarzestaffel (СС) – военизированная структура, посвящённая Чёрному Когтю, и главная организация безопасности в Герцланде. СС выступает за жестокость и террор в качестве предпочтительного решения военных и политических проблем и требует от своих членов полной лояльности и повиновения под страхом смертной казни. Её два основных отделения – Альгемайне СС (Общие СС) и Ваффен-СС (Вооружённые СС)."
ANG_intelligence_service_idea:0 "Служба безопасности"
ANG_intelligence_service_idea_desc:0 "Служба безопасности (СБ) является разведывательным агентством Чёрного Когтя. Её мандат заключается в выявлении и нейтрализации потенциальных иностранных либо внутренних врагов лидерства Чёрного Когтя. Её сеть агентов и информаторов по всему Герцланду стремится держать каждого гражданина под постоянным наблюдением."
ANG_intelligence_service_idea_lar:0 "Служба безопасности"
ANG_intelligence_service_idea_lar_desc:0 "Служба безопасности (СБ) является разведывательным агентством Чёрного Когтя. Её мандат заключается в выявлении и нейтрализации потенциальных иностранных либо внутренних врагов лидерства Чёрного Когтя. Её сеть агентов и информаторов по всему Герцланду стремится держать каждого гражданина под постоянным наблюдением."
ANG_secret_nation:0 "Теневое состояние"
ANG_secret_nation_desc:0 "Никому не позволено покидать Герцланд или въезжать в него. Достижение совершенства возможно только тогда, когда мы смотрим внутрь себя и изолируем себя от опасных чуждых идей."
ANG_herzland_system:0 "Система Герцланда"
ANG_herzland_system_desc:0 "По всей стране общество организовано по строгой классовой иерархии. Способствуя эффективности и порядку, система знаменует собой возвращение к традиционной феодальной социальной структуре, хотя и модифицированной с учётом технического прогресса."
ANG_national_guard_2_idea:0 "Национальная гвардия Герцланда"
ANG_national_guard_2_idea_desc:0 "Национальная гвардия, поклявшаяся защищать народ Герцланда, является военной резервной силой, призванной защищать нашу свободу. Стоя в солидарности с городскими рабочими, сельскими фермерами и всеми, кто находится между ними, эти храбрые добровольцы являются нашей первой полосой обороны от любой угрозы, внутренней или внешней."
ANG_industrial_center_2:0 "Местные промышленные центры"
ANG_industrial_center_2_desc:0 "Во всём Герцланде промышленное развитие идёт медленно и неуклонно. Вместо лихорадочного рывка развитие идёт планомерно и взвешенно, с опорой на существующие промышленные центры."
ANG_free_press_2_idea:0 "Свободная пресса"
ANG_free_press_2_idea_desc:0 "Каждый грифон имеет право на свободу мнений и их свободное выражение, а также право распространять информацию и идеи через средства массовой информации. Ни один голос не умолкнет в наш славный Новый век!"
ANG_without_democracy_idea:0 "Свобода без демократии"
ANG_without_democracy_idea_desc:0 "Хотя демократия является одним из трёх принципов, мир знает, что мы находимся в процессе борьбы за само наше существование. Нам понадобится стабильность в обозримом будущем, чтобы отразить эти угрозы."
ANG_republican_secret_police:0 "Ministerium für Öffentliche Sicherheit"
ANG_republican_secret_police_desc:0 "MfÖS, или же Министерство общественной безопасности, – это разведывательное агентство, в задачу которого входит защита политической структуры Республики. Обладая широкими полномочиями и действиями, не подлежащими судебному обжалованию, сотрудники министерства безжалостно подавляют любую оппозицию правительству."
ANG_republican_secret_police_lar:0 "Ministerium für Öffentliche Sicherheit"
ANG_republican_secret_police_lar_desc:0 "MfÖS, или же Министерство общественной безопасности, – это разведывательное агентство, в задачу которого входит защита политической структуры Республики. Обладая широкими полномочиями и действиями, не подлежащими судебному обжалованию, сотрудники министерства безжалостно подавляют любую оппозицию правительству."
ANG_nationalism_idea:0 "За республику!"
ANG_nationalism_idea_desc:0 "Наше дело правое! Мы сражаемся за триумф свободы на всём континенте и освобождение каждого грифона, изнывающего под гнётом тирании."
ANG_new_republican_army:0 "Республиканская армия"
ANG_new_republican_army_desc:0 "Солдаты новой республиканской армии фанатично преданы идеалам свободы; им свойственна отчаянная храбрость, подчас граничащая с безрассудством."
ANG_bread_and_circuses_idea:0 "Хлеба и зрелищ!"
ANG_bread_and_circuses_idea_desc:0 "Публичные игры проводятся регулярно для блага и развлечения народа, а еда щедро раздаётся. Эти меры должны способствовать укреплению единства и покорности народа."
ANG_local_cultures_idea:0 "Erhaltungsgesetz"
ANG_local_cultures_idea_desc:0 "Erhaltungsgesetz, или «Закон о сохранении», направлен на сохранение культуры и наследия групп по всей Грифонии. Родные языки являются незаменимой частью такого наследия и в некоторых местах подвергаются серьёзной угрозе."
ANG_republican_secret_police_enemy:0 "Ministerium für Öffentliche Sicherheit"
ANG_republican_secret_police_enemy_desc:0 "MfÖS, или же Министерство общественной безопасности, – это моральная мерзость. Действуя без гражданских ограничений, оно сеет ужас и подавляет свободомыслие среди граждан. Нам придётся уничтожить агентство при первой же возможности."
ANG_republican_secret_police_enemy_lar:0 "Ministerium für Öffentliche Sicherheit"
ANG_republican_secret_police_enemy_lar_desc:0 "MfÖS, или же Министерство общественной безопасности, – это моральная мерзость. Действуя без гражданских ограничений, оно сеет ужас и подавляет свободомыслие среди граждан. Нам придётся уничтожить агентство при первой же возможности."
ANG_peacekeeping:0 "Миротворческие силы"
ANG_peacekeeping_desc:0 "Наши дни разжигания войны прошли. Цель нашей армии – защитить народ и обеспечить условия для прочного мира."
ANG_liberty_idea:0 "Настоящая свобода"
ANG_liberty_idea_desc:0 "Каждый грифон больше не принуждается клясться в верности Блюму и партии. Граждане могут свободно думать и действовать так, как им хочется."
ANG_new_institutions_idea:0 "Новые институты"
ANG_new_institutions_idea_desc:0 "Железная хватка угнетения больше не сковывает умы наших граждан! Цензура университетских программ отменена, а студентам теперь предлагают задавать вопросы."
ANG_prosperity_idea:0 "Истинное процветание"
ANG_prosperity_idea_desc:0 "Мы стремимся раскрыть творческие способности и потенциал каждого грифона ради каждого из них."
ANG_loyalty_thite_idea:0 "Десятина лояльности"
ANG_loyalty_thite_idea_desc:0 "Грифоны больше не будут пожинать плоды Империи, не внося должного вклада в её поддержание. Средства, получаемые от десятины лояльности, идут на то, чтобы промышленность Империи была способна поддерживать наши армии в надлежащем состоянии."
ANG_new_nobility:0 "Новая знать"
ANG_new_nobility_desc:0 "Лживые, коварные аристократы Империи были разоблачены, и их собственность была конфискована. На их место встаёт новая когорта грифонов, чья верность императору Лееру не вызывает сомнений."
ANG_imperial_guard:0 "Имперская гвардия"
ANG_imperial_guard_desc:0 "Очень престижная Имперская гвардия состоит из самых элитных солдат Имперской армии. Под непосредственным командованием императора Леера они служат его личным телохранителем и тактическим резервом. Члены гвардии получают лучшую зарплату, пайки, жильё и снаряжение, чем обычные солдаты."
ANG_imperial_commissariat:0 "Императорский комиссариат"
ANG_imperial_commissariat_desc:0 "Императорскому комиссариату поручено обеспечить лояльность населения и военных. Следя за моральным духом широкой публики и жёстко расправляясь с любыми нарушителями, они защищают Империю от внутренних угроз."
ANG_imperial_commissariat_lar:0 "Императорский комиссариат"
ANG_imperial_commissariat_lar_desc:0 "Императорскому комиссариату поручено обеспечить лояльность населения и военных. Следя за моральным духом широкой публики и жёстко расправляясь с любыми нарушителями, они защищают Империю от внутренних угроз."
ANG_pental_battalion_idea:0 "Strafbataillone"
ANG_pental_battalion_idea_desc:0 "Strafbataillone (штрафные батальоны) – это подразделения, состоящие из заключённых, которые были принуждены к военной службе. Эти подразделения плохо оснащены и часто используются для проведения опасных операций и самоубийственных миссий. Они также служат источником рабочей силы в прифронтовых районах."
ANG_enforced_languages:0 "Закон о культурном единстве"
ANG_enforced_languages_desc:0 "Разрозненные регионы Грифонии могут иметь свои собственные местные диалекты, но единственный язык Империи – настоящий гриффиш. Тем, кто хочет поступить на имперскую службу, стоит начать его изучать. Один язык, одна культура, одна Империя."

### Focuses ###
ANG_army_stuff:0 "Сформировать армию Энгривера"
ANG_army_stuff_desc:0 "До революции 978 года Энгривер защищало неофициальное ополчение, созданное различными поселениями и мелкими дворянами баронства. Но после революции ряд ополченцев остался на службе, чтобы защитить пограничные районы и выследить остатки Армии Свободного Государства. Пришло время реорганизовать эти подразделения в настоящую армию."
ANG_mass_combat:0 "Доктрина Бауэра"
ANG_mass_combat_desc:0 "После окончательного формирования армии пришло время выбрать наилучшую школу стратегической мысли. Зигер Бауэр предложил стратегию глубокой обороны. Он утверждает, что такая стратегия лучше всего подойдёт нашей нации, ориентированной на пехоту и испытывающей промышленный голод."
ANG_trenches:0 "Доктрина Штойбера"
ANG_trenches_desc:0 "После окончательного формирования армии пришло время выбрать наилучшую школу стратегической мысли. Отмар Штойбер предложил стратегию, основанную на строительстве фортификационных сооружений. Его стратегия будет основываться на использовании местности – вроде густых лесов и многочисленных рек – для создания всесторонней обороны."
ANG_massive_firepower:0 "Доктрина Хеннингера"
ANG_massive_firepower_desc:0 "После окончательного формирования армии пришло время выбрать наилучшую школу стратегической мысли. Эрвин Хеннингер предложил стратегию, основанную на использовании артиллерии и вспомогательных подразделений для повышения эффективности нашей пехоты. Хеннингер уверен, что такая армия будет очень гибкой и сможет быстро адаптироваться."
ANG_angriver_rangers:0 "Энгриверские рейнджеры"
ANG_angriver_rangers_desc:0 "Энгриверские рейнджеры существуют уже более века; их миссия заключается в том, чтобы патрулировать лес Шайсвальд и защищать жителей Энгривера от чудовищ и прочих опасностей, которые там обитают. Недавно было предложено интегрировать рейнджеров в нашу военную структуру, чтобы использовать их элитные навыки против враждебных захватчиков."
ANG_our_traditions:0 "Обучение рейнджеров"
ANG_our_traditions_desc:0 "Энгриверские рейнджеры имеют репутацию искусных охотников и надёжных разведчиков. С их включением в нашу военную структуру было предложено, чтобы они поделились своим опытом с войсками и обучили разведывательные подразделения искусству выслеживания и преследования противника."
ANG_modern_infantry:0 "Новая винтовка"
ANG_modern_infantry_desc:0 "Хотя винтовка «Hinterladerbuecshe» хорошо служила нашим вооружённым силам на протяжении последних нескольких десятилетий, её возраст начинает сказываться, поскольку новые конструкции уже превосходят эту модель. Поэтому самое время обратиться к ведущим военным предприятиям страны, чтобы разработать новую стандартную винтовку."
ANG_filled_arsenals:0 "Арсенал Грифинга"
ANG_filled_arsenals_desc:0 "Традиционно закупка снаряжения для ополчения осуществлялась в партнёрстве с частными промышленными фирмами. Но можно ли доверять частникам в эти непростые времена? Чтобы обезопасить себя, мы учредим «Арсенал Грифинга» – государственное предприятие, которое будет отвечать за производство оружия, техники и боеприпасов для нужд нашей армии."
ANG_support_squads:0 "Улучшение пехотных формирований"
ANG_support_squads_desc:0 "События во всём мире показали, что боевая эффективность традиционных дивизий повышается при добавлении к ним вспомогательных рот. Воспроизводя успех этого подхода в наших собственных вооружённых силах, мы можем рассчитывать, что они будут лучше справляться со своими задачами."
ANG_magical_infantry_focus:0 "Экспериментальное оружие"
ANG_magical_infantry_focus_desc:0 "Недавнее обнаружение запасов кристаллов в Энджелкло привлекло наше внимание к возможности разработки пехотного оружия на основе кристаллов. Хотя эти разработки в основном носят экспериментальный характер и принесли лишь скромные результаты, согласно расчётам, в будущем такое оружие может оказаться весьма эффективным в бою."
ANG_modern_knights:0 "Наследие Верлорены Гофнунген"
ANG_modern_knights_desc:0 "Верлорен Гофнунген – это элитный рыцарский отряд энгриверской армии. Его корни ведут к Революции 978 года, когда барон призвал мелких дворян прийти к нему на помощь. Подразделение было сформировано, и благодаря его высочайшей храбрости имперские силы одержали победу. Но рыцари сейчас остро нуждаются в свежей крови, улучшенном снаряжении и обновлённой доктрине."
ANG_special_forces:0 "Энгриверский спецназ"
ANG_special_forces_desc:0 "Во всём мире развитие подготовки и доктрины создало ряд особых задач для специализированных пехотных формирований. К ним относятся подразделения, подготовленные для боевых действий в горах, для высадки в тылу противника и для проведения морских десантов. Такой уровень специализации может быть очень полезен для нашего дела."
ANG_artillery_modernization:0 "Модернизировать наши батареи"
ANG_artillery_modernization_desc:0 "Республиканская революция доказала неэффективность нашей артиллерии в бою, особенно крупных орудий. Причина в использовании старинных дульнозарядных пушек вместо казнозарядных. Несмотря на то, что эта проблема была частично решена, предстоит ещё сделать большие шаги в разработке и внедрении артиллерийских технологий."
ANG_radio_towers:0 "Эквестрийская магия"
ANG_radio_towers_desc:0 "Инженеры Эквестрии изобрели радары. Первоначально они использовались для слежения за гражданской авиацией, но эту технологию можно адаптировать для обнаружения вражеских самолётов с невероятных расстояний, что позволит эффективно их перехватывать. Эта разработка определённо стоит затрат на её приобретение."
ANG_computing_experiments:0 "Эквестрийское волшебство"
ANG_computing_experiments_desc:0 "Инженеры Эквестрии разработали новую технологию, известную как компьютер. Изначально он задумывался как счётная машина, предназначенная для помощи учёным в сложных расчётах. Тем не менее эта технология показала перспективы в сфере разведки, поскольку может помочь взломщикам шифров и защитить наши собственные линии связи."
ANG_rocket_artillery_effort:0 "Диверсификация нашей огневой мощи"
ANG_rocket_artillery_effort_desc:0 "В последнее время развитие ракетной техники позволило уменьшить размеры двигателей, повысить эффективность, надёжность и способность нести большую полезную нагрузку. В связи с этим энгриверская армия начала изучать возможность применения ракет для усиления наших традиционных артиллерийских батарей."
ANG_army_motorization:0 "Грифтрак"
ANG_army_motorization_desc:0 "Грифтрак – это прочное и надёжное транспортное средство, разработанное инженерами Грифенхейма, чтобы выдерживать суровый, бесплодный и холодный климат Грифонии. С момента создания грузовик стал популярным во всей Империи, и лицензии на него охотно приобретают различные имперские структуры. Этот грузовик повысит манёвренность и скорость наших сил."
ANG_proper_tanks:0 "Импорт имперских разработок"
ANG_proper_tanks_desc:0 "В последнее время императорская армия начала разрабатывать боевые бронированные машины. Эти машины, прозванные танками, закованы в тяжёлую броню и могут легко противостоять пехоте. Включение небольшого количества танков для поддержки пехоты или большого количества в качестве самостоятельных боевых единиц значительно повысит эффективность нашей армии."
ANG_inspired_army:0 "Оборонительная армия"
ANG_inspired_army_desc:0 "Новая энгриверская армия была построена на традициях старой, с сильным акцентом на превосходство укреплённых оборонительных позиций в нашей доктрине. Цель энгриверской армии состоит в том, чтобы сформировать прочный оплот против иностранного вторжения за счёт быстрой переброски войск на сильные укреплённые позиции."
ANG_superior_army:0 "Наступательная армия"
ANG_superior_army_desc:0 "Хотя наша армия традиционно сражалась в обороне, последние достижения в области технологий и доктрины позволили нам перехватить инициативу. Бронированные клинья при поддержке артиллерии будут пробивать бреши в обороне противника, куда смогут устремиться моторизованные батальоны. Вот как должна действовать современная армия!"
ANG_military_academy:0 "Основать Институт военных дел"
ANG_military_academy_desc:0 "Институт военных дел был создан в городе Аппенваген. Задача этого учреждения состоит в том, чтобы обучать будущее поколение офицеров, размещать вновь созданный Генеральный штаб энгриверской армии и разрабатывать доктрину как на тактическом, так и на стратегическом уровне."

ANG_air_stuff:0 "Высший пилотаж" #Исправить, если неправильно
ANG_air_stuff_desc:0 "Грифоны рождались, чтобы летать в небесах и наслаждаться настоящей свободой. Но, несмотря на способности, которые дают нам крылья, биологические ограничения не позволяли грифонам летать слишком быстро или высоко. Однако последние новшества в конструкции самолётов помогут преодолеть эти границы, и у грифонов будет ещё меньше ограничений."
ANG_fighter_projects:0 "Стальные крылья"
ANG_fighter_projects_desc:0 "Наши нынешние планеры стремительно устаревают, и наш первый шаг к господству в воздухе должен состоять в обновлении моделей истребителей. Нам нечего опасаться вражеских самолётов, если наши пилоты просто разорвут их на клочки."
ANG_doctrinal_development:0 "Лётное обучение"
ANG_doctrinal_development_desc:0 "Хотя небеса привычнее для грифонов, чем для других существ, чрезмерные высоты всё ещё могут сильно ограничивать наши возможности. Постепенная подготовка позволит нашим пилотам эффективно сражаться даже на предельных высотах, что даст им тактическое преимущество над врагами."
ANG_actual_air_bases:0 "Аэродромы Аппенгена"
ANG_actual_air_bases_desc:0 "Хотя самолёты никогда не были популярны в Энгривере, в своё время прославился один чудаковатый грифон, владевший таким аппаратом. В Аппенгене находится заброшенный аэродром, и его расположение идеально подходит для создания нового аэродрома. Без взлётно-посадочных полос наши самолёты – не более чем стальные смертники, которым негде приземлиться."
ANG_strat:0 "Усиление стратегического бомбардировщика"
ANG_strat_desc:0 "Уничтожение военной промышленности противника способно лишить его возможности обеспечивать войска снаряжением. Поскольку наиболее важные заводы обычно охраняются лучше всего, необходимо разработать специализированный бомбардировщик для ударов по промышленным центрам противника."
ANG_tact:0 "Усиление тактического бомбардировщика"
ANG_tact_desc:0 "Зачем стрелять во врагов с земли, когда можно обрушить на них удар с неба? Разрабатывая новые тактические бомбардировщики для поражения сил противника, мы сможем серьёзно ослабить вражеские дивизии ещё до того, как они вступят в бой с нашими наземными войсками."
ANG_napalm:0 "Напалм"
ANG_napalm_desc:0 "Напалм оказался весьма полезен на войне. Он горит при тех же температурах, что и бензин, но гораздо дольше, а также плотно прилипает к поверхностям. Это вещество практически идеально подходит для боевой нагрузки наших бомбардировщиков, атакующих вражеские укрепления и пехоту."
ANG_CAS_projects:0 "Железные когти"
ANG_CAS_projects_desc:0 "Хотя боевая нагрузка штурмовиков уступает тактическим бомбардировщикам, эти машины по-прежнему играют жизненно важную роль в наших операциях. Штурмовики, наносящие удары по целям на поле боя, способны переломить ход сражения при правильном применении."
ANG_heavy_fighter_projects:0 "Охрана нашего неба"
ANG_heavy_fighter_projects_desc:0 "Чтобы обеспечить надёжное сопровождение наших стратегических бомбардировщиков, необходимо разработать новый истребитель. Эти хорошо вооружённые, но более тяжёлые и менее манёвренные машины смогут эффективно прикрывать бомбардировщики и станут крепким орешком для вражеских перехватчиков."
ANG_rocket_projects:0 "Ракетные проекты"
ANG_rocket_projects_desc:0 "Хотя многие считают их новинкой войны, ракеты обладают огромным потенциалом как в качестве силовых установок для наших самолётов, так и в качестве самостоятельного оружия. Инвестиции в испытательные полигоны и новые конструкции ракет на данном этапе вполне оправданны."
ANG_paratrooper_project:0 "Кричащие орлы"
ANG_paratrooper_project_desc:0 "Прыгая с высоты, которую ещё несколько лет назад даже самые смелые грифоны сочли бы безумием, наши элитные десантники могут легко проникать в тыл противника и сеять хаос. А по мере того как их снаряжение становится совершеннее, расширяется и круг их потенциальных стратегических и тактических задач."
ANG_expanded_bases:0 "Расширение аэродромов Аппенгена"
ANG_expanded_bases_desc:0 "Чтобы удовлетворить потребности растущих военно-воздушных сил и создать основу для их дальнейшего развития, необходимо ещё больше расширить аэродромы в Аппенгене."
ANG_jet_fighters:0 "Истребитель V-1"
ANG_jet_fighters_desc:0 "После создания нескольких прототипов и неудачных испытаний мы близки к созданию первой в мире полноценной модели реактивного истребителя. При дополнительных инвестициях мы сможем вступить в новую эру авиации и летать на самолётах с такой скоростью, от которой у любого грифона перехватит дыхание."

ANG_industrial_stuff:0 "Спасение экономики"
ANG_industrial_stuff_desc:0 "Экономика Энгривера находится в плачевном состоянии: годы пренебрежения, а также набеги бандитов и разбойников довели нас до самого дна. Мы выглядим жалко даже на фоне других земель Герцланда. Будущее Энгривера выглядит по-настоящему мрачным, если мы не выведем его из этого спада уже сегодня."
ANG_clearing_out_shitforest:0 "Восстановление Сердца Империи"
ANG_clearing_out_shitforest_desc:0 "Большие участки Сердца Империи покрыты лесами, что мешает промышленному освоению этих земель. Массовая вырубка лесов вблизи наших немногочисленных промышленных центров позволит нам расширяться. Да и никому особо не нравились эти леса."
ANG_electronics_research:0 "Эксперименты с электроникой"
ANG_electronics_research_desc:0 "Электроника зарекомендовала себя как крайне важная сфера для любого современного государства. Электричество изменило практически все сферы повседневной жизни, и страны быстро развивают эту отрасль. Если мы хотим достичь тех же высот, что и экономические центры Грифонии, вложения в развитие собственной электроники будут вполне оправданны."
ANG_farmland:0 "Эксплуатация сельхозугодий"
ANG_farmland_desc:0 "Обширные районы Сердца Империи не в полной мере используются для земледелия. Расширяя существующие сельхозугодья и финансируя освоение новых, мы можем значительно увеличить поставки продовольствия в Энгривер. Сытые грифоны – счастливые грифоны."
ANG_country_roads:0 "Новые железнодорожные линии"
ANG_country_roads_desc:0 "Локомотивы только начинают появляться в Энгривере, а экономический потенциал этих массивных машин неоспорим. Проложив железные дороги через недавно вырубленные леса, мы сможем стимулировать освоение и развитие обширных равнин Энгривера. Это также позволит нашим вооружённым силам перемещаться по стране гораздо быстрее, чем прежде."
ANG_green_gold:0 "Голубое золото"
ANG_green_gold_desc:0 "В Энгривере было обнаружено крупное месторождение магических кристаллов, которое пока не разрабатывают. Добыча этих кристаллов потребовала бы сравнительно небольших усилий, а их потенциальное военное применение огромно."
ANG_magic_boosts:0 "Волшебные инвестиции"
ANG_magic_boosts_desc:0 "Применение магии в промышленности ещё не до конца изучено. Использование её возможностей в производстве способно дать огромные преимущества каждому сектору экономики, и мы были бы глупцами, если бы упускали этот потенциал."
ANG_mining:0 "Расширение шахт"
ANG_mining_desc:0 "По мере того как возможности применения магических свойств кристаллов, найденных в Энгривере, становятся всё очевиднее, раскрывается и подлинная ценность этого ресурса. Расширение шахт для полного освоения обнаруженных на нашей территории месторождений должно стать нашей главной задачей."
ANG_power_of_the_gods:0 "Сила богов"
ANG_power_of_the_gods_desc:0 "Недавнее открытие магических кристаллов в Энгривере привлекло в нашу столицу множество учёных-волшебников, и благодаря их совместной работе мы мельком увидели истинную силу, скрытую в этих кристаллах. Хотя их теории ещё предстоит проверить, экономический и военный потенциал кристаллов поражает воображение."
ANG_connect_the_nation:0 "Соединить нацию"
ANG_connect_the_nation_desc:0 "Состояние дорог в Энгривере, прямо скажем, ужасное. Огромные пространства между крупными населёнными пунктами связаны путями, которые десятилетиями не ремонтировались, а некоторые и вовсе превратились в непроходимые грязные колеи. Модернизация и ремонт дорожной сети должны стать первыми шагами к спасению экономики."
ANG_griffing_industry:0 "Привлечение тяжёлой промышленности"
ANG_griffing_industry_desc:0 "Энгривер никогда не привлекал особого внимания инвесторов из-за того, что государство мало вкладывалось в промышленный сектор. Но если мы предложим потенциальным инвесторам весомые льготы, Энгривер сразу станет привлекательнее для промышленников."
ANG_dierhoven_steel_mills:0 "Новые сталелитейные заводы в Дирхофене"
ANG_dierhoven_steel_mills_desc:0 "Дирхофен – растущий город у южного края Шайсвальда. Его расположение позволяет торговать с крупными городами за пределами края, такими как Верения и Грифонстоун, но до сих пор городу не хватало товаров для торговли. Очистив лес и превратив древесину в уголь, мы обеспечим топливом кузницы и цеха, переплавляющие руду в сталь и медь."
ANG_educate_the_people:0 "Образованное население"
ANG_educate_the_people_desc:0 "Если мы хотим построить по-настоящему современную экономику, необходимо покончить с эпидемией неграмотности, охватившей Энгривер с незапамятных времён. Мы расширим систему образования, предоставляя щедрую поддержку как государственным, так и частным школам, и откроем вечерние школы для рабочих, желающих научиться грамоте."
ANG_our_own_oil_company:0 "Привлечение нефтяных компаний"
ANG_our_own_oil_company_desc:0 "Промышленность Энгривера развивается всё быстрее, но нехватка нефти начала сдерживать её рост. Чтобы решить эту проблему, мы сделали щедрые предложения нескольким нефтяным компаниям, желающим построить в Грифонии нефтеперерабатывающие заводы. Осталось лишь подписать соглашение."
ANG_arms_industry:0 "Наша оружейная индустрия"
ANG_arms_industry_desc:0 "В Энгривере никогда не было много военных заводов, а его армия никогда не нуждалась в больших объёмах вооружений. Но по мере того как мы вступаем в новую эпоху войн, становится ясно, что нам необходимо наращивать производственные мощности ради нужд современной армии."
ANG_automobile_industry:0 "Расширение «Рубин Аутомобиле»"
ANG_automobile_industry_desc:0 "«Рубин Аутомобиле» – одна из тех редких компаний Энгривера, что действительно преуспевают. Автомобили компании хорошо спроектированы и надёжны, и сейчас она ищет средства для расширения производства. Если мы предоставим финансирование, то получим постоянный источник грузовиков для армии."
ANG_science_base_improvement:0 "Современная научная база"
ANG_science_base_improvement_desc:0 "Благодаря недавним успехам в экономике мы смогли расширить научно-исследовательскую деятельность. Хотя эти вложения не позволят нам сравняться с мировыми научными центрами, они приблизят нас к созданию современной научной базы."
ANG_land_grants:0 "Земельные гранты для фермеров"
ANG_land_grants_desc:0 "Обширные, малозаселённые районы Энгривера обладают потенциалом для ведения сельского хозяйства. Мы предоставим эту землю практически бесплатно фермерам, стремящимся начать своё дело, и сможем привлечь немало новых переселенцев. Это не только увеличит налоговые поступления, но и пополнит ряды призывников за счёт прибывших."
ANG_village_education:0 "Сельское образование"
ANG_village_education_desc:0 "Во многих деревнях по-прежнему нет никаких учебных заведений, из-за чего многие наши граждане не могут в полной мере реализовать свой потенциал. Мы разработаем специальную программу, чтобы обеспечить достойное образование в этих селениях и окончательно искоренить неграмотность в стране."
ANG_national_bank:0 "Национальный банк Энгривера"
ANG_national_bank_desc:0 "У Энгривера нет центрального банка, поскольку в прошлом он не требовался из-за слабой экономической базы. Но благодаря нашим недавним успехам в промышленности его отсутствие стало тормозом для дальнейшего развития. Учредив такой банк, мы сделаем ещё один шаг к по-настоящему современной экономике."
ANG_industrial_projects:0 "Тяжёлые промышленные проекты"
ANG_industrial_projects_desc:0 "В Энгривере ещё хватает земель, не освоенных промышленностью. Можно построить ещё больше фабрик и дополнительно расширить уже действующие. Мы настолько близки к устранению экономических бед, долго преследовавших нас, что не можем остановиться сейчас."
ANG_new_economy:0 "Проклятие снято"
ANG_new_economy_desc:0 "Теперь фабрики усеяли ландшафт Энгривера, выпуская товары, которые грузят в поезда для отправки по всему континенту. Ещё несколько лет назад такая картина показалась бы любому грифону нелепой. Но после огромных усилий нам наконец удалось преодолеть экономическое проклятие, десятилетиями тяготевшее над Энгривером."

ANG_navy_stuff:0 "Наш ВМФ"
ANG_navy_stuff_desc:0 "Впервые в истории нашей страны мы обзавелись выходом к морю. Огромный и грозный океан наконец предстал перед нами. За горизонтом скрывается немало угроз, и мы должны подготовиться к их появлению, построив военные корабли. Местные жители помогут нам в этом деле."
ANG_base_strike_f:0 "Удар в сердце"
ANG_base_strike_f_desc:0 "Основные силы противника не всегда будут уязвимы для прямого удара. Зачастую подлинная сила флота кроется не в нём самом, а в портах и верфях, которые его снабжают и ремонтируют. Но с помощью авианосцев и подводных лодок мы можем нанести сокрушительный удар по этой жизненно важной части военной инфраструктуры противника, не забывая защищать и собственную."
ANG_carrier_f:0 "Эксперименты с авианосцами"
ANG_carrier_f_desc:0 "Авианосцы способны полностью перестроить морскую войну. Благодаря сочетанию возможностей флота и авиации открываются практически безграничные тактические и стратегические возможности. Но прежде чем что-либо из этого станет реальностью, нам нужно разработать проект надёжного авианосца."
ANG_navy_planes_f:0 "Морская авиация"
ANG_navy_planes_f_desc:0 "Чтобы справиться с особыми задачами палубной авиации, необходимо разработать новые модели самолётов. С каждым усовершенствованием наших палубных самолётов стратегический потенциал авианосцев будет расти, и было бы чистым безумием не развивать это направление."
ANG_fleet_being_f:0 "Покажем нашу силу"
ANG_fleet_being_f_desc:0 "Наши порты – важнейшая опора флота, ведь без снабжения корабли долго не продержатся. Делая ставку на крупные линейные корабли, мы сможем запугивать противников и удерживать их вдали от наших берегов. Пара линкоров не повредит национальной гордости."
ANG_dockyards:0 "Наш порт"
ANG_dockyards_desc:0 "Для базирования и обслуживания нашего нового флота необходим полноценный порт. Построив несколько новых верфей, мы сможем удовлетворить потребности нашего ВМФ и открыть новое направление для торговли."
ANG_battlecruiser_f:0 "Большие корабли"
ANG_battlecruiser_f_desc:0 "Чтобы оставаться на уровне военно-морских сил других стран, мы должны постоянно развивать кораблестроение и строить более крупные суда. Как говорится, чем больше, тем лучше, и мы определённо способны стать сильнее."
ANG_light_cruiser_f:0 "Лёгкие крейсеры"
ANG_light_cruiser_f_desc:0 "Чтобы отвечать всё более строгим требованиям нашего флота, наши лёгкие крейсеры необходимо модернизировать. Броню и вооружение нынешних проектов почти наверняка можно улучшить, и если ради этого придётся нарушить несколько военно-морских соглашений – пусть так и будет."
ANG_battleship_f:0 "Линкоры"
ANG_battleship_f_desc:0 "Создать настоящий линкор – задача непростая, но это гордость любой державы. Благодаря растущему военно-морскому потенциалу страны и новейшим морским технологиям теперь это стало возможным. Настало время построить подлинный флагман нашего флота."
ANG_expand_dockyards:0 "Расширение верфей"
ANG_expand_dockyards_desc:0 "Наш растущий флот требует всё больше ресурсов и рабочей силы, поэтому для удовлетворения его потребностей будут построены новые верфи. В конце концов, флот не может существовать без верфей."
ANG_marine_f:0 "Сформировать корпус морской пехоты"
ANG_marine_f_desc:0 "Особенности современной войны сделали десантные операции необходимостью. Вместо того чтобы бросать на берег необученные регулярные части, не готовые к таким задачам, мы создадим отдельный корпус морской пехоты для проведения десантных операций и подготовим бойцов, способных успешно действовать в таких условиях."
ANG_transport_f:0 "Современные транспортные суда"
ANG_transport_f_desc:0 "По мере расширения десантных операций растёт и спрос на новые, лучше оснащённые транспортные суда. Совершенствуя существующие проекты, мы сможем перебрасывать больше войск к месту боевых действий быстрее и эффективнее, чем прежде."
ANG_trade_indirection_f:0 "Удар по топливной артерии"
ANG_trade_indirection_f_desc:0 "Мы не можем позволить себе прямое столкновение с более сильным противником. Зато новейшие подводные технологии открывают другой путь: крупный подводный флот при грамотной тактике способен легко нарушить морские торговые перевозки противника. Огромный флот мало чего стоит, если нечем заправлять его корабли."
ANG_destroyer_f:0 "Морское патрулирование"
ANG_destroyer_f_desc:0 "Не каждая задача требует самых крупных кораблей во флоте. Патрулирование береговой линии и охрана тяжёлых судов – задачи, которые куда лучше подходят лёгким кораблям. Благодаря компактности и простоте производства наши эсминцы смогут драться с противниками тяжелее своей весовой категории."
ANG_submarine_f:0 "Эксперименты с подводными лодками"
ANG_submarine_f_desc:0 "Возможность незаметно наносить удары по вражеским судам, подстерегать флот противника в океане и выжидать идеальный момент для атаки поистине леденит душу. Создавая новые проекты подводных лодок, мы сможем полнее раскрыть этот потенциал."

ANG_the_marshals_takeover:0 "Контрреволюция"
ANG_the_marshals_takeover_desc:0 "Улицы окрасились в алый цвет, а с республиканцами покончено. Маршал одержал верх и стал лидером страны; пора залечивать раны и решать насущные проблемы, стоящие перед Энгривером. Настало время перемен."
ANG_deafeating_the_free_state:0 "Изгнать их"
ANG_deafeating_the_free_state_desc:0 "Красные крепко удерживают позиции, а их хватка на жизненно важных артериях страны не ослабевает, но час удара пробил. Они отвлеклись на трофеи после своей недолгой победы, и мы сокрушим их."
ANG_ranger_patrols:0 "Отправить рейнджеров"
ANG_ranger_patrols_desc:0 "Леса в нынешнем состоянии слишком опасны: нужно положить конец страху перед тварями и прочими ужасами, таящимися в этом проклятом лесу. Рейнджеры разберутся с лесом раз и навсегда."
ANG_forest_checkpoints:0 "В поисках красных"
ANG_forest_checkpoints_desc:0 "В лесах скрываются анархисты, и они нашептывают свои лозунги сквозь листву, развращая грифонов своей гнусной идеологией. Мы отправим рейнджеров прочёсывать леса в поисках красных."
ANG_protecting_the_villages:0 "Страж деревень"
ANG_protecting_the_villages_desc:0 "Деревни годами страдали от налётов бандитов и влияния красных, тогда как государство не оказывало им помощи и фактически бросило на произвол судьбы. Но это неправильно – мы вооружим самых надёжных грифонов в деревнях и дадим им право защищать свои дома от тех, кто несёт им зло."
ANG_hunting_the_bands:0 "Охота на бандитов"
ANG_hunting_the_bands_desc:0 "Казна пустеет, а бандиты всё ещё на свободе; когда проблема у грифона в одном когте, а решение – в другом, остаётся лишь свести их воедино. Давайте наконец покончим с этими надоедливыми бандитами раз и навсегда."
ANG_order_restored:0 "Восстановить порядок"
ANG_order_restored_desc:0 "Вся наша работа, весь пролитый пот, кровь и слёзы наконец принесли плоды. Лес укрощён и превращён в надёжный рубеж для тех, кто хочет начать новую жизнь вдали отсюда."
ANG_black_claw_hunting:0 "Великий заговор"
ANG_black_claw_hunting_desc:0 "С красными покончено, и теперь настало время сломать клюв Когтю. Их идеология – это идеология тирании и разрушения, обрекающая народ на нищету, поборы и гибель. Чёрный Коготь скоро будет уничтожен."
ANG_reinforce_the_police:0 "Современная полиция"
ANG_reinforce_the_police_desc:0 "Полицейские силы Энгривера всегда представляли собой скорее разрозненное сборище солдат, исполнявших роль военной полиции, но с этим будет покончено: их преобразуют в первоклассную структуру, способную поддерживать стабильность в стране."
ANG_crackdown:0 "Карательные меры"
ANG_crackdown_desc:0 "Мы должны покончить с Чёрным Когтем: в Энгривере не должно оставаться места такой заразе, как эта организация. Мы уже арестовываем десятки их сторонников, но на их место приходят сотни других. Если выход и есть, то он в ещё более жёсткой расправе."
ANG_investigate_nobles:0 "Очевидные подозреваемые"
ANG_investigate_nobles_desc:0 "Дворянство оказалось между молотом и наковальней, выступив против планов маршала по улучшению жизни народа. К тому же многих аристократов подозревают в связях с Чёрным Когтем. К счастью, у маршала есть план, как с ними справиться."
ANG_the_ringleaders:0 "Вытащить их"
ANG_the_ringleaders_desc:0 "Мы покончим с Чёрным Когтем раз и навсегда. Мы найдём их в логовах и домах и будем бороться за свободу и независимость, чего бы это ни стоило. Хороший грифон не должен позволять злу жить и цвести у себя под боком."
ANG_the_claw_is_severed:0 "Разрушить Коготь"
ANG_the_claw_is_severed_desc:0 "Чёрный Коготь десятилетиями был бельмом на глазу; его преступления и сектантские замашки едва не разрушили страну, погрузив её в атмосферу страха и паранойи. Никто не знал, не задушит ли его во сне собственный сосед. Но наконец с ними будет покончено – мы сломаем эти когти."
ANG_amends_with_republicans:0 "Загладить вину"
ANG_amends_with_republicans_desc:0 "Недовольство республиканцев контрреволюцией маршала Отмара постепенно накапливалось. Если с ним не справиться, оно может перерасти в новое восстание и ввергнуть Энгривер в анархию."
ANG_meet_with_the_leaders:0 "Пожать их когти"
ANG_meet_with_the_leaders_desc:0 "Маршал Отмар встретился с лидером республиканцев – грифоном по имени Герхардом Блюмом. Они провели содержательный разговор о том, каким должно быть будущее Энгривера и что необходимо изменить, чтобы сделать его великой страной. Обе стороны назвали это хорошим началом для дальнейшего диалога."
ANG_freedom_of_speech:0 "Выпустить их"
ANG_freedom_of_speech_desc:0 "После долгих переговоров между республиканцами и маршалом было решено освободить задержанных во время контрреволюции, что стало жестом доброй воли со стороны маршала, стремящегося наладить отношения между сторонами."
ANG_spread_the_word:0 "Распространить весть"
ANG_spread_the_word_desc:0 "Несите весть, добрые грифоны! У маршала и республиканцев мало разногласий, и во многом они единомышленники – зачем спорить из-за формулировок, если главное – что мы оба хотим свободы и независимости?"
ANG_free_press:0 "Пусть их голоса будут услышаны"
ANG_free_press_desc:0 "Хунта маршала больше не будет заставлять республиканцев молчать! Теперь и пресса, и политические оппоненты маршала – разумеется, не из числа красных – могут свободно высказываться о том, как управляется великий Энгривер. Так что не бойтесь, журналисты: времена притеснений позади."
ANG_friendship:0 "Вместе сильнее"
ANG_friendship_desc:0 "Победителей не будет, если мы станем воевать друг с другом. Не останется ни одного грифона, если брат пойдёт на брата из-за разногласий. Мир и дружба – вот что откроет нам подлинное будущее, к которому стремятся все. В смерти побеждает лишь сам Маар."
ANG_the_new_constitution:0 "Конституция Энгривера"
ANG_the_new_constitution_desc:0 "Наконец пришло время закрепить положение маршала как одной из главных опор государства. Когда грифоны задаются вопросом, что удерживает Энгривер в единстве, им достаточно взглянуть на портрет на стене. Будущее светло, а местная демократия ведёт к местным выборам. За кого проголосуете вы?"
ANG_defending_our_home:0 "Сражаться за свой дом"
ANG_defending_our_home_desc:0 "Борись за правое дело, борись за свою жизнь! Все энгриверцы должны отстаивать своё право на существование: Империя наступает, чтобы вновь затянуть нас в свою бюрократию, где грифоны обязаны умирать по первому слову императора. Мы боролись за свободу и будем стоять за неё до конца."
ANG_the_national_guard:0 "Сформировать Национальную гвардию"
ANG_the_national_guard_desc:0 "Чтобы надёжно защититься от мощи Империи, мы должны уметь удерживать то, чего добились. Пока мы сражаемся на фронте, жители тревожатся и устают, страх заполняет их мысли, а сомнения гложут сердца. Но когда они видят бойца Национальной гвардии на каждом углу, весь страх отступает, ведь они знают, что находятся под защитой."
ANG_the_right_to_bear_arms:0 "Право на ношение оружия"
ANG_the_right_to_bear_arms_desc:0 "Империя превосходит нас численностью, выпускает больше продукции и способна выставить армию численностью большей, чем всё население Энгривера. Наша главная опора – каждый дом, где живут наши грифоны, ведь когда империалисты постучат в дверь, им ответят выстрелами."
ANG_angriver_forever:0 "Позаботиться о нашей собственности"
ANG_angriver_forever_desc:0 "Грифонам нужна работа, а солдатам – оружие. Пришло время убить двух зайцев одним выстрелом. Разве не таков настоящий прагматичный маршал?"
ANG_a_modern_nation:0 "Современная нация – это безопасная нация"
ANG_a_modern_nation_desc:0 "Сильная и безопасная страна – это место, где дети не умирают от голода и болезней, жизнь становится проще, а недостатки компенсируются технологиями. Такой должна быть держава, заботящаяся о своём народе. Путь будет трудным, но перемены к лучшему уже близки."
ANG_springtime_in_angriver:0 "Весна в Энгривере"
ANG_springtime_in_angriver_desc:0 "Когда приходит весна, грифоны могут наконец перевести дух и по-настоящему вдохнуть аромат цветов. Посмотрите, к чему привели реформы Отмара – это настоящий прогресс. Для Энгривера наступает невиданный прежде золотой век, и по мере роста доходов грифоны начинают вкладывать средства. Кому-то нужны гранты на строительство – почему бы не поддержать их?"
ANG_welfare_for_the_people:0 "Создать Социальный кодекс"
ANG_welfare_for_the_people_desc:0 "Есть грифоны, которым не хватает работы, и есть те, кто не может трудиться из-за душевного расстройства или физических увечий. Пожилые всю жизнь трудятся, чтобы встретить старость, располагая лишь скромными накоплениями, отложенными за годы труда. Мы должны помочь им – мы обязаны помочь своему народу."
ANG_northern_ties:0 "Наши друзья за границей"
ANG_northern_ties_desc:0 "Сотрудничая с соседями из Грифонстоуна, можно приумножить богатство. Жители Грифонстоуна и Фетизии выразили готовность вкладывать средства в нашу страну."
ANG_scientific_advance:0 "Научный прогресс"
ANG_scientific_advance_desc:0 "Маршал – покровитель наук; его советники с удовольствием знакомят его с новыми открытиями и достижениями, и со временем он всерьёз увлёкся идеей технологически передового Энгривера, начав вкладывать в науку ещё больше средств."
ANG_industrial_might:0 "Звуки промышленности"
ANG_industrial_might_desc:0 "Слышишь, как вращаются шестерёнки? Как гудят и мерно стучат станки? Гул промышленности становится всё громче – мощь и сила, пульсирующие в механизмах, дарят настоящее упоение."
ANG_open_borders:0 "Открытость"
ANG_open_borders_desc:0 "Война никогда не меняется. Она ломает судьбы и превращает дома в руины, а те, кто бежит от неё, не находят спасения, когда границы закрыты. Но мы должны помочь этим угнетённым грифонам, раз у нас есть средства и воля. Так почему бы не протянуть им когти помощи?"
ANG_our_homeland:0 "Дом храбрых"
ANG_our_homeland_desc:0 "Энгривер – дом свободных и храбрых, где народ счастлив, где бедные не голодают и где каждый желающий трудиться может найти работу. Чёрный Коготь давно сгинул, шрамы ещё напоминают о прошлом, но оно осталось позади. Отмар проделал отличную работу."

ANG_anarchism:0 "Анархия в Энгривере"
ANG_anarchism_desc:0 "После десятилетий борьбы наше упорство было вознаграждено, и мы свергли злого барона! Но праздновать некогда: мы должны провести перемены и окончательно упразднить государство. Только так мы по-настоящему достигнем своих целей."
ANG_futurism:0 "Футуризм"
ANG_futurism_desc:0 "Оковы традиций и страх перед переменами больше не будут сковывать художественный поиск. Мы устремимся к современности стремительно и неудержимо, ломая преграды и освобождая страну от груза прошлого."
ANG_heroes_of_the_revolution:0 "Герои революции"
ANG_heroes_of_the_revolution_desc:0 "Немало грифонов погибло в борьбе против гнетущего аппарата государства. Их жертва не была напрасной, и мы никогда не забудем наших товарищей! Не забудем мы и тех, кто выжил, – закалённых в боях и покрытых шрамами ветеранов. Они получат щедрую материальную поддержку в благодарность за свою борьбу."
ANG_local_councils:0 "Конфедерация коммун"
ANG_local_councils_desc:0 "Бароны годами держали население Энгривера в железных тисках, не оставляя никакой свободы. Теперь многое переменится, ведь власть будет децентрализована, а государство упразднено. Мы создадим конфедерацию свободных автономных коммун, добровольно объединившихся под знаменем анархии."
ANG_farms_for_the_farmers:0 "Фермы фермерам"
ANG_farms_for_the_farmers_desc:0 "Долгие годы высшее сословие скупало огромные наделы земли, заставляя крепостных трудиться за гроши. Довольно! Земля принадлежит всем нам! Сельские коммуны должны обрабатывать её сообща и делиться плодами своего труда. Земля не может быть собственностью кого-то одного – она нужна всем нам, чтобы выжить. Больше грифоны не будут голодать из-за чужой алчности."
ANG_worker_control:0 "Захватить средства производства"
ANG_worker_control_desc:0 "Теперь анархическая революция распространится из сельской местности на крупные города и промышленные центры Энгривера. Фабрики, мельницы, мастерские, транспорт и коммунальные службы – всё будет принадлежать всем. Больше никаких зарплат, жёстких графиков работы и богатых хозяев. От каждого – по способностям, каждому – по потребностям!"
ANG_peoples_roads:0 "Соединить коммуны"
ANG_peoples_roads_desc:0 "Во времена барона дороги в сельской местности пришли в полный упадок. Теперь же общины, стремящиеся проложить новые пути для обмена и торговли, сообща берутся за строительство дорог. Одна небольшая деревня на восточных холмах даже обратилась за помощью – и соседи откликнулись, а значит, даже самая бедная и крошечная коммуна в Энгривере будет связана с остальными."
ANG_anarchist_society:0 "Анархистское общество"
ANG_anarchist_society_desc:0 "Последние следы частной собственности, денег, феодализма и капитализма стёрты с лица Энгривера. Мы достигли подлинного анархо-коммунизма. Некоторые считают анархизм невозможным, хаотичным и неуправляемым. Однако объёмы производства растут и в городах, и в сёлах, а труженики работают на общее благо, зная, что товарищи обеспечат их всем необходимым."
ANG_anarchist_education:0 "Коммунальное образование"
ANG_anarchist_education_desc:0 "Учителя и учёные долго жаловались на мизерное жалованье. Теперь они вообще не получают платы, но трудятся с ещё большим рвением. Товарищи щедро делятся с ними излишками припасов, ценя их вклад в общее дело, помощь в воспитании подрастающего поколения и стремление постичь устройство мира. Знаниями делятся свободно, и никто не прячет их под замком."
ANG_build_support:0 "Принятие анархии"
ANG_build_support_desc:0 "Многие грифоны Энгривера отравлены государственными догмами и сомневаются, что смогут жить в анархическом обществе. Мы должны разъяснить им суть перемен и показать, что стремимся лишь к свободе и благополучию для всех. Нужно также объяснить, что отмена частной собственности не лишает их личных вещей."
ANG_matters_of_faith:0 "Ни богов, ни господ"
ANG_matters_of_faith_desc:0 "Долгое время жрецы внушали, будто боги карают и диктуют жизнь по суровым заповедям, а сами набивали храмы несметными богатствами. Этому придёт конец. Боги – не жестокие деспоты, а наши творцы, любящие как родители любят своих детей. Храмы очистят от излишеств, а время догматизма минует: поклоняться богам можно будет свободно, без сковывающих правил."
ANG_syndicates:0 "Синдикаты рабочих"
ANG_syndicates_desc:0 "Ярким примером анархического синтеза становится рост числа синдикалистских союзов, которые стремительно набирают силу. Рабочие советы берут в свои руки управление городской экономикой. Оказывается, работники трудятся куда охотнее, когда работают не на жестокого хозяина, а ради общего процветания."
ANG_red_rangers:0 "Красные рейнджеры"
ANG_red_rangers_desc:0 "В наших рядах немало бойцов-партизан, годами воевавших в Шайсвальде против бандитов, контрреволюционеров и чудовищ. Теперь они могут официально войти в ряды рейнджеров и снова проявить своё мастерство."
ANG_hunting_the_bourgeoise:0 "Пропаганда хороших поступков"
ANG_hunting_the_bourgeoise_desc:0 "Долгое время мы подкрепляли призывы прямым действием против буржуазных выскочек, чтобы разжечь пламя революции. Теперь, когда власть в наших руках, зачем останавливаться? Не давайте пощады этим негодяям и смотрите, как народ ликует от радости и облегчения при виде расправы над алчными эксплуататорами."
ANG_the_baron_fate:0 "Смерть деспоту!"
ANG_the_baron_fate_desc:0 "Долгие годы Энгривер страдал под гнётом Леера «Беспощадного» – самого жестокого правителя, какого только можно вообразить. Он не знал милосердия к другим, так почему же мы должны щадить его? Пусть этот одержимый властью и насилием безумец отвечает по заслугам."
ANG_confiscate_assets:0 "Конфисковать государственные активы"
ANG_confiscate_assets_desc:0 "Прежде баронству принадлежало множество строений по всей стране: казённые дворцы, усадьбы, склады и мастерские. Теперь, когда государства больше нет, эти здания и всё имущество принадлежат всем. Бюрократы и капиталисты, преграждающие нам путь, будут устранены."
ANG_destroy_the_claw:0 "Уничтожить Коготь"
ANG_destroy_the_claw_desc:0 "Чёрному Когтю доверять нельзя. Кто знает, что его члены замышляют в тени? Наверняка они готовят удар по нашему свободному союзу равенства. Если они хотят пощады, пусть открыто расскажут о своих подлинных намерениях – ведь слово и мысль больше не скованы запретами."
ANG_local_units:0 "Коммунальное ополчение"
ANG_local_units_desc:0 "С государственным аппаратом насилия и силовиками покончено. Но нам всё равно нужно позаботиться об обороне на случай внешнего вторжения. Поэтому создаются общинные отряды ополчения: они берут оружие со складов и готовятся к бою. Ополченцы мотивированы, ведь сражаются не за властного вождя и не за монеты, а за свои дома и семьи."
ANG_local_armories:0 "Пушку в каждый дом!"
ANG_local_armories_desc:0 "Единственный надёжный способ сберечь свободу для всех и не допустить возвращения гнёта – вооружить каждого жителя. Тогда никто не сможет навязывать свою волю силой, и все будут равны перед лицом угрозы. Ради этого коммуны разворачивают выпуск оружия и готовят мастеров-оружейников."
ANG_the_communard_army:0 "Колонна Шерлера"
ANG_the_communard_army_desc:0 "Хотя главную опору обороны Конфедерации составляют общинные отряды, могут потребоваться и скоординированные силы. Отряды ополчения следует объединить под единым красным знаменем, которое понесёт вожак партизан Шерлер. Пусть это пока и не кадровая армия, но преданность и революционный запал её бойцов не вызывают сомнений."
ANG_the_battlecry_of_freedom:0 "Боевой клич свободы"
ANG_the_battlecry_of_freedom_desc:0 "Грифоны Энгривера обрели свободу, но миллионы других по-прежнему остаются в цепях, порабощённые буржуазными и феодальными хозяевами. Можем ли мы спокойно смотреть на их муки? Нет! Мы пойдём вперёд с революционными песнями, неся свободу грифонам Герцланда! За свободную Грифонию!"

ANG_elections:0 "Первые выборы"
ANG_elections_desc:0 "Энгривер теперь по-настоящему свободен от тирании, и пришло время народу решить, по какому пути двигаться дальше. Ожидается напряжённая борьба, поскольку участвующие в выборах партии придерживаются совершенно разных взглядов на дальнейший путь Энгривера."
ANG_bluhm:0 "Победа Национально-республиканской партии"
ANG_bluhm_desc:0 "Герхард Блюм и его республиканцы получили большинство голосов и готовы превратить Энгривер в оплот республиканизма. Страна шагнёт в светлую новую эпоху с триколором в когтях."
ANG_republican_spirit:0 "Республиканский дух"
ANG_republican_spirit_desc:0 "Грифоны Энгривера боролись и отдавали жизни за свободу и готовы сделать это снова. В стране укрепилось сильное чувство патриотизма, и с каждым днём всё больше грифонов заявляют о верности партии и республике."
ANG_take_the_land:0 "Отнять землю"
ANG_take_the_land_desc:0 "Алчные землевладельцы и дворяне владеют большей частью земли в Энгривере. Эти гнусные паразиты поколениями похищали и убивали простых грифонов ради расширения своих владений, и пришло время им понести заслуженную кару за свои злодеяния. Их земли отберут – при необходимости силой."
ANG_for_the_people:0 "Для народа"
ANG_for_the_people_desc:0 "Национально-республиканская партия опирается на три главных принципа: свободу, демократию и процветание. Эти идеалы выше интересов отдельных грифонов и любых государств. Они вдохновили народ отдавать все силы общему делу и оставаться верным партии."
ANG_the_march_of_progress:0 "Марш прогресса"
ANG_the_march_of_progress_desc:0 "Экономика Энгривера находится в плачевном состоянии, и НРП намерена исправить положение смелым планом. Масштабные государственные вложения в инфраструктуру и промышленность Энгривера – лишь первый этап. Энгривер не сможет добиться процветания в новую эпоху без современной промышленной базы."
ANG_rapid_industrialisation:0 "Быстрая индустриализация"
ANG_rapid_industrialisation_desc:0 "Огромные субсидии для всех, кто готов открыть завод в Энгривере, и щедрые партийные льготы быстро превратили страну в центр притяжения для промышленников. Едва ли не каждый день в стране появляются новые предприятия, а над ней всё чаще поднимается дым фабричных труб."
ANG_pumped_up:0 "Приготовимся к худшему"
ANG_pumped_up_desc:0 "Хотя теперь Энгривер располагает достойной промышленной базой, мощностей военного производства по-прежнему не хватает. Чтобы исправить положение, мы заключили ряд соглашений с известными оружейными компаниями, обменяв крупные налоговые льготы на строительство новых военных заводов."
ANG_stronghold_of_republicanism:0 "Оплот республиканизма"
ANG_stronghold_of_republicanism_desc:0 "Герхард Блюм и его республиканцы завоевали сердца жителей. Под их властью население Энгривера прониклось идеалами республиканизма. Народ сплочён, предан делу и готов защищать свою страну до конца."
ANG_new_officers:0 "Новые офицеры"
ANG_new_officers_desc:0 "Силы революции состояли в основном из наскоро собранного ополчения и не имели слаженной командной структуры и крепкого офицерского корпуса. Повышая наиболее способных командиров и набирая новых офицеров, мы сможем решить эту острую проблему наших вооружённых сил."
ANG_resurrect_republican_army:0 "Воскрешение Республиканской армии"
ANG_resurrect_republican_army_desc:0 "Бойцы Республиканской армии до самого конца доблестно сражались против тиранических имперских войск и вдохновили многих других на борьбу с гнётом. Возрождение этой славной армии и превращение её в основу наших вооружённых сил, без сомнения, заметно укрепит боевой дух."
ANG_eichberg:0 "Социал-демократы получают большинство"
ANG_eichberg_desc:0 "Гера Эйхберг и Социал-демократическая партия получили убедительное большинство на выборах и готовы в полной мере воплотить свои амбициозные планы."
ANG_welfare_programs:0 "Программы социального обеспечения"
ANG_welfare_programs_desc:0 "Одними из первых обещаний Эйхберг и её партии стали стабильность и достаток для каждого жителя Энгривера. Ради этого запускается комплексная программа социального обеспечения, гарантирующая, что ни один грифон не останется без пищи или медицинской помощи в новом обществе, которое строят социал-демократы."
ANG_proper_land_reform:0 "Правильная земельная реформа"
ANG_proper_land_reform_desc:0 "Земля в Энгривере никогда не распределялась справедливо: большая её часть принадлежала богатым землевладельцам и дворянам. Социал-демократы намерены исправить эту несправедливость, но важно сделать это грамотно. Нам предстоит устранить порождающее эту несправедливость неравенство и обеспечить ненасильственный ход реформ."
ANG_cooperate_with_syndicates:0 "Сотрудничество с синдикатами"
ANG_cooperate_with_syndicates_desc:0 "Хотя синдикаты и их анархистские союзники не взяли под полный контроль Энгривер, они по-прежнему остаются весомой силой на политической арене. Учитывая их интересы и выполняя некоторые требования, мы сможем обрести ценных и влиятельных союзников."
ANG_a_free_society:0 "Свободное общество"
ANG_a_free_society_desc:0 "Социал-демократы намерены глубоко обновить сам уклад жизни в Энгривере, выстраивая по-настоящему свободное и справедливое общество. Мы поддержим растущую экономику, обеспечим обычным гражданам гражданские свободы, которых они прежде были лишены, и сделаем систему управления более справедливой."
ANG_a_connected_nation:0 "Связанная нация"
ANG_a_connected_nation_desc:0 "Энгривер остаётся независимой страной, однако прежние власти так и не смогли должным образом развить местную инфраструктуру. Нам предстоит продолжить начатое ими дело: возобновить строительство и проложить новую сеть автомобильных дорог по всему краю."
ANG_support_local_companies:0 "Поддержка местных компаний"
ANG_support_local_companies_desc:0 "В то время как другие партии подстраивались под запросы крупных корпораций, социал-демократы всегда обещали поддержку небольшим местным предприятиям Энгривера. Наконец мы можем помочь этим инициативным предпринимателям и принять законы, облегчающие жизнь владельцам малого бизнеса."
ANG_freedom_for_all:0 "Свобода для всех"
ANG_freedom_for_all_desc:0 "Амбициозные планы Эйхберг превзошли самые смелые ожидания, а их плоды оказались огромными. Энгривер стал добрее и мягче, чем прежде – это общество, которое по-настоящему заботится о каждом живущем в нём существе."
ANG_dispose_of_the_baron:0 "Участь барона"
ANG_dispose_of_the_baron_desc:0 "Барон Леер «Беспощадный» угнетал жителей Энгривера десятилетиями, и настало время для заслуженного возмездия. Этот день должен запомниться каждому гражданину Энгривера."
ANG_hunt_down_the_claw:0 "Охота на Коготь"
ANG_hunt_down_the_claw_desc:0 "Чёрный Коготь веками был бельмом на глазу у жителей Энгривера, безнаказанно убивая и запугивая их. Но ни одна организация не скроется надолго от сил революции. Наше ополчение вытащит их на свет из тёмных укрытий, и, когда их разоблачат, они получат по заслугам."
ANG_weschler:0 "Социал-либеральная партия побеждает на выборах"
ANG_weschler_desc:0 "Отто Вешлер и Социал-либеральная партия заручились поддержкой избирателей и теперь готовы взять на себя управление Энгривером. Пообещав сохранить независимость и стабильность страны, социал-либералы теперь должны решить множество непростых задач."
ANG_safeguard_the_people:0 "Защитите народ"
ANG_safeguard_the_people_desc:0 "Если Энгривер хочет пережить грядущие потрясения, ему необходимо догнать остальной мир по уровню промышленного развития. Мы не сможем защитить себя, если не сумеем сбалансировать бюджет и обеспечить насущные потребности народа."
ANG_buyout_estates:0 "Выкупить поместья"
ANG_buyout_estates_desc:0 "Несколько крупных поместий, принадлежащих знатным родам, занимают земли, крайне ценные для промышленного развития. Зачастую самое простое решение оказывается лучшим: выкупить эти земли будет несложно."
ANG_use_the_land:0 "Использование земли"
ANG_use_the_land_desc:0 "Теперь, когда земли бывших поместий окончательно перешли в собственность государства, мы можем предоставить нескольким крупным компаниям особые права на эти земли в обмен на строительство заводов и шахт в Энгривере. Народ может немного поворчать, но когда это мешало прибыли?"
ANG_angriverian_identity:0 "Энгриверская идентичность"
ANG_angriverian_identity_desc:0 "У Энгривера никогда не было собственной национальной идентичности, и большинство жителей считали себя подданными империи. Нельзя мириться с этим дальше – необходимо сформировать новую идентичность. Жители Энгривера по-своему особенные, или, по крайней мере, в чём нам предстоит их убедить."
ANG_urbanisation:0 "Урбанизация"
ANG_urbanisation_desc:0 "Энгривер не может оставаться обществом, застрявшим в прошлом, поэтому значительной части населения придётся переселиться в города. В городах у обычных жителей гораздо больше возможностей. И пусть сельская местность отходит на второй план – так тому и быть."
ANG_national_arms_industry:0 "Национальная оружейная промышленность"
ANG_national_arms_industry_desc:0 "Сейчас у Энгривера недостаточно производственных мощностей, чтобы выпускать оружие для собственной армии в нужных количествах. Пока мы не восполним этот дефицит, страна будет крайне уязвима перед внешней агрессией. Строительство новых военных заводов должно стать приоритетом для наших промышленников."
ANG_an_industrious_nation:0 "Трудолюбивое общество"
ANG_an_industrious_nation_desc:0 "Энгривер окончательно избавился от прежней репутации экономического захолустья Грифонии. Теперь экономика растёт быстрыми темпами, и всё больше грифонов ежедневно приходят работать на фабрики. Для Энгривера и его промышленников открываются хорошие перспективы."
ANG_river_forts:0 "Речные форты"
ANG_river_forts_desc:0 "Река, протекающая через Энгривер, служит отличным естественным рубежом обороны от любой агрессии со стороны империи. Усилив естественный рубеж фортами, мы создадим оборонительную линию, для прорыва которой потребуются огромные силы."
ANG_national_academia:0 "Национальная академия"
ANG_national_academia_desc:0 "У Энгривера никогда не было по-настоящему сильной научной базы, но благодаря недавним реформам край стал привлекательным для многих учёных и исследователей, ценящих свободное общество. Нам стоит поощрять этих специалистов переселяться сюда и развивать отечественную науку."
ANG_more_industrial_projects:0 "Больше промышленных проектов"
ANG_more_industrial_projects_desc:0 "Энгривер стремительно становится центром промышленного роста, и предложения от компаний и промышленников, желающих закрепиться в стране, поступают едва ли не каждый день. Одобрить самые выгодные из них точно не помешает."

ANG_heartless_creatures:0 "Удары Когтя"
ANG_heartless_creatures_desc:0 "Крестьяне-выскочки попались на нашу уловку, и теперь им уже поздно что-либо предпринять. Государственный аппарат прочно находится в когтях Геры Эйхберг, провозгласившей себя регентом Энгривера. Чёрный Коготь наконец перестал скрываться и теперь может перестроить Энгривер в соответствии со своими грандиозными замыслами."
ANG_the_claw_ascended:0 "Очистить офицерский корпус"
ANG_the_claw_ascended_desc:0 "Глупому любителю крестьян Отмару Штойберу позволили выдвигать грифонов низкого происхождения на офицерские должности, которые испокон веков занимала знать. Эту ошибку мы исправим. Отныне во главе солдат будут стоять только чистокровные и дисциплинированные аристократы, верные Чёрному Когтю!"
ANG_modernisation_plan:0 "Создать Чёрную гвардию"
ANG_modernisation_plan_desc:0 "Армия находится под контролем лояльных дворян, и можно приступать к следующему шагу нашего плана. Официальным продолжением Когтя станет Чёрная гвардия, состоящая из элитных рыцарей, присягнувших на верность регенту. Её бойцы будут навязывать волю регента железом, огнём и кровью, истребляя тех, кто не подчиняется божественным приказам Чёрного Когтя."
ANG_all_to_the_nobility:0 "Феодальное ополчение"
ANG_all_to_the_nobility_desc:0 "Каждый способный сражаться грифон обязан служить короне в трудные времена. Сейчас это особенно необходимо: Грифонию нужно спасти от упадка и разложения. Все должны откликнуться на призыв; военной службы можно избежать, только заплатив немалый налог. Так корона получит либо солдат, либо деньги. И то и другое очень ценно."
ANG_crushed_spirits:0 "Связаться с имперскими дворянами"
ANG_crushed_spirits_desc:0 "В императорской армии есть дворяне, которые недовольны действиями лжерегента. Чёрный Коготь может предложить им лучшую альтернативу – регента, который гарантирует их права и готов сражаться за них. Так почему же они должны продолжать служить регенту [GRI.GetLeader], если вместо этого они могут преклонить колени перед нами?"
ANG_secure_our_power:0 "Очищение Шайсвальда"
ANG_secure_our_power_desc:0 "Многие до сих пор сопротивляются власти Чёрного Когтя. К счастью, против этих отвратительных выскочек есть эффективное средство – пули. Мы не остановимся, пока не будет уничтожено каждое логово предателей, настоящих или подозреваемых! Рейнджеры уйдут в леса и выследят свою добычу – презренных мятежников."
ANG_make_examples:0 "Уничтожить анархо-мааритов"
ANG_make_examples_desc:0 "Всем известно, что Вилли Шерлер – ревностный маарит, приносящий птенцов в жертву своему злому божеству. Наш моральный долг – выследить его и остальных нечестивых последователей! Они могут прятаться и убегать, но это лишь отсрочит неизбежное. В итоге мы найдём их и расправимся с ними."
ANG_kill_the_rangers:0 "Чистки среди бюргеров"
ANG_kill_the_rangers_desc:0 "Горожане всегда были нашими заклятыми врагами. Именно они стали проводниками коммерциализации, либерализма, демократии и культурного обмена. Неудивительно, что почти все республиканцы пришли из их рядов. Республиканцы – полная противоположность Чёрному Когтю. Они не могут сосуществовать: одна сторона должна уничтожить другую."
ANG_crush_the_resistance:0 "Благословение прелата"
ANG_crush_the_resistance_desc:0 "После уничтожения сопротивления в Энгривер вернулся мир. Прелат Борея, которую безбожный барон так долго отодвигал на второй план, благодарна нам, ведь повстанцы выступали против божественного общественного порядка, основанного на заветах Борея. Прелат на нашей стороне, так что многие грифоны начнут поддерживать наше справедливое и благородное дело."
ANG_the_secret_council:0 "Встреча с бароном"
ANG_the_secret_council_desc:0 "Леер, бывший барон Энгривера, был заключён в тюрьму республиканцами. Они планировали казнить его, но быстрый захват власти Чёрным Когтем спас ему жизнь. Он всё ещё томится в тюрьме, но, возможно, пришло время регенту Гере даровать ему свободу."
ANG_the_claw_guard:0 "Камарилья"
ANG_the_claw_guard_desc:0 "Самые надёжные соратники Эйхберг войдут в её неофициальное окружение. Благодаря их многочисленным связям и умению плести интриги нам будет куда легче управлять страной. Эти преданные члены Чёрного Когтя умеют дёргать за ниточки и убеждать других охотно выполнять их приказы."
ANG_gas_weapons:0 "Длинная хватка Когтя"
ANG_gas_weapons_desc:0 "Влияние Чёрного Когтя почти не распространялось за пределы Энгривера, поскольку его деятельность нужно было сохранять в тайне любой ценой. Но теперь, когда маски сорваны, пришло время обратить взор за пределы этой захолустной провинции. Враги регента недолго останутся вне нашей досягаемости. Скоро они узнают, что можно сбежать, но нельзя спрятаться."
ANG_hire_mercs:0 "Восстановление привилегий"
ANG_hire_mercs_desc:0 "Не секрет, что барон Леер расширил свою власть за счёт традиционной знати, сильно ослабленной революцией 978 года. Многие особые права, которыми древние энгриверские семьи обладали на протяжении веков, были вычеркнуты из книг законов. Теперь они будут восстановлены, и их семьи будут вечно благодарны Чёрному Когтю."
ANG_restore_feudalism:0 "Возвращение феодализма"
ANG_restore_feudalism_desc:0 "По всему континенту неуклонно шёл процесс отмены феодализма. Его называли «эволюцией», «развитием» или «приходом современности». Но на самом деле эквестрийцы таким образом коварно разрушали древние традиции грифонов. В по-настоящему гармоничном обществе каждый знает своё место в иерархии, а богатые доминируют над бедными."
ANG_work_the_land:0 "Навязывание крепостного права"
ANG_work_the_land_desc:0 "Рабство – это варварская и отвратительная практика. Взамен наши предки создали крепостное право – более цивилизованную форму рабства. Привязанные к земле крестьяне, ставшие собственностью сюзерена, будут бесплатно трудиться в счёт погашения долгов. И если они будут трудиться достаточно усердно, то, возможно, смогут вернуть свободу..."
ANG_fill_the_mills:0 "Искупление через труд"
ANG_fill_the_mills_desc:0 "После переворота многие грифоны, некогда выступавшие против Чёрного Когтя, оказались за решёткой. Вместо того чтобы просто избавиться от них, мы можем извлечь из них пользу. Шахты опасны и всегда нуждаются в новых рабочих. Эти заключённые получат шанс искупить свою вину тяжёлым трудом – или погибнут, пытаясь это сделать."
ANG_into_the_factories:0 "Промышленное крепостничество"
ANG_into_the_factories_desc:0 "Индустриализацию нельзя повернуть вспять, а возврат к прошлому укладу невозможен. Вместо этого аристократия должна приспособиться к новым способам производства. Аристократы захватят предприятия и бизнес, а рабочие станут городскими крепостными – собственностью компаний. Подобно обычным крепостным, они будут либо работать, либо умрут."
ANG_skull_roads:0 "Барщина"
ANG_skull_roads_desc:0 "Согласно древним законам каждый трудоспособный житель Энгривера должен участвовать в общественных работах. Это жизненно необходимо для поддержания дорог и мостов в надлежащем состоянии, ведь Шайсвальд постоянно пытается захватить их. Работа будет тяжёлой, а те, кто откажется её выполнять, будут жестоко наказаны."
ANG_ruthless_industry:0 "Аристократическое воспитание"
ANG_ruthless_industry_desc:0 "Дворяне всегда были более образованными, чем крестьяне, но новый класс бюргеров способен соперничать с аристократией. Это неприемлемо, ведь благородное сословие всегда должно превосходить всех остальных грифонов. Чёрный Коготь будет лично контролировать обучение представителей этого нового класса, промывая им мозги с самого юного возраста."
ANG_testing_the_limits:0 "Тёмное просвещение"
ANG_testing_the_limits_desc:0 "Изучение окружающего мира никогда не должно ограничиваться этическими и моральными соображениями: они лишь мешают научному прогрессу. Господства над природой и грифоньим родом можно достичь лишь путём жертв. Наши учёные не испытывают недостатка в желающих стать подопытными, поэтому сейчас им осталось лишь сбросить тяжёлые оковы морали."
ANG_the_perfect_state:0 "Свергнуть ложное регентство"
ANG_the_perfect_state_desc:0 "Энгривер был перестроен в соответствии с идеалами Чёрного Когтя. Низшие грифоны трудятся на благо своих знатных хозяев, а все прочие, кто мог бы помешать нашему делу, были... удалены. Теперь Гера Эйхберг хочет достичь своей главной цели: спасти Империю от злых когтей её никчёмного регента."

ANG_they_shall_know_fear:0 "Они познают страх"
ANG_they_shall_know_fear_desc:0 "Коварные паразиты, кишевшие в Энгривере с тех пор, как была предпринята попытка республиканской революции, наконец раскрылись и тем самым предрешили свою судьбу. Барон Леер сделает всё возможное, чтобы избавить Энгривер от этой чумы и стереть последние следы республиканизма."
ANG_restore_order:0 "Восстановить порядок"
ANG_restore_order_desc:0 "Бандиты Армии Свободного Государства продолжают досаждать нам, несмотря на то что их нападение было отбито. Чтобы покончить с ними, необходимо принять решительные меры. Барон постановил, что любой, кого подозревают в сотрудничестве с бандитами, считается виновным в государственной измене и будет наказан соответствующим образом."
ANG_into_the_forest:0 "В леса!"
ANG_into_the_forest_desc:0 "Шайсвальд слишком долго был рассадником революционеров и культов. Если барон хочет навести порядок в Энгривере, необходимо обыскать каждый участок леса, проследить все тропы и застрелить каждого предателя. При полной поддержке государства зачистка лесов от этих паразитов – лишь вопрос времени."
ANG_burn_them_out:0 "Сжечь их всех!"
ANG_burn_them_out_desc:0 "Несмотря на все усилия наших верных солдат, очаги сопротивления по-прежнему скрываются в глубине Шайсвальда. Такими темпами мы не избавимся от преступников и за десятилетия, поэтому пора принять решительные меры. Лес будет очищен от бандитов, даже если нам придётся сжечь его дотла."
ANG_reasurre_nobility:0 "Успокоить дворян"
ANG_reasurre_nobility_desc:0 "Дворяне – основа власти барона в Энгривере, но, к сожалению, их верность нельзя считать безусловной. Недавние нападения, какими бы жалкими они ни были, несколько поколебали их уверенность в стабильности Энгривера. Барон произнесёт несколько публичных речей по всей стране, чтобы показать: у мерзких республиканцев не хватит смелости напасть на него открыто."
ANG_release_the_hounds:0 "Спустите псов!"
ANG_release_the_hounds_desc:0 "После поражения от верных солдат барона мерзкие республиканцы рассеялись и теперь скрываются по всему Энгриверу, выжидая удобного момента для нового удара. Мы должны выследить каждого предателя, прежде чем они получат такую возможность, чтобы жизнь барона больше не подвергалась опасности."
ANG_burn_the_fields:0 "Сжечь поля!"
ANG_burn_the_fields_desc:0 "Республиканские трусы скрываются в сельской местности, пользуясь помощью фермеров, сочувствующих их делу. Если мы хотим покончить с ними раз и навсегда, нужно разобраться и с теми, кто им потворствует. Любой, кого поймают на укрывательстве предателей, будет казнён. А чтобы перекрыть мятежникам поставки продовольствия, их поля будут сожжены дотла."
ANG_teach_them_a_lesson:0 "Урок страха"
ANG_teach_them_a_lesson_desc:0 "Солдаты барона обрушатся на Энгривер, словно огненная волна, уничтожая всё на своём пути. Они не остановятся, пока последний республиканец не погибнет, а каждый триколор не будет разорван в клочья. Республиканцы научатся бояться барона – или умрут."
ANG_initial_stabilisation:0 "Затишье перед бурей"
ANG_initial_stabilisation_desc:0 "Теперь, когда Энгривер избавлен от чумы республиканизма, настало время барону укрепить свою власть над страной. Его господство останется непререкаемым, а каждый гражданин станет исполнителем его воли. Энгривер был бы ничем без барона, и он намерен воспользоваться этим в полной мере."
ANG_the_barons_authority:0 "Страна барона"
ANG_the_barons_authority_desc:0 "Барон правит Энгривером единолично и обладает абсолютной властью, а каждый гражданин обязан беспрекословно подчиняться его воле. С помощью пропагандистской кампании мы превратим барона в символ единства народа, а его мудрость и сила станут доказательством законности его правления."
ANG_deal_with_the_claw:0 "Сделка с Когтем"
ANG_deal_with_the_claw_desc:0 "Хотя мотивы Чёрного Когтя остаются загадкой даже для барона, нельзя отрицать, что на протяжении веков организация демонстрировала свою эффективность. Организации с такими навыками и талантами нашлось бы достойное применение, и, возможно, идеологические разногласия между ней и бароном не так велики, как кажется на первый взгляд."
ANG_butcher_the_claw:0 "Разобраться с Когтем"
ANG_butcher_the_claw_desc:0 "Чёрный Коготь веками преследовал Энгривер, а его мотивы оставались загадкой для всех, кто не входил в его ряды. С этим больше нельзя мириться: если барон хочет править Энгривером как следует, мы вытащим Коготь на свет. Его агентов будут выслеживать, допрашивать и казнить, пока мы не раскроем личности лидеров и не уничтожим организацию раз и навсегда."
ANG_loyal_nobility:0 "Безусловное послушание"
ANG_loyal_nobility_desc:0 "Воля барона провозглашена высшим законом Энгривера, и теперь наши граждане подчиняются ей во всех сферах жизни. Страх и ужас превратили общество Энгривера в общество абсолютного, безоговорочного повиновения барону."
ANG_control_information:0 "Знание – сила"
ANG_control_information_desc:0 "Чтобы никто из подданных барона больше не смог устроить заговор, мы должны тщательно собирать сведения о каждом из них. Каждый обрывок информации дополняет общую картину, а созданная по всей стране сеть осведомителей позволит нам следить за каждым предателем и не дать ему ускользнуть от нашего взора."
ANG_loyalty_officers:0 "Офицеры лояльности"
ANG_loyalty_officers_desc:0 "После успеха сети осведомителей барон приказал создать в Энгривере тайную полицию. Офицеры лояльности будут следить за населением, выявляя признаки предательства, и получат полномочия подавлять любые потенциальные восстания ещё до их начала. Тайная полиция также будет надзирать за армией, обеспечивая её верность барону."
ANG_absolute_loyalty:0 "Абсолютная лояльность"
ANG_absolute_loyalty_desc:0 "Благодаря усилиям офицеров лояльности армия стала фанатично предана барону. По его приказу наши солдаты с радостью бросятся безоружными на пулемёты, а сама мысль об отступлении без приказа теперь кажется им чуждой. Похоже, нам наконец удалось создать войско, достойное барона и готовое умереть по первому его слову."
ANG_a_living_fortress:0 "Нерушимая крепость"
ANG_a_living_fortress_desc:0 "Энгривер со всех сторон окружён врагами и предателями, и вторжение враждебных сил – лишь вопрос времени. Чтобы подготовиться к неизбежному, барон распорядился развернуть масштабное строительство укреплений по всей стране, превращая Энгривер в огромную нерушимую крепость."
ANG_unrestricted_progress:0 "Неограниченный прогресс"
ANG_unrestricted_progress_desc:0 "Если Энгривер хочет достичь высот, которых требует барон, наши исследования и разработки должны соответствовать современным стандартам. Мы не можем позволить моральным сомнениям мешать нам, если хотим стать по-настоящему великой державой. Чтобы ускорить научный прогресс, мы сделаем всё, что сочтём необходимым."
ANG_forceful_modernisation:0 "Вытащить Энгривер в новый век"
ANG_forceful_modernisation_desc:0 "Несмотря на все наши усилия, Энгривер остаётся промышленным захолустьем даже по сравнению с остальной Грифонией. Такое положение больше нельзя терпеть, и барон объявил об амбициозном плане вывести Энгривер на уровень остального мира. Народу придётся дорого за это заплатить, но барон готов пойти на такую жертву."
ANG_war_chest:0 "Финансовый резерв"
ANG_war_chest_desc:0 "Энгривер окружён врагами, и удар одного из них – лишь вопрос времени. Чтобы пережить такой конфликт, страна должна быть готова к войне. С населения будут взимать специальный налог для финансирования расширения вооружённых сил, а продажу предметов роскоши запретят до тех пор, пока мы снова не окажемся в безопасности."
ANG_resource_exploitation:0 "Богатство Энгривера"
ANG_resource_exploitation_desc:0 "В глубинах Шайсвальда таятся огромные запасы неразработанных ресурсов, но прежние правительства отказывались осваивать их из-за опасностей, подстерегающих в лесу. Барона, однако, не запугают мелкие твари, обитающие в чаще: каждую крупицу полезного сырья необходимо извлечь из земли Энгривера, невзирая на риск."
ANG_bleed_for_me:0 "Все бандиты и воры"
ANG_bleed_for_me_desc:0 "Мелкие бандиты и воры Энгривера томятся в наших тюрьмах, обременяя государственную казну и не принося никакой пользы. С этим пора покончить. Решение оказалось простым: преступники Энгривера либо искупят свою вину на передовой, либо отправятся на казнь."
ANG_back_to_work:0 "Вернуться к работе"
ANG_back_to_work_desc:0 "Во время беспорядков, последовавших за попыткой государственного переворота, многие грифоны покинули рабочие места и укрылись вместе с семьями. Теперь, когда угроза миновала, подобную праздность больше нельзя терпеть. Граждане Энгривера должны работать – нравится им это или нет."
ANG_fortify_my_country:0 "Сражайтесь за свою страну"
ANG_fortify_my_country_desc:0 "Храбрые войска барона сражаются не только ради чести служить ему, но и ради того, чтобы Энгриверу больше никогда не угрожали подлые силы республиканизма, стремящиеся его уничтожить. Они будут сражаться и умирать, защищая свои семьи, свой народ и, прежде всего, барона."
ANG_man_my_armies:0 "Слава войны"
ANG_man_my_armies_desc:0 "Свирепые войска Энгривера сражаются не только ради службы своим сеньорам, но и ради славы победы над врагом на поле боя. Каждый солдат готов броситься на неприятеля, охваченный неудержимым безумием, которое превращает его в поистине ужасающую силу на поле боя."
ANG_work_in_my_factories:0 "На фабрики"
ANG_work_in_my_factories_desc:0 "Многие грифоны в Энгривере по-прежнему отказываются работать, ссылаясь на старость или незаживающие раны. Но пламя войны требует всё больше топлива, и наша снисходительность к этим трусам не может продолжаться. Если понадобится, их отправят на заводы под дулом пистолета – барон требует именно этого."

ANG_the_commune:0 "Коммуна Герцланда"
ANG_the_commune_desc:0 "Победа пролетариата! Империя уничтожена, зло свергнуто, а имперская столица – в наших когтях. Среди тлеющих руин старого порядка мы провозглашаем Коммуну, свободную от гнёта капитализма. Теперь мы должны идти вперёд и освобождать соседей! Пролетарии всех стран, соединяйтесь!"
ANG_take_katerin:0 "Освободить Катеринское княжество"
ANG_take_katerin_desc:0 "Рабочие лесистого Катерина тяжело пострадали под властью своих деспотов. Проклятая безумная Катерина творила ужасные вещи со своими подданными, и многие тысячи существ томятся в нищете. Наш долг – спасти их!"
ANG_take_romau_and_yale:0 "Освободить Ромау и Йель"
ANG_take_romau_and_yale_desc:0 "Долгое время пролетариат Ромау и Йеля находился под властью узкой элиты – совета богатых олигархов или консервативных ректоров университетов, которые по сути были марионетками императора и архонтов. Но теперь наконец настал час освобождения."
ANG_take_bronzehill_strawberry:0 "Освободить север"
ANG_take_bronzehill_strawberry_desc:0 "Имперские капиталисты охотно присваивали богатства Бронзхилла, наживаясь за счёт местных алмазных псов. А Строуберри долгое время находился под властью злых аристократов, которые только и делали, что пили клубничное вино. Этому пришёл конец: наши красные знамёна возвещают о наступлении свободы!"
ANG_take_feathisia_greiffenheim:0 "Освободить запад"
ANG_take_feathisia_greiffenheim_desc:0 "Пусть великий герцог Фетизии и терпимо относился к коммунизму, но перемены не приходят сверху. Грайфенмаршен же действительно является страной свободных, однако по мере роста городов капитализм всё сильнее угрожает этой свободе. Оба края вскоре обретут подлинную свободу и социализм!"
ANG_the_congress:0 "Съезд пролетариата"
ANG_the_congress_desc:0 "Наконец Герцланд объединён в единую Коммуну рабочих, а ненавистная буржуазия и аристократия бежит из страны. Теперь предстоит провести масштабную реорганизацию и уничтожить все остатки капитализма. Первый съезд пролетариата должен состояться там, где мы определим наше будущее!"
ANG_chairman_kogchel:0 "Председатель Когхель"
ANG_chairman_kogchel_desc:0 "Гербен Когхель, бывший лидер Лейбористской партии Фетизии, – умеренный грифон, которым многие восхищаются на родине. Он обязался создать систему социальных служб для всех и превратить Сердце Империи в работающую демократию. При поддержке умеренных грифонов он сможет увести Герцланд от радикализма."
ANG_regional_languages_act:0 "Закон о региональных языках"
ANG_regional_languages_act_desc:0 "Несмотря на столетия имперского господства, в Герцланде существует множество культур, и не все их представители говорят на грифоньем языке. Наше правительство не станет отдавать предпочтение какой-либо одной культуре: нормативные акты и государственные услуги будут доступны на всех языках Герцланда. Каждый сможет чувствовать себя здесь как дома."
ANG_free_education:0 "Право на саморазвитие"
ANG_free_education_desc:0 "Нет сомнений: образование – один из важнейших факторов, определяющих будущее грифона. Чтобы каждый гражданин мог самостоятельно выбирать свой путь, ему необходимо предоставить наилучшее доступное образование. Мы введём бесплатное обучение и будем поощрять граждан приобретать навыки, полезные обществу. У каждого появится шанс преуспеть."
ANG_worker_laws:0 "Трудовое законодательство Герцланда"
ANG_worker_laws_desc:0 "Жадные и коварные работодатели больше не будут наживаться на грифонах. Законы о достойных условиях труда позволят коммунам защищать рабочих, и эпоха изнурительной эксплуатации на фабриках наконец закончится. Разумная продолжительность смен, ограничения сверхурочной работы, правила безопасности и оплачиваемые больничные улучшат жизнь простых грифонов."
ANG_free_healthcare:0 "Заботливое сердце"
ANG_free_healthcare_desc:0 "Слишком долго мы оставляли больных без помощи, лишь молясь, чтобы нас не постигла их участь. Теперь, когда у нас появилась такая возможность, мы должны обеспечить всем жителям наилучшее медицинское обслуживание. Больные и раненые получат необходимую помощь, ведь жизнь бесценна. Бесплатная медицина станет правом каждого."
ANG_public_works:0 "Проекты общественных работ"
ANG_public_works_desc:0 "Войны, опустошившие Грифонию, разрушили слишком многое и оставили слишком мало. Чтобы снизить безработицу и дать толчок экономике, мы начнём масштабные общественные работы по благоустройству Сердца Империи. Сама природа покорится нашим когтям, пока мы преобразуем её на благо грифонов."
ANG_reinforce_democracy:0 "Новая демократия"
ANG_reinforce_democracy_desc:0 "Гербен Когхель никогда не отказывался от демократии, и теперь, когда он указал путь к процветанию, коммуны также понесут факел демократии. Будет внедрена народная демократия, закрепляющая право на референдумы и подачу петиций. Мы призовём всех граждан участвовать в общественной жизни, чтобы каждый мог внести свой вклад."
ANG_brand_new_army:0 "Народная армия"
ANG_brand_new_army_desc:0 "Герцланд не может пренебрегать вопросами обороны. К сожалению, в мире есть те, кто завидует нашему процветанию и строит против нас козни. Народная армия объединит весь Герцланд в силу, способную защитить наше социалистическое будущее. Будем надеяться, что нам никогда не придётся отправлять этих храбрецов в бой."
ANG_old_friends:0 "Реинтегрировать армию"
ANG_old_friends_desc:0 "От Бауэрмилица в Грайфенмаршене до железнолапых Бронзхилла – у Империи богатые и разнообразные военные традиции. Мы не должны уничтожать исторические части, их форму и тактику. Вместо этого следует принять этих солдат в наши ряды. Мы не переписываем историю: пусть легендарные отряды прежних земель снова сражаются за нас."
ANG_socialism_with_a_face:0 "Восставшие из руин и единые"
ANG_socialism_with_a_face_desc:0 "«Восставшие из руин и смотрящие в будущее. Позволь нам служить тебе, Герцланд, наша родина. Старые беды должны быть побеждены вместе. Давайте пахать, строить, учиться и творить, как никогда прежде. Уверенное в своей силе, свободное поколение вырастет. Мы станем новой жизнью Герцланда. И солнце, прекрасное как никогда, будет сиять над нами.»"
ANG_resource_nationalisation:0 "Национализация ресурсов"
ANG_resource_nationalisation_desc:0 "По всему Герцланду шахты, фермы, нефтеперерабатывающие и металлургические заводы принадлежат аристократическим семьям или капиталистическим предприятиям. Этой жадности придёт конец: простые грифоны заявляют свои права на то, что по праву принадлежит им!"
ANG_create_jobs:0 "Занятость для каждого грифона"
ANG_create_jobs_desc:0 "Капиталистический способ производства по самой своей природе выжимает все соки из одних рабочих, оставляя остальных в резервной армии безработных и нищих. Но с отменой наёмного рабства каждый сможет внести свой вклад. От каждого – по способностям, каждому – по потребностям."
ANG_connect_the_heartlands:0 "Дороги через Герцланд"
ANG_connect_the_heartlands_desc:0 "Герцланд огромен, а инфраструктура в менее развитых районах остаётся слабой. Теперь сами грифоны возьмутся за решение этой проблемы: они проложат асфальтированные дороги не только между крупными городскими центрами, которые прежде разделяли границы, но и между небольшими городками, чтобы связать их друг с другом."
ANG_arm_the_people:0 "Вооружить население"
ANG_arm_the_people_desc:0 "Если мы хотим защитить наш социалистический край от буржуазной агрессии, рабочим необходимо оружие. Многие уже понимают это и охотно создают мастерские и заводы, где производят оружие для революции."
ANG_chairman_scherler:0 "Председатель Шерлер"
ANG_chairman_scherler_desc:0 "Неудивительно, что Шерлер победил на голосовании. В конце концов, его анархисты сокрушили жалкие остатки некогда могущественной империи и освободили Герцланд от гнёта. Теперь он намерен распространить ценности анархии за пределы Энгривера – сердца революции."
ANG_the_new_communard_army:0 "Новая коммунарская армия"
ANG_the_new_communard_army_desc:0 "Имперская армия была не более чем кровожадным псом императора. Ей на смену придёт Красная армия народа, которая будет сражаться без хозяина. Её солдаты откажутся от корыстных целей и возьмутся за оружие во имя Коммуны, на благо всех грифонов Герцланда."
ANG_expand_the_ranks:0 "Расширить ряды"
ANG_expand_the_ranks_desc:0 "Красные рейнджеры, ветераны партизанской войны, примут в свои ряды новых товарищей и превратятся в настоящую профессиональную силу. Пусть аристократическая мразь дрожит перед ними!"
ANG_boreo_socialism:0 "Борео-социализм"
ANG_boreo_socialism_desc:0 "Борей – бог богатства, но не неравенства, как полагают многие грифоны из высших сословий. Он хотел, чтобы все грифоны жили в достатке и сами распоряжались своей жизнью. Поэтому капитализм – не что иное, как идолопоклонство, которому нельзя потакать."
ANG_peace_within:0 "Мир внутри страны"
ANG_peace_within_desc:0 "Грифоны Герцланда различны, но все они свободны. Никто не угнетает другого, никто не страдает от нищеты или голода. Поэтому в нашем свободном краю анархии нет места вражде, а каждый грифон может получить то, чего желает."
ANG_socialist_eleos:0 "Социалистический Элеос"
ANG_socialist_eleos_desc:0 "Элеос – это сила, побуждающая отдавать другим и делиться тем, что имеешь. Щедрость должна стать главной ценностью нашего народа, а жадность – остаться в прошлом и постепенно забыться."
ANG_red_archons:0 "Красные архонты"
ANG_red_archons_desc:0 "Возможно, прежде у нас были разногласия с архонтами, но теперь они остались в прошлом: власть старого порядка сломлена, а прежние амбиции отброшены. Мы готовы пойти им навстречу и вернуть часть утраченных полномочий в надежде, что они примут наши анархические ценности."
ANG_power_to_the_congress:0 "Власть – Конгрессу"
ANG_power_to_the_congress_desc:0 "Шерлер не желает становиться единоличным правителем. Вместо этого он стремится сохранить Конгресс в качестве управляющего органа Герцланда, чтобы даже самые маленькие деревни имели право голоса в государственных делах. Так мы обеспечим демократию и свободу каждому грифону."
ANG_revolutionary_fighters:0 "Общее дело"
ANG_revolutionary_fighters_desc:0 "В Грифонии немало социалистов и коммунистов, которые продолжают борьбу даже после нашей победы. Мы не станем сидеть сложа когти: поддержим товарищей в их борьбе и осудим угнетателей, которые им противостоят!"
ANG_the_perfect_society:0 "Идеальное общество"
ANG_the_perfect_society_desc:0 "По мере того как ценности анархии и борео-социализма распространяются по Герцланду, грифоны начинают жить свободно и в достатке. Разрушения, голод и страдания становятся им чужды, и со временем они забывают, что всё это когда-либо существовало."
ANG_agrarianism:0 "Аграрианизм"
ANG_agrarianism_desc:0 "Герцланд во многом является житницей всей Грифонии: миллионы грифонов живут в сельской местности и деревнях. Десятилетиями крестьяне трудились, а плоды их тяжёлого труда жадно присваивали господа. Этому пришёл конец! Мы освободим земледельцев и обеспечим достойную жизнь всем крестьянам."
ANG_massive_land_reform:0 "Большая земельная реформа"
ANG_massive_land_reform_desc:0 "Большая часть земли всегда принадлежала горстке дворянских семей. Эту несправедливость необходимо устранить! Крестьянские коммуны разделят землю между собой: тем, кто сам её не обрабатывает, незачем ею владеть."
ANG_soldiers_and_farmers:0 "Солдаты и фермеры"
ANG_soldiers_and_farmers_desc:0 "Земледельцы быстро становятся самыми решительными защитниками Герцланда и твёрдо намерены не допустить возвращения какого-либо деспота, прежнего гнёта и крепостного права. Многие тысячи грифонов, готовых до конца отстаивать свободу, берут ружья и клянутся защищать Коммуну."
ANG_support_culture:0 "Революционизировать культуру"
ANG_support_culture_desc:0 "Консервативные, регрессивные и аристократические представления глубоко укоренились в культуре Герцланда за столетия деспотичного правления. Но теперь старые оковы сломлены, и грифоны освобождаются не только физически, но и духовно. Они смогут раскрыть свой творческий потенциал, не опасаясь прежних ограничений, табу и запретов."
ANG_chairman_ehrdhardt:0 "Председатель Эрхардт"
ANG_chairman_ehrdhardt_desc:0 "Эрхардт из Ромау – ветеран ожесточённых уличных боёв, убеждённый синдикалист и атеист, выросший в городе, где господствует консервативный архонат Эйр. Его пламенные речи звучали куда страстнее выступлений Когхеля и Шерлера, поэтому неудивительно, что он завоевал доверие и восхищение народа."
ANG_anti_clericalism:0 "Антиклерикализм"
ANG_anti_clericalism_desc:0 "Священники-декаденты не следуют собственным проповедям и предали народ, которому должны служить. Религия, которую они столь рьяно насаждают, – не что иное, как инструмент буржуазии для контроля над крестьянами. В Герцланде больше не потерпят этого зла. Ни богов, ни господ – только свободные грифоны!"
ANG_confiscate_property:0 "Конфисковать частную собственность"
ANG_confiscate_property_desc:0 "Очевидно, что для искоренения остатков капитализма нужны более решительные меры. АСГ и ЛПГ выступали за постепенный переход собственности, позволяя аристократам и предпринимателям продавать средства производства. Мы же считаем, что их следует изъять силой и передать народным синдикатам."
ANG_internationalism:0 "Интернационализм"
ANG_internationalism_desc:0 "Социализм в отдельно взятой стране обречён, если позволить реакционерам за рубежом укрепиться и нанести удар по нашему делу. Мы должны оказать товарищам существенную помощь и поддержать их в борьбе за восстание и свержение угнетателей."
ANG_the_grand_congress:0 "Всегрифоний съезд"
ANG_the_grand_congress_desc:0 "Съезд Герцланда? Нет – это должен быть Великий съезд Грифонии, который объединит всех социалистов континента для совместной работы. Только сообща мы сможем одолеть буржуазную угрозу!"
ANG_the_afr:0 "AfSS"
ANG_the_afr_desc:0 "Ausschuss für Staatssicherheit, или Комитет государственной безопасности, будет создан для защиты страны от любых угроз, откуда бы они ни исходили. Его сотрудники будут внимательно следить за обстановкой, выявлять реакционных противников и пресекать их действия, пока не стало слишком поздно, а также собирать сведения об иностранных империалистах."
ANG_the_erhardt_doctrine:0 "Доктрина Эрхардта"
ANG_the_erhardt_doctrine_desc:0 "Наш председатель выступает за вмешательство во внешние конфликты ради укрепления социализма и ослабления реакции. По его мнению, это лучший способ приблизить мировую революцию, не втягивая Герцланд напрямую в масштабные кровопролитные войны."
ANG_professionalism:0 "Профессионализм"
ANG_professionalism_desc:0 "Будучи ветераном уличных боёв в Ромау, Эрхардт выступает за создание профессиональных военизированных союзов с регулярной боевой подготовкой. По его словам, это необходимо, чтобы Герцланд мог надёжно защитить себя от внешней агрессии."
ANG_a_disciplined_army:0 "Дисциплинированная армия"
ANG_a_disciplined_army_desc:0 "Дальнейшие реформы позволили превратить наших бойцов в лучших из лучших и как следует подготовить их к возможному конфликту. Численность военных союзов растёт, а ряды резервистов пополняют решительные бойцы, готовые сражаться за дело революции."
ANG_the_heartlander_century:0 "Век Герцланда"
ANG_the_heartlander_century_desc:0 "Влияние Герцланда простирается далеко за его пределы: он становится знаменосцем социалистического дела и вдохновляет революционеров по всему миру. Герцланд стремительно набирает вес в мировой политике, и некоторые уже предсказывают, что первое столетие нового тысячелетия станет веком Герцланда."

ANG_the_republic:0 "Возвращение в Грифенхейм"
ANG_the_republic_desc:0 "Мы сделали это – Империя окончательно повержена! После долгих лет изгнания демократия возвращается в Грифенхейм. Это знаменательное событие: мы завершили дело, начатое Кемерскаем."
ANG_take_katerin_republican:0 "Болота Катерина"
ANG_take_katerin_republican_desc:0 "Народу Катеринского княжества пошло бы на пользу объединение с нами. Если его лидеры слишком упрямы, чтобы это понять, нам придётся действовать за них."
ANG_take_romau_and_yale_republican:0 "Продвижение обучения"
ANG_take_romau_and_yale_republican_desc:0 "Говорят, что в Ромау и Йеле живут самые блестящие умы Грифонии. Надеюсь, их хватит, чтобы оценить преимущества объединения."
ANG_take_bronzehill_strawberry_republican:0 "В горах"
ANG_take_bronzehill_strawberry_republican_desc:0 "Алмазные псы Бронзхилла имеют такое же право стать частью нашей республики, как и грифоны. Мы примем их с распростёртыми объятиями!"
ANG_take_feathisia_greiffenheim_republican:0 "Марш к морю"
ANG_take_feathisia_greiffenheim_republican_desc:0 "Фетизцы горды и, к сожалению, отвергли наши призывы к объединению. Но так или иначе, у Республики должен быть выход к морю."
ANG_the_new_elections:0 "Новые выборы"
ANG_the_new_elections_desc:0 "С Империей покончено, и Герцланд объединяется в свободный и процветающий союз. Пришло время предоставить народу возможность самому определить дальнейший путь. Отто Вешлер мужественно провёл нас через эти неспокойные времена, однако из-за слабого здоровья он отказался участвовать в новых выборах."
ANG_an_unexpected_comeback:0 "Неожиданное возвращение"
ANG_an_unexpected_comeback_desc:0 "Саския Меклер провела впечатляющую кампанию, благодаря которой социал-демократы НПГ неожиданно вернулись на политическую арену. Теперь ей предстоит воплотить в жизнь свою амбициозную программу для Герцланда."
ANG_syndicate_ties:0 "Связи синдикатов"
ANG_syndicate_ties_desc:0 "Тесное сотрудничество с синдикатами необходимо для процветания трудящихся и защиты их права объединяться и вести коллективные переговоры. Такое партнёрство принесёт пользу рабочим и поможет нам проводить собственную экономическую политику."
ANG_stronger_united:0 "Сильное объединение"
ANG_stronger_united_desc:0 "Благодаря добровольному объединению и взаимному сотрудничеству мы способны достичь гораздо большего, чем если бы нами двигали только жадность и корысть. Союз свободных и равных существ нерушим!"
ANG_jobs_for_the_people:0 "Работа для народа"
ANG_jobs_for_the_people_desc:0 "Каждый гражданин имеет право зарабатывать на жизнь, и мы обязуемся обеспечить его работой, которая позволит ему жить достойно. Для этого мы разработаем общенациональную программу создания мастерских."
ANG_rebuild_trust:0 "Восстановить доверие"
ANG_rebuild_trust_desc:0 "Раны войны ещё свежи, а Герцланд охвачен страхом и подозрениями. В такой атмосфере невозможно укрепить солидарность, необходимую стране для подлинного процветания. Мы должны начать процесс примирения и помочь грифонам вновь научиться доверять друг другу."
ANG_a_lessened_army:0 "Сокращение армии"
ANG_a_lessened_army_desc:0 "Мы должны сократить численность армии и ограничить её вмешательство во внутренние дела. Теперь, когда непосредственная угроза нашему существованию миновала, чрезмерно влиятельные вооружённые силы сами по себе представляют опасность для общества."
ANG_a_new_urban_culture:0 "Новая городская культура"
ANG_a_new_urban_culture_desc:0 "У городов Герцланда есть свои культурные и материальные потребности. Поддерживая писателей, музыкантов и художников, мы вдохнём в них новую жизнь. Искусство, как и предпринимательство, сельское хозяйство и труд, необходимо для построения идеального содружества."
ANG_a_better_society:0 "Лучшее общество"
ANG_a_better_society_desc:0 "Веками угнетённые подданные Империи мечтали о свободном и справедливом обществе, в котором каждый мог бы по-настоящему процветать. После долгих лет напряжённого труда и борьбы мы воплотили эту мечту в жизнь. Теперь каждый грифон пожинает плоды наших общих усилий, а солидарность стала залогом всеобщего благополучия!"
ANG_actual_welfare:0 "Реальное благосостояние"
ANG_actual_welfare_desc:0 "Недостаточно просто предоставить гражданам «равные возможности». Из-за неблагоприятных обстоятельств многие не могут ими воспользоваться и оказываются предоставлены сами себе. Мы больше не допустим этого: благополучие каждого будет гарантировано!"
ANG_land_for_the_people:0 "Земля для народа"
ANG_land_for_the_people_desc:0 "Крупные поместья сосредоточили в своих руках огромные площади земли, тогда как мелкие фермеры обнищали и не могут прокормить семьи. Столь неравномерное распределение земли – одна из главных причин неравенства в Герцланде. Мы экспроприируем земли крупных поместий и передадим их крестьянам."
ANG_connect_the_dots:0 "Связать воедино"
ANG_connect_the_dots_desc:0 "Инвестиции в инфраструктуру помогут сократить бедность, развить внутреннюю и международную торговлю и сблизить наших граждан. Каждый должен иметь возможность свободно передвигаться по Герцланду."
ANG_autonomous_minorities:0 "Автономные меньшинства"
ANG_autonomous_minorities_desc:0 "Добровольные объединения – основа нашего общества. Все граждане должны иметь возможность создавать собственные организации и свободно выражать себя в Республике. Мы должны приветствовать многообразие Герцланда."
ANG_the_protege:0 "Протеже"
ANG_the_protege_desc:0 "Избрание Фионы Шмитц подтвердило поддержку социал-либерального курса Вешлера. Её ждёт непростой путь: она надеется вписать собственную страницу в историю Республики и привести народ к свободному и процветающему будущему."
ANG_local_urban_centers:0 "Местные городские центры"
ANG_local_urban_centers_desc:0 "Хотя мы выступаем за ускорение урбанизации, жители небольших и средних городов не должны думать, что о них забыли. Поддерживая развитие городов по всему Герцланду, мы сможем распределить плоды прогресса так, чтобы ни один грифон не остался обделённым."
ANG_we_need_more:0 "Нам нужно больше"
ANG_we_need_more_desc:0 "Мы должны учиться использовать имеющиеся ресурсы с максимальной отдачей и никогда не останавливаться на достигнутом. Стремясь к прогрессу, нельзя упускать ни одной возможности! Государственно-частное партнёрство позволит нам стимулировать развитие даже тех отраслей, которые прежде казались непривлекательными для инвестиций."
ANG_heavy_industry:0 "Крупные инвестиции"
ANG_heavy_industry_desc:0 "Тяжёлая промышленность – ключ к экономическому процветанию. К сожалению, нам не хватает тяжёлого оборудования, крупных станков и необходимой инфраструктуры. Субсидии этому сектору в будущем принесут значительную экономическую отдачу и создадут новые рабочие места, что необходимо для сохранения военного паритета с потенциальными противниками."
ANG_ban_the_fez:0 "Запретить фески"
ANG_ban_the_fez_desc:0 "В рамках реформ по созданию современного светского общества мы должны пересмотреть требования к форменной одежде. Феска, традиционно используемая полицейскими, стала символом имперского правления, против которого мы боролись. Отныне она не будет считаться приемлемым головным убором для государственных служащих."
ANG_new_nationalism:0 "Новый национализм"
ANG_new_nationalism_desc:0 "Мы до сих пор недостаточно осмыслили уникальную самобытность Герцланда. Слишком долго нас произвольно разделяли, а мы погрязали в мелких распрях. Герцландцы должны объединиться в сплочённое политическое сообщество, связанное общей историей и идеалами."
ANG_federalism:0 "Децентрализация"
ANG_federalism_desc:0 "Федерализм – лучшая система управления для такой многонациональной страны, как наша: группы, составляющие Герцланд, имеют все основания опасаться чрезмерного усиления центральной власти. Расширение региональной автономии даст им больше возможностей и позволит самостоятельно определять своё будущее."
ANG_a_dream_realised:0 "Мечта осуществилась"
ANG_a_dream_realised_desc:0 "Наша нация родилась в борьбе за свободу и верна идее равенства всех существ. Наш путь был нелёгким, но мы преодолели все испытания и стали сильнее, черпая силы в стойкости нашего духа. Благодаря демократии мы построили самое свободное и справедливое общество в мире!"
ANG_titular_nobility:0 "Дворяне с титулами"
ANG_titular_nobility_desc:0 "Доля земель, находящихся под контролем аристократии, непомерно велика и не может оставаться такой. Мы договоримся с дворянами о передаче значительной части их владений, позволив им при этом сохранить титулы."
ANG_an_efficient_nation:0 "Эффективная нация"
ANG_an_efficient_nation_desc:0 "Создав более современную и отлаженную систему производства, мы сможем добиться того, чтобы наша промышленность выпускала больше продукции, более высокого качества и быстрее, чем промышленность любой другой страны. Это нам по силам: трудолюбие, дисциплина и изобретательность давно стали частью характера Герцланда."
ANG_guardians_of_the_constitution:0 "Стражи Конституции"
ANG_guardians_of_the_constitution_desc:0 "Наше общество живёт по конституции, закрепляющей право каждого гражданина на жизнь, свободу и собственность. Каждый понимает, что от этой конституции зависит будущее свободы во всей Грифонии. Мы боремся не ради прихотей своенравного тирана, а за верховенство закона!"
ANG_expand_the_army:0 "Расширить армию"
ANG_expand_the_army_desc:0 "Цена свободы – вечная бдительность. Мы, рассчитывающие пожинать плоды свободы, должны быть готовы защищать её и гарантировать, что будущие поколения также смогут жить свободно."

ANG_be_ready:0 "Объединение или смерть"
ANG_be_ready_desc:0 "Чёрный Коготь наконец захватил имперскую столицу, однако остальная часть Герцланда всё ещё не признаёт законную власть регента. Предатели и мятежники должны быть уничтожены. Единственное справедливое наказание за неповиновение – смерть."
ANG_take_katerin_claw:0 "Претензии на Катерин"
ANG_take_katerin_claw_desc:0 "Несостоявшееся Катеринское княжество десятилетиями пребывало в плачевном состоянии: местная правительница обезумела после того, что республиканские подонки сотворили с ней в детстве. Избавить его жителей от этих мучений – акт милосердия. Впрочем, некоторые катеринские дворяне могут согласиться на сотрудничество..."
ANG_take_romau_and_yale_claw:0 "Южный штурм"
ANG_take_romau_and_yale_claw_desc:0 "Университеты Йеля – рассадник опасных либеральных и анархистских идей. В Энгривере это хорошо известно: один из йельских профессоров уже пытался распространить здесь своё нечестивое учение. Ромау немногим лучше. Архонат Эйр будет благодарен нам за помощь, а коррумпированные университеты подвергнутся чистке."
ANG_take_bronzehill_strawberry_claw:0 "Марш на север"
ANG_take_bronzehill_strawberry_claw_desc:0 "Дворяне северного Герцланда должны пасть перед нами на колени, однако многие из них заблуждаются, считая себя великими. Война с ними была бы позорной, но если они по глупости решат, что их планы важнее великого замысла Чёрного Когтя, винить им придётся лишь себя."
ANG_take_feathisia_greiffenheim_claw:0 "Уничтожить болотных грифонов"
ANG_take_feathisia_greiffenheim_claw_desc:0 "Так называемые «нации» Фетизии и Грайфенмаршена придерживаются отвратительных порядков: они превозносят «демократию» и даже позволяют крестьянам голосовать. Республиканизм и идеология пони окончательно их развратили. Им явно необходима чистка."
ANG_the_new_state:0 "Чёрная книга"
ANG_the_new_state_desc:0 "Готовясь к объединению Герцланда, Чёрный Коготь составил обширный список видных грифонов, с которыми необходимо разобраться как можно скорее. В него вошли республиканцы, социалисты, коммунисты, анархисты, крестьянские лидеры, купцы, саботажники, предатели, террористы, сброд, мятежники, гармонисты, либералы, прогрессисты, еретики, атеисты, бандиты, иностранцы, шпионы, диссиденты..." #список намеренно сделан таким длинным. Он ради шутки будет выходить за размер окна для описания фокуса :^)
ANG_faith_claw:0 "Вера"
ANG_faith_claw_desc:0 "Империя Грифонов – государство-архонат. Те, кто не следует учению трёх Архонтов, в лучшем случае заблуждаются, а в худшем становятся язычниками. Однако последние архонты возомнили о себе слишком много. Новые архонты будут знать своё место в иерархии: они лишь верные слуги истинного главы веры – императора."
ANG_autocracy_claw:0 "Автократия"
ANG_autocracy_claw_desc:0 "Гроверы выковали Империю Грифонов огнём и кровью. Они и ЕСТЬ империя – без них её бы не существовало. Поэтому все подданные должны беспрекословно повиноваться своему божественному лорду и сюзерену. Слово императора окончательно и не подлежит обсуждению. Пока он не достигнет совершеннолетия, регент будет править от его имени."
ANG_nationality_claw:0 "Национальность"
ANG_nationality_claw_desc:0 "Герцландцы – народ, основавший империю. Их судьба неразрывно связана с судьбой императоров. Быть подданным империи – значит быть герцландцем, и слишком многие грифоны забыли об этом. Все прочие грифоны равны в своём служении имперскому народу. А негрифонам? Им нет места в Империи."
ANG_end_urban_autonomy:0 "Покончить с городской автономией"
ANG_end_urban_autonomy_desc:0 "Благодаря тонким манипуляциям, а порой и откровенному подкупу жители нескольких имперских городов добились автономии от императора и даже отказались платить налоги короне. Но Чёрный Коготь положит конец подобной измене. Все привилегии будут отменены, а собственность бюргеров передана дворянам."
ANG_knight_service:0 "Ввести рыцарскую службу"
ANG_knight_service_desc:0 "В последние годы древний грифоний обычай награждать за военную службу землёй уступил место денежному жалованью. Но зачем тратить монеты, если можно просто раздать рыцарям собственность простых грифонов? Отныне каждый рыцарь получит земельный надел и горстку крепостных. Знатных отпрысков будут поощрять вступать в рыцарские ряды."
ANG_purge_heretics:0 "Покончить с еретиками"
ANG_purge_heretics_desc:0 "Уже несколько столетий ересь разъедает Герцланд. Так называемые «старообрядцы» открыто бросают вызов власти архонтов и тем самым предают своего императора! Чёрный Коготь должен безжалостно вырезать эту раковую опухоль из тела страны. К счастью, мы накопили немалый опыт подобных операций..."
ANG_a_model_province:0 "Образцовая провинция"
ANG_a_model_province_desc:0 "Хотя алмазные псы Бронзхилла и не грифоны, они зарекомендовали себя образцовыми слугами императора. Они верны ему и полностью переняли герцландскую идентичность. Поэтому их можно считать почётными грифонами и примером для всех остальных подданных империи."
ANG_drain_the_swamp:0 "Рождение Федерии"
ANG_drain_the_swamp_desc:0 "Грифонов так называемой «Фетизии» сбили с пути декадентские пони и коррумпированный республиканский сброд. Весь регион нуждается в срочной и тщательной очистке. Фетизия возродится как Федерия, а её грифоны вернутся на истинный путь. Их грубый диалект заменят правильным языком, а варварские институты распустят."
ANG_imperial_loyalists:0 "Призвать имперских лоялистов"
ANG_imperial_loyalists_desc:0 "Хотя Грифонию заполонили предатели и мятежники, ещё остались те, кто тоскует по золотому веку императорского правления, когда на континенте царили мир, справедливость и порядок. Таких грифонов можно найти среди знати многих бывших марионеточных государств. Чёрному Когтю достаточно связаться с ними – и они охотно присоединятся к нашему делу..."
ANG_assassinations:0 "Обезглавить змей"
ANG_assassinations_desc:0 "Многие армии предателей выступают против законной власти Гровера VI. Но, как и почти все современные армии, они сильно зависят от опытных генералов. Если с некоторыми из этих генералов произойдут несчастные случаи, их армии будут сражаться не лучше безголовых кокатрисов."
ANG_restoratio_imperii:0 "Восход Когтя"
ANG_restoratio_imperii_desc:0 "«Истребление повстанцев – наше святое дело. Ты знаешь, кто они и где их искать. Так иди и исполни волю богов.»"
ANG_the_north_claw:0 "Корень зла"
ANG_the_north_claw_desc:0 "После жалкой попытки свергнуть старый праведный порядок республиканские подонки бежали на север и захватили большую часть этих земель. Теперь они затаились там, зализывая раны и готовясь к новой попытке. Но скоро республиканцы ответят за свои преступления, и на этот раз сбежать им не удастся."
ANG_into_vedina_claw:0 "Подчинить Ведину"
ANG_into_vedina_claw_desc:0 "Когда королевство Ведина узрело божественную мощь императора Гровера I, его жители мудро преклонили колени и поклялись ему в верности. Но стоило империи ослабеть, как они нарушили клятву. Они восхищаются рыцарством, но без колебаний поступают бесчестно, когда им это выгодно. За свои поступки приходится отвечать..."
ANG_counter_revolution:0 "Антиреволюционная зачистка"
ANG_counter_revolution_desc:0 "Республиканизм и коммунизм десятилетиями развращали север. Но Чёрный Коготь уничтожит все следы этих мерзких идеологий за считанные недели. Всех сторонников революции быстро приговорят к смерти, трёхцветные флаги сорвут и сожгут, а прореспубликанские СМИ закроют."
ANG_core_north_claw:0 "Возобновить клятвы верности"
ANG_core_north_claw_desc:0 "Герцогство Клаудбьюри, Королевство Ведина и Хаукланд когда-то были верными и счастливыми подданными императора. Довоенный порядок будет восстановлен. Север вновь обретёт мир и процветание, когда старая знать вернёт себе титулы и крепостных. Всё пережитое превратится лишь в дурное воспоминание."
ANG_the_lake_claw:0 "Священный поход на святой город"
ANG_the_lake_claw_desc:0 "Грифонстоун – первый город грифоньего рода, бывшая резиденция архоната Борея и родина династии Гроверов – оказался в когтях коррумпированных и некомпетентных глупцов. Все земли вокруг священного озера Румейр находятся под властью порочных и злобных грифонов. Чтобы спасти эту святую землю, нужен священный поход!"
ANG_assimilate_rumare:0 "Завершить ассимиляцию Румейра"
ANG_assimilate_rumare_desc:0 "Император Гровер III начал приобщать недостаточно цивилизованных грифонов к имперским языку и культуре. К сожалению, во многих местах этот процесс так и не завершился – например, в баронстве Румейр, где укоренились сепаратизм и терроризм. Очевидно, мы должны довести до конца дело, начатое много лет назад."
ANG_rebuild_griffonstone:0 "Восстановить Грифонстоун"
ANG_rebuild_griffonstone_desc:0 "Священный город отвоевали доблестное ополчение и отважные рыцари. Теперь мы можем вернуть ему утраченную славу и вновь сделать его второй столицей империи. Император Гровер VI, как и его предки, будет коронован именно здесь."
ANG_core_lakes_claw:0 "Воля богов исполнена"
ANG_core_lakes_claw_desc:0 "Грифонстоун, Соларспайк и берега озера Румейр теперь под нашим контролем. Феодализм восстановлен, а крепостные вернулись на поля своих законных хозяев. Паломники вновь стекаются в эти края: под бдительной охраной Чёрного Когтя дороги снова безопасны. Боги довольны нами."
ANG_the_west_claw:0 "Покарать запад"
ANG_the_west_claw_desc:0 "Запад всегда был декадентским и коррумпированным, развращённым влиянием пони. Поэтому там укоренились нелояльность и ненависть к законной власти императоров. Аквелия всегда готова восстать при малейших признаках слабости Империи, а предательство Скайфола во время революции не будет забыто и прощено. Запад должен сгореть за свои грехи."
ANG_burn_skyfall:0 "Очищение Скайфола"
ANG_burn_skyfall_desc:0 "Самозваный «железный канцлер» из Скайфола сделал всё, чтобы ослабить Империю и приумножить собственное богатство. Он мёртв, но его город – улей подонков и злодеев, логово греха и гнилое сердце капитализма – всё ещё стоит. Весь город и все его жители заслуживают самого сурового наказания."
ANG_destroy_aquila:0 "Уничтожить Аквилу"
ANG_destroy_aquila_desc:0 "Когда аквелийцы впервые бросили вызов императору, Гровер II сжёг их столицу. Но наказание оказалось недостаточным: аквелийцы не усвоили урока. Значит, его придётся повторить. Аквила должна сгореть вновь, и на этот раз мы не оставим после себя ни души и ни камня."
ANG_core_west_claw:0 "Урок покорности"
ANG_core_west_claw_desc:0 "На западе разыгралась великая трагедия. Местные грифоны должны понять, что виноваты в ней исключительно они сами. Останься они верными подданными империи, ничего бы не произошло. Будем надеяться, что они усвоят урок и больше не повторят ошибок отцов и матерей."
ANG_the_south_claw:0 "Архипредатели"
ANG_the_south_claw_desc:0 "Когда был утрачен идол Борея и умер король Гумберто, Вингбардия первой открыто бросила вызов божественной власти империи и отделилась. Она стала одним из главных виновников краха империи – искрой, из которой разгорелся пожар. Поэтому её необходимо покорить без малейшей пощады."
ANG_kill_asterion:0 "Вторжение на Астерион"
ANG_kill_asterion_desc:0 "Минотавры всегда были бельмом на глазу у грифонов. Они преградили путь Гроверу I, сражались против Гровера II и восстали при Гровере V. Их поведение доказывает, что другим, низшим расам нельзя доверять (за исключением почётных грифонов Бронзхилла, разумеется). Уничтожение Астериона обеспечит безопасность империи."
ANG_rubber_serfs:0 "Ввести крепостное право на плантациях"
ANG_rubber_serfs_desc:0 "Тёплый климат Южной Грифонии благоприятствует выращиванию каучуконосных растений. Однако прежде владельцам плантаций приходилось платить рабочим, что снижало прибыльность их предприятий. Теперь мы используем прикреплённых к земле крепостных: их труд позволит увеличить доходы и значительно расширить плантации."
ANG_core_south_claw:0 "Покорённый юг"
ANG_core_south_claw_desc:0 "Будем надеяться, что вингбардийцы усвоили преподанный им урок, хотя с ними обошлись куда мягче, чем с их собратьями-предателями на западе. Неизвестно, почему регент Гера пощадила Карфин, но никто не должен сомневаться в её мудрости. Возможно, южане поймут: если они вновь предадут империю, то разделят судьбу Аквелии."
ANG_the_frontier_claw:0 "Через Ползучие Горы"
ANG_the_frontier_claw_desc:0 "Фронтир никогда не был неотъемлемой частью империи, однако служил важной буферной зоной между цивилизацией и варварским миром негрифонов. Восток богат ресурсами, которые так и манят к себе. И, разумеется, местным грифонам тоже следует напомнить, что они предатели."
ANG_the_eastern_bulwark:0 "Оплот против востока"
ANG_the_eastern_bulwark_desc:0 "Восточные грифоны забыли свой долг и нарушили клятву, но теперь вернутся к предназначенному им богами делу. Они будут охранять восточные рубежи империи от ужасов, таящихся за её пределами."
ANG_the_eastern_breadbasket:0 "Житница империи"
ANG_the_eastern_breadbasket_desc:0 "Почва долины Эви чрезвычайно плодородна и прекрасно подходит для земледелия. После восстановления старого порядка сотни тысяч, если не миллионы крепостных вновь готовы трудиться, чтобы прокормить население всей империи. А если кто-нибудь из них осмелится снова взбунтоваться, его настигнет кара короля Клосау."
ANG_core_frontier_claw:0 "Старый порядок восстановлен"
ANG_core_frontier_claw_desc:0 "Дворяне Фронтира будут вечно благодарны нам за возвращение неограниченной власти. Рыцари вновь готовы защищать рубежи империи. Восточные отбросы-пони дрожат перед нашей мощью. Всё складывается как нельзя лучше: планы Чёрного Когтя снова воплотились в жизнь."
ANG_reclaim_nova_griffonia_claw:0 "Последний фронтир"
ANG_reclaim_nova_griffonia_claw_desc:0 "Возвращение утраченных земель Грифонии завершено. Но работа ещё не окончена. Последняя нация предателей бросает вызов имперской власти, полагая, что океан надёжно защитит её от нас. Но водная преграда не остановит божественную, несокрушимую мощь наших армий. Нова Грифония скоро ответит за свои преступления."

#pounce remember to do this shit, this is unification tree. Gud stuff, eat ass smoke grass baby.
ANG_the_kingdom:0 "Королевство Герцланд"
ANG_the_kingdom_desc:0 "Владеть целым континентом – несбыточная мечта, давно рассыпавшаяся, словно песок в часах. Империя уже никогда не станет прежней, и, возможно, это к лучшему. В конце концов, грифоны по всему миру никогда не стремились быть её частью, поэтому нам следует сосредоточиться на Герцланде. Так будет основано Королевство Герцланд."
ANG_take_katerin_kingdom:0 "Освободить Катерин"
ANG_take_katerin_kingdom_desc:0 "Мёртвые земли Катерина необходимо освободить, чтобы Герцланд мог быть по-настоящему защищён. Мы соберём войска и подготовимся к войне против проклятого правительства, удерживающего эти земли."
ANG_take_romau_and_yale_kingdom:0 "Объединить Юг"
ANG_take_romau_and_yale_kingdom_desc:0 "Земли Йеля и Свободный город Ромау имеют ключевое значение для безопасности южной границы нашего нового государства. Мы должны установить контроль над этими регионами и обеспечить защиту их населения."
ANG_take_bronzehill_strawberry_kingdom:0 "Объединить Север"
ANG_take_bronzehill_strawberry_kingdom_desc:0 "Северные земли по-прежнему верны бывшей Империи в Грифенхейме. Если мы оставим их в покое, они наверняка окажут нам сопротивление. Герцланд должен быть объединён."
ANG_take_feathisia_greiffenheim_kingdom:0 "В болота"
ANG_take_feathisia_greiffenheim_kingdom_desc:0 "Болота на северо-западе занимают значительную часть земель Герцланда. Мы должны установить контроль над этими территориями, если действительно хотим объединить страну."
ANG_implement_constitution:0 "Принять Конституцию"
ANG_implement_constitution_desc:0 "Конституция, вступившая в силу в Энгривере, должна распространиться и на остальную часть Герцланда. Она объединит нас узами братства и единства, чтобы мы могли противостоять тиранам и преступникам всего мира. Да здравствует Герцланд!"
ANG_amends_with_the_church:0 "Покой в этом мире и в ином"
ANG_amends_with_the_church_desc:0 "Хотя многие представители Тринитарного храма Грифонии противятся свободе, которую мы несём, некоторые их воины сражаются вместе с нами за объединение Герцланда. Мы не должны вступать с ними в конфликт. В конце концов, они служат божественному, а мы по-прежнему почитаем богов."
ANG_adopt_grover_vi:0 "Усыновить Гровера VI"
ANG_adopt_grover_vi_desc:0 "Гровер VI пережил немало трагедий. Я должен дать ему понять, что желаю ему и Герцланду только добра. Мои отношения с его отцом, несомненно, помогут."
ANG_ensure_noble_rights:0 "Усмирить знать"
ANG_ensure_noble_rights_desc:0 "Имперская знать уже замышляет свержение нашего нового режима, опасаясь лишиться прав и титулов. Мы намерены дать народу больше свободы, но должны заверить дворян, что не собираемся поступать с ними так, как поступили бы социалисты или республиканцы."
ANG_limited_democracy:0 "Местная демократия"
ANG_limited_democracy_desc:0 "Великая мечта Отмара наконец готова воплотиться в жизнь: он намерен принести свободу и демократию в Герцланд на местном уровне. Жители смогут сами выбирать своих представителей в Герцландский сейм, подчинённый королю. Это тонкий баланс между свободой и властью, и Отмар сумеет его соблюсти."
ANG_expand_the_nationalgarde:0 "Реформировать Национальную гвардию"
ANG_expand_the_nationalgarde_desc:0 "Система Национальной гвардии хорошо зарекомендовала себя в лесах Энгривера. Пришло время распространить её на болота Фетизии, горы Бронзхилла и мёртвые земли Катеринского княжества."
ANG_new_knightly_orders:0 "Совет Девяти"
ANG_new_knightly_orders_desc:0 "Рыцари старой Империи погрязли в коррупции и преследовали интересы порочных грифонов. Мы объединим уцелевшие части старых орденов с нашими верными грифонами и создадим новое рыцарство, которое будет защищать Герцланд от внешних угроз и прежде всего хранить верность королю."
ANG_a_connected_kingdom:0 "Объединить нацию"
ANG_a_connected_kingdom_desc:0 "Многие жители Герцланда всё ещё не ощущают себя частью Королевства, поскольку их жизнь оторвана от жизни остальной страны. Мы должны объединить все земли Герцланда и создать по-настоящему единую нацию."
ANG_local_industrial_centers:0 "Поддержать местные промышленные центры"
ANG_local_industrial_centers_desc:0 "Мы понимаем, что не можем индустриализировать всю страну одним щелчком когтей. Ни трёхлетний, ни пятилетний, ни даже семилетний план не сделает эту задачу простой. Но мы можем начать постепенную и осторожную индустриализацию, опираясь на уже существующие промышленные центры."
ANG_against_extremism:0 "Борьба с экстремизмом"
ANG_against_extremism_desc:0 "Многие грифоны видят в ком-либо своего «врага» – будь то республиканцы, социалисты, деспотичные дворяне или кто-то ещё. Но всех этих противников объединяет одно: экстремизм. Наша страна должна держаться от него подальше и проводить взвешенную, рациональную политику. Радикалам не место в Герцланде."
ANG_shake_claws:0 "Ради лучшего мира"
ANG_shake_claws_desc:0 "Свобода – один из основополагающих принципов нашей нации, и мы должны защищать её и способствовать её распространению. Народ не должен быть врагом правительства, а его голос должен быть услышан. Без этих базовых прав мы утратим всё, что отличает нашу страну от прежней репрессивной имперской системы."
ANG_into_the_world:0 "Снова в мир"
ANG_into_the_world_desc:0 "Герцланд стал по-настоящему свободным и процветающим государством. Мы союзники свободных народов мира и поддерживаем всех, кто хочет быть услышанным. Настало время Герцланду вновь выйти на мировую арену – обновлённому и сильному как никогда."
 
ANG_the_new_republic:0 "Республика Грифонов"
ANG_the_new_republic_desc:0 "После многих лет борьбы и кровопролития мы свергли всех мелких и коррумпированных правителей Сердца Империи и создали сильную, славную Республику! Триколор теперь гордо реет от Роттендедама до Катеринбурга. Но даже осуществив мечту всей своей жизни, президент Блюм заявил, что его работа ещё далека от завершения."
ANG_liberty:0 "Свобода"
ANG_liberty_desc:0 "Кризис, с которым мы сталкиваемся, ещё не закончился, и любая смена правительства сейчас поставит под угрозу стабильность Республики. Для сохранения свободной и упорядоченной нации выборы будут временно приостановлены."
ANG_without_democracy:0 "Без демократии"
ANG_without_democracy_desc:0 "Враги Республики прячутся среди нас: социалисты, реакционеры, ревизионисты – все подрывают национальное единство. Чтобы искоренить их, мы создадим департамент, ответственный за наблюдение за средствами связи и пресечение подрывной деятельности."
ANG_the_presidents_duty:0 "Обязанность президента"
ANG_the_presidents_duty_desc:0 "Республика находится под угрозой как со всех сторон, так и изнутри. Наш храбрый президент Блюм должен вести нас в эти трудные времена, потому что он единственный, кто на это способен."
ANG_nationalism:0 "Национализм"
ANG_nationalism_desc:0 "Наши граждане должны знать, что прежде всего их объединяет Республика и что именно Республике они обязаны своей абсолютной преданностью."
ANG_the_new_army:0 "Реформа армии"
ANG_the_new_army_desc:0 "Стоящая перед нами задача требует, чтобы вся нация была готова взяться за оружие. Каждый гражданин должен быть готов служить Республике, и каждый солдат должен знать, что отступление недопустимо."
ANG_for_the_republic:0 "За республику!"
ANG_for_the_republic_desc:0 "Мы никогда не должны забывать, ради чего мы взялись за оружие. Мы сражаемся, чтобы донести свет нашей революции до тех, кто всё ещё томится во тьме. Наше дело правое, и мы не отступим, пока каждый грифон не обретёт свободу!"
ANG_prosperity:0 "Процветание"
ANG_prosperity_desc:0 "Как долг каждого грифона – защищать Республику, так и долг Республики – обеспечивать каждого средствами к существованию. Никому не будет позволено голодать или остаться без крова."
ANG_within_limits:0 "В пределах разумного"
ANG_within_limits_desc:0 "Нет ничего плохого в том, чтобы быть уверенным в своём благополучии, но расточительная роскошь вредна для нации. Граждане должны жить скромной жизнью."
ANG_bread_and_circuses:0 "Хлеба и зрелищ"
ANG_bread_and_circuses_desc:0 "Счастливое население не станет создавать проблем. Раздача продовольствия и финансирование общественных развлечений укрепят единство между грифонами и не дадут им повода для недовольства."
ANG_towards_unification:0 "Мечта о единой Грифонии"
ANG_towards_unification_desc:0 "Наша позиция укрепилась. Подготовка завершена, народ готов. Президент Блюм скоро выступит с речью в Грифенхейме, в ходе которой он провозгласит нашу цель: политическое объединение Грифонии."
ANG_the_north:0 "Поход против ревизионистов"
ANG_the_north_desc:0 "Трусы, бежавшие в Клаудбьюри после того, как они сорвали революцию, продолжают бросать нам вызов. Пришло время поставить их на место вместе с социалистами-ревизионистами в Скайнавии."
ANG_into_vedina:0 "Ошибка Ведины"
ANG_into_vedina_desc:0 "Ведина никогда не была частью Империи, и поэтому многие вединцы считают себя отделёнными от других грифонов в Грифонии. Мы исправим это заблуждение."
ANG_the_riches_of_brantbeak:0 "Богатство Брэнтбика"
ANG_the_riches_of_brantbeak_desc:0 "Брэнтбик буквально сидит на золотой жиле! Эти месторождения полезных ископаемых и многое другое теперь принадлежат нам, и мы сделаем своим приоритетом наращивание их добычи."
ANG_core_north:0 "Прочь, ревизионисты!"
ANG_core_north_desc:0 "Ревизионисты Клаудбьюри и Скайнавии, наконец разбиты, и наши заблудшие братья увидели ошибочность своего пути. Когда наш северный фланг защищён, мы наконец сможем обратить своё внимание на другие регионы."
ANG_the_lake:0 "Ядро Грифонии"
ANG_the_lake_desc:0 "Колыбель грифоньего рода погрязла в пороке и упадке, и её жители взывали к освобождению. Мы призваны восстановить её былую славу; мы введём её в новую эру!"
ANG_support_local_languages:0 "Закон о защите культур"
ANG_support_local_languages_desc:0 "Мы должны дать понять всем грифонам, что у нас нет желания вмешиваться в их образ жизни. Этот закон защитит местные культуры от посягательств и должен принести нам много друзей по всей нашей земле."
ANG_repair_griffonstone:0 "Реставрация Грифонстоуна"
ANG_repair_griffonstone_desc:0 "К сожалению, город Грифонстоун пришёл в упадок из-за многолетнего пренебрежения. Но мы не позволим этому позору остаться. Мы перестроим Грифонстоун в процветающий современный город, способный соперничать с любым городом в Грифонии!"
ANG_core_lakes:0 "Бьющееся сердце Грифонии"
ANG_core_lakes_desc:0 "Во всех центральных землях нас встречают приветствиями. Теперь нация процветает и обрела новую цель. Нет сомнения, что древнее сердце Грифонии было возрождено нашими когтями."
ANG_the_west:0 "На запад"
ANG_the_west_desc:0 "Западные земли – самые богатые во всей Грифонии и включают в себя бывшую жемчужину империи: Скайфол. Взять это богатство под свой контроль было бы поистине великим благом."
ANG_the_trade_cities:0 "Больше никаких торговых принцев!"
ANG_the_trade_cities_desc:0 "Скайфол и подобные ему торговые города превратились в рассадники порока с немыслимыми богатствами, стекающими в карманы самых нечестных грифонов. Отныне мы будем использовать непристойное богатство этих лордов-торговцев на благо нации."
ANG_greifwald_oil_fields:0 "Чёрная страна"
ANG_greifwald_oil_fields_desc:0 "Нефтяные месторождения Аделарта являются ценным активом, но в настоящее время они устарели, и добыча может быть значительно улучшена. Развитие этих ресурсов будет иметь жизненно важное значение для продолжения военных усилий."
ANG_core_west:0 "Интеграция запада"
ANG_core_west_desc:0 "У аквелийцев всегда был сильный республиканский дух. С ними во главе западные грифоны приняли объединение. Вместе мы идём к светлому будущему!"
ANG_the_south:0 "Предатели"
ANG_the_south_desc:0 "Вингбардия первой отделилась от Империи и стала рассадником радикалов всех мастей. Эти экстремисты будут мешать славному объединению Грифонии."
ANG_destroy_commies:0 "Повесить коммунистов"
ANG_destroy_commies_desc:0 "Цель коммунистов – свергнуть всё, что мы построили, и погрузить мир в хаос. Этим силам анархии и беспорядка не должно быть пощады."
ANG_destroy_fascists:0 "Расстрелять сторонников превосходства"
ANG_destroy_fascists_desc:0 "Вингбардия – родина превосходства: опасной и непоследовательной идеологии, которая продолжает распространяться. Эти радикалы никогда не примут объединение; их необходимо искоренить в нашей стране, чтобы они не могли сотрудничать с врагами Республики в будущем."
ANG_core_south:0 "Безмятежный юг"
ANG_core_south_desc:0 "Радикалы замолчали, и в Вингбардии снова спокойно. Вингбардийцы и грифоны со всего юга теперь гордо стоят рядом с нами!"
ANG_the_frontier:0 "Старая граница"
ANG_the_frontier_desc:0 "Отсталые земли восточной границы не останутся в стороне от поступи прогресса. Эти грифоны займут своё законное место как граждане Республики."
ANG_the_gryphus_port:0 "Восточный порт Республики"
ANG_the_gryphus_port_desc:0 "Риапорту – это порт, который свяжет нас с прибыльными торговыми сетями юго-востока. А расширение верфей этого города станет большим преимуществом для нашего флота."
ANG_the_new_breadbasket:0 "Золотые поля Бродфельда"
ANG_the_new_breadbasket_desc:0 "Богатые чернозёмы Бродфельда позволяют выращивать большие объёмы пшеницы, ячменя и овса. Мы можем использовать эту сельскохозяйственную продукцию, чтобы прокормить значительную часть Грифонии."
ANG_core_frontier:0 "Интегрировать границу"
ANG_core_frontier_desc:0 "Восточным грифонам дарована свобода, хотя они должны знать, что мы также приносим порядок. Все будут защищены, и мы положим конец так называемому «пограничному правосудию»."
ANG_a_united_griffonia:0 "Закон о предоставлении полномочий"
ANG_a_united_griffonia_desc:0 "Мы объединили Грифонию, но сохранение этого единства потребует сильной центральной власти. Президент должен иметь возможность принимать все необходимые меры для поддержания мира и порядка на всей территории Республики, в том числе в одностороннем порядке принимать законы."

ANG_the_dictator_is_dead:0 "Диктатор мёртв"
ANG_the_dictator_is_dead_desc:0 "Блюм, может, и мёртв, но у нас нет времени праздновать. Сейчас перед нами стоит задача демонтировать его аппарат угнетения и провести реформы, чтобы предотвратить его восстановление."
ANG_destroy_the_cult:0 "Уничтожить культ личности"
ANG_destroy_the_cult_desc:0 "Блюм и его лакеи распространили много лжи, чтобы преувеличить его роль в революции и изобразить его богоподобной фигурой. Эти мифы должны быть развеяны, чтобы Республика выбралась из-под его тени."
ANG_release_prisoners:0 "Освободить заключённых"
ANG_release_prisoners_desc:0 "Многие диссиденты остаются в тюрьмах, несправедливо заключённые MfÖS. Нет причин позволять им томиться дальше, и они должны быть немедленно освобождены."
ANG_abolish_conscription:0 "Отменить призыв на военную службу"
ANG_abolish_conscription_desc:0 "Пришло время остановить военную машину и позволить нашим храбрым грифонам наконец-то вернуться домой. Эта война кормила себя достаточно долго."
ANG_peace_in_the_world:0 "Мир во всём мире"
ANG_peace_in_the_world_desc:0 "Потребуется решимость защищать то, что мы построили, но мы не должны поддаваться слепому ура-патриотизму. Наше желание – поддерживать мир без конфликтов."
ANG_three_principles:0 "Истинный принцип"
ANG_three_principles_desc:0 "Блюм предал принципы Республики, но мы их не забыли. Они снова поведут нас."
ANG_liberty_2:0 "Истинная свобода"
ANG_liberty_2_desc:0 "Во имя защиты свободы правительство Блюма создало ужасающую систему тирании. Мы позаботимся о том, чтобы грифоны могли свободно жить по своему усмотрению, и чтобы ни один грифон не жил в страхе перед государством."
ANG_guarantee_freedom:0 "Гарантии свобод"
ANG_guarantee_freedom_desc:0 "Права граждан должны быть чётко закреплены, чтобы гарантировать, что они не нарушаются, и поэтому мы будем закреплять свободу слова, собраний, печати, вероисповедания и собственности. Мы также установим принцип равенства перед законом и запретим произвольное лишение свободы, чтобы свобода никогда больше не подвергалась угрозе."
ANG_democracy_2:0 "Истинная демократия"
ANG_democracy_2_desc:0 "Для того чтобы голоса народа были услышаны, наше правительство должно иметь надёжную систему сдержек и противовесов. Правление Блюма наглядно показало, сколь опасно давать одному грифону слишком много власти."
ANG_institutions:0 "Новые институты"
ANG_institutions_desc:0 "Слишком долго MfÖS держало наши умы в клетке, что привело к интеллектуальному застою. Но свободной мысли больше ничто не будет препятствовать! По всей Республике будут созданы новые университеты и другие высшие учебные заведения."
ANG_prosperity_2:0 "Истинное процветание"
ANG_prosperity_2_desc:0 "Мы не рассматриваем население как безликую массу, которую достаточно лишь ублажать. Помимо обеспечения основных материальных потребностей, мы хотим помочь каждому грифону раскрыть свой потенциал и полностью реализовать себя."
ANG_welfare_2:0 "Рабочие места для народа"
ANG_welfare_2_desc:0 "Мы гарантируем работу для каждого гражданина, в рамках программы Национальных мастерских. В дополнение к этому мы будем заботиться обо всех работниках, вводя новые правила их защиты и поощряя справедливое распределение прибыли."
ANG_restore_multiparty_system:0 "Восстановление многопартийной системы"
ANG_restore_multiparty_system_desc:0 "Больше не будут подавляться голоса инакомыслящих или запрещаться формирование определённых партий. Все голоса должны иметь возможность быть услышанными во время выборов."
ANG_federalism_2:0 "Федерализм"
ANG_federalism_2_desc:0 "Дальнейшее сохранение централизованного абсолютизма приведёт к распаду Республики. Мы должны допустить большую региональную автономию и уважать самобытность различных народов и общин по всей Грифонии."
ANG_remove_the_ministry:0 "Избавиться от MfÖS"
ANG_remove_the_ministry_desc:0 "MfÖS – не более чем инструмент угнетения. Он всегда будет символом тоталитаризма Блюма и как таковой должен быть упразднён."
ANG_the_trial:0 "Суд над Герцогом"
ANG_the_trial_desc:0 "Ганс Герцог управлял деятельностью MfÖS с момента его создания. Пора ему предстать перед судом, но мы дадим ему больше, чем он дал нам: справедливый суд."
ANG_new_elections:0 "Новые выборы"
ANG_new_elections_desc:0 "Наконец, Республика была исцелена, и теперь воцарилась справедливость. Настало время позволить народу самому определить дальнейший путь страны."

ANG_the_empire:0 "Империя Леера"
ANG_the_empire_desc:0 "Превзойдя все ожидания, барон Леер сумел отнять Грифенхейм у его старых правителей и объявил себя императором Империи Грифонов. Но амбиции Леера на этом не заканчиваются, и он намерен расширить свою новую империю."
ANG_take_katerin_baron:0 "В сердце тьмы"
ANG_take_katerin_baron_desc:0 "Катерин уже давно страдает под властью безумной принцессы Каталины, и император не потерпит такого безумного правителя, притесняющего своих законных подданных. Солдаты императора войдут в самое сердце тьмы, и Катерин войдёт в состав империи."
ANG_take_romau_and_yale_baron:0 "Города юга"
ANG_take_romau_and_yale_baron_desc:0 "Йель и Ромау уже давно считаются частью имперскими землями, и в них живут миллионы имперских подданных, а также там расположены немногие подлинные университеты в Сердце Империи. Города юга будут включены в расширяющуюся империю, нравится им это или нет."
ANG_take_bronzehill_strawberry_baron:0 "Земли клубники и камня"
ANG_take_bronzehill_strawberry_baron_desc:0 "Клубничное Герцогство и Бронзхилл издавна считались неотъемлемыми регионами империи, обладая большим количеством промышленных и природных ресурсов, которые будут необходимы для будущей экспансии. Если планы Императора должны быть реализованы, то они должны быть возвращены в состав Империи."
ANG_take_feathisia_greiffenheim_baron:0 "Свет севера"
ANG_take_feathisia_greiffenheim_baron_desc:0 "Фетизия и, в меньшей степени, Грайфенмаршен являются крупными областями, богатыми природными ресурсами Сердца Империи, и, таким образом, возвращение их в состав империи должно быть приоритетом."
ANG_the_corination:0 "Коронация"
ANG_the_corination_desc:0 "После того, как последний осколок Сердца Империи наконец-то был возвращён, пришло время императору Лееру официально короноваться в качестве Императора Империи Грифонов. Время окончательного триумфа Леера приближается, и великие дела всё ещё лежат за его пределами."
ANG_nationalization:0 "Имперские монополии"
ANG_nationalization_desc:0 "Империю не волнуют мелкие заботы свободного рынка, и она доверит большую часть экономики государственным компаниям, для которых эффективность и благо Империи важнее материальной прибыли."
ANG_state_farms:0 "Имперские фермы"
ANG_state_farms_desc:0 "Многие земли в Империи принадлежат небольшим семьям фермеров или находятся в собственности угасающих дворянских родов. Нельзя допустить, чтобы источник продовольствия Империи оставался в когтях столь своекорыстных групп, так что после конфискации он будет принадлежать государству и управляться им."
ANG_expand_war_chest:0 "Десятина лояльности"
ANG_expand_war_chest_desc:0 "Граждане Империи давно пользуются её защитой, ничего не давая взамен. Император Леер заявил, что такое несбалансированное соглашение неприемлемо, и со всех граждан Империи будет взиматься особая ежемесячная десятина."
ANG_out_with_the_old:0 "Прочь старое..."
ANG_out_with_the_old_desc:0 "Старые дворяне Империи далеки от принятия нового Императора, несмотря на его явно законные притязания на престол. Дворяне существуют только для того, чтобы поддержать Императора, и если они откажутся это сделать, то их дальнейшее существование не может быть оправдано."
ANG_in_with_the_new:0 "...И да здравствует новое"
ANG_in_with_the_new_desc:0 "В то время как старые дворяне были нелояльными и неуправляемыми, нашлось несколько мелких дворян и богатых грифонов, достаточно мудрых, чтобы признать законное притязание Леера на трон. Такая мудрость должна быть вознаграждена, и эти грифоны получат высокие титулы и заменят старую знать."
ANG_the_imperial_cult:0 "Имперский культ"
ANG_the_imperial_cult_desc:0 "Император Леер поистине божественно благословлён, и нельзя отрицать, что его действия несут на себе печать богов. Вполне естественно, что его подданные поклоняются ему, и Имперский культ медленно начал формироваться вокруг него по мере роста его власти."
ANG_the_imperial_guard:0 "Имперская гвардия"
ANG_the_imperial_guard_desc:0 "Старые вооружённые силы Империи явно не были достаточно компетентны, чтобы удерживать власть, и Император Леер приказал реорганизовать всю армию. Новообразованная Имперская гвардия теперь возглавит атаку против врагов Империи."
ANG_commissars:0 "Комиссариат"
ANG_commissars_desc:0 "Офицеры лояльности старой Энгриверской армии были в значительной степени успешными и обеспечили значительное повышение лояльности и боевой эффективности вооружённых сил. Чтобы обеспечить абсолютную лояльность своих подданных, император Леер приказал расширить эту организацию, чтобы охватить все аспекты жизни общества."
ANG_penal_battatlions:0 "Пушечное мясо"
ANG_penal_battatlions_desc:0 "Имперская гвардия всегда нуждается в большем количестве тел, чтобы заполнить её ряды, и отбросы общества готовы ответить на её призыв. Преступники Империи будут отправлены на передовую для отбывания наказания, и искупить свою вину они смогут лишь смертью за императора."
ANG_the_god_emperor:0 "Бог-Император всех грифонов"
ANG_the_god_emperor_desc:0 "Император Леер I объявил себя богом, и никто в Империи не смеет этого отрицать. Имперский культ был объявлен официальной государственной религией Империи, и святой пыл его подданных будет способствовать грядущему завоеванию Грифонии."
ANG_the_north_baron:0 "Пусть север сгорит"
ANG_the_north_baron_desc:0 "На севере лежат мерзкие предатели из Республики Грифонов. Эти презренные бандиты были первопричиной упадка Империи, и с тех пор их жалкая революция скрывалась в горах. Настало время для них предстать перед абсолютной справедливостью."
ANG_into_vedina_baron:0 "Вединские курицы"
ANG_into_vedina_baron_desc:0 "Ведина никогда не была частью Империи и долгое время оставалась в стороне от войн. Империя была построена на трупах малых народов, и пришло время Ведине присоединиться к Империи Грифонов."
ANG_burn_the_traitors_out:0 "Уничтожить республиканцев"
ANG_burn_the_traitors_out_desc:0 "Республиканизм был болезнью, которая убила старую империю, почти положив конец векам славного правления. И хотя они были побеждены храбрыми патриотами империи, они всё ещё плодятся в Грифонии со своими мерзкими идеалами. Сердце этой инфекции находится в Клаудбьюри, и если мы хотим когда-нибудь избавиться от неё, мы должны бороться с ней у источника."
ANG_core_north_baron:0 "Север восстановлен"
ANG_core_north_baron_desc:0 "Северные районы империи, наконец, были освобождены от десятилетий республиканского бандитизма. Граждане севера теперь свободны жить своей жизнью под полной защитой Империи, и северные просторы вскоре будут полностью интегрированы в растущую империю."
ANG_the_lake_baron:0 "Сердце Грифонии"
ANG_the_lake_baron_desc:0 "На юге находится место рождения расы грифонов. Грифонстоун – источник, из которого произошли прародители нашей расы. Если мы хотим восстановить империю, мы должны обезопасить этот важный регион."
ANG_enforce_the_language:0 "Применение имперского диалекта"
ANG_enforce_the_language_desc:0 "По мере того как Империя вновь возвращает свою законную территорию, мы сталкиваемся со странной проблемой. Различия диалектов гриффиша могут затруднить правильное общение с нашими подданными. Мы не можем позволить, чтобы такие разделения распространились по всей Империи, и, наконец, пришло время для гриффиша быть стандартизированным."
ANG_burn_griffonstone:0 "Корона Гровера II"
ANG_burn_griffonstone_desc:0 "Гровер Второй был одним из величайших императоров, в истории Грифонии, распространяя цивилизационный свет Империи на обширные части континента. И поскольку император Леер намеревается сравниться и превзойти великого Императора, уместно, чтобы он носил его корону."
ANG_core_lakes_baron:0 "Порядок"
ANG_core_lakes_baron_desc:0 "Южные провинции были покорены, и различные мелкие королевства и герцогства, которые когда-то покрывали регион, были объединены под светом Империи. Вскоре может начаться реинтеграция юга, что укрепит нашу власть в этом важном регионе."
ANG_the_west_baron:0 "На запад"
ANG_the_west_baron_desc:0 "На западе находится много жизненно важных регионов, таких как Аквелия и Скайфол. Эти регионы всегда были исконными частями Империи, и поэтому они будут возвращены в Империю любыми возможными способами."
ANG_punish_the_trade_princes:0 "Разграбить торгашей"
ANG_punish_the_trade_princes_desc:0 "У торгашей Скайфола одна забота: обставить да надуть, а называется это у них по-другому... В том-то всё и дело. Укради покрышку – и ты вор, а он хотел украсть твои четыре слитка золота – и это ничего."
ANG_no_such_thing_as_aquileians:0 "Нет никакой Аквелии"
ANG_no_such_thing_as_aquileians_desc:0 "Аквелия долгое время была мятежной провинцией империи, а её республиканские симпатии только дают понять, что нации суждено пасть. Аквелия на самом деле не является законным государством. Это всего лишь географический термин, и мы дадим это понять его заблудшим жителям."
ANG_core_west_baron:0 "Возрождение Запада"
ANG_core_west_baron_desc:0 "Пожар сопротивления на Западе, наконец, потушен, и регион теперь готов к окончательной реинтеграции в Империю. Преимущества установления порядка в этом регионе, уже ясно дают о себе знать и будут расти только после завершения реинтеграции."
ANG_the_south_baron:0 "Земля преступников и предателей"
ANG_the_south_baron_desc:0 "Лжекоролевство Вингбардия лежит далеко на юге, в регионе, населённом самыми худшими грифонами континента. Именно их предательство положило начало распаду Старой Империи, поставив под угрозу столетия славного имперского правления. Пришло время свести счёты в поистине грандиозном масштабе."
ANG_burn_down_arantiga:0 "Наследник Арантигоса"
ANG_burn_down_arantiga_desc:0 "Граждане Арантиги начали вести себя странно за последние несколько недель. Похоже, они убедили себя, что Бог-Император – это возрождённый Арантигос. В то время как обычно подобная глупость была бы искоренена, Бог-Император, серьёзно подумав об этой идее, решил принять её как факт. Может ли кто-то усомниться в том, что его завоевания превосходят завоевания Арантигоса?"
ANG_burn_karthin:0 "Сжечь Карфин"
ANG_burn_karthin_desc:0 "Карфин – это сердце Вингбардии, воплощающее всё худшее из старого ложного королевства. Если пятно вингбардийского предательства когда-либо будет удалено из южных пределов Грифонии, оно должно быть сожжено дотла."
ANG_core_south_baron:0 "Новый юг"
ANG_core_south_baron_desc:0 "Южные окраины Грифонии преобразились, исчезли наследия старых ложных королевств, которые когда-то господствовали на земле, твёрдое, но справедливое правление Империи – это всё, что осталось. Реинтеграция юга скоро будет завершена, и последние следы Вингбардии исчезнут."
ANG_the_frontier_baron:0 "Граница"
ANG_the_frontier_baron_desc:0 "На востоке простирается старая граница Империи с рыцарскими орденами, которые были созданы для защиты от пони на дальнем востоке и племён Грифьей Сечи. Восстановление границы – это одна из последних вещей, которую необходимо сделать, прежде чем Империя снова станет единой."
ANG_the_gryphus_port_baron:0 "Дальневосточный порт Империи"
ANG_the_gryphus_port_baron_desc:0 "Риапорту является наиболее экономически ценным портом на юге Грифонии, и его дальнейшее развитие, несомненно, укрепит наши военно-морские силы."
ANG_eradicate_the_cossacks:0 "Величайшая ошибка Гровера I"
ANG_eradicate_the_cossacks_desc:0 "Хотя он, без сомнения, был величайшим императором, нельзя отрицать, что величайшей ошибкой Гровера I было позволить мерзким казакам продолжать свой варварский образ жизни. Бог-Император не повторит эту ошибку, и казаки будут цивилизованы, нравится им это или нет."
ANG_core_frontier_baron:0 "Полный контроль"
ANG_core_frontier_baron_desc:0 "Старая граница наконец-то была восстановлена, и прежние ошибки управления, больше не будут повторяться. Империя сохранит полный контроль над этими регионами, и их прежняя автономия будет отправлена на свалку истории."
ANG_reclaim_nova_griffonia:0 "Наша своенравная колония"
ANG_reclaim_nova_griffonia_desc:0 "Император Леер первым сделал то, что казалось невозможным, и Империя вернула свои грифоньи земли. Но теперь, когда территория грифонов находится под нашим полным контролем, необходимо решить вопрос о своенравной колонии. Последний недостающий фрагмент находится в Эквестрии, и с её возвращением Империя вновь станет единой."

### Events ###
angriver.1.t:0 "Возвращение земли"
angriver.1.d:0 "С незапамятных времён леса Энгривера были естественным сдерживающим фактором для поселений. Всеобъемлющий Шайсвальд оказался не идеальным местом для начала жизни будущих городов. Но всему приходит конец, и Шайсвальд медленно, но верно начал уменьшаться. С каждым днём всё больше деревьев падает, расчищается всё больше пространства и прибывает всё больше грифонов. Небольшие поселения постепенно становятся процветающими, увеличивая приток иммигрантов в Энгривер, поскольку свободные грифоны ищут место, где можно подзаработать на лучшую жизнь в Грифонии. Эти поселения и сопровождающие их поселенцы имеют своего рода пограничный дух, и ничто, похоже, не сможет остановить их экспансию."
angriver.1.a:0 "Это здорово услышать."

angriver.2.t:0 "Таинственная болезнь"
angriver.2.d:0 "Горнодобывающая промышленность быстро стала одной из самых прибыльных отраслей в Энгривере, поскольку спрос на недавно обнаруженные магические кристаллы кажется неуклонным. Но похоже, что эти кристаллы не были благом каким они изначально казались, поскольку странная болезнь начала распространяться среди шахтеров. Эта болезнь загадочно поражает здоровых грифонов без внешних признаков, и среди горнорабочих начала распространяться паника.\n\nПроблема обострилась когда несколько буровзрывников оказались в ловушке после обрушения кристаллической шахты. Спустя 18 часов они смогли выбраться наружу, нам казалось, что всё будет хорошо, но вскоре болезнь дала о себе знать. Оставшиеся в живых начали часто уставать и кашлять кровью. Их состояние быстро ухудшалось, было ощущение, что они одержимы какой-то тёмной силой, их конечности двигались причудливо, а сами бессвязно просили о помощи. Вскоре выжившие были избавлены от страданий."
angriver.2.a:0 "Может ли уран быть причиной этого?"

angriver.3.t:0 "Урбанизация"
angriver.3.d:0 "С недавним расширением дорожной системы, город Энгривер стал привлекательным для промышленников, стремящихся основать новые фабрики. Вместе с этими фабриками появляются рабочие места, и теперь тысячи грифонов переезжают в города, чтобы работать на этих фабриках. Медленно, но верно, деньги, услуги, богатство и возможности централизуются в городах, и грифоны из сельской местности приходят искать здесь своё счастье. Это быстрое изменение привело к опустошению некоторых бедных фермерских общин Энгривера, и многие из них с пугающей лёгкостью теряют свои самые молодые поколения, которые уезжают в города. Через несколько лет многие из этих ферм станут заброшенными. Их жители уедут в города, оставив за собой только разрушенные дома и остатки прошлого."
angriver.3.a:0 "Приятно слышать."

angriver.4.t:0 "Образовательная кампания"
angriver.4.d:0 "Неграмотность давно преследует народ Энгривера, поскольку долгое время грамотность не приносила реальной пользы обычному грифону. Но по мере того как современность вторгается в Энгривер, проблема стала слишком большой, чтобы её игнорировать. Государство запустило большую программу, нацеленную на ликвидацию неграмотности раз и навсегда, и плоды этого труда начали проявляться. Наконец-то было введено обязательное школьное образование, а для рабочих, желающих достичь грамотности, организованы вечерние школы за небольшую плату. Это оказалось большим преимуществом для нашего промышленного сектора, а также для наших программ исследований и разработок, поскольку грамотные грифоны гораздо более ценные рабочие, чем неграмотные."
angriver.4.a:0 "Борьба продолжается."

angriver.5.t:0 "Завершение образовательной кампании"
angriver.5.d:0 "Энгривер действительно преобразился, так как, впервые в истории региона большинство населения можно смело назвать грамотным. Битва была долгой и тяжелой, требуя от правительства больших инвестиций. Но программа ликвидации неграмотности вышла за рамки наших самых смелых мечтаний, и благодеяние для промышленного и научного секторов также было огромным. Призрак неграмотности не задерживается в Энгривере, и это наш день празднования!"
angriver.5.a:0 "Поднимем бокалы за это!"

angriver.6.t:0 "Проект сельхозугодий"
angriver.6.d:0 "Проект сельхозугодий — это правительственная инициатива, направленная на то, чтобы лучше использовать обширные пространства Энгривера, предлагая льготы и субсидии любому грифону, желающему переехать в деревню, чтобы основать ферму. В последнее время проект стал неожиданным успехом, и многие грифоны проявили желание начать новую жизнь на бескрайних равнинах Энгривера. Эти новые поселенцы расширили небольшие поселения, которые уже были здесь. Некоторые предполагают, что в этом регионе скоро начнут появляться новые города."
angriver.6.a:0 "Отлично!"

angriver.7.t:0 "Сбей и беги"
angriver.7.d:0 "В связи с недавними дорожными работами вокруг Энгривера было неизбежно, что жители Шайсвальда будут встревожены. Во время строительства одна из деревень возле леса стала очагом неестественной активности. Селяне начали исчезать посреди ночи, и единственной подсказкой о их трагичной судьбе были обрывки кровавой одежды, обнаруженные на краю леса. Сообщения о жутких звуках в ночное время сеяли массовую паранойю, а местным жителям каждую ночь снились кошмары.\n\nПоселение было парализовано страхом, и многие думали, что погибнут от лап этого ужасного монстра. Источником всех бед был Лихо, пробиравшийся в деревню, чтобы потакать своему аппетиту. Питаясь ужасом селян, он намеревался поглотить всё живое вокруг. Ночью он выполз из леса и приблизился к идеальному месту для начала своего тёмного ритуала. Он замер в тени ночи, готовясь к главной трапезе...\n\nНо его сбил грузовик. Кунц Бартрам, как обычно, ехал в деревню для проведения переписи региона. Поскольку он отставал от графика, то решил отправиться в путь ночью, чтобы сэкономить время. Кроме того, перед поездкой он выпил немало имперского пива с катеринскими брецелями. Излишне говорить, что это был далеко не лучший «рецепт» для ответственного вождения.\n\nИз-за плохой видимости, алкоголя и недостатка сна Кунц въехал прямо в Лихо – а если точнее, переехал его. Из-за зацепившейся потёртой одежды существо застряло под днищем, и грузовик утащил его за собой в деревню. Из-за лихачества Кунца то, что доехало до поселения, больше походило на кровавое пятно, чем на страшного Лихо.\n\nКогда Кунц прибыл, горожане объявили его спасителем и щедро наградили хорошим имперским пивом с тушёной капустой."
angriver.7.a:0 "Так... вот как надо было справляться с Лихо."

angriver.8.t:0 "Программа сельского образования окупилась"
angriver.8.d:0 "Недавно созданная программа для сельских учителей быстро начала приносить плоды, поскольку всё больше и больше грифонов в сельской местности становятся образованными. Это укрепило веру нашего народа в правительство, и многие молодые грифоны из сельской местности стали политически активными. Эта программа доказала свою ценность, и грифоны уже стремятся её расширить."
angriver.8.a:0 "Хорошо."

angriver.9.t:0 "Осада Центрального Банка"
angriver.9.d:0 "Вчера утром представители коммуны Грифинга связались с Центральным Банком, чтобы потребовать немедленного отказа от его резервов. Требование было отклонено, и в этот момент силы Коммунарной Армии были направлены для захвата средств банка, в случае необходимости силой. К тому времени, когда они прибыли, сотрудники банка забаррикадировались внутри здания и приготовились к осаде.\n\nВ течение дня продолжалось напряжённое противостояние, но ни одна из сторон не хотела зажигать пороховую бочку. В конечном итоге те, кто находился внутри Центрального Банка, сделали первый шаг, пытаясь сбежать с тем золотом, которое они могли нести под покровом темноты. К сожалению или к счастью, они были обнаружены, и началась кровопролитная перестрелка с большими жертвами с обеих сторон, но в итоге вся оппозиция была умиротворена, и Коммунарная Армия захватила контроль над банком и его богатством. Конфискованные средства были незамедлительно распределены среди благодарного населения, что позволило нам значительно повысить популярность."
angriver.9.a:0 "Победа!"

angriver.10.t:0 "Предательство!"
angriver.10.d:0 "Вот уже несколько недель MfÖS занималось изучением тайных связей дворян, служащих офицерами в имперской армии. К сожалению, они не смогли расшифровать их сообщения и узнать, с кем они общались. Теперь правда раскрылась, но уже слишком поздно что-либо предпринимать.\n\nЗначительная часть имперской армии дезертировала и пересекла границу с Энгривером, где правит тиранический культ Чёрного Когтя. Мы не знаем, с помощью какой лжи и манипуляций они склонили на свою сторону столько офицеров, но ущерб уже нанесён.\n\nГера Эйхберг, самопровозглашённая "законный регент", явно планирует узурпировать власть в Грифенхейме тем или иным способом. Мы должны подготовиться к её удару, пока ещё можем."
angriver.10.a:0 "Предатели понесут наказание!"

angriver.11.t:0 "Воздаяние мяснику по заслугам"
angriver.11.d:0 "Два грифона из Чёрной гвардии, облачённые в тёмные зачарованные доспехи, ввели закованного в цепи архипредателя Фердинанда Донкло в императорский тронный зал. Гера Эйхберг уже ждала там, восседая на месте регента подле пустующего трона. Она смотрела на Фердинанда с абсолютным презрением.\n\nГрифон-альбинос вскинул голову. Ему всё ещё удавалось ухмыляться, несмотря на сломанный клюв и многочисленные синяки. — Не могу поверить, что в конце концов меня одолела какая-то цыпочка.\n\nГера молча поднялась и сошла по ступеням к пленнику. Она не проронила ни слова, даже оказавшись в нескольких сантиметрах от его лица, лишь сверлила взглядом его кроваво-красные глаза. А затем, внезапно дав волю ярости, она нанесла сокрушительный удар в лоб, от которого грифон повалился на мозаичный пол.\n\nБывший лорд-протектор тяжело дышал, пытаясь вернуть себе прежнее самообладание. — Я не понимаю тебя. К чему эта злость? Насколько мне известно, многие наши цели совпадают. Мы ведь хотим одного: восстановить величие Империи.\n\nГера с силой наступила на него, заставив Фердинанда застонать, когда острые когти вонзились в его плоть. Она плюнула ему в лицо и поморщилась. — Мерзкий детоубийца, ты будешь гореть в Тартаре вечность! — Гера выхватила зачарованный кинжал – тот самый, которым когда-то оборвала жизнь барона.\n\nФердинанд уставился на лезвие. Он по крайней мере дал птенцу возможность умереть быстрой и чистой смертью. Глядя в глаза Геры, он понял: она не будет столь милосердна."
angriver.11.a:0 "Умри."

angriver.12.t:0 "Чудо"
angriver.12.d:0 "Гера Эйхберг улыбнулась, проходя мимо гниющих останков Фердинанда Донкло, которые были выставлены на публичное обозрение. Она бы с удовольствием посмотрела на них и подольше, но у неё были более важные дела. В сопровождении чёрной гвардии она направилась в крупнейший сиротский приют Грифенхейма на окраине города.\n\nЭто было большое здание, где жило множество молодых грифонов, потерявших своих родителей во время недавних кровавых конфликтов. Но её агенты сообщили ей об одном особом маленьком грифоне, который идеально подходил для её нужд. Юный Хенрик был почти того же возраста, что и Гровер VI, да и выглядел очень похоже. Не потребовалось бы много работы, чтобы сделать из него идеального двойника. И хотя он не носил очков, ему придётся приспособиться пользоваться ими.\n\nГера вошла в его комнату в приюте и приказала своим охранникам остаться снаружи.\n— К-кто вы? — спросил застигнутый врасплох маленький грифон. — В-вы пришли усыновить меня?\nГера тепло улыбнулась. — Ну, а ты что думаешь?\nХенрик ничего не сказал, но застенчиво улыбнулся в ответ. В его глазах стояли слезы.\nЭтот грифон был слишком плаксив, но это можно будет исправить позже. — А знаешь что? Я усыновляю тебя, потому что узнала о тебе кое-что очень, очень особенное.\n— Ч-что?\nГера села рядом с ним и положила коготь ему на плечо. — В твоих жилах течет императорская кровь. Твои покойные родители никогда не говорили тебе об этом, потому что хотели уберечь тебя. Но под моей опекой ты будешь в большей безопасности, чем где-либо ещё.\nГлаза Хенрика расширились. — В с-самом деле?!\n— Да. Но другие мне не поверят, поэтому с этого момента давай просто притворимся, что ты на самом деле Гровер VI, хорошо? Каким-то образом ты чудом выжил. — Она игриво подмигнула ему.\n— Д-да! Это будет... наш маленький секрет! — Взволнованно воскликнул Хенрик."
angriver.12.a:0 "Он будет отличной заменой."

angriver.13.t:0 "Урок языка"
angriver.13.d:0 "Молодой император оказался прилежным учеником, возможно, что даже слишком прилежным. Похоже, что он начал увлекаться разными языками: Гера видела, как он читал гриффишско-аквелийский словарь. Она не знала, откуда он его взял, ведь многие неуместные книги из императорской библиотеки уже были сожжены. Похоже, что эта книга избежала уничтожения. Быть может, император даже лично спас её?\n\nГера подошла к столу, за которым читал Гровер. Она постучала когтем по его плечу, испугав птенца. — А-а-а! Гера? Я не слышал, как ты вошла в комнату.\nОна улыбнулась. — Прошу прощения, мой император. Мне было любопытно, что вы читаете.\nГровер нервно посмотрел на свою книгу, затем снова на грифину. — Эм, это словарь, который я нашел. Я думаю, что аквелийский язык очень красивый.\nГера покачала головой в разочаровании, хотя всё ещё продолжала улыбаться. — О нет, император. Неужели нет ничего лучшего для изучения? Изучение бесполезных языков - пустая трата времени.\nГровер сжался под её взглядом. — Н-но... разве я не должен знать язык своих будущих подданных?\n— Император Грифонии должен знать только императорский язык - грифонстоунский диалект гриффиша. Если его подданные не говорят на нём, то это полностью их вина. Вы должны помнить, мой Император, что чем дальше от Грифонстоуна и Грифенхейма вы удаляетесь, тем тусклее становится свет цивилизации.\nГровер посмотрел на пол и стыдливо закрыл свою книгу. — Я-я понимаю, Гера. Простите меня. Мне... наверное, стоит почитать что-нибудь другое, верно?\nГера погладила его по голове и улыбнулась пошире. — Да. Ты быстро учишься. — Она забрала у него книгу. — Почему бы нам не прогуляться? Я могла бы показать вам прекрасную литературу из императорской библиотеки.\nГровер слабо улыбнулся в ответ. — Конечно, Гера. Звучит неплохо."
angriver.13.a:0 "Хороший мальчик."

angriver.14.t:0 "Божественная власть"
angriver.14.d:0 "Гровер, несомненно, был любопытным грифоном, который любил исследовать императорский дворец. Однажды он нашёл кухню, где готовилась еда для него и знати. Он заглянул в дверь и увидел поваров, занятых работой. Некоторое время он спокойно наблюдал за ними, а потом его глаза расширились, когда он увидел, что готовится тесто для печенья. Он терпеливо ждал своего шанса, и повара отвлеклись. Он влетел в кухню, хлопая крыльями, и схватил миску с тестом для печенья.\n\nЧерез некоторое время главный повар кухни привёл хнычущего Гровера в кабинет Геры. — Регент Гера, — сказал повар, — Вам нужно лучше воспитывать императора. Он пробрался на кухню и украл оттуда еду!\nГера подняла бровь, посмотрев сначала на него, потом на насупившегося императора, потом снова на повара. — Ясно, — пробормотала она и встала из-за стола. Она медленно подошла к шеф-повару и не мигая уставилась на него. Гнев шеф-повара вскоре сменился беспокойством.\n— В чём дело, Гера? — спросил Гровер.\n— Боюсь, вашему повару нужно научиться хорошим манерам, — сказала она и ударила того прямо по лицу.\nГровер ахнул, когда повар дёрнулся. Гера пристально посмотрела на него. — Как ты посмел ослушаться своего императора? Ты - не более чем Его собственность. Если Он желает получить от тебя что-то, ты должен отдать это Ему, потому что в конечном итоге это тоже Его собственность. Оглянись вокруг. Всё, что ты видишь, - это Его собственность, унаследованная от Его отца.\nПерья шеф-повара выглядели взъерошенными. — Н-но вы не можете просто позволить ребёнку получать то, чего он хочет!\nГера снова ударила его, но этот раз ещё сильнее. — Во-первых, я не позволю никому говорить о Нём без упоминания титула "император". Во-вторых, ты уволен. Стража! Уведите его!\nДвое чёрных стражей вышли из теней кабинета и утащили бывшего главного повара, который гневно кричал. Гера выдохнула и расслабилась, затем повернулась к Гроверу, который выглядел весьма потрясенным. Она ободряюще улыбнулась ему. — Вам нужно научиться быть более напористым, мой император. Помните, что я сказала. Всё и все - ваша собственность, и вы можете поступать с ней так, как пожелаете. Никто не имеет права отказать вам в чём-либо. Ведь даже я всего лишь ваш наставник и опекун.\nГровер кивнул. — Я-я понимаю. Спасибо, Гера."
angriver.14.a:0 "Урок выучен."

angriver.15.t:0 "Плохой друг"
angriver.15.d:0 "Император Гровер VI вошёл во двор, а за ним следовал другой грифон примерно такого же возраста. И хотя Гровер шёл уверенно, его спутник колебался. — Грови, ты уверен, что мне можно сюда приходить?\nГровер ободряюще улыбнулся своему другу. — Если я разрешу, то да. Я же император, в конце концов!\nДруг улыбнулся в ответ и последовал за ним внутрь императорского дворца. Он с изумлением огляделся вокруг, увидев изысканную архитектуру, высокие залы и многочисленные картины и статуи, украшавшие их. — Блин, Грови, ты так живешь?\n— Это лишь коридоры! Подожди, пока не увидишь мою комнату. Тебе просто голову снесёт! — Гровер подошёл к книжному шкафу. — Однако нам придётся использовать тайные ходы, чтобы никто не увидел тебя здесь. Я единственный во дворце, кто знает о них! — Он схватил книгу и потянул за неё, отчего книжный шкаф пришёл в движение и открылся, подобно двери.\nДруг Гровера потерял дар речи, когда они вошли в пыльный и тёмный туннель, который был достаточно просторным для них двоих. Они повернули налево, направо, налево, поднялись наверх и снова повернули, войдя в проход, который вёл в комнату Гровера. Однако они поняли, что были там не одни: перед ними стояла скрытая тенями фигура.\n\n— К-кто ты? — спросил Гровер, пока его друг спрятался за ним.\n— Это я, ваш регент, — мягко сказала фигура.\nГровер облегчённо вздохнул. — Т-ты напугала меня, тётя Гера! Я и не знал, что ты в курсе о секретных туннелях!\n— Конечно, я в курсе, глупыш. — Они видели, как Гера слегка наклонила голову. — Но кто ваш друг?\n— Это Гюнтер, сын портного. Его отец сшил для меня одежду, так что я познакомился с ним таким образом...\nГера покачала головой. — Ай-яй, император. Вы же понимаете, что он всего лишь грязный простогрифон?\nДруг Гровера съёжился, а император нахмурился. — Он не г-грязный!\n— Быть может не снаружи. Но внутри? Там сплошная грязь и мерзость. И ни капли благородной крови. Разве я не советовала вам избегать общения с такими грифонами?\n— Да, но он мой друг...\n— Смотрите на него как на слугу или последователя. Но не как на друга. Он вам не ровня, и никогда им не будет. Помните об этом, император.\nГровер опустил голову и снова взглянул на своего друга. — Я... думаю, это была плохая идея, Гюнтер. Тебе лучше пойти домой.\nОн кивнул и побежал прочь."
angriver.15.a:0 "..."

angriver.16.t:0 "Грехи отца"
angriver.16.d:0 "Император Гровер VI сидел за своим учебным столом. Он поднял коготь, показывая своей учительнице, регенту Геру, что у него есть вопрос. — В чём дело, император? — спросила она.\n— Тётя Гера, в книге по истории, которую я читаю... там говорится, что Регентский Совет не разрешил моему отцу короноваться, когда он вырос. Почему?\nГера вздохнула. — Я тогда была ещё маленьким птенцом, поэтому лично не знакома с теми событиями. Но я слышала от дворян - тех, кто пережили революцию, - что Гровер V ещё не был готов стать императором. Он болел и был травмирован потерей своего отца, вашего деда. Возможно, вы сможете его понять.\nИмператор некоторое время молчал.\nГера продолжила. — Но глупые простогрифоны посчитали это захватом власти, считая дворян коррумпированными и злыми. И этот глупый архонт, Эрос, считал также. Он взбаламутил простогрифонов, пытаясь увеличить свою собственную власть, но это обернулось страшным провалом. В итоге именно он пытался спасти вашего отца из горящего дворца.\n— Но почему чернь столь разозлилась? — спросил Гровер. — Они завидовали знати?\nГера усмехнулась. — Возможно. Но правда в том, что ваш дедушка Гровер IV годами умиротворял их. Давал им всё больше и больше прав, потому что искренне любил своих подданных. Но вы знаете, как это происходит. Вы даёте простогрифонам коготь, а они отхватывают всю переднюю лапу. Простогрифоны продолжали хотеть большего, но когда он умер, дворяне мудро отменили некоторые чрезмерно радикальные реформы, что возмутило их. Пусть это будет притчей о жадности. Вы должны быть очень осторожны в общении с низкорождёнными.\nИмператор понимающе кивнул. — Спасибо, тётя Гера. — Затем он вернулся к усердному чтению учебника по истории.\n\nГера улыбнулась, гордясь своим учеником. Он быстро учился."
angriver.16.a:0 "Гера - хороший учитель."

angriver.17.t:0 "Анархистские рейды"
angriver.17.d:0 "Со времён революции 978 года Союз Анархистов Энгривера был занозой нашего правительства. Хотя анархисты и потерпели поражение вместе с республиканцами, но так называемая "Армия Свободного Государства" продолжает наносить удары из тени. Эта бандитская армия недавно усилила свои атаки, и мы, кажется, как никогда бессильны остановить их.\n\nВ последнее время стали пропадать военные патрули, их изуродованные тела находили спустя несколько недель без всего ценного снаряжения. Несколько офицеров погибли от взрывов автомобилей и яда. Этот недавний всплеск активности достиг своего апогея после недавнего рейда на слабо защищенный арсенал, который оказался для нас катастрофическим. Весь гарнизон был зарезан, а оружие из арсенала было захвачено Армией Свободного Государства."
angriver.17.a:0 "Проклятье!"

angriver.18.t:0 "Таинственные убийства"
angriver.18.d:0 "Тёмные тучи сгущаются над Энгривером, а население живёт в постоянном страхе и паранойе, многие ожидают, что следующий день может стать для них последним. Начало этой атмосфере ужаса положила череда загадочных убийств. Ни один грифон не был застрахован, никто не был в безопасности, любой, от владельца престижной компании до скромного нищего, мог быть следующим. Любая жертва просто исчезала без следа в один из прекрасных дней, и без каких-либо намёков на то, что могло случиться.\n\nНо трупы рано или поздно сплывают, а какой-нибудь несчастный грифон обнаруживает эту ужасающую сцену. Самое сложное — это всегда опознать тело или то, что от него осталось. Невозможно определить причину смерти жертв, поскольку многие из них, похоже, были разорваны на части или убиты таким жестоким образом, что почти ничего не оставалось для опознания. Сами тела появлялись в любом месте, причём самые неожиданные находки были обнаружены внутри камеры в штаб-квартире полиции. Не имея никаких зацепок, полиция ничего не смогла сделать с этими убийствами, кроме как посоветовать каждому грифону сохранять постоянную бдительность, а само правительство, похоже, бессильно перед этой невидимой угрозой."
angriver.18.a:0 "Проклятый Чёрный Коготь..."

angriver.19.t:0 "Охота Гроссмаршала"
angriver.19.d:0 "Мерзкие монстры и бандиты Энгривера были постоянной занозой правительства, и их присутствие больше нельзя терпеть. Теперь разбойникам Энгривера знают имя, которое нужно бояться, Гроссмаршал Отмар Штойбер. Гроссмаршал начал невероятно эффективную кампанию против злобных преступников в регионе: полицейские рейды на цитадели бандитов и нападения армии на гнёзда монстров происходят почти ежедневно. Сам Гроссмаршал пользовался огромным приростом популярности среди простого населения. Трудно найти в Энгривере грифона с отрицательным мнением о Гроссмаршале."
angriver.19.a:0 "Хорошая работа, Отмар!"

angriver.20.t:0 "Республиканизм на подъёме"
angriver.20.d:0 "Много лет назад, во время Республиканской Революции 978 года, Энгривер погрузился в хаос, когда республиканцы, анархисты и лоялисты открыто сражались на улицах. Но революционная толпа была в конечном счёте была побеждена, их идеалы разбиты, а старый порядок укрепился благодаря решительному лидерству Барона Леера во время кризиса. Когда их Республика превратилась в кучку бандитов, прячущихся в горах, а Император вновь уверенно восседал на троне в Грифенхейме, немногие оставшиеся республиканцы отказались от своих идеалов, оставив позади себя лишь разорванные триколоры и разрушенные мечты.\n\nМногие думали, что это ознаменует конец угрозы республиканцев в Энгривере. Они ошибались... Кажется, что республиканские идеалы, столь лелеемые сбродом, не умирали все эти годы. Как инфекция, они медленно разрастались в тени. Этот медленный рост, наконец, достиг переломного момента, и триколоры вновь открыто развеваются среди населения. Толпа призывает к революции, пройдет совсем немного времени, прежде чем их желание будет исполнено."
angriver.20.a:0 "Это снова мы..."

angriver.21.t:0 "Кинжалы в темноте"
angriver.21.d:0 "Ночь. Улица. Фонарь. Аптека... Тёмные фигуры начали движение, пока их жертвы отдыхают после долгого и тяжелого рабочего дня. Их цель — заполучить контроль над Энгривером у Барона и преподнести его республиканцам на серебряном блюдце. Первые атаки начались со взрыва самодельных бомб в казармах армии. Ополченцы уже занялись обеспечением безопасности ключевых правительственных учреждений. Вскоре начались бои. Гарнизон был весь в крови, хоть он и был лучше экипирован и обучен, чем республиканское ополчение. Улицы охвачены стальным штормом из орудийного огня, сопровождаемым взрывами. Пока республиканцы атакуют штаб ополчения, гарнизон переходит к его защите. Судьба Энгривера теперь лежит на лезвии ножа, и любая сторона может уйти победителем этой ночью."
angriver.21.a:0 "Предателей бьют в ответ."
angriver.21.b:0 "Предатели получили контроль над баронством!"

angriver.22.t:0 "Последний рубеж Гроссмаршала"
angriver.22.d:0 "Предатели теперь контролируют баронство, а их победа, казалось, была уже близка. Но местонахождение Гроссмаршала остаётся для них неизвестным, и они наверняка запаникуют, если узнают, где он находится. Гроссмаршал Отмар Штойбер сидел в командном кресле танка, одного из немногих присутствующих в Энгривере и ехал по улицам Грифинга со своей личной охраной и остатками лоялистов, которых смог собрать. Их целью является штаб-квартира республиканцев, содержащая офицеров и лидеров. Сам комплекс построен как форт и хорошо защищён.\n\nГроссмаршал намеревается уничтожить лидерство предателей одним ударом обезглавливания, чтобы вдохновить упавших духом сторонников. Когда его силы прибыли ко входу республиканского штаба, ополчение уже готовилось атаковать враждебные силы. Гроссмаршал достаёт меч и вылезает из своего танка. Он намерен напасть на штаб предателей со своими грифонами, хоть их шансы на успех невелики. Какая бы судьба ему ни предстояла, Гроссмаршал встретит её в лоб."
angriver.22.a:0 "Он повержен, как и ожидалось..."
angriver.22.b:0 "Маршал побеждает революционеров!"

angriver.23.t:0 "Яркое будущее"
angriver.23.d:0 "После окончательного уничтожения последних остатков старого режима, Энгривер прочно оказался в когтях повстанцев. Но окончательная судьба страны ещё не решена, поскольку повстанцы, свергнувшие старое правительство, далеки от единства. Революция была в целом проведена двумя фракциями. Эти две фракции в настоящее время ведут невидимую войну влияния, обе стороны стремятся взять абсолютный контроль над революционными силами, одновременно отвергая желания друг друга.\n\nВо-первых, существует Национал-Республиканская Партия, возглавляемая Герхардом Блюмом. НРП является местным отделением ведущей партии Республики Грифонов и состоит из широкой коалиции различных демократических идеологий. Национал-Республиканская Партия выступает за свободное и демократическое общество, а различные партии, входящие во фракцию, намерены баллотироваться на выборах.\n\nНо есть и анархисты во главе с Вилли Шерлером. Анархисты ведут партизанскую войну против правительства на протяжении десятилетий, и их силы составляют большое количество революционных ополченцев. Они намерены превратить Энгривер в анархистский рай, который готов защищать себя любой ценой.\n\nПока разгорается теневая война, ни один грифон не может абсолютно ясно сказать, какая фракция одержит победу. И снова судьба Энгривера покоится на прихотях судьбы."
angriver.23.a:0 "Вилли Шерлер и его анархисты освободят Грифонию!"
angriver.23.b:0 "Герхард Блюм и Национал-Республиканская Партия создают Временное правительство!"

angriver.24.t:0 "Маршал-Регент"
angriver.24.d:0 "Республиканская кровь окрашивает улицы, распад Энгривера был предотвращён, а Маршал победил. Энгривер больше не будет отсталой и застрявшей в прошлом страной, не способной угнаться за другими нациями, что модернизируются у нас под боком. Маршал обещает всем мир, процветание и счастье.\n\nКрестьянам Энгривера впервые предложили сияющую надежду, что приходит с новым рассветом. Есть те, кто сомневается в Маршале, но большинство счастливы тому, что в этой гниющей нации наконец-то произойдут перемены.\n\nДа здравствует Великий Маршал! Пусть его мудрость будет бесконечной, а царствование — благословенным!"
angriver.24.a:0 "Слава Энгриверу!"

angriver.25.t:0 "Массовые репрессии"
angriver.25.d:0 "Когда день сменяется ночью, Коготь поражается новыми рейнджерами. Новая инициатива Маршала началась, и Чёрный Коготь, преследующий каждую грань энгриверской жизни, начинает чувствовать боль от этого. Набеги становятся всё более многочисленными, каждый раз, когда их ловят, они принимают свои таблетки и умирают. Но живой или мертвый — это не имеет значения. Потому что независимо от того, с чем Энгривер будет иметь дело, одним преступником станет меньше. Да здравствует Энгривер, пусть Борей будет нашим свидетелем того, что Чёрный Коготь скоро умрет."
angriver.25.a:0 "На один шаг ближе к тому, чтобы одолеть Коготь!"

angriver.26.t:0 "Великий заговор"
angriver.26.d:0 "Чёрный рассвет взошёл на небе, когда рейнджеры вернулись с новостями. Они говорят, что разведчики пропали без вести, а подкрепление, посланное за ними, чтобы помочь, было найдено выпотрошенным и помеченным в лесу. Символ Чёрного Когтя, нарисованный на их остатках, был ужасающим, но ужасающе было потерять столько грифонов. Когда Отмар услышал об этом, он почувствовал лишь ярость. Его ненависть к Чёрному Когтю известна всем, кто когда-либо говорил с ним, она преследует его, и он не может спать спокойно по ночам. Любой шум пробуждает его ото сна: был ли это убийца, посланный Когтем, чтобы прикончить его или всё же скрипение ветки...\n\nИ вот он начал новую кампанию против них. Они нападали в темноте и прятались у всех на виду. Если это так хорошо срабатывает для них, то почему бы и не сработает для него? Вскоре его пташки вернулись с вестями о том, что они услышали: в своих покоях дворяне говорили тихим голосом, а между аристократами голубых кровей, которые так презирали Отмара, существовали тайные заговоры. Эти дворяне имели только то, что им было дано, чтобы служить народу, и вот они работают, чтобы сломать спины крестьянам, которые несут их на своих плечах.\n\nНенависть — вот, что чувствовал Отмар, приказывая своим слугам окружить дворян, не будет пощады для нечестивых, он научит этих предателей тому, что случится с теми, кто пойдет против него. Это был новый вид гнева, неизвестный Отмару прежде. Он всегда ненавидел Чёрный Коготь, но теперь у него наконец-то появилось лицо, на которое он мог выплеснуть свою ненависть, убийства, бесконечные убийства, всё это теперь имело свое лицо.\n\nПредатели голубой крови не находили утешения в новостях о судебных процессах по их делам, у судей не было ни жалости, ни милосердия. Большинство из них либо отправляли предателей в самые тёмные и сырые камеры подземелий, либо объявляли смертный приговор на месте. Ярость Отмара взяла над ним верх, надеюсь, этого больше не повторится."
angriver.26.a:0 "Где дворяне? Ох, должно быть, моё воображение."

angriver.27.t:0 "Лидеры"
angriver.27.d:0 "Информация из его сети передавалась Отмару самыми странными способами. Клочки бумаги, покрытые шифрованными отчётами. Сообщения, написанные на внутренней стороне медных колец. Зашифрованные передачи доставлялись через заброшенные номерные станции. Ему нужен был грифон, которому было бы поручено следить за всем этим.\nНаконец, он уверен, что у него достаточно улик.\n\nЧёрный Коготь известен своей скрытностью, поэтому они так долго избегали задержания. Они великолепны в заметании своих следов, сокрытии личности и избегании поимки. Тем не менее, для каждого секрета, который имел Коготь, у Отмара было вдвое больше воли и решимости.\nЭто была его миссия с того момента, как он узнал о них, того момента, как узнал, что они реальны и опасны, а не просто призраки или ужастики, нужно поймать их. И Отмар не сдаётся так же легко, как те, что были до него.\n\nЭто заняло много времени. Он не мог поймать их обычными способами, поэтому он решил выжидать. Отправить двойных агентов, чтобы вступить в их преступные ряды. Следить за ними издалека. Пусть им станет комфортно, пусть они думают, что их невозможно остановить.\n\nПора нанести удар. Теперь, когда они слабы, теперь, когда его грифонам удалось проникнуть в каждый закоулок их организации, теперь, когда у него есть масса свидетельств о них, достаточно больших, чтобы принять меры. У него есть всё, что ему нужно. Адреса, имена, рабочие места, оттиски, места. Каждый кусочек головоломки был заложен перед ним, пришло время, наконец, решить её. Собрать кусочки вместе... и разбить Чёрный Коготь.\n\nВесь взвод рейнджеров готов штурмовать их укрытия и норы с наручниками и дубинками, как только он отдаст приказ. Все они нанесут удар в полночь, когда преступники будут уставшими от зверств дня. Как только суд вынесет свои вердикты, тюрьмы Энгривера будут заполнены самыми отъявленными преступниками, которых знает Грифония. Но к рассвету, когда грязь затвердеет, пыль рассосется, и ветер прекратит свой вой... Энгривер станет немного безопаснее.\n\nСегодня ночью восторжествует справедливость, и Отмар будет держать её в узде."
angriver.27.a:0 "Чёрный Коготь не будет знать что его поразило."

angriver.28.t:0 "Встреча с Блюмом"
angriver.28.d:0 "Герхард Блюм — интересный грифон, если не сказать больше. В прошлом Отмар встречал изрядную долю воинов-духов, но ничего похожего на крепкого предводителя республиканцев. У Блюма был такой взгляд, словно он всегда был в дюйме от желания вырвать у Маршала внутренности. Проще говоря, считалось, что его трудно уговорить прийти на чай и поболтать.\nОн удивил всех, когда он принял приглашение без суеты и лишних разговоров.\n\n— Доброе утро, мистер Отмар. Или как мне вас назвать? Ваше Высочество? Ваше Величество? Правитель? — в его резком поведении не было ничего удивительного, впрочем, как и в том, что в его глазах всё ещё был убийственный блеск.\n— Я вижу, что вы заинтересованы в том, чтобы сразу перейти к делу. Очень хорошо, я принесу нам чаю, а потом... — Отмар, несмотря ни на что, пытался быть любезным, всё же.\n— Нет, не надо чая. — настаивал Блюм. — Я пришел сюда не для того, чтобы тратить время, Ваше Высочество, в ваших тюрьмах гибнут мои грифоны, пока мы тут беседуем, и я не из тех, кто наслаждается жасминовым чаем, пока мои соотечественники умирают за свои убеждения. В отличие от кого-то другого, здесь. — ответил он грубо. Так много проблем, чтобы попытаться быть дружелюбным по этому поводу.\n— Я ожидал вежливого разговора от умного грифона, не теряя своего времени и кислорода, слушая ту же самую чушь, что я слышу ежедневно по дороге на работу. — точно так же, милость Отмара растаяла, и горький, отвращающий взгляд Блюма был встречен не менее яростным взглядом. — Значит, вы либо спускаетесь и собираетесь с мыслями, либо сегодня ничего не будет решено.\n— Вы предатель, Маршал Отмар. — Блюм резко врезается. — Вы убийца своего народа, вы тиран. — продолжал он, стиснув клюв так сильно, что его слова выходили приглушенными, вымученными. — Вы - проблема Энгривера!\n— Как будто я не могу сказать то же самое о вас!.. — Отмар резко отступает, повышая тон, возвышаясь над сравнительно маленьким грифоном. — Ваши грифоны... ваши республиканцы... вы все преступники! Вы терроризировали Энгривер, вы потрясли страну до предела, и всё потому, что мы не склонились перед вашим определением...\n— Вы тиран! Ничего из этого не случилось бы, если бы такие грифоны, как вы, слушали голос народа! — кричит в ответ Блюм.\n— А вы... — внезапно Маршал делает паузу, замечая что-то. Похоже, Блюм тоже делает паузу, не упуская возможности для атаки.\n\nЛишь на мгновение Отмар смог что-то увидеть — за этим взглядом ненависти и гнева самого отвратительного вида, он смог увидеть глубже. На мгновение Отмар увидел себя, но в чужой шкуре — того же грифона, ищущего не власти, не силы, не влияния... но ради лучшего Энгривера.\n\nЕсли судить по внезапной остановке их гнева, то Блюм увидел то же самое. Эти двое смотрели друг на друга всего несколько секунд, пока, наконец, республиканец не закашлялся, не вспомнил и не вздохнул. — Итак. Насчет того предложенного чая."
angriver.28.a:0 "Тост за новую дружбу!"

angriver.29.t:0 "Освобождение политзаключенных"
angriver.29.d:0 "— Подожди, так что мы можем просто... пойти домой... сейчас?\n\nПосле встречи с господином Блюмом от республиканцев, Отмар пришёл к выводу в отношении тюрьмы политзаключенных, оставшихся после краха республиканцев. Вместо того, чтобы держать их взаперти за свои политические убеждения, он смог договориться о мирном завершении всего конфликта между монархистами и республиканцами.\n\nСсора приближается к концу. По мере того, как поднимаются решетки и освобождаются тысячи арестованных грифонов, Отмар и его новый друг Блюм работают день и ночь, чтобы лучше очертить будущее Энгривера. Сотрудничество — это единственный способ положить конец кровопролитию, и два закаленных грифона-воина это прекрасно знают.\n\nТеперь вместо того, чтобы сражаться с ними, все эти хорошо обученные республиканцы могут быть использованы лучше."
angriver.29.a:0 "Ступайте с миром, братья."

angriver.30.t:0 "Конституция Энгривера"
angriver.30.d:0 "— Это наш третий проект, Отмар. Я думаю, что он достаточно хорош... — слова Блюма остаются без внимания. Отмар уже вырывал страницы и набрасывал новые сноски и звёздочки к их последней попытки создать Конституцию. — Знаете, возможно, вам следовало остаться в армии. Возможно, политика не для вас.\n\nНа это Отмар только оглядывается через плечо, бросая на него железный взгляд, способный прорезать дерево.\n— Говорит, конечно, тот грифон, который въехал в мой дом и начал проклинать меня в дверях. Очень дипломатично с вашей стороны.\n\n— Эй, быть дипломатом - это одно, быть политиком - это другое. — Блюм делает глоток холодного чая. — Вы больше дипломат.\n\n— Как так? — Отмар проклинает себе под нос, снова вырывая страницу, начиная заново.\n\n— Слишком много слов. Дипломат много говорит и ничего не делает - политик мало говорит и много делает. — говорит Блюм, подходя к столу Маршала и смотрит на его работу. — Это разве Конституция?! Действительно ли так важно давать статье 13... что это?! Один, два, три, четыре, пять... пять разных сносок?!"\n\n— Почему бы и нет? Это кодекс законов для всего Энгривера - он должен быть идеальным, точным, ве...\n\n— Сжатым тоже. Никто не собирается читать Конституцию размером со священную книгу Борея. Думаю, этого достаточно, Отмар. Просто... — он поднимает ручку со стола и внезапно зачеркивает добрую половину страницы. — Ну вот и всё. В этом нет нужды. Это тоже не нужно. — он выбрасывает ещё одну — Или это.\n\n— Эй! — Отмар тянется к нему когтем, но Блюм быстро отталкивает его.\n\n— Я думаю, что узнал кто вы. Вы не дипломат, Отмар, вы писатель. Писатели всегда ненавидят когда редакторы сокращают их работу. — посмеивается Блюм. — Я когда-то был редактором газеты, знаете? До того, как я стал генералом для республиканцев. Вы знаете, сколько таких писателей, как вы, я встречал, которые не хотят сокращать свою работу? Сейчас, помолчите, позвольте мне закончить, здесь много дел. — он хватает обнажённый клочок бумаги и начинает читать его, вырезая из него щедрые куски, а Отмар мрачно смотрит на него.\nК счастью, конечный продукт, что неудивительно, более презентабелен.\n\n— Пожалуйста. — Блюм кивает во всех отношениях, но скромно."
angriver.30.a:0 "Тройное ура Энгриверу!"

angriver.31.t:0 "Иммиграционная волна"
angriver.31.d:0 "Это не так уж и много, наше маленькое Баронство Энгривер. Цивилизация, рождённая вокруг извилистой реки, прорезающей грязные скалистые равнины, окружающие тёмные холодные леса. Но, эй, судя по всему, существа, приезжающие сюда, не ожидают многого.\n\nИммиграционная служба работает в приличном темпе, обрабатывая паспорта и новые разрешения на гражданство самых новых граждан Энгривера. Они простые пони и грифоны, но Энгриверу не нужно больше, чем это. Мы будем благодарны за любую новую пару копыт или лап, и мы не в состоянии быть разборчивыми.\n\nВниз по речной дороге экипаж охотников на монстров отделяется от остальной части иммиграционного конвоя и направляется к лесу. Внутри, вооруженные винтовками грифоны, все тосты с бутылками светлого пива, оружие готово к их новейшему испытанию.\n\nВниз по дороге, ещё один экипаж останавливается на пустынном, грязном поле, и небольшая семья выходит, осматривая свою новую, скоро готовящуюся к эксплуатации ферму. Когда жена приводит детей к захудалому дому в центре поля, чтобы начать уборку, отец начинает убирать камни и грязь.\n\nТранспортная тележка рабочих направляется к самому Энгриверу, на оружейные заводы.\n\nНаше маленькое баронство — наш маленький уголок жизни, независимо от того, насколько он суров и ужасен, но он постепенно растет.\n\nОтмар улыбается. Поскольку постоянный приток иммигрантов продолжает литься из-за горизонта, он знает, что сделал добро для своей страны. Он надеется, что этим новым пони и грифонам понравится время, проведённое здесь, в его маленьком уголке Грифонии."
angriver.31.a:0 "Добро пожаловать в Энгривер!"

angriver.32.t:0 "Движение Ворхут"
angriver.32.d:0 "Мы являемся авангардом новой эры в Грифонии, и поэтому ответственны за то, чтобы нести сияющий факел будущего. Любые репрессивные законы, запрещающие "вырождённое" или "неуместное" искусство, были отменены вместе с любыми другими ограничениями, и наши художники и писатели подобны птицам, освобожденным от клеток.\n\nУже формируется новое движение, движение "Ворхут", полностью охватывающее идею индустриального общества с быстрыми автомобилями, растягивающимися городами и передовыми технологиями. Если раньше пейзажи и портреты аристократов были популярны, то теперь абстракционизм рисуется, ничего не представляя, но всё одновременно. Яркие цвета, геометрические фигуры, акцент на скорость и динамизм.\n\nСо свободой, грифоны Энгривера могут, наконец, раскрыть свои истинные сущности и выразить это по своему желанию."
angriver.32.a:0 "Создадим новую личность Энгривера!"

angriver.33.t:0 "Вера и анархизм"
angriver.33.d:0 "На этой неделе анархистские ополченцы по всей стране вошли в храмы и святыни и разграбили их, освободив их от бесполезных безделушек. Священные книги были спасены, но их необычные золотые обложки нет. В конце концов, каждое религиозное здание в Энгривере ничем не отличалось от обычного здания. Добыча была расплавлена в золотые слитки, которые затем были равномерно распределены между коммунами. Золото можно было бы использовать для приобретения машин из-за рубежа, чтобы ускорить нашу индустриализацию, и, похоже, общины уже планируют это сделать.\n\nЛюбые религиозные законы и правила, которые когда-то страстно проповедовали обманутые фанатики, теперь игнорировались, и богам свободно поклонялись различными способами. Некоторые даже оставили Богов и начали приносить жертвы по обету лесным духам. Поистине, вера была освобождена от оков."
angriver.33.a:0 "Хвала небесам!"

angriver.34.t:0 "Ужасная смерть"
angriver.34.d:0 "Рано утром бывшего Барона и печально известного тирана Леера увезли из его тюрьмы в Грифинг на окраину Шайсвальда, где революционеры когда-то провели свои годы жизни и борьбы. Он не получил большой толпы свидетелей своей драматической, подобную мученику смерть. Нет, вместо этого его затащили в отвратительное мелкое болото, сняв с него дорогую аристократическую одежду. Его гневная тирада, обращенная к палачам, быстро смолкла после громкого выстрела, эхом разнесшегося по лесу. Наступила глубокая тишина, затем раздался громкий всплеск, когда его злой труп свалили в грязный пруд. Некоторые из анархистов, уходя, плюнули на его тело."
angriver.34.a:0 "И хорошее избавление!"

angriver.35.t:0 "Первые выборы"
angriver.35.d:0 "Накануне первых свободных выборов в Энгривере три разных фракции имеют наилучшие шансы претендовать на победу.\n\nНационал-Республиканская Партия, возглавляемая Герхардом Блюмом, поддерживает знаменитые Три Принципа Свободы, Демократии и Процветания. Блюм утверждает, что Энгриверу необходимо сильное центральное правительство, чтобы гарантировать эти принципы и защитить республиканизм.\n\nГера Эйхберг и Социал-Демократическая Партия обещают поставить народное благополучие на первое место. Планы Эйхберг по земельной реформе и обеспечению гражданских свобод для простых грифонов сделали её очень популярной среди низших классов. Социал-Либеральная программа Отто Вешлера сосредоточена на улучшении экономического положения Энгривера с помощью программы урбанизации и индустриализации. В сотрудничестве с крупными корпорациями Вешлер обещает свободу и прогресс.\n\nКакая из этих трёх партий выйдет победителем, ещё предстоит выяснить."
angriver.35.a:0 "Герхард Блюм и Национал-Республиканская Партия побеждают на выборах!"
angriver.35.b:0 "Гера Эйхберг и Социал-Демократическая Партия побеждают на выборах!"
angriver.35.c:0 "Отто Вешлер и Социал-Либеральная Партия побеждают на выборах!"

angriver.36.t:0 "Смерть Леера"
angriver.36.d:0 "Барон Леер был, по всем сведениям, садистским ублюдком. Именно его ревностная жестокость во время Республиканской Революции принесла ему эпитет "беспощадный", и на протяжении всей его власти он казался более заинтересованным в распространении террора, чем в улучшении жизни энгриверцев. Для тех, кто сверг его, казнь была актом давно назревшей расплаты.\n\nКазнь Барона была публичной и долгожданной. В пасмурный день в Грифинге, на виду у нетерпеливой толпы, барон Леер встретил свой конец. Все произошло быстро, без особых церемоний, поскольку барону было отказано в последних словах. Впоследствии его останки были сожжены и развеяны по ветру."
angriver.36.a:0 "Sic semper tyrannis."

angriver.37.t:0 "Зловещая правда"
angriver.37.d:0 "В наших усилиях по искоренению таинственного Чёрного Когтя мы натолкнулись на шокирующее откровение. Гера Эйхберг из НПЭ фактически является главой всей организации. Она не добрая социал-демократка, а коварный вдохновитель, который стремился проникнуть и разрушить Республику изнутри. Мы обнаружили множество доказательств, в которых изложен её чрезвычайно мрачный план в отношении Энгривера.\n\nСаския Меклер взяла на себя лидерство НПЭ, и партия столкнулась со снижением популярности, поскольку повсюду грифоны ставят под сомнение их искренность. Эйхберг покинула свою резиденцию прежде, чем её смогли схватить, и её нынешнее местонахождение неизвестно."
angriver.37.a:0 "Невероятно!"

angriver.38.t:0 "Коготь наносит удар"
angriver.38.d:0 "В холодный вечер в Грифинге Гера Эйхберг стояла перед большим банкетным залом, заполненным грифонами. Престижная знать и правительственные чиновники сидели в ожидании, чтобы услышать её обращение. Эйхберг оглянулась на толпу, её взгляд упал на группу верных лейтенантов партии НПЭ.\n— Дураки... — пробормотала она, прежде чем прокашляться.\n\n— Добро пожаловать и спасибо всем, за столь приятный визит сегодняшнего вечера! — с широкой улыбкой сказала Эйхберг. — Многие из вас - мои старые друзья, и я знаю, что вы терпеливо ждали возможности направить Энгривер на правильный путь. Эта возможность наконец-то наступила. — она отвесила скромный поклон, когда зал заполонили вежливые апплодисменты.\n\n— Я часто слышу, как грифоны жалуются, что они хотят быть свободными, и я вынуждена задаться вопросом... чего они хотят, какой свободы? Свободы для чего? Свободы быть сметённым ветрами? — выражение лица Эйхберг стало насмешливым, когда она сделала размашистое движение. — То, чего они действительно желают, - это хаос, и у меня больше нет терпения выслушивать их глупости. — с насмешкой произнесла она. В толпе члены НПЭ растерянно оглядывались.\n\n— Этот воздух заражён. Вы чувствуете это? Энгривер захвачен предателями и трусами. Их неуклюжесть фатально ослабит нашу страну, если мы не возьмем контроль! — в одно мгновение агенты Эйхберг вышли из тени и схватили ничего не подозревающих лейтенантов НПЭ и правительственных чиновников. — Эта земля должна быть очищена и очищена кровью! — её голос стал громче и решительнее, когда она сжала когти в кулак.\n\n— Энгривер болен. Пока он не очистится от своих врагов, он будет чахнуть и умирать. Предатели и трусы, они все должны быть очищены нашим Когтем. Энгривер возродится: сильнее, чем когда-либо! Настало время для Чёрного Когтя занять свое законное место и править! — Эйхберг подняла кулак под гром аплодисментов собравшихся дворян."
angriver.38.a:0 "Мы увидим эту землю очищенной!"

angriver.39.t:0 "Когти во тьме"
angriver.39.d:0 "Полная луна ярко освещала спокойную, прохладную ночь в Шайсвальде. Внизу, на лесной подстилке, одинокая грифина отчаянно металась между деревьями. Среди густой листвы слабый свет достигал грифину, когда она мчалась через лес, изредка оглядываясь назад. Это было даже к лучшему: как известный бывший член Союза Анархистов, она не могла позволить себе попасться.\n\nЕё пункт назначения был укрытием в глубине леса. Аванпост оставался секретным в течение многих лет, действуя как убежище для тех, кто пытался избежать правления Барона. Там она будет в безопасности от Чёрного Когтя. Ей просто придется затаиться на некоторое время, и всё кровопролитие и паранойя прекратятся.\n\nВ конце концов она достигла подхода к укрытию, но её встретила лишь зловещая тишина. На постах не было никаких наблюдателей, и воздух был странно спокоен. Она уловила отвратительное зловоние и последовала за ним к его источнику. Окутанный мраком, расчлененный труп висел над входом, вздёрнутый в качестве страшного предупреждения. Это было немыслимо. Откуда им было знать?\n\nОна услышала небольшой шелест в подлеске. В одно мгновение на неё набросились два агента Чёрного Когтя. Вынырнув из тени в безумном исступлении, их клинки полоснули её многократно и с необычайной быстротой, продолжая даже после того, как нанесенные ими раны были наверняка смертельными. То, что упало на землю, было осушенной и разорванной шелухой: ещё одно предупреждение любому грифону, который пытался спрятаться от Когтя."
angriver.39.a:0 "Сегодня Шайсвальд немного спокоен..."

angriver.40.t:0 "Бесследно исчезнувшие"
angriver.40.d:0 "Город Фолькештеттен был довольно незначительным и во всех отношениях выглядел типичным энгриверским поселением. Тут были старые дома, окруженные остатками заброшенных каменных стен, рыночная площадь, богато украшенная ратуша, окруженная особняками купцов, и оживленный промышленный район, над которым недавно поднялись высокие трубы, поскольку индустриализация неуклонно расширяла свои масштабы. В Фолькерштеттене не было ничего исключительного, и его жители были довольны этим. Жизнь обычно была тихой и мирной, даже когда в Грифинге происходили беспорядки.\n\nВсё начало меняться, когда известные торговцы начали исчезать вместе с членами своих семей. Не было никаких улик или признаков случившегося: в один прекрасный день грифоны просто исчезли из своих домов. По мере того как продолжались исчезновения, среди населения распространилась тревога. Появились слухи о том, что все эти торговцы поддерживали республиканцев. Вскоре эти исчезновения перекинулись и на рабочий класс, и вновь пострадали лишь сторонники республиканцев.\n\nБеспокойство переросло в страх и ужас. Те грифоны, которые открыто поддерживали НРП, ныне либо готовились к печальной участи, либо пытались спрятаться, либо бежали из города. Другие же вдруг стали вести себя так, будто они всегда презирали республиканцев и никогда не испытывали к ним симпатии. Некоторые даже начали избивать подозреваемых в симпатиях к республиканцам или сжигать их имущество, пытаясь доказать собственную невиновность. Остальные молчали, молясь о том, чтобы их пощадили.\n\nФолькерштеттен охватила аура паранойи, а слово "республиканец" быстро стало ругательством, которое уже никто не осмеливался произносить вслух."
angriver.40.a:0 "Это их проучит."

angriver.41.t:0 "Судьба барона"
angriver.41.d:0 "После того как республиканцы и их союзники-анархисты свергли барона, он был унижен и брошен в подземелье под своим замком, который стоял на холме за пределами Грифинга. В этих подземельях когда-то содержалось множество повстанцев и предателей, которых мучительно пытали до смерти. Эти подземелья и наградили Леера прозвищем "Беспощадный", поэтому было иронично, что теперь он отведал своего собственного лекарства.\n\nНо однажды республиканцы, охранявшие его тюрьму, исчезли. Несколько дней было жутко тихо, пока не появились новые, странно молчаливые охранники. Они давали барону еду и заботились о его нуждах, но не выпустили его на свободу. Леер предположил, что произошло нечто важное. Возможно, Отмар возглавил контрреволюцию, дабы свергнуть предателей?\n\nШло время, но в тёмных подземельях нельзя было отличить день от ночи. Леер терпеливо ждал, и был вознагражден. Дверь в его темницу открылась, и внутрь вошла грифина. Леер не узнал её, но заметил, что та одета весьма изысканно. — Меня наконец-то готовы освободить? Самое время. Почему это не произошло быстрее? — пробормотал он.\n\nГрифина улыбнулась. — Ты всегда заботился лишь о себе, Леер. И единственное, чего ты когда-либо хотел, так это власть исключительно ради самой власти.\nЛеер растерянно моргнул, а затем сердито нахмурился. — Что, во имя Тартара, ты несёшь?\n— Что бы ты сделал, вернув свой трон? Ты бы собрал армию и выступил на Грифенхейм в попытке захватить императорский трон. Конечно, ты бы потерпел поражение, но твоё эго заставляет тебя думать, что ты сильнее и важнее, чем ты есть на самом деле. — Грифина хихикнула.\nЛеер пристально посмотрел на нее. — Ты пришла сюда, чтобы насмехаться надо мной? Как ты смеешь? Я - твой СЮЗЕРЕН! ПРЕКЛОНИ ПЕРЕДО МНОЙ КОЛЕНИ!\nГрифина достала длинный зачарованный нож и усмехнулась. Глаза Леера расширились от шока. — Я пришла сюда, чтобы освободить тебя, Леер. От жизни. Ты - безбожный предатель, и Чёрный Коготь должен сразить тебя."
angriver.41.a:0 "Он был не лучше республиканцев."

angriver.42.t:0 "Восстановление порядка"
angriver.42.d:0 "Недавние события в Энгривере показали, что, несмотря на свое поражение, республиканские отбросы по-прежнему наводняют баронство, как паразиты. Республиканская толпа бунтует на улицах, размахивая своим триколором и призывая к смерти Барона. Ради спасения Энгривера с этим сбродом нужно разобраться раз и навсегда.\n\nВ стране было объявлено военное положение, и любой подозреваемый в пособничестве республиканской мрази будет казнен без суда и следствия. Солдаты Барона обладают абсолютной властью и теперь безнаказанно действуют в качестве судьи, присяжных и палача."
angriver.42.a:0 "Это моя страна!"

angriver.43.t:0 "В леса!"
angriver.43.d:0 "Энгривер покрыт густыми лесами, с Шайсвальдом, являющимся самым большим и самым опасным лесом в пределах баронии. Бандиты Армии Свободного Государства десятилетиями использовали местность в своих интересах, скрывая себя в глубине леса и тайно наращивая свои силы. Если Энгривер когда-либо будет избавлен от этих разбойников, то они должны быть изгнаны из лесов.\n\nСотни солдат Барона наводнили леса Энгривера в поисках любых следов присутствия Свободной Государственной Армии. Потери, понесенные в лесу, высоки, многие бойцы были потеряны в результате набегов и засад. Армия Свободного Государства без сомнения готовилась к происходящему долгое время, но если жизни солдат - это цена, которую мы должны заплатить, чтобы истребить этих предателей, то так тому и быть."
angriver.43.a:0 "Костры должны очистить их предательство!"

angriver.44.t:0 "Выпустить псов!"
angriver.44.d:0 "Республиканские ополченцы, напавшие на столицу, не были уничтожены после проигрыша в битве, и большинство из них бежало в окружающую сельскую местность. Мы не можем позволить этим бандитам распространять свою крестьянскую подлую идеологию, и поэтому каждый республиканский предатель должен быть выслежен и разоблачен.\n\nДля того, чтобы эта задача была выполнена с максимальной эффективностью, Барон создал новую оперативную группу, состоящую из его самых доверенных и преданных солдат. Эти солдаты обрушатся на сельскую местность, как стая голодных псов, с разрешением безнаказанно сажать в тюрьму или казнить любого - это лишь небольшая плата за безопасность Энгривера."
angriver.44.a:0 "Это послужит им уроком!"

angriver.45.t:0 "Сжечь их всех!"
angriver.45.d:0 "Несмотря на все усилия военных, сторонники республиканцев по-прежнему продолжают прятаться среди населения в сельской местности. В соответствии с желаниями Барона, должны быть применены более радикальные методы, чтобы искоренить Республиканскую Угрозу. Любой, кто подозревается в симпатиях к республиканизму, теперь будет публично казнен, а если какой-нибудь город окажется слишком далеко зашедшим, то он будет сожжен дотла. Не исключено, что крестьяне будут жаловаться на жестокое обращение, как они всегда делают, но они должны признать, что это в конечном счете приведёт к лучшему."
angriver.45.a:0 "Надеюсь, они усвоили урок..."

angriver.46.t:0 "Абсолютная власть Барона"
angriver.46.d:0 "Впервые за многие десятилетия Энгривер полностью находится под контролем Барона. Республиканские ополченцы лежат мертвыми со своими сторонниками, сельская местность наконец очищена от их инфекционного присутствия. И жалкие бандиты Свободной Государственной Армии были изгнаны из своих тайных штабов в лесу. С уничтожением последних остатков республиканских предателей власть барона Леера в Баронстве Энгривер теперь не подвергается сомнению.\n\nГрифоны Энгривера признали, что Барон - единственный, кто ими правит, и приняли его абсолютную власть над всеми частями их жизни. Энгривер живёт и умирает вместе с Бароном, и любой грифон, оспаривающий этот факт, быстро окажется на виселице.\n\nОдним заметным отсутствием в свите Барона является Гроссмаршал Отмар Штойбер, который недавно исчез после предполагаемого похищения республиканскими террористами. Барон заявил, что его верные солдаты обыскивают всё Баронство в поисках его местонахождения и что мерзкие республиканцы заплатят за этот террористический акт. Некоторые грифоны могут счесть похищение Гроссмаршала очень удобным для Барона, поскольку у Отмара было много разногласий с ним, но те, кто достаточно неразумны, чтобы высказывать подобные опасения, быстро оказывались в тюрьме.\n\nХотя Барону в значительной степени удалось закрепить свой абсолютный авторитет среди простых жителей Энгривера, то же самое нельзя сказать о дворянах. Несмотря на все его попытки убедить их, они всё ещё боятся очередного восстания республиканцев и сомневаются в способности Барона защитить их."
angriver.46.a:0 "Это моя страна!"

angriver.47.t:0 "От банкротства к процветанию"
angriver.47.d:0 "Одноименная река Энгривер, протекающая по территории страны, многое давала грифонам страны. Она использовалась не только как источник пресной воды, но и для орошения полей, а также как источник энергии. Одним из мест, использовавших течение реки для питания своих машин, была лесопилка Герасхофен, принадлежавшая одной из старейших компаний в Энгривере. Она производила большую часть пиломатериалов в стране, и там трудились сотни рабочих. Но рабочие требовали зарплату, и по мере того, как деревянные здания заменялись бетонными, лесопилка испытывала всё больше трудностей. Спрос упал, но зарплата выросла, из-за чего компания залезла в долги и почти обанкротилась.\n\nНо затем произошло чудо. Чёрный Коготь издал закон, который привёл к появлению массы рабочих, которым не нужно платить. Компания быстро заменила наёмных рабочих на этих "промышленных крепостных", как их называли, и спасла себя от верной гибели. Вскоре долги были погашены, а прибыль начала расти. Новые владельцы компании, которые, как оказалось, были дворянами из Чёрного Когтя, вскоре получили огромные прибыли.\n\nЭто же явление повторялось во всем Энгривере, и повсюду компании сообщали о высоких темпах роста. Конечно, внутренний потребительский спрос упал из-за нехватки средств у населения, но ведь существуют внешние рынки, жаждущие дешёвых товаров! И Энгривер с радостью предоставлял их."
angriver.47.a:0 "Бизнес процветает!"

angriver.48.t:0 "Предложение Грифенхейма"
angriver.48.d:0 "После победы над имперцами партия [From.GetRulingParty] Энгривера основала государство [From.GetName] на руинах прежнего режима. Новое название уже само по себе подтверждает их желание объединить все соседние страны под одним знаменем.\n\nХотя, по понятным причинам, они не ведут переговоров со всеми, они всё же готовы сделать исключение для нас. Дипломаты из Грифенхейма прибыли сегодня в [Root.Capital.GetName] со следующим предложением: мы можем добровольно отказаться от нашего суверенитета и присоединиться к государству [From.GetNameDef], сохранив при этом некоторую степень автономии.\n\nЭто заманчивое предложение. Однако нам придётся отказаться от своей независимости. И пока ещё не до конца понятно, действительно ли все эти различные идеологии смогут сосуществовать в Герцланде, как они обещают, или всё же нет."
angriver.48.a:0 "Мы присоединимся к этой новой стране!"
angriver.48.b:0 "Мы не уверены в этом..."

angriver.49.t:0 "Государство [From.Owner.GetName] отказывается"
angriver.49.d:0 "Наши посланники вернулись с печальными новостями. Государство [From.GetNameDef] не желает присоединяться к нам и вместо этого хочет сохранить свой суверенитет и независимость. Неважно, насколько наши дипломаты пытались договориться и обливая их обещаниями автономии, они стойко отказывались. Пером не удалось, но меч остаётся вариантом."
angriver.49.a:0 "Они присоединятся к нам, хотят они этого или нет!"
angriver.49.b:0 "Мы должны уважать их решение."

angriver.50.t:0 "Выбор нового Председателя"
angriver.50.d:0 "После периода реформ Коммуна наконец создала основы, на которых могла быть построена истинная социалистическая утопия. Тем не менее, точная форма этой утопии оставалась спорной. Столько, сколько Шерлер хотел создать истинное анархистское государство Герцланд со своими товарищами, он не хотел навязывать свою волю другим, кто придерживался других ценностей.\n\nТаким образом, Съезд проходил в Грифенхейме, где собрались представители всех уголков Герцланда, чтобы избрать председателя и решить, какая партия направит Коммуну к светлому будущему. Три кандидата оказались популярными, их аргументы были убедительными и обоснованными: фетизец Гербен Когхель из ЛПГ, герой революции Вилли Шерлер из АСГ и ромауан Роланд Эрхардт из СПГ. У всех троих были совершенно разные ценности, и споры между ними время от времени накалялись, но в конечном итоге все трое превыше всего ценили демократию и позволили народу принять окончательное решение."
angriver.50.a:0 "Гербен Когхель и ЛПГ возглавят Сердце Империи!"
angriver.50.b:0 "Вилли Шерлер и АСГ возглавят Сердце Империи!"
angriver.50.c:0 "Роланд Эрхардт и СПГ возглавят Сердце Империи!"

angriver.51.t:0 "Закон о Национальном Языке"
angriver.51.d:0 "Когхель долгое время работал над серией законодательных реформ, которые признавали бы все разнообразные языки и диалекты Герцланда официальными, наряду с имперским диалектом, который веками использовался в документах и среди знати. Это была гигантская и трудная задача, и ему помогали дюжина лингвистов из университета Йели, но в итоге был подготовлен полный список региональных языков и диалектов, содержащий более двухсот записей. Чтобы избежать бюрократического кошмара, имперский диалект продолжал бы использоваться, но каждый грифон теперь имел право получать услуги на своем собственном диалекте. Кроме того, финансирование было предоставлено тем, кто хотел публиковать тексты на своем родном языке.\n\nВскоре многие библиотеки Герцланда были заполнены новыми книгами, местные газеты переключили свои языки, и звуки более космополитических городов, таких как Грифенхейм, стали более разнообразными. Прогуливаясь по улице, можно было услышать все языки: от фетизского до южно-грайфенмаршенского, от энгриверского до странного языка алмазных собак Бронзхилла."
angriver.51.a:0 "Тройное ура Герцланду!"

angriver.52.t:0 "День в офисе"
angriver.52.d:0 "Гербен Когхель, председатель Коммуны Герцланда, смотрел в окно своего кабинета в Грифенхейме. Это был солнечный день, прекрасный день для отдыха, но каким бы он не был это не останавливало объёмную работу граждан. Когда он собирался вернуться к докладам о ситуации в мире и предложении возглавляемого Герцландом Интернационала, его остановил стук в дверь.\n\n— Входите, мистер Ротфидер, — сказал Когхель, подозревая, что это был его секретарь. Но в кабинет вошла молодая птица украшенная коричневыми перьями с кучей бумаг в когтях, глаза блестели от радости. — Ещё больше работы, Рейнхардт? — вздохнул Председатель, но ему стало любопытно, когда секретарь покачал головой и положил бумаги на стол Когхеля.\n— Что-нибудь, чтобы поддержать вас, сэр.\n— Не называйте меня сэром, мистер Ротфидер.\n— Наслаждайтесь этим, Гербен... — секретарь быстро удалился из кабинета, оставив Когхеля наедине с ещё большим количеством бумаг.\n\nКогхель из любопытства взял верхний листок и зачитал вслух. Это было письмо.\n"Дорогой Председатель, я не знаю, дойдет ли до вас это письмо, но вы, должно быть, заняты. Однако я и моя семья хотим поблагодарить вас за вашу невероятную работу по улучшению страны. Когда анархисты захватили Сердце Империи, мы думали, что наша страна окажется в хаосе, но с вами у руля наша жизнь улучшилась..."\n\nПисьмо Томаса из Гринбэка. Это было лишь одно из серии благодарных писем со всего Герцланда. В конце чтения у председателя на лице появилась яркая улыбка. Вот для чего он все это сделал. Кто бы мог поверить, что эта невероятная возможность пришла от анархистов, скрывающихся в самом тёмном уголке Герцланда? Когхель схватил свой чемодан со стола и убрал письма. Возможно, пришло время идти дальше?"
angriver.52.a:0 "Мы зашли так далеко."

angriver.53.t:0 "Вера и социализм"
angriver.53.d:0 "Многие грифоны в Герцланде, особенно живущие в сельской местности, остаются строго религиозными. Когда анархисты Энгривера победили Империю и была основана Коммуна, они боялись, что "безбожные коммунисты", как их часто называют архонты, уничтожат любые следы религии. Действительно, ополченцы грабили храмы, но только для того, чтобы они могли делиться своим чрезмерным богатством с народом. И вскоре после того, как Шерлер был избран, была провозглашена свобода вероисповедания, к счастью для всех. На самом деле Шерлер даже охотно поддерживал поклонение трем главным богам Пантеона-грифона, особенно Борею, Богу процветания. Сейчас религиозные обряды живы как никогда."
angriver.53.a:0 "Борей приносит мне процветание, Эйр охраняет меня, Арктурий даёт мне умереть солдатом!"

angriver.54.t:0 "Сердцебиение"
angriver.54.d:0 "После ряда реформ Герцланд действительно превратился в утопию истинной свободы, где каждый процветает под бдительными богами. Многие капиталисты за границей предсказывали немедленный распад общины, так как анархия не может функционировать в таком крупном масштабе, но они были опровергнуты, уровень жизни пролетариата Герцланда превзошел их.\n\nПервый срок пребывания Шерлера на посту председателя закончился, многие поблагодарили его за работу, но он предупредил их, чтобы не формировать культ личности вокруг себя и сказал, что они совершили этот подвиг вместе. Тем не менее он выиграл вторые выборы и будет продолжать оставаться на своем посту в обозримом будущем."
angriver.54.a:0 "Интернационал объединяет расу грифонов!"

angriver.55.t:0 "Празднование революционной культуры"
angriver.55.d:0 "Как и в Энгривере, культура освободилась от оков. Художники, писатели и музыканты больше не должны стремиться угодить богатым покровителям или угнетающим законодателям и вольны выражать себя так, как они хотят. Формируются новые направления, включающие не только футуризм, но и экспрессионизм, сюрреализм, абстрактное искусство и многое другое. То, что когда-то считалось дегенеративным, теперь рассматривается так же глубоко как и классическое направление, также мы исследуем и разгадываем самые сокровенные тайны нашей души и самой жизни.\n\nАрт-фестивали и выставки проводятся в крупных городах, таких как Ромау, Катеринбург и Мирабель, их свободный вход позволяет каждому прийти и лицезреть истинный артистизм, а не старые пыльные портреты буржуазии."
angriver.55.a:0 "Будущее здесь!"

angriver.56.t:0 "Закон Эрхардта" #Перепроверить
angriver.56.d:0 "После нескольких недель подготовки Эрхардт и СПГ закончили подготовку спорного закона, отменяющего владение тамплиерами, запрещающего публичные религиозные практики и запрещающего использование символики, связанной с верой. Закон едва был принят Съездом, и когда о нем стало известно, это вызвало бурю негодования, особенно на юго-западе, который традиционно был более религиозным. Проходят протесты и даже бунты, наиболее концентрированным их гнев лежал на Эрхардте, хоть он и не был бы успешным без поддержки своей партии. Напряженность, вызванная этим, была достаточно плохой для того, чтобы законы о выборах были реформированы, и Съезд децентрализовал ещё больше, поэтому более густонаселённые регионы Герцланда на северо-западе не будут доминировать над менее населёнными на юго-западе, но на данный момент закон останется в силе, несмотря на продолжающееся противодействие ему."
angriver.56.a:0 "Религия — это опиум масс!"

angriver.57.t:0 "Век Герцланда"
angriver.57.d:0 "Герцланд уже давно оказывает влияние на другие страны мира, поддерживая местных революционеров оружием и припасами, а Великий Съезд функционирует как место встречи левых по всему миру, где их идеи совершенствуются и планируются революции. Но теперь Эрхардт хочет сделать следующий шаг к глобальной революции, которая ещё больше усилит влияние Герцланда. Он и его партия, СПГ, встретились с видными революционерами и левыми интеллектуалами со всего мира, которые собрались в Грифенхейме, и вместе заложили основы для Интернационала. Это массовая международная организация, стремящаяся объединить под одним красным знаменем всех различных социалистов, анархистов и коммунистов. Тысячи грифонов присоединились к нему в течение первого дня, и его членство продолжает расти, вскоре после этого, Эрхардт сказал, что вместе они принесут революцию на все континенты."
angriver.57.a:0 "Социализм спасет мир!"

angriver.58.t:0 "Новый рассвет"
angriver.58.d:0 "Первые выборы в Герцландской Республике знаменуют начало новой эры для грифонов, которые долгое время страдали от высокомерного правления Империи. Обещание свободного и справедливого общества волнует каждого гражданина, но им решать, как лучше всего создать это общество. Два варианта выбора стоят выше остальных по популярности: "Социал-либеральная Партия Герцланда" во главе с Фионой Шмитц и "Народная Партия Герцланда" во главе с Саскией Меклер.\n\nОтсутствие Отто Вешлера вырисовывается для действующего СЛПГ, но Шмитц - грифон, который разделяет его убеждения и обязался сделать защиту свободы своим главным приоритетом. Содействуя секуляризму, гражданским свободам и принципам свободного рынка, Шмитц стремится сделать Герцланд самой свободной и процветающей страной в мире.\n\nВ то же время Саския Меклер пересекает Герцланд, приводя доводы в пользу более справедливого, более сострадательного общественного порядка. Она утверждает, что в свете укоренившегося неравенства необходимо предпринять более конкретные шаги для защиты благосостояния простого гражданина. Её видение лучшего общества, кажется, вызвало отклик, возможно, достаточно, чтобы свергнуть СЛПГ. Накануне выборов исход далеко не определен, но в итоге..."
angriver.58.a:0 "СЛПГ и Фиона Шмитц продолжают мандат Вешлера!"
angriver.58.b:0 "Меклер и НПГ добиваются неожиданной победы!"

angriver.59.t:0 "Смерть Отто Вешлера"
angriver.59.d:0 "Сегодня печальный день, так как до нас дошли новости, что сегодня утром Отто Вешлер мирно скончался от хронической болезни, которая преследовала его в течение многих месяцев. Мы все скорбим о гибели великого грифона, мужество и решимость которого были необходимы для создания Республики Герцланд. Генеральный почтмейстер, ставший президентом, сделал больше, чем любой другой грифон в истории, чтобы принести свободу и демократию в Грифонию.\n\nВ честь его многолетней службы сначала в Энгривере, а затем во всем Герцланде, будет основан Институт Государственного Управления Вешлера. Это учреждение будет отвечать за продвижение этических общественных услуг и практики. Грифон, мечтавший о честном правительстве, служащем свободным гражданам, многое сделал, чтобы воплотить эту мечту в жизнь; но теперь мы должны продолжать его наследие в новой эпохе прогресса."
angriver.59.a:0 "Отдыхай спокойно, старый друг."

angriver.60.t:0 "Речь Меклер"
angriver.60.d:0 "Было холодное утро в Грифенхейме, когда перед зданием Капитолия собралась толпа. Настроение было мрачным, отражая отношение населения, всё ещё восстанавливающегося после бурного объединения Герцланда. Они собрались, чтобы услышать первое обращение президента Меклера, которая стояла одна на ступенях Капитолия, готовая обратиться к ним: вызывающая фигура, затмеваемая высоким куполом здания.\n\n— Мои сограждане, — начала Меклер, — Я пришла к вам во время Великой неопределенности и потрясений. Многие боятся того, что может ожидать нас в будущем, но я прошу вас не упускать из виду величие того, что мы совершили. Коррумпированная, разлагающаяся Империя была разрушена, и теперь мы стоим на краю пропасти нового века. — её тон начал успокаиваться, становясь все более сильным, пока она продолжала. — Нашей борьбой, нашей кровью, потом и решимостью мы завоевали свободу для Герцланда! — при этих словах толпа разразилась короткой овацией.\n\n— Но хотя Империя убита, истинное обещание Герцланда ещё не выполнено. — она решительно подняла коготь. — Оно не будет реализовано до тех пор, пока право каждого гражданина на процветание не будет установлено и искуплено. Оно не будет реализовано до тех пор, пока мы все не будем достаточно доверять друг другу, чтобы сотрудничать и разделять наше бремя. — Она положила свой коготь на свое сердце.\n\n— Хотя летописцы истории слишком часто игнорируют тяжелое положение простых граждан, именно благодаря вашей силе и солидарности эта Республика будет расти или падать. — Меклер сделала широкий жест в сторону толпы, которая была восхищена вниманием. — И поэтому я смиренно прошу вашей поддержки в этом начинании. Я прошу вас всех быть готовыми присоединиться к когтям со своими соседями, чтобы мы могли вместе идти к светлому будущему.\nТишина продолжалась долгое время, прежде чем разразившиеся аплодисменты сменились громовыми."
angriver.60.a:0 "За светлое будущее!"

angriver.61.t:0 "Герцландская модель"
angriver.61.d:0 "По всему миру наблюдатели восхищаются достижениями Республики Герцланд. Земля, однажды погрязшая в раздорах, претерпела превращение в самую счастливую и процветающую страну в Грифонии. Принятие сильного государства всеобщего благосостояния в сочетании с инвестициями в образование и уход за детьми, а также с надежной защитой рабочей силы привело к тому, что Герцланд хвалят как "Образцовой социал-демократией".\n\nПрезидент Меклер утверждает, что эти достижения стали возможными благодаря то, что она называет "Революцией Доверия", приспосабливаясь к меняющемуся миру с сочувствием и солидарностью. По её словам, содействие равенству требует от граждан высокой степени доверия к правительству и готовности работать вместе для достижения компромиссов и решения проблем посредством демократических процессов. Благодаря социальному контракту, который подчеркивает справедливость, граждане не сомневаются в том, что государственные учреждения имеют в виду свои наилучшие интересы.\n\nМеждународная сеть социологов и политологов посвятила себя изучению Герцланда с целью извлечения из него уроков и применению их в свои страны; ситуация, которая была бы немыслима несколько коротких десятилетий назад, наконец решилась. Мы действительно прошли долгий путь!"
angriver.61.a:0 "Тройное ура Герцланду!"

angriver.62.t:0 "Внесение поправок в Конвенцию"
angriver.62.d:0 "В переполненном душном зале в центре Грифенхейма собралась разнообразная коллекция представителей со всего Герцланда. Они были собраны для принятия конвенции о внесении поправок, первой в истории Республики, чтобы решить, утвердить ли поправку, которая изменит распределение власти в Герцланде и подтолкнет Республику к доктрине общего суверенитета. Предлагаемая система "двойного федерализма" будет разделять власть между федеральным правительством Герцланда и региональными правительствами штатов. Четко определенные условия этого разделения позволят штатам осуществлять свои полномочия без вмешательства федерального правительства.\n\nПредставители в целом поддержали эту идею, стремясь получить для своих штатов ту степень контроля, которая была утрачена при объединении Герцланда. Шумное меньшинство скептически относилось к страху, что разделение власти ослабит способность Республики действовать эффективно. Президент Шмитц призвал ко всему их вниманию, поднимаясь, чтобы выступить на съезде.\n\n— Мои друзья, мы собрались здесь сегодня, чтобы рассмотреть поправку к нашей Конституции, которая, как я горячо считаю, жизненно необходима для сохранения свободы в Герцланде — начала Шмитц. — Это факт, что всемогущее национальное правительство представляет угрозу свободе народа; мы должны осознавать опасность, которую представляет тирания масс. Если централизованная власть попадет в когти народного демагога, права меньшинств, безусловно, будут поставлены под угрозу.\nПерспектива неконтролируемой демократии выбила из колеи многих представителей, склонив их к позиции Шмитца.\n\n— Угроза, создаваемая такой фигурой, будет уменьшена в федеральной системе. Кроме того, предоставление государствам автономии для решения своих собственных проблем их собственными путями приведет к лучшим решениям для всего Герцланда, — продолжила Шмитц. — Чтобы дать нашим гражданам возможность выбирать свои собственные пути в будущее, я смиренно прошу вас ратифицировать эту поправку.\n\nСобравшиеся представители бурно аплодировали."
angriver.62.a:0 "Власть для государства, свобода для народа!"

angriver.63.t:0 "Мечта реализована"
angriver.63.d:0 "После падения Империи Грифонов их бывшие подданные объединились в амбициозный союз под названием Республика Герцланд. Это была попытка, порожденная смелым идеализмом, которая стала возможной только благодаря целеустремленной решимости Отто Вешлера, чье видение свободного Герцланда вдохновило бесчисленное количество других принять его путь. В то время опытные наблюдатели предсказывали, что различия между бывшими имперскими вассалами станут непримиримыми и приведут к распаду союза в течение полувека. Но Республика Герцланд выжила и стала сильнее, чем когда-либо, во многом благодаря преемнику Вешлера, Фионе Шмитц.\n\nУмело выражая высокие стремления к свободе и демократии она грамотно перенесла Герцланд через опасный период неопределенности после объединения с её непоколебимым лидерством. Шмитц признала ловушки, создаваемые унитарным государством, управляющим исторически разнообразным Герцландом, и умело подтолкнула Республику к федеративной системе, которая имела стабилизирующий эффект и оказалась популярной. Инвестиции в повышение эффективности производства окупились, и экономика Герцланда является одной из самых передовых в мире. Это сочетание свободы и процветания сделало население чрезвычайно патриотичным, и теперь герцландцы гордо хвастаются тем, что их страна — страна свободных.\n\nБудущее неясно, но несомненно то, что народ Герцланда смело встретится с ним, готовы сделать всё необходимое, чтобы защитить свои священные идеалы."
angriver.63.a:0 "За жизнь, свободу и счастье!"

angriver.64.t:0 "Из теней"
angriver.64.d:0 "Неожиданные вести поступили от наших военных. Один из их самых высокопоставленных офицеров был найден лежащим без сознания в своём кабинете. Офицер был тяжело ранен и его быстро доставили в ближайший госпиталь. Но пока неизвестно, удастся ли ему оправиться от этих ранений.\n\nНам неясно, что именно произошло. Офис был тщательно осмотрен, но не было обнаружено никаких улик или следов преступника. Похоже, что данный диверсант был очень опытен и знал, как быстро нанести удар и скрыться с места преступления. Мы мало что можем сделать, кроме как молиться о том, чтобы раненый офицер поправился. Но даже в этом случае его возвращение на службу в армии весьма маловероятно."
angriver.64.a:0 "Кто это сделал?!"

angriver.65.t:0 "Мир в наше время"
angriver.65.d:0 "Отмар сидел за своим столом в переоборудованном отеле в Грифенхейме. Теперь, когда он контролировал большую часть Центральных Земель, ему приходилось иметь дело с теми же проблемами, с которыми всегда приходилось бороться Имперской династии. Как он жалел своего старого друга Гровера V. Он никогда не мог себе представить, какой адской политикой Грифенхейма может быть, не находясь сейчас среди них.\n\nКто-то постучал в его дверь.\n— Сэр Отмар, они готовы встретиться с вами сейчас. — посланник позвал его.\nОтмар рассмеялся, конечно, они были готовы встретиться с ним, хотя и приходили к нему в кабинет, он всегда встречал их. Сделав ещё один вдох, он приготовился к тому, что должно было произойти. Поскольку он собирался встретить, вероятно, самый существенный единый барьер между ним и миром для Центральных Земель, а также самый большой столп, поддерживающий жизнь в пределах Имперских Земель.\n\nАрхонты.\n\nЭрос - влиятельный грифон, и один из самых влиятельных грифонов сегодня. Эрион примерно так же хорош для Империи, как питьевая вода из Катеринского болота полезна для здоровья грифонов. И Протеус... ну, он был в своей собственной лиге. Но Отмару пришлось уложить их всех и сразу решить их проблемы. Любое соглашение, заключенное только с одним, будет рассматриваться как "Извращение Власти Храма". Итак, вот они, четыре грифона в комнате, один захватчик, пытающийся убедить остальных работать с ним.\n\nОни сидели и разговаривали, пока луна не взошла и не вернулась за горизонт, но все они наконец пришли к соглашению. Хотя именно оно заставило Отмара уткнуться клювом в коготь, всё останется почти таким же, просто заменится старый порядок новым. Полномочия Архоната будут ограничены, но они могут продолжать в том же духе, что и раньше. Единственным реальным изменением было закулисное обещание Эроса, что Эрион не будет долгой проблемой. По крайней мере, за это Отмар может быть благодарен."
angriver.65.a:0 "Хвала Богам!"

angriver.66.t:0 "Королевское усыновление"
angriver.66.d:0 "Отмар стоял возле Имперского дворца в Грифенхейме. С тех пор как город был захвачен, небольшой отряд рыцарей и имперских гвардейцев удерживал центр дворцового комплекса, в котором осталось место империи. Отмар приказал прекратить нападения неделями ранее, и началась осада. Каждый день он отправлял просьбы договориться о капитуляции, но до сегодняшнего дня им всегда отказывали.\n\nОтмар начал переходить мост и встретил капитана охраны, старого пса по имени Бенито, которого Отмар встречал раньше. К настоящему времени Бенито выглядел как тень своего прежнего я, словно засохший от войны и голода. Он передал свое оружие Отмару и принял предложенную ему еду, уходя к самонадеянному позору. Он шёл по великолепным залам в определенном темпе, зная, где ему нужно оказаться. И когда он вошел в Имперский Тронный Зал, он взглянул на грифона, с которым ему нужно было поговорить; сам ребенок императора. Гровер VI. Гарнизон явно голодал, чтобы сохранить этого мальчика здоровым, но даже он проявлял признаки слабости. Они смотрели друг на друга минуту или две, пока Отмар не решил, что ему нужно нарушить тишину.\n\n— Дитя, я знаю, как ты должен смотреть на меня. Грифон ничем не отличается от любого другого жаждущего власти личности, который в течение многих лет окружал вас, пытаясь получить больше власти и влияния для себя. Но я могу показать вам, что я больше, чем это.\nМолодой Император просто смотрел, пока ещё одна минута молчания не прошла и не пришел ответ.\n— Вы попытались свергнуть меня с престола, вы отняли у меня моего регента и моих советников и отправили армии в мою столицу. Как я могу научиться? доверять тому, кто это делает? — решимость ребенка удивила Отмара, но у него был ответ, он схватил стул, усел его посреди зала и начал говорить — Гровер. Я здесь не для того, чтобы останавливаться на прошлом и не ищу для незаработанного прощения. Вместо этого я призываю вас смотреть в будущее, как ваш отец, прежде чем он был отнят у всех нас.\nЭто взволновало молодого мальчика, который наклонился, чтобы услышать, что сказал этот странный захватчик с юга.\n— Я знал твоего отца, когда мы были молоды, ещё до того, как меня привезли на родину. Он говорил о том, как он хотел создать Империю заново, чтобы доставить радость её гражданам, но проклятая революция разрушила этот шанс. И стервятники, его совет хотел остановить его амбиции ради собственной выгоды. Они вообще не заботились об Империи! У тебя тоже есть стервятники, дитя мое. Любой, у кого есть хорошие намерения, всегда делает...\n— А у вас нет?! — съязвил молодой император. Отмар хмыкнул, поднимая настроение в комнате.\n— Возможно, они у меня были давным-давно, у меня просто был здравый смысл положить конец их грязным сделкам, прежде чем они могли удержать меня в плену. — становясь мрачным, Отмар продолжил — Однажды я позволил этому сумасшедшему дому Империи сокрушить моего друга, и я не позволю этому случиться с его сыном. Мне нужно объяснить, что я не смог сделать в прошлом, с действиями, которые я предприму сейчас. Пожалуйста, иди со мной, и мы сможем сделать это правильно.\n\nГровер встал и последовал за ним. Всё это было сделано официально, в соответствии с придворными формальностями Отмар стал крестным отцом последнего императора грифонов. И регентом первого короля грифонов."
angriver.66.a:0 "Мёртвой империи пришёл конец."

angriver.67.t:0 "Новые друзья"
angriver.67.d:0 "Отмар сидел, потирая когтями виски и пытаясь понять, как он в это ввязался. Он созвал дворян бывших имперских территорий на большой банкет в Грифенхейм, чтобы составить новое соглашение об их привилегиях в его новой, более справедливой системе. И хотя он всё ещё намеревался сделать это, он никогда не мог постичь последствия того, что сделал.\n\nОн сидел во главе огромного стола, уставленного знатью королевства. А за десертом они устроили скандал. Все началось с того, что две семьи, которые спорили о правах на какую-то фабрику близ Кронбурга, начали пререкаться на пиру. Будучи тем, кем они были, дворяне начали формировать фракции даже из-за чего-то такого маленького.\n\nХотя, когда наконец почувствовалось, что терпение Отмара достигло предела. У него был план. У Отмара был талант превращать беспорядок в возможность, и он планировал сделать то же самое здесь. Он знал, что многие из этих дворян в зале были решительно против его планов демократизации Герцланда, и он точно знал, как заставить их хоть немного успокоиться.\n\nОтмар встал и постучал вилкой по своему бокалу, чтобы попросить тишины, спокойно он встал и объявил толпе — Дамы и господа, кажется, вы все потеряли из виду, почему мы здесь, вы хотите пререкаться из-за обладания одной фабрикой, когда сотрудничество может принести вам ещё много. И если бы вы только могли уделить мне немного больше вашего времени, мы могли бы все это упорядочить и обсудить, как будет функционировать эта новая демократия\n\nЭто сработало как обаяние. Дворяне были заинтригованы обещанием богатства, и поскольку Отмар формально их не подкупил, им пришлось хотя бы какое-то время сотрудничать, прежде чем они снова могли ополчиться на него. И кто знает? Некоторые из дворян могут быть искренними в своем интересе к демократии. Отмар мог только надеяться. Только надежда на этот лучший мир."
angriver.67.a:0 "Пусть прошлое уйдет."

angriver.68.t:0 "Удивительный поворот событий"
angriver.68.d:0 "Отмар ждал этого момента. Прошло столько времени, сколько он себя помнил, с тех пор, как в юности он видел, как первые дворяне пытали простогрифонов, когда он увидел, как регентский совет его старого друга Гровера взял дело в свои когти и поступил справедливо... испортить всё это. С тех самых пор, как он впервые подумал — Разве грифоны не выбрали бы лучших лидеров для этих грифонов? — Он далеко не республиканец, отнюдь нет. Он планировал возвысить бывшего ребенка-императора до нового положения власти в качестве Короля своему новому Герцланду и создать прочный мир. Но для того, чтобы наступил этот мир, его земля нуждалась в компетентных лидерах, которые продолжили бы свою деятельность после его смерти и в конечном итоге смерти самого Гровера. А для этого требовались выборы.\n\nЭто был его великий опус, его грандиозный момент окончательной победы, и он посылал послание в прямом эфире всей нации.\n\nОтмар вышел на балкон королевского дворца, и Гровер стоял рядом с ним, теперь достаточно взрослый, чтобы понять, что происходит. Он подошел к микрофону, установленному перед ним, и начал говорить...\n\n— Граждане Герцланда, я говорю вам сегодня из города Грифенхейма, когда-то столицы могущественной, но отсталой нации. И из-за этого недостатка он попал под власть стервятников, которые хотели разорвать его тушу ради собственной выгоды и извратить права народа, живших под его властью. Но сегодня вы все живёте под другой нацией, Герцландом. Земля, в которой все могут жить в мире под властью своего Короля. Но у нас всё ещё есть та же проблема, что и у Старой Империи, которую я давным-давно поклялся решить, и которая теперь должна осуществиться. Я указываю, как регент этой земли, с моим королем на моей стороне, что через шесть месяцев. Все в стране должны провести свободные и справедливые выборы, чтобы выбрать представителей, которые будут служить ему с усердием. Голосуйте хорошо граждане, ваш Король рассчитывает на вас.\n\nС этими словами Отмар вышел с балкона вместе с Гровером. Когда они вошли в коридор, молодой Король и старший регент обменялись улыбками. В тот момент у них было что-то общее.\n\n\nОни оба могли бы наконец примириться со своим прошлым."
angriver.68.a:0 "Народ будет услышан!"

angriver.69.t:0 "Герцланд и мир"
angriver.69.d:0 "В сегодняшнем радиосообщении на континенте Отмар Штойбер объявил всему грифоньему региону о внешней политике нового государства Герцланда. Он будет стремиться поддерживать баланс сил в мире и защищать права и свободы всех в Грифонии.\n\nЦитата Маршала-регента: "Мы должны стремиться стать арбитрами мира в этом мире, который одарен Бореем к нам. Если мы не справимся с этой задачей, то мы никогда не будем прощены.""
angriver.69.a:0 "Мы обеспечим мир!"

angriver.70.t:0 "Коронация"
angriver.70.d:0 "Сегодня был особенный день для Грифенхейма, ибо он принимал своего первого короля. Старая держава жаждала усадить Гровера на престол и короновать его шестым императором. Но нация, которую Гровер скоро возглавит, будет чем-то новым – Королевством Герцланд. Когда толпа, затаив дыхание, ждала начала речи, на трибуну вышел регент Отмар Штойбер.\n\n— Мои братья и сёстры. Сегодня великий момент для всего Герцланда и даже Грифонии, которая встречает новую нацию. Да, мы существовали на карте в течение длительного времени, но я всегда правил вместо истинного государя этих земель. Сегодня он будет коронован монархом этой страны, и я могу сказать, что далее вы услышите слова исключительно вашего короля. Я не составлял эту речь и поэтому так же взволнован, как и вы. Может быть, я наконец-то смогу наконец уйти на пенсию! — неожиданная шутка заставила толпу рассмеяться. Грифоны не привыкли к тому, что столь стойкий лидер может вести себя более расслаблено. — И теперь, граждане Герцланда, я представляю вам вашего лидера. Теперь я формально отрекаюсь от должности регента. И отхожу в сторону, дабы король занял своё место.\n\nОтмар попрощался и вернулся в здание за трибуной. Из той же двери явился сам Гровер. Народ уже привык видеть его, но не таким, каким он предстал перед ними сегодня. В этот день он появился не в роскошных королевских регалиях, а в простом парадном костюме с слегка причудливой вышивкой. Он был здесь сегодня не для того, чтобы властвовать над народом, а чтобы править для него. Аплодисменты гремели над толпой и затихли лишь после того, как король, подойдя к микрофону, жестом попросил тишины.\n— Мои грифоны, я не могу передать вам радость, которую я испытываю, когда стою с вами здесь сегодня. Я родился в дряхлеющей Империи, которая использовала насилие и войну в попытках покорить континент, только чтобы снова и снова терпеть неудачи, потому что она не служила народу. Моя первая и единственная цель, как вашего короля? Обеспечить, чтобы этого никогда не повторилось. Возможно, когда-то я был Гровером VI из императорской династии, но это в прошлом. Несколько минут назад я подписал документы об официальном отказе от притязаний на престол старой империи и любую землю, которой она когда-то владела. Теперь я ваш и только ваш король. Я всего лишь Гровер I-ый из Герцланда. Я надеюсь, что буду служить вам в меру своих возможностей. Чтобы сделать жизнь всех вас лучше и создать нацию, которая будет воспитывать своих граждан, как мать своих птенцов. Я знаю, что мой образ вызывает горькие воспоминания у некоторых. Но я молюсь, чтобы вы все могли преодолеть предубеждения и принять меня таким, каким я являюсь.\n\nГород молчал. Слёзы навернулись на глаза многих грифонов, когда они увидели, как птенец вырос и стал королём. И никто не чувствовал этого сильнее, чем Отмар, который уже начал плакать от радости на половине великой речи. Когда разразились аплодисменты, но никто в замке не уделял достаточного внимания Отмару, который вытащил старый медальон с изображением внутри. Когда Отмар заглянул внутрь, он увидел лицо молодого Гровера V. Не похожего на императора в его предсмертные годы. Отмар сунул медальон в одну лапу и положил другую на сердце. — Теперь ты можешь отдохнуть, мой друг..."
angriver.70.a:0 "Да здравствует король Гровер I!"

angriver.71.t:0 "Революция торжествует"
angriver.71.d:0 "Герхард Блюм сидел за своим столом, с каменным лицом и в глубоком созерцании. Время для празднования прошло, но остался трудный вопрос. После консолидации Сердца Империи некоторые члены партии выступали за аннексию Республики Кемерская на севере. Рейнхард Олбикинг был одним из таких грифонов, умеренным делегатом НРП. Ханс Герцог, влиятельная фигура в военном министерстве, не согласился. Оба грифона сели перед Блюмом, чтобы выступить с доводами.\n\n— У нас общая цель: Свобода, Демократия и Процветание. Эти принципы ведут нас обоих, — начал Олбикинг. — Кроме того, Кемерскай - живая легенда. Он даже более популярен, чем вы! — Олбикинг указал на Блюма, который нахмурился. — Будучи предтечей нашей Республики, мы вправе объединиться с ним в первых рядах.\n\n— Глупости! — вспыхнул Герцог. — Эта Республика была завоевана нашей кровью. Это была наша борьба. И вы говорите, что мы должны отдать её неудачнику, который ничего не добился? — Герцог ударил кулаком по столу. — Пока Кемерскай бездействовал, Блюм вел нас к победе! Мне кажется, что он должен был прийти к нам.\n\nБлюм поднял коготь, сигнализируя двум грифонам остановиться. Он закрыл глаза и глубоко вздохнул. Они оба наклонились вперед, не зная, что он скажет."
angriver.71.a:0 "Свобода, Демократия, Процветание!"
angriver.71.b:0 "Я построил это! А не те свиньи в Клаудбьюри!"

angriver.72.t:0 "Возвращение в Грифенхейм"
angriver.72.d:0 "Президент-Маршал Кемерскай вошел в Грифенхейм под восторженные аплодисменты. Легендарный герой Республиканской Революции наконец достиг окончательной победы, но у него был ещё один грифон, чтобы поблагодарить его за это: Герхард Блюм, лидер энгриверской НРП.\n\nБлюм, грифон, который провел большую часть своей жизни, трудясь в тени Кемерская, очевидно, не испытывал к нему обид, и оба уважительно трясли когтями, когда встретились. Затем Блюм и Кемерскай выступили с совместным заявлением, в котором изложили план передачи власти, и подчеркнули, что не должно быть разногласий или раздоров среди тех, кто верит в Три Принципа."
angriver.72.a:0 "Да здравствует Республика!"

angriver.73.t:0 "Предательство"
angriver.73.d:0 "Мы ожидали, что как только энгриверская НРП завершит объединение Герцланда, они объединятся с нами. Однако Блюм отказался это сделать. Более того, он осудил нас, подчеркнув, что во время недавней речи он лично напал на Кемерская, обвинив его в том, что он неудачник и трус, чьи десятилетия после марша на север были чередой болот. Эти замечания были широко освещены, и уже вызвали у нас сильные смущения дома.\n\nВозможно, Блюм позволил гордости омрачить его мнение. Отныне между нами не может быть компромисса! Ради Революции нам придется сокрушить его и его притворную Республику."
angriver.73.a:0 "Рано или поздно мы придем за этими ревизионистскими ублюдками!"

angriver.74.t:0 "Обещание Президента"
angriver.74.d:0 "Атмосфера помпезности наполнила Грифенхейм, когда солдаты маршировали, и трехцветные флаги развевались на ветру над каждой улицей. Грифоны, гудевшие от энергии и волнения, наполнили воздух: ожидание, что грифон, который привел их к триумфу над Империей, снова приведет их к славе.\n\nМассивная толпа собралась перед особняком Президента, стремясь услышать от Героя Революции торжественную речь. Президент Блюм был готов обратиться к ним в военной форме, медали блестели на ярком солнечном свете. Позади него стояла группа наиболее преданных делегатов НРП, а также Ганс Герцог, глава недавно сформированного Министерства Общественной Безопасности (MfÖS).\n\n— Мы многого достигли в нашей борьбе за свободу, — начал Блюм. — Центральные Земли объединены, мы победили! — Блюм протянул свои когти, когда толпа начала приветствовать. — Есть много чего отпраздновать, но многое ещё предстоит сделать. Наша миссия - это донести свет свободы до всех грифонов, но многие в других местах всё ещё живут во тьме. — нахмурился он.\n\n— В наших силах освободить каждого грифона на этом континенте, превратить Грифонию в сияющий маяк для всего мира. — Блюм сжал свой коготь в кулак. — Это наша судьба и мое обещание. Это обещание, что мы не успокоимся, пока каждый грифон не будет освобожден от цепей Старой Грифонии!\nСледующие несколько предложений Блюма не могли быть услышаны над ревущей толпой."
angriver.74.a:0 "Триколор будет развеваться над Грифонией!"

angriver.75.t:0 "Утечка"
angriver.75.d:0 "Мирное утро в Грифенхейме было разрушено, когда агенты MfÖS совершили налет на офисы Der Schrei des Herzens. Эта газета каким-то образом сумела получить полный текст готовящегося к исполнению Закона о Предоставлении Полномочий, и опубликовала подробности. Бумаги с утечкой уже были в обращении к тому времени, когда MfÖS был предупрежден. При подготовке, журналисты и другие сотрудники забаррикадировались внутри здания, заставляя агентов вызывать слесарей, чтобы получить доступ.\n\nПосле того, как осада затянулась, разъяренные грифоны, которые услышали новости о Законе, собрались возле офисов, чтобы перебить агентов. Кирпичи и камни наполнили воздух, когда их забрасывали агитаторы. Но довольно скоро здание было взломано, прессы отключены, а сотрудники газеты арестованы. К вечеру Герцог доложил президенту свой доклад об инциденте. Блюм молчал и постукивал клювом, хмурость была видна на его лице. Он был обеспокоен, явно обеспокоен тем, что знание о Законе ускользнуло до того, как они были готовы.\n\nГерцог поднял коготь, чтобы заверить Президента. — Мы полностью способны поддерживать порядок в городе. Помимо этого изолированного события, самое совершенное спокойствие продолжает царить во всех частях столицы."
angriver.75.a:0 "Уверен, из этого ничего не выйдет..."

angriver.76.t:0 "Протест"
angriver.76.d:0 "Слово Закона о Предоставлений Полномочий разнеслось по всему Грифенхейму как лесной пожар. Это были новости, которых многие давно боялись: переворот Блюма наконец был здесь. Организации, которые давно ушли в подполье, решили, что теперь это их последний, лучший шанс выйти на поверхность. Спонтанные демонстрации вспыхнули по всему городу; они скандировали "Долой Блюма!" и "Да здравствует революция!"\n\nБольшая акция протеста, состоящая из нескольких тысяч грифонов, собралась в особняке Президента и встретила отряд полиции. Толпа потребовала освободить заключенных журналистов и назначить новые выборы. Полиция призвала толпу немедленно разойтись, но к ним не прислушались. Переговоров не будет.\n\nВ ответ полиция начала насильственную разгон, но после большого толчка толпа отказалась сдвинуться с места. Многие были вооружены либо оружием, либо самодельным оружием ближнего боя. Полиция отступила и перестроилась на линии перестрелки. Напряженность достигла точки кипения, когда из толпы начали вылетать снаряды.\n\nГде-то раз раздался выстрел и кто-то крикнул..."
angriver.76.a:0 "Открыть огонь!"

angriver.77.t:0 "Неожиданный поворот событий"
angriver.77.d:0 "Когда дым рассеялся, дюжина демонстрантов замерла, а десятки были ранены. Толпа поспешно растворилась и отчаянно отступила от особняка вглубь сердца Грифенхейма. Тела погибших были выставлены на улицы, где они были провозглашены мучениками революции.\n\nЭтот инцидент привел в ярость дезорганизованные антиправительственные силы, которые быстро объединились под властью единого лидера. Саския Меклер была в Грифенхейме, когда начались беспорядки, и повстанцы уже доверяли ему, так как в течение многих лет он выступал за реформы. Когда повстанческие группы собрались, чтобы спланировать свой следующий шаг, Меклер поднялась, чтобы дать пламенный призыв.\n\n "Незаконные действия Блюма сделали его власть нелегитимной. Перед лицом этих действий послушание означает смерть революции и начало нового господства тирании! Сопротивление теперь является обязанностью всех свободных грифонов. Это мой призыв к городу и моим братьям и сестрам по всей Республике: сопротивляться! "\n\nМеклерское заявление было быстро распространено, и мотивированные волны грифонов присоединились к восстанию. Уже не было пути назад. Грифенхейм был в восстании."
angriver.77.a:0 "Это нехорошо..."

angriver.78.t:0 "Эскалация"
angriver.78.d:0 "Под покровом ночи повстанцы приступили к строительству баррикад. К рассвету улицы Грифенхейма превратились в растягивающийся лабиринт. Эти баррикады разрушили линии связи и усиление полиции, в результате чего многие подразделения оказались в изоляции и зажаты уличными боевыми действиями, которые распространились по всему городу.\n\nРезорганизованные демонстрации уступили место скоординированным набегам на оружейные магазины, охранные посты и правительственные здания, которые обеспечивали оружием и поставками, чтобы подпитывать растущее восстание. Повстанцы, казалось, черпали силы из всех типов грифонов: бедные студенты и рабочие взялись за оружие вместе с богатыми предпринимателями, объединёнными своей ненавистью к Блюму!\n\nСо своей базы в центре Грифенхейма они быстро разгромили рассеянные полицейские силы. Вскоре были разграблены целые арсеналы, и повстанцы контролировали значительную часть города. Когда Блюм выглянул из президентского особняка, он мог видеть лишь дым и слышать выстрелы."
angriver.78.a:0 "Такими темпами они скоро начнут производить гильотины."

angriver.79.t:0 "План Президента"
angriver.79.d:0 "События последних нескольких дней показали нам, что местные власти не в состоянии подавить этих нарушителей спокойствия. — говорил спокойно Герцог, несмотря на страшную оценку, которую он давал президенту. — Кажется, что общественные беспорядки намного шире, чем мы изначально полагали.\n\n— Беспорядки? Это полномасштабное восстание! — взорвался Блюм. Он шел клюв к клюву с Герцогом. — Восстание, которое вашей организации не удалось предотвратить!\nГерцог остался стойким, когда Блюм отвернулся, чтобы шагнуть. — Сейчас нам нужен сильный коготь, чтобы восстановить порядок. Призовите армию.\n\n— Да, сэр, — сказал Герцог без каких-либо колебаний.\n\n— Подавляющая сила - это единственный способ справиться с повстанцами. — Блюм надел саблю. — Я лично проведу колонну через центр города и уничтожу это восстание. Пусть будет известно, что никакая милость не будет оказана подрывным агентам или их сочувствующим."
angriver.79.a:0 "Это наверняка сработает!"

angriver.80.t:0 "Брешь в плане"
angriver.80.d:0 "Колонна Блюма прошла по улицам Грифенхейма, готовая подавить возникшее восстание. Но когда они переходили из района в район в ожидании ожесточенных боев, они вместо этого находили жуткую тишину. Улицы были мирными. Они не встретили признаков сопротивления, пока не наткнулись на большую площадь с фонтаном в центре, окруженную высокими зданиями.\n\nПосле того, как они вошли на площадь, повстанцы сошлись на зданиях, заняли позиции в окнах и открыл огонь. Солдаты изо всех сил пытались укрыться за всем, что могли, поскольку мятежники забаррикадировали улицы с площади. Они были в ловушке; сражение будет их единственным выходом.\n\nБлюм знал, что ему нужно сплотить свои войска. Он взлетел над ними и обнажил свою саблю, направив её на баррикаду, которая блокировала их наступление.\n— Вперёд, Маар их возьми! — крикнул он. — Вперёд!\nЕго клинок блестел на солнце только на мгновение, прежде чем он упал с неба. Кровь полилась на булыжники, на которые он приземлился. Герхард Блюм был застрелен.\n\nВ президентском особняке Герцог получил мрачные новости вместе с ещё более худшими новостями: массовое дезертирство распространилось по всем колоннам, посланным в город. Без Блюма и, возможно, даже с ним солдаты Республиканской Армии были более склонны сражаться вместе с гражданами Грифенхейма, чем против них. Рядом с Герцогом исполняющий обязанности президента Олбикинг был в ужасе.\n\n— Ч-что нам делать? — спросил Олбикинг."
angriver.80.a:0 "Забаррикадируйте ворота!"

angriver.81.t:0 "Грандиозный финал"
angriver.81.d:0 "В тёмном погребе под центром Грифенхейма, Меклер посмотрела на карту города. Всё шло хорошо, и осталось лишь несколько небольших анклавов правительственного сопротивления. К сожалению, одним из таких анклавов был сильно укрепленный президентский особняк; принять это было бы нелегкой задачей. Внезапно ворвался грифон.\n— Мэм, мы схватили президента Олбикинга за пределами особняка. Он пытался улизнуть, — сказал посланник.\n\nМеклер обнаружила, что Олбикинг закопченный и весь в грязи. Выглядело так, как будто он был вынужден ползти на животе во время попытки побега, но это не помешало ей приветствовать своего старого друга с улыбкой.\n\n— Рейнхард, ты выглядишь не так хорошо, как в последний раз я тебя видела, — сказала Меклер. — Кажется, я помню, как предупреждала вас, что придерживаться Блюма было бы ошибкой. — она сморщила клюв, частично из-за отвращения к его действиям и частично из-за его вони.\n\n— Саския, прости, ты была права! Вы должны верить мне, когда я говорю, что никогда не хотел, чтобы это случилось! — сказал Олбикинг. Он был в панике, и Меклер могла сказать, что он искренен.\n\n— Я знаю вас и верю вам, — спокойно сказала Меклер. — Вам ещё не поздно исправить это и остановить кровопролитие: приказать своим силам отступить. Настало время перемен, для правительства, которое ставит народ на первое место. И я думаю, что вы согласны.\n\nОлбикинг закрыл глаза, собрался с духом и кивнул."
angriver.81.a:0 "Диктатор мертв!"

angriver.82.t:0 "Три Истинных Принципа"
angriver.82.d:0 "Когда Меклер была готова выступить с первым публичным обращением к Грифенхейму, она посмотрела на приглушенную толпу и город, в котором были шрамы от недавнего восстания. Бои, хотя и были относительно короткими, но нанесли Грифенхейму огромный ущерб, который всё ещё находился в процессе ремонта.\n\n— Во-первых, я должна поблагодарить всех вас, — начала Меклер. — Именно храбрость и решительность народа положили конец тирании Блюма и сделали всё это возможным. — она прижала коготь к груди. — Это то, что мы должны сделать, чтобы предотвратить появление такого грифона, это соблюдение Трех Принципов. Блюм утверждал, что верит в эти принципы, но он потерял из виду того, для кого они: народа.\n\n— Нашим лидерам никогда не следует забывать, что их первая обязанность перед народом, — продолжила Меклер. — Истинная Свобода, чтобы народ мог действовать так, как он хочет. Истинная Демократия, чтобы народ мог выбирать своих лидеров. Истинное Процветание, чтобы народ мог полностью раскрыть свой потенциал. Эти принципы являются основой Республики! — Меклер взбудоражила аудиторию, и бурные аплодисменты быстро распространились по толпе."
angriver.82.a:0 "За Республику!"

angriver.83.t:0 "Суд над Герцогом"
angriver.83.d:0 "Ганс Герцог сидел в здании суда, хмурясь. После ликвидации MfÖS ему были предъявлены обвинения по многочисленным обвинениям, связанным с нарушением прав граждан Республики, и теперь он был вынужден предстать перед судом.\n\nОбвинение началось с язвительной атаки на MfÖS Герцога, это была беззаконная организация, которая действовала без учета гражданских прав любого гражданина. Незаконный надзор, произвольные обыски и аресты, а также бессрочные задержания без суда и следствия входили в их черный список обвинений.\n\nЗащита Герцога утверждала, что он лишь выполнял приказы своего начальника, президента Блюма, и поэтому не может быть привлечен к юридической ответственности. Обвинение представило документы, доказывающие, что Герцог лично возглавлял процесс жестокого подавления вингбардийских политических диссидентов после войны.\n\nВ конце концов Герцог был осужден по всем пунктам обвинения и получил смертную казнь."
angriver.83.a:0 "Справедливость восторжествовала!"

angriver.84.t:0 "Выборы"
angriver.84.d:0 "Проведение первых общенациональных выборов после первоначальной победы Блюма стало поводом для большого праздника, и кандидаты со всей Грифонии бросили свои шляпы на ринг на пост президента. Но только один может выйти победителем из этого списка лидеров со всей Грифонии.\n\nТеодор Верани, герой Аквелийской Революции, выступает от Социал-Либерального крыла НПП. Он планирует помочь маленьким грифонам, предложив бесплатное образование, а также перераспределив землю.\n\nСаскию Меклер из Социал-Демократического крыла НПП широко хвалили за её роль в свержении Блюма и восстановлении доверия к правительству. Она обещает отстаивать Три Истинных Принципа и защищать народ превыше всего.\n\nГенрих Кингфезер из бывшей Республики Грифонов выступил с амбициозным планом по созданию действительно свободного рыночного общества. Он и ПП посвятят себя поддержке бизнес-инициатив и защите свободы от тирании.\n\nФиона Шмитц из СЛП - протеже покойного Отто Вешлера, посвятила себя продвижению его программ по промышленной эффективности и городского обновления. Экономическое процветание и прогресс являются основой её программы.\n\nКогда все голоса подсчитаны, решающую победу одерживают..."
angriver.84.a:0 "Теодор Верани и Социал-либеральное крыло НПП!"
angriver.84.b:0 "Саския Меклер и Социал-демократическое крыло НПП!"
angriver.84.c:0 "Генрих Кингфезер и ПП!"
angriver.84.e:0 "Фиона Шмитц и СЛП!"

angriver.85.t:0 "Коронация"
angriver.85.d:0 "В солнечный день в Грифенхейме грифоны всего города оказались свидетелями коронации нового Императора. Настроение было немного тревожным, потому что это было невероятно важное событие. Это официально ознаменовало конец династии, которая привела Империю к славе и бесчисленным триумфам, уходящим в глубь веков, и началу чего-то, в чём многие ещё не были уверены.\n\nЛеер возглавлял процессию по улицам, за которой следовали дисциплинированные колонны Имперских войск. Несмотря на прелюбодеяние ликующих толп, он не обращал на них внимания, оставаясь прямо сосредоточенным на своем пути. Следуя извилистым путем, он в конце концов прибыл в Императорский дворец, где должна была состояться церемония коронации. Леер поднялся по ступеням дворца в окружении своих верных солдат. На вершине его поджидала судьба. В нарушение традиций Леер решил короновать себя сам, а не быть коронованным архонтом. Посмотрев на толпу, он положил Императорскую корону на голову. В одно мгновение вековая преемственность была разрушена, и родилась новая династия."
angriver.85.a:0 "Да здравствует Император Леер!"

angriver.86.t:0 "Со старым покончено"
angriver.86.d:0 "Неблагодарные, как всегда, члены аристократии с трудом скрывают свое презрение к императору Лееру. На государственных банкетах они улыбаются и трясут его когтем, делая вид, что принимают его, но их слова - не что иное, как неискренняя лесть. На самом деле они просто выжидают и замышляют его падение в тени. Мы знаем правду и знаем, что нужно сделать.\n\nДля обеспечения нашей позиции коррумпированное, декадентское и нелояльное благородство должно быть очищено. Где бы они ни прятались и какие бы оправдания они ни пытались придумать, они не спасут их от меча правосудия. Есть много грифонов, которые будут более чем готовы занять их место, и которые будут вечно благодарны Императору за его великодушие."
angriver.86.a:0 "Они мне все равно никогда не нравились."

angriver.87.t:0 "Имперский культ"
angriver.87.d:0 "Интересная идея начала распространяться среди населения Грифенхейма. В поисках объяснения поражений и унижений, нанесенных Империи во время правления поздней династии Гроверов, многие пришли к выводу, что моральные неудачи родословной заставили её потерять благосклонность Богов. Для этих грифонов привлекательность жестокого и воинствующего Императора Леера сильна, и они указывают на то, что он получил звание законного наследника благосклонности богов.\n\nЭкейтерус, местный священник Грифенхейма, не только соглашается с этой точкой зрения, но и делает ещё один шаг вперёд. Он решительно поддерживает положение о том, что Леер является представителем Империи перед богами, и что он является единственным воплощением славы Империи. Он также высоко оценивает моральное превосходство Леера, ссылаясь на резкие шаги, предпринятые им против коррумпированной старой знати, чья жадность и нечестие были известны среди жителей города.\n\nГрифоны из всех слоев общества оказались удивительно восприимчивыми к этому сообщению. Мы должны продвинуть Экейтеруса на более высокий авторитет, чтобы его слова достигли как можно большего числа грифонов. Все должны знать, что править — божественное предназначение Леера, и что его воля — воля Богов!"
angriver.87.a:0 "Слава Империи!"

angriver.88.t:0 "Бич Клаудбьюри"
angriver.88.d:0 "Во время республиканской революции 978 года Леер, тогдашний барон Энгривера, увидел, что его владения едва не были разрушены республиканцами и их неуправляемыми крестьянскими союзниками. Со временем он изгнал эту угрозу из Энгривера, но Клаудбьюри стал приютом для таких предателей: "Бандитское государство", как Леер назвал их. Это предательство не было забыто к тому времени, когда территория снова оказалась под имперским контролем.\n\nКогда силы Императора Леера вошли в Клаудбьюри, это стало сигналом к началу чистки, в результате которой болезнь республиканизма будет очищена из земли раз и навсегда. Ни один грифон не был в безопасности, и по всей бывшей республике имперские войска проливали кровь тех, кто обвинялся в сотрудничестве с режимом Республики. Жестокие массовые убийства и разрушение целых деревень были обычным явлением: наказание народа Клаудбьюри за укрытие врагов Империи."
angriver.88.a:0 "Это предатели!"

angriver.89.t:0 "Корона Гровера II"
angriver.89.d:0 "Когда император Леер вошел в Грифонстоун, он сразу же был очарован городом. Значение прародины расы грифонов не ускользнуло от него, и он не спеша любовался уникальной архитектурой Грифонстоуна и изучал всю историю, какую только мог. Его любовь к городу заставила приказать перенести столицу туда, но он пришёл не за этим.\n\nОн пришел, чтобы по праву завладеть древним артефактом - короной Гровера II. Леер восхищался Гровером II и почитал его как величайшего Воина-Императора, который когда-либо существовал, и считал себя наследником наследия старого Императора. Точно так же, как и Гровер II, он разгромил мятежных аквелийцев и вторгся в Нимбусию, чтобы сохранить Империю. Леер снова победит врагов Империи, но на этот раз, чтобы восстановить то, что было потеряно.\n\nКогда Леер впервые увидел корону во время церемонии, которую он не мог отрицать, что это был самый величественный предмет, который он когда-либо видел. Он смиренно опустился на колени, вопреки своему обычному поведению, и склонил голову перед коронацией. Собравшиеся грифоны молча стояли в благоговейном страхе перед ним, ибо все они ощущали силу Бога-Императора грифонов."
angriver.89.a:0 "Как и ты, великий, я заставлю мир дрожать!"

angriver.90.t:0 "Отменить привилегии"
angriver.90.d:0 "Наше освоение законной имперской территории Аквелии дает нам прекрасную возможность перестроить общество; мы воспользуемся этой возможностью, чтобы навсегда сломить власть дворян. Именно их жадность и некомпетентность позволили начать упадок Империи, и будь мы прокляты, если позволим этому случиться снова!\n\nАквелийская аристократия особенно дегенеративна, с долгой историей злоупотребления своими привилегиями и провоцирования беспорядков, и поэтому они увидят, что их привилегии ограничены. Все благородные налоговые льготы отныне отменены, и государственные учреждения больше не будут выставлены на продажу. Эти меры наверняка сделают нас популярными среди простых грифонов. Пусть будет известно, что отныне простогрифоны и дворяне равны перед законом!"
angriver.90.a:0 "Их алчность больше не будет угрожать империи."

angriver.91.t:0 "Уничтожение Карфина"
angriver.91.d:0 "Император Леер всегда испытывал в своем сердце особое презрение к "Ложному Королевству" к югу от Империи, и поэтому было неизбежно, что месть, которую его силы планировали нанести столице Вингбардии после её падения, будет жестокой. Жуткий мрак обрушился на Карфин, как только битва закончилась, и город успокоился, а население с ужасом ожидало, чтобы узнать свою судьбу. Как только Имперские войска закончили добычу всего подвижного богатства Карфина, по всему городу вспыхнули пожары.\n\nПри необычайно сухом сезоне огонь быстро разлетелся из нескольких источников и поглотил всё на своем пути. Он разрушен без ущерба для бедных трущоб, сжигающих столько же, сколько легендарные музеи и театры в Карфине. Огромные массы бежали от пожара в бешеной панике, и очень немногие выжили. В последствии, по оценкам, до девяти десятых общей площади города стало необитаемым. Древний центр славы и могущества в южной части Грифонии был разрушен до основания."
angriver.91.a:0 "Единственное, чего заслуживает Вингбардия."

angriver.92.t:0 "Дезертиры в армии!"
angriver.92.d:0 "Тревожные вести поступают из нашей армии. Похоже, что несколько военных подразделений и многие офицеры - большинство из которых имеют аристократическое происхождение - дезертировали и сменили сторону, вступив в ряды Священной Империи Грифонов. Похоже, что эти грифоны в тайне питали симпатии к имперскому правлению и вошли в контакт с иностранными агентами, которые и помогли им предать нас.\n\nК счастью, большинство наших солдат сохранили верность, а дезертиры составили лишь меньшинство. Но это лишь доказывает, что в конечном итоге никому нельзя доверять."
angriver.92.a:0 "Предатели понесут наказание!"

angriver.93.t:0 "Сын Маара"
angriver.93.d:0 "Рыцарь в чёрных доспехах открыл тяжёлую дверь, ведущую в сырое и тёмное подземелье. Внутрь вошла регент Гера. Её фонарь осветил маленькую комнату и явил миру окровавленного грифона, висящего на цепях. Его хриплое дыхание было слышно даже с большого расстояния.\n\nГера подошла ближе, глядя на сломленного старого грифона с чистым отвращением. — Каково это - наконец-то получить заслуженное наказание? Наказание, которого ты пытался избежать в течение стольких лет?\n— Я... хочу... увидеть... свою жену... — тихо пробормотал он.\n— Твоя жена мертва. Весь дом Кемерскай мёртв, Александр. И знаешь, почему? Ты знаешь, почему?!\nБывший президент-маршал ничего не сказал.\n— Потому что ты отнял у меня всё. Твои чудовища-республиканцы убили мою семью. Всех до единого. Так что это лишь божественное возмездие.\n— Я... даже не знаю... кто ты.\n— Из-за твоей революции погибли сотни тысяч грифонов. Конечно, ты не знаешь их всех.\n— Я не... приказывал убивать... ни единого грифона. — Кемерскай с трудом поднял голову и уставился прямо в глаза Геры. — Но скольких... ты убила... своими когтями?\nГера мгновение молча смотрела на него в ответ. — Столько, сколько было нужно. — Она вытащила зачарованный кинжал. Тот самый, которым она убила барона Энгривера. — А теперь их станет на одного больше."
angriver.93.a:0 "Республиканский кошмар закончился."

angriver.94.t:0 "Семейное воссоединение"
angriver.94.d:0 "Бывшая регент Священной Империи Грифонов вышла на поляну в лесу. Посреди луга стояли заросшие руины; заброшенные, но не забытые. Обгоревшие столбы были такими же чёрными, как и в 978 году, хотя сейчас их частично покрыли мох и листва.\n\nГера расправила крылья и, перелетев через разрушенную каменную кладку, приземлилась в центре руин. Там стояли многочисленные каменные мемориалы. Они выглядели опрятно, так что за ними явно ухаживали.\n— Я вернулась домой в последний раз. Отец, мать, все остальные, я завершила свою работу. Я отомстила тем, кто разрушил наши жизни, восстановила славу нашей любимой родины и вырастила императора как собственного сына. Империя Грифонов в надёжных когтях, и я надеюсь, что подобная трагедия больше никогда не повторится. Но теперь у меня больше нет цели.\nОна вытащила кинжал, тот самый, который оборвал жизни барона и президента-маршала, а также многих других грифонов. — Ты убил многих, но теперь тебе предстоит последняя задача. А потом ты сможешь отдыхать рядом со мной целую вечность.\nК её удивлению зачарованный клинок хихикнул. — Я всегда с радостью буду пить кровь виновных, как прежде пил кровь невинных.\n\nГера глубоко вздохнула, закрыла глаза и погрузила кинжал в собственное сердце."
angriver.94.a:0 "Mors vincit omnia." # Смерть побеждает всё

angriver_news.1.t:0 "Рождение Герцланда"
angriver_news.1.d:0 "[This.GetNewspaperHeader]После того как регент Империи Грифонов потребовал подчинения от её вассалов, желая аннексировать их напрямую, он столкнулся с открытым восстанием. Одним из его непокорных подданных стало баронство Энгривер, чьи храбрые солдаты теперь захватили контроль над имперской столицей. Регент сбежал, и энгриверцы объявили об образовании Герцланда, намереваясь объединить земли Сердца Империи, присоединив других бывших вассалов."
angriver_news.1.a:0 "Что это значит для Грифонии?"

angriver_news.2.t:0 "Рождение Интернационала"
angriver_news.2.d:0 "[This.GetNewspaperHeader]Вчера в Грифенхейме состоялась массовая международная встреча с участием социалистов, анархистов и коммунистов со всего мира. Вместе они основали новую организацию, известную как Международная ассоциация трудящихся, или просто Интернационал. Она будет стремиться объединить разрозненные идеи всех левых движений ради единой цели – революции и свержения капитализма."
angriver_news.2.a:0 "Интересно..."

angriver_news.3.t:0 "Возрождение Империи"
angriver_news.3.d:0 "[This.GetNewspaperHeader]После того как регент Империи Грифонов потребовал подчинения от её вассалов, желая аннексировать их напрямую, он столкнулся с открытым восстанием. Одним из его непокорных подданных стало баронство Энгривер, чьи храбрые солдаты теперь захватили контроль над имперской столицей. Регент сбежал, и теперь энгриверцы претендуют на все земли Империи."
angriver_news.3.a:0 "Энгривер превыше всего?"

