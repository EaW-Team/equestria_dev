### Country Leader Descriptions ###
best_boi_desc:0 "§YДата рождения§!: 15 ноября 958 года\n\n§YБиография§!: Отмар Штойбер – весьма своеобразный грифон во всех смыслах этого слова. Он родился среди высшей знати Энгривера, и в его биографии на первый взгляд ничто не объясняет, как он развил политические принципы, которые планирует реализовать в Энгривере и за его пределами. Он жил в роскоши со своими родителями в Грифенхейме среди самых декадентских представителей имперской знати. Но если присмотреться, то можно вполне увидеть причину, которая сподвигла Штойбера изменить свои взгляды. У Отмара был друг, о котором он старался заботиться всю жизнь и чьё наследие он планирует защищать. И этим другом был император Гровер V. С юных лет они были близки и играли вместе. И хоть болезненный Гровер вечно просил Отмара притормозить, тот не возражал, ведь они были лучшими друзьями. Даже когда Отмар начал посещать школу вдали от императорского наследника и перешёл в военную академию, они всегда поддерживали связь. А затем наступил 978 год. В возрасте двадцати лет Отмар оказался во главе значительной части имперской армии близ столицы, которая пыталась задержать республиканцев до прибытия подкрепления. Он сражался день и ночь ради спасения Империи своего друга. Но Штойбер не был ни суровым командиром, ни фанатиком. Он, как настоящий джентльгриф, хорошо обращался с пленными и даже обедал со многими из них. И тогда уже начала формироваться его личность. Потому что даже после разграбления Кроны Отмар продолжал относиться к своим противникам с уважением. В конце концов революция закончилась, и Отмар вернулся в Грифенхейм к своему другу. Никто точно не знает, что они сказали друг другу в тот день, но Отмар вышел из комнаты изменившимся грифоном. Он вернулся в Энгривер и занялся управлением своими семейными поместьями, массово реформируя их и работая на подающего надежды барона Лера. Хотя всем, кто его знал, было совершенно ясно, что он совсем не любит своего босса. Штойбер продолжал отправлять письма своему другу, но их встречи были нечастыми. Последняя встреча между ним и Гровером состоялась, когда император посетил Грифинг в начале 1007 года. Неизвестно, что там произошло, но в глазах Отмара снова вспыхнул огонь. После краха Империи, восстания республиканцев и её реставрации он ещё не принял титула, говоря, что время для этого вскоре придёт. Но он также отказался признать имперскую власть, заявляя, что «эти падальщики не имеют прав на это». Только самые близкие знают, что он имеет в виду. Отмар намерен исполнить последнее желание Гровера V. Пора осуществить реформу правительства и ещё раз спасти наследника империи. Отмар уже спас одного Гровера, так что спасёт и другого. \n\n§YАвтор портрета§!: Kessel"
the_mailman_desc:0 "§YДата рождения§!: 2 июня 927 года в Грифинге\n\n§YБиография§!: Отто Вешлер был сыном Конрада Вешлера, преуспевающего торговца в Грифинге. Несмотря на благополучие, семья Отто была изгнана из приличного общества в результате широко распространённого подозрения, что Конрад был вовлечён в торговлю на чёрном рынке – обвинение, которое Конрад и его семья всегда отрицали. Несмотря на это, молодой Отто отказался идти по пути своего отца и вместо этого продолжил карьеру на государственной службе. После окончания университета он начал работать почтальоном в почтовом отделении Грифинга, начав, как оказалось, долгую и выдающуюся карьеру.\n\nПосле того как он прошёл путь от почтальона до почтмейстера Грифинга, Отто был шокирован коррупцией и неумелым управлением. Сделав вывод о том, что кумовство было основной причиной проблемы, он решил положить ей конец. Но это была нелёгкая задача, и последовал долгий период борьбы, когда Отто постоянно мешали укоренившиеся и влиятельные семьи Грифинга.\n\nВ конце концов, после многих лет усилий Отто удалось превратить почтовое отделение Грифинга в эффективный, меритократический отдел. Его достижения не остались незамеченными: сам барон восхвалял работу, выполненную Отто, и повысил его до генерального почтмейстера всего Энгривера. Его прошлое управление почтовой службой является одной из немногих безоговорочных историй успеха Энгривера и принесло ему почти всеобщую популярность – популярность, позволившую проложить свой путь к переднему краю общественной жизни в качестве защитника либеральных принципов.\n\n§YАвтор портрета§!: Cofido"
lawyer_bird_desc:0 "§YДата рождения§!: 13 апреля 973 года в Грифинге\n\n§YБиография§!: Фиона Шмитц, родом из семьи богатых землевладельцев, выросла в особняке, старшей из шести детей. Её формальное образование началось в молодом возрасте, и в этом ей помогали уважаемые наставники со всей Империи. Прилежная студентка, Шмитц проявляла страстное любопытство во всех областях и вне учёбы часто читала книги из обширной библиотеки своей семьи.\n\nПосле окончания университета с отличием она начала работать судебным клерком, в конечном итоге став адвокатом со своей практикой. Благодаря семейным связям её клиентский список вскоре включал членов элитных семей Энгривера. В ходе юридической практики Шмитц сталкивалась с повсеместным распространением коррупции в правовой системе Энгривера и проявляла живой интерес к её пресечению.\n\nЭтот интерес заставил её вступить в контакт с Отто Вешлером, добросовестным управленцем государственной службы, который разделял её цель реформирования государственного аппарата. Шмитц была вдохновлена идеалами Вешлера и быстро стала его преданным протеже. Они оба полагали, что несправедливость и эксцессы Энгривера были результатом институциональных неудач, а не грифоньего характера, и что индивидуальные свободы в сочетании с политическим равенством были противоядием от произвола правительства.\n\nШмитц – верная сторонница добродетелей республиканизма; в отношении общества она делает акцент на секуляризме, свободном, но регулируемом рынке и защите гражданских свобод.\n\n§YАвтор портрета§!: Cofido"
hera_eichberg:0 "Гера Эйхберг"
hera_eichberg_desc:0 "§YДата рождения§!: 7 июля 972 года в Грифинге\n\n§YБиография§!: Почти ничего не известно о детстве Геры Эйхберг. Хотя она постоянно присутствует в светских кругах Энгривера, она приобрела репутацию скрытной особой и редко раскрывала подробности своей личной жизни. Её очевидная интровертность и странные манеры поведения привели многих наблюдателей в недоумение по поводу её первоначального взлёта к политической известности, но на данный момент никто не сомневается в её эффективности.\n\n§YАвтор портрета§!: Printik"
little_kemerskai:0 "Герхард Блюм"
little_kemerskai_desc:0 "§YДата рождения§!: 31 октября 946 года за пределами Герасхофена\n\n§YБиография§!: Герхард Блюм родился в маленьком городке в сельской местности Энгривера, в семье бедных фермеров. Его скромное воспитание никак не отразилось на амбициях, что привело его к вступлению в Имперскую армию в надежде обрести славу, но его надежды рухнули. Он оказался недоволен жёсткой и устаревшей военной доктриной Империи. Когда Кемерскай начал свою Республиканскую революцию в 978 году, Блюм был активным сторонником, полагая, что Империя нуждается в решительных реформах, чтобы процветать в меняющемся мире.\n\nПосле провала революции Блюм отказался следовать за своими собратьями-республиканцами в Долгом походе на север. Вместо этого он вернулся в Энгривер, чтобы сформировать сопротивление, начав то, что станет десятилетней борьбой за освобождение его родины. Обладая ограниченными ресурсами и разношёрстной силой, Блюм был постоянной занозой для баронства. Непоколебимая решимость и смелость – это черты, которые солдаты Блюма всегда приписывали ему в этот период.\n\nЭтот невысокий рост в сочетании с твёрдыми идеалами республиканцев принёс ему прозвище «Маленький Кемерскай». Ни один грифон не осмелился бы сказать это в его присутствии, так как он питает сильную неприязнь к Кемерскаю за то, что тот провалил Первую республиканскую революцию. По мнению Блюма, именно слабость и снисходительность Кемерская привели к контрреволюции. Блюм клянётся, что он пойдёт на всё, чтобы защитить Республику и поддержать Три Принципа. Учитывая длину резюме и внушительные достижения, он вовсе не выглядит маленьким грифоном.\n\n§YАвтор портрета§!: cadillacdynamite"
saskia_meckler_desc:0 "§YДата рождения§!: 16 октября 964 года в Грифенхейме\n\n§YБиография§!: Общительная и естественно харизматичная Саския Меклер родилась в семье среднего класса в центре Грифенхейма. С самого раннего возраста Меклер, страдавшая от нищеты в городе, увлеклась улучшением условий жизни бедных и обеспечением равенства. Время, проведённое в университете, показало, что её тянет к социалистическим идеологиям, хотя она уклоняется от более радикальных позиций некоторых из своих сверстников.\n\nПосле окончания учебы она переехала в Энгривер, чтобы отдалиться от глаз Империи. Её магнитная личность быстро приобрела репутацию респектабельного и приветливого философа и теоретика. Жёсткий критик Анархистского союза, она решила присоединиться к социал-демократам после падения баронства, в конце концов поднявшись до роли их лидера в хаосе после позора Геры Эйхберг.\n\nМеклер видит лучшее общество более заботливым, доверяющим друг другу и щедрым. Её риторический стиль основан на эгалитарных призывах, часто превознося достоинства эмпатии и смирения; она гордится тем, что видит лучшее в каждом грифоне, которого встречает.\n\n§YАвтор портрета§!: Cofido"
saskia_meckler_NRP_desc:0 "§YДата рождения§!: 16 октября 964 года в Грифенхейме\n\n§YБиография§!: Общительная и естественно харизматичная Саския Меклер родилась в семье среднего класса в центре Грифенхейма. С самого раннего возраста Меклер, страдавшая от нищеты в городе, увлеклась улучшением условий жизни бедных и обеспечением равенства. Время, проведённое в университете, показало, что её тянет к социалистическим идеологиям, хотя она уклоняется от более радикальных позиций некоторых из своих сверстников.\n\nПосле окончания учебы она переехала в Энгривер, чтобы отдалиться от глаз Империи. Её магнитная личность быстро приобрела репутацию респектабельного и приветливого философа и теоретика. Жёсткий критик Анархистского союза, она решила присоединиться к социал-демократам после падения баронства, в конце концов поднявшись до роли их лидера в хаосе после позора Геры Эйхберг.\n\nМеклер избежала преследования при диктатуре Блюма из-за сильной связи с умеренной фракцией в НРП. Эти связи позволили ей стать одним из самых выдающихся общественных сторонников либерализации в Республике – позицию, которую она эффективно использовала во время свержения Блюма. Она продолжает публично восхвалять «Истинные принципы» НРП и утверждает, что, хотя партия была испорчена влиянием Блюма, её первоначальная миссия была достойной.\n\nВидение Меклер лучшего общества – это то общество, которое соответствует принципам Истинной Свободы, Истинной Демократии и Истинного Процветания для народа, что позволяет создать свободную и справедливую Пангрифонью Республику.\n\n§YАвтор портрета§!: Cofido"
reinhard_olbeaking_desc:0 "Маловероятное повышение Рейнхарда Олбикинга до политической известности началось в условиях турбулентности после падения Энгриверского баронства. Малоизвестный журналист, работавший на газету «Грифинг», он был вдохновлен республиканской риторикой и начал писать колонки и брошюры в поддержку НРП, которые оказались чрезвычайно популярными. Эта известность привела к тому, что он был избран делегатом, представляющим Грифинг во вновь сформированном национальном законодательном органе.\n\nПосле того как Республика выросла, он стал лидером умеренной фракции НРП, иногда бодаясь с Блюмом по поводу роли правительства в гражданском обществе. В конце концов они примирились, и Блюм выбрал Олбикинга в качестве своего вице-президента, хотя эта должность была в основном церемониальной и имела небольшую фактическую власть. Олбикинг служил скорее подставным лицом, закрепляя маргинализованный статус умеренной фракции НРП.\n\nХодили слухи, что Олбикинг был недоволен и замешан в заговоре против Блюма, хотя немногие полагают, что он – тот грифон, который способен на подобную хитрость."
baron_leer_desc:0 "§YДата рождения§!: 5 мая 955 года в Грифинге\n\n§YБиография§!: Барон Леер когда-то был самодовольным правителем, но когда пламя революции охватило Грифонию и ожесточённо запылало в Энгривере, Леер был вынужден бороться за жизнь своего баронства. Его земли были быстро захвачены республиканско-анархистским альянсом с превосходящими силами. Повстанцы казались неудержимыми до тех пор, пока маршал Штойбер, близкий друг Леера, не смог сплотить свои силы и начать поддерживать барона. Их союз оказался плодотворным, и вместе они начали оттеснять Республиканскую армию. В бою Леер не давал пощады, демонстрируя шокирующую жестокость, которая проявлялась в кровожадном обращении с пленными. Хотя Штойбер счёл это поведение неприятным, у него было мало времени, чтобы остановить Леера; в короткие сроки они положили конец организованному сопротивлению в Энгривере. Кампания прошла успешно, но она положила начало постоянному расколу между Леером и Штойбером. После восстановления правления Гровера V Леер был вознагражден за свою службу, и Энгривер получил большую автономию в пределах Империи.\n\nКризис довёл барона до абсолютного предела; некоторые говорят, что он остался сломленным грифоном. Хотя он всегда обладал авторитарной личностью и склонностью к микроуправлению, в последние годы он становился всё более одержимым – якобы потому, что предвидит день, когда хаос и нестабильность вернутся в Грифонию с удвоенной силой, а чтобы выжить, он и его страна должны быть готовы.\n\n§YАвтор портрета§!: Scroup"
emperor_leer_desc:0 "Первое, на что обращаешь внимание при встрече с императором Леером, – это уверенность, с которой он себя несёт. Он – лидер без малейшего страха или неуверенности, и одно его присутствие, кажется, закаляет решимость грифонов, чья вера может колебаться. Это качество сослужило ему хорошую службу, когда он командовал своими армиями в битвах, из которых неизменно выходил победителем. Неудовлетворённый ролью яростного воина, Леер также обладает превосходной мудростью: он – блестящий и беспримерный стратег, формулирующий свои планы с почти сверхъестественным предвидением.\n\n«Наш император привык к решительным действиям; как барон Энгривера, он был свидетелем ущерба, нанесенного его земле безбожными революционерами, и принял единоличное командование силами лоялистов, сокрушая орды хаоса в молниеносной кампании. Этот опыт оставил его измененным грифоном, и он поклялся никогда не отдыхать, пока мир и процветание для его любимых подданных не будут гарантированы. Благочестивый грифон, нет сомнений в том, что его вознесение было волей богов».\n— Рудольф Рюмкер, придворный историк"
willie_scherler_desc:0 "§YДата рождения§!: 29 апреля 957 года в Ромау\n\n§YБиография§!: Вилли Шерлер когда-то был профессором социологии в университете Сайрусвала в Йеле. Увлеченный своей сферой деятельности и убежденный анархо-синдикалист, он был популярен среди своих учеников и стал известен тем, что давал живые и зажигательные лекции. По иронии судьбы для академика, он предпочел действия идеям и стал беспокойным на своем посту. Он пришел к тому, что стал обижаться на своих сверстников в университете за то, что они были революционерами лишь на словах, и горел желанием взять будущее в свои собственные когти.\n\nОднажды он ушел со своего поста и уехал в Энгривер, чтобы применить свои теории на практике. Заполнив вакуум в лидерстве, он быстро стал объединяющим пунктом для неорганизованных социалистических групп в Энгривере и со временем возглавил их. Именно под его лидерством Армия свободного государства была преобразована в обученную и грозную партизанскую армию.\n\nШерлер обладает сильной, но сострадательной личностью и является естественным лидером, внушающим преданность своим последователям. Он искренне верует в богов, хотя презирает жёсткую структуру и догму устоявшихся храмов, которые, по его мнению, искажают истинные послания богов ради собственной выгоды.\n\n§YАвтор портрета§!: Scroup"
ANG_kogchel_desc:0 "Гербен Когхель родился в семье банковского клерка в Де-Влёйгельсе, столице Фетизии. Несмотря на то, что его отец умер, когда он был птенцом, Гербен поначалу следовал его примеру, работая в местном банке. Изучая финансы, он быстро понял, что государство Фетизия может добиться большего успеха. Многие грифоны жили в бедности или неуверенности, едва избегая голода. Огорченный отсутствием защиты для каждого грифона, Когхель присоединился к Партии Труда, чтобы бороться за права рабочих. Его искренняя эмпатия и стремление сделать Фетизию лучше привели к тому, что он стал популярен на местном уровне и был избран первым мэром Де-Влёйгельса от ПТ, благодаря чему город улучшил заботу о самых бедных.\n\nЕго новообретённая популярность распространилась за пределы партийных линий, и поговаривали, что Когхель вел давнюю переписку с герцогом Фетизии. Когда Когхель вошёл в парламент после победы лейбористов на выборах, сопротивление его планам усилилось. И либерал-демократы, и герцогская партия противились его инициативам, а вероятность того, что НАФ пойдет на сотрудничество, была ещё меньше. Тем не менее Когхель продолжал трудиться, не затаив обиды на политических оппонентов и изо всех сил пытаясь изменить Фетизию к лучшему.\n\nУсилия социал-демократа, казалось, потерпели крах в хаосе после падения Империи, когда Фетизию захлестнули более насильственные и пессимистические силы. Однако, пока Когхель у руля, более умеренные грифоны никогда не теряют надежды на лучшее будущее. Портфель Когхеля, наполненный социальными реформами, сам по себе стал символом надежды, поскольку политик отказывался расставаться с ними при любых обстоятельствах, напоминая себе, за что он боролся. Теперь, после стольких смертей и разрушений, пришло время восстанавливать страну. Гербен Когхель надеется вдохнуть новую жизнь в Герцланд, внедрить рабочую демократию и исправить нестабильное общество региона. Тем не менее, некоторые опасаются, что идеалистический грифон оставит и без того потрепанный регион уязвимым в этот неопределенный век."
ANG_ERHARDT_DESC:0 "При описании Роланда Эрхардта первое слово, которое приходит на ум, – «радикальный». Де-факто лидер рабочего движения Ромау, Эрхардт произвел большое впечатление на город самыми разными способами. Он провел сотни забастовок, едва избежал десятков покушений со стороны Совета Ромау и даже сжег пару храмов в своем великом походе против архоната, Империи и тех, кто мог навредить рабочим Ромау.\n\nЭрхардт родился в 961 году в условиях, очень похожих на жизнь большинства ромауцев: в то время как Сенат расточительно тратил деньги и воевал между собой, он рос в относительной бедности. Положение его трущоб рядом с разросшимся храмом Эйр подпитывало его религиозную вражду, и когда священнослужители неизменно отвечали на все просьбы лишь призывами к милосердию, он начал полностью сомневаться в милости богов. Его мать и отец участвовали в рабочем движении, и Роланд вскоре присоединился к ним, вступив в профсоюз ремесленников в возрасте 16 лет. Он поднимался по профсоюзной лестнице от простого рабочего до организатора, и когда началась Республиканская революция, он присоединился к своим товарищам в масштабной всеобщей забастовке.\n\nХотя революция в Ромау и последующая общенациональная Республиканская революция потерпели неудачу, Эрхардт продолжал свою деятельность, в конце концов обойдя даже собственных родителей и став назначенным представителем своего союза в 997 году.\n\nЭрхардт множество раз ходатайствовал перед советом о правах, и когда ему отказывали, он организовывал забастовку за забастовкой, пока рабочие не добивались своего. Его юношеская враждебность к эйрианцам вылилась в жестокую антирелигиозную кампанию: Эрхардт вместе с тысячами других рабочих участвовал в поджогах храмов Ромау в знак протеста против коррумпированного архонта Эриона.\n\nТеперь Эрхардт председательствует в Конгрессе, обладая всей полнотой власти, необходимой для того, чтобы свести давние счёты с могущественными, коррумпированными и бесчестными грифонами, предавшими народ Герцланда."
hera_eichberg_desc_long:0 "§YДата рождения§!: 7 июля 972 года в Грифинге\n\nГера Эйхберг родилась в семье мелкого аристократа и наслаждалась безбедным детством в большом поместье на окраине Грифинга – административного центра баронства Энгривер, верного подданного Империи Грифонов. Но в шесть лет мир вокруг неё рухнул.\n\nРеспубликанские революционеры заполонили столицу, а барон Леер сплотил своих сторонников, дабы нанести ответный удар по предателям. Поместье Геры было сожжено дотла, а вся её семья была зверски убита анархистами и республиканцами. Чудом ей удалось выжить. Маленькая и покрытая шрамами грифина выползла из обугленных останков своего бывшего дома. Она тихо поклялась отомстить.\n\nПосле окончания революции она была удочерена другой знатной семьей – Эйхбергами, которые воспитали её как собственного птенца. Когда Гера выросла, она начала активно налаживать связи с влиятельными грифонами страны. Выражая в частном порядке крайне антиреспубликанские взгляды, она привлекла внимание зловещего «Чёрного Когтя». Это было именно то, чего она добивалась, и вскоре Гера вступила в их ряды. С годами она совершила невероятно стремительный взлёт не только в энгриверском обществе, но и внутри самого «Чёрного Когтя», возглавив организацию после того, как предыдущий лидер погиб в результате «несчастного случая». Проникнув в ряды республиканцев, она примкнула к социал-демократической НПЭ и благодаря шантажу, подкупу, манипуляциям и принуждению стала лидером партии. И вот наконец она возглавила сам Энгривер. Десятилетия планирования и подготовки принесли свои плоды, но её работа ещё не окончена. Далеко не окончена.\n\n§YАвтор портрета§!: Printik"

 ### General Descriptions ###
 meh_boi_general_desc:0 "§YДата рождения§!: 15 ноября 958 года\n\n§YБиография§!: Отмар Штойбер — весьма своеобразный грифон во всех смыслах этого слова. Он родился среди высшей знати Энгривера и жил в роскоши со своими родителями в Грифенхейме. Он лично знал Гровера V и дружил с ним с самого детства. Многие говорят, что именно встреча с императором после того, как Отмар сражался против республиканцев, изменила этого грифона. Однако Отмар всегда был и будет джентльгрифом.\n\nВ настоящее время Отмар поселился в Энгривере и занялся управлением своими семейными поместьями. Он реформирует их и продолжает общаться со своим другом по почте. Отмар не знает, какое будущее ждёт Империю и Энгривер, но страсть в его глазах не потухла, и он продолжает неустанно работать на благо Энгривера.\n\n§YАвтор портрета§!: Kessel"
little_kemerskai_short_desc:0 "§YДата рождения§!: 31 октября 946 года за пределами Герасхофена\n\n§YБиография§!: Герхард Блюм родился в маленьком городке в сельской местности Энгривера, в семье бедных фермеров. Его скромное воспитание никак не отразилось на амбициях, что привело его к вступлению в Имперскую армию в надежде обрести славу, но его надежды рухнули, и он оказался недоволен жёсткой и устаревшей военной доктриной Империи. Когда Кемерскай начал свою Республиканскую революцию в 978 году, Блюм был активным сторонником, полагая, что Империя нуждается в решительных реформах, чтобы процветать в меняющемся мире.\n\nПосле того как революция потерпела неудачу, Блюм отказался следовать за своими собратьями-республиканцами в Долгом марше на Север. Вместо этого он вернулся в Энгривер, чтобы сформировать сопротивление, начав то, что станет десятилетней борьбой за освобождение своей родины. С ограниченными ресурсами и разношёрстной силой Блюм был постоянной занозой для баронства. Непоколебимая решимость и мужество — это черты, которые солдаты Блюма всегда приписывали ему в этот период.\n\n§YАвтор портрета§!: cadillacdynamite"
baron_leer_short_desc:0 "§YДата рождения§!: 5 мая 955 года в Грифинге\n\n§YБиография§!: Барон Леер когда-то был самодовольным правителем, но когда пламя революции охватило Грифонию, оно ожесточённо запылало в Энгривере, вынудив Леера бороться за свою жизнь. Его земли были быстро захвачены республиканско-анархистским союзом значительной силы. Повстанцы казались неудержимыми до тех пор, пока маршал Штойбер — близкий друг Леера — не смог сплотить свои силы и начать поддерживать барона. Их партнёрство оказалось плодотворным, и вместе они начали оттеснять Республиканскую армию. Леер не проявил пощады в бою и продемонстрировал шокирующую жестокость, которая проявилась в кровожадном обращении с пленными. Хотя Штойбер счёл это поведение неприятным, у него не было много времени, чтобы останавливаться на этом; в короткие сроки они положили конец организованному сопротивлению в Энгривере. Кампания прошла успешно, но она положила начало постоянному расколу между Леером и Штойбером. После восстановления правления Гровера V Леер был вознаграждён за свою службу, а Энгривер получил большую автономию в пределах Империи.\n\n§YАвтор портрета§!: Scroup"
marc_kippenberger_desc:0 "§YДата рождения§!: 16 апреля 972 года около Дирхофена\n\n§YБиография§!: Марк Киппенбергер родился в бедной крестьянской семье в Энгривере. Несмотря на суровые условия, у него было хорошее детство благодаря усилиям любящих его родителей. Однако это сказалось на его отце, которому приходилось работать долгими часами. В результате этого по мере взросления Марк стал свидетелем того, как здоровье его отца заметно ухудшилось. Видя аналогичную ситуацию, происходящую с остальными жителями деревни, Марк покинул родной дом, чтобы изучать медицину.\n\nВо время своих поездок по всему Энгриверу он понял, что плохие условия не уникальны для его деревни и распространены по всей остальной части страны. Он был свидетелем бедности и голода везде, куда бы ни пошёл, и был потрясен этими ужасными условиями. Он понимал, что как бы ни старался, тысячи грифонов не получат лечения. Эти события заставили Марка оставить медицинскую карьеру и выйти на политическую сцену. Тем не менее он понимал, что политические перемены невозможны, пока у власти находится барон Леер, и единственным способом решения этих проблем является революция. С тех пор он вступил в армию Энгривера, сделал там карьеру и наладил связь с несколькими республиканскими ячейками.\n\nУ него есть контакты в Национальной Республиканской Партии, и он поддерживает их мечту о Пангрифоньей Республике. Когда придёт время, он с радостью поможет республиканцам свергнуть барона и будет бороться за их дело.\n\n§YАвтор портрета§!: Axidant"
steelwing_hollowtooth_desc:0 "§YДата рождения§!: 21 сентября 979 года\n\n§YБиография§!: Стилвинг Холлоутус родился в энгриверской семье из рабочего класса. Его родственники на протяжении многих поколений служили в армии и занимались развитием промышленности. Стилвинг начал работать бригадиром в семейном бизнесе по производству стали. Навыки, которые он получил во время работы, сделали Стилвинга главным кандидатом на службу в армии, через которую должны были проходить все Холлоутусы согласно семейной традиции. Стилвинг поступил в офицерскую академию и смог найти себе хорошее место в сфере административного и материально-технического управления благодаря своим навыкам бригадира и знаниям в области торговли. Он стал ключевым звеном в логистической цепочке армии.\n\nЧерез некоторое время Стилвингу пришлось непосредственно возглавить войска на фронте из-за нехватки полевых офицеров. Стилвинг, подобно своим предкам, желает верно служить в армии Энгривера. Он попал под влияние маршала Штойбера и разделяет его цели и планы в отношении будущего страны. Стилвинг с радостью готов сделать всё возможное, чтобы Энгривер мог увидеть светлое завтра.\n\n§YАвтор портрета§!: Niezow"
 
