 #Easter egg bios
 ZZZ_discord_desc_1:0 "§YДата рождения:§! В незапамятные времена\n\n§YБиография:§! — О, это было бы слишком скучно! Честно говоря, вы без проблем можете себе представить многие абзацы бредней обо мне любимом без единого упоминания шоколадного дождя или того, кто завязывает ваши провода в узлы, стоит только закрыть ящик стола?\n\nДайте знать, когда найдёте ответ, потому что я и сам всё ещё пытаюсь это выяснить.\n\nПолагаю, мне стоит сказать о себе хотя бы ЧТО-ТО. В конце концов, именно ради этого меня сюда и добавили. *Кхм*\n\nВидели бы вы сейчас своё лицо! Игра обращается к ВАМ, §0всемогущему ИГРОКУ?!§! Бесценное зрелище! Впрочем, чего ещё вы ожидали от скромняшки Дискорда? Лорда Хаоса, Духа Раздора, Повелителя... Дисгармонии и, э-э, как вообще Солнцезадая придумывает все эти титулы? Может, в этом и кроется секрет того, как она столь долго защищала Эквестрию? Пока герольд их зачитывал, все успевали попросту уснуть.\n\nКак бы то ни было, вы наверняка думаете: «Дискорд, что такой красавец вроде забыл в этом унылом месте?» О, я так рад, что вы спросили! Я бы с радостью назвал это своим изгнанием за то, что наконец-то подменил шампунь Лунозадой на майонез и суперклей, но увы. Всё куда прозаичнее. Я – пасхалка. Агась! И меня просто ОСТАВИЛИ тут ждать, пока кто-нибудь из глубокоуважаемых игроков меня не найдёт! Уф, что за наглость! И всё потому, что они не могут придумать, как вписать тот двадцатисемитомный фанфик по Флаттеркорду в переработку Эквестрии. Какая жалость.\n\nМне хотелось бы рассказать о себе побольше, но я ограничен рамками: если этот текст вылезет за пределы экрана, разработчики оторвут голову. Ну, точно не мою, но тому, кто переводит этот текст, точно не поздоровится.\n\nНу да ладно, вернусь-ка я к работе над правой бровью Твайлайт для её скульптуры из картофельного пюре. Мой шедевр скоро будет готов!\n\nЧао-какао!"
 ZZZ_discord_desc_2:0 "§YДата рождения:§! До тепловой смерти Вселенной и после того, как Лорен Фауст приснился её бред про «Что, если бы Кью был в My Little Pony?»\n\n§YБиография:§! Ну и ну, кого это к нам занесло? Любопытный любитель покраса карт заметил крошечную точку и решил проверить, что тут? А разве ты не слышал, как любопытство сгубило кошку? Предлагаю тебе проваливать, пока я занят подготовкой отличного хаоса, включающего чейнджлингов и изжогу...\n\nТы всё ещё здесь? Замечательно! Я ни с кем не общался целую вечность! Ну, как минимум две секунды, с тех самых пор, как меня сюда забросили эти §RНЕБЛАГОДАРНЫЕ§!.. То есть §PЗАБОТЛИВЫЕ разработчики Equestria at War.§! После того как они годами дразнили меня в одной из тех цитат на экране загрузки, меньшее, что им стоило сделать – сделать меня стартовым лидером Эквестрии. Это же не так сложно, просто переписать капельку лора, и все пони смогут кататься по мыльным дорогам и обедать вкусными тарелками, что подаются на подносах из тортов. Это куда веселее, чем та скучная, СЕРЬЁЗНАЯ штука про войну, в которую ввязалась Эквестрия. Буэ!\n\nЯ бы лучше посмотрел, очистили ли те мухоловки-венерины, которых я сделал на прошлой неделе, моё старое жилище в Хаосвилле от наплыва растений. Я не был дома так давно...\n\nКак бы то ни было, да-да, это я, Дискорд, во плоти... то есть в виртуальной плоти. Вряд ли мне нужно представляться. Немного хаоса здесь, щепотка паники там – и вот ты уже самая печально известная фигура в истории Эквестрии. Не то чтобы я жаловался. Просто было бы славно, если бы обезьяны за клавиатурами, кодящие эту штуку, добавили меня в Эквестрию. Но нет, это ведь слишком сложно. Им обязательно нужно сделать из меня §tПАСХАЛКУ§! для той малюсенькой территории, которая управляет вещами вроде вечной ночи.\n\nБраво. Поистине шедеврально.\n\nИ я абсолютно серьёзен насчёт пасхалки. Мой юрисконсульт обязал меня заявить, что я... *кхм*... §6НЕКАНОНИЧЕН.§!\n\nИ раз уж с этим покончено, позвольте мне... Погодите, моё время уже вышло? Серьёзно?! Я же даже не рассказал им про мой пятидесятисемитомный фанфик про шиппинг меня с самим собой и..."
 ZZZ_discord_desc_3:0 "§YДата рождения:§! Да\n\n§YБиография:§! Уф, полагаю, сперва нам стоит уладить формальности, верно? Привет, я Дискорд, Лорд Хаоса, Дух Раздора, Повелитель Дисгармонии, Король Хрустящих Пальцев, Маэстро Расстроенных Инструментов, Прародитель Навязчивого Чувства, Будто Ты Забыл Что-То Важное, Су-Шеф Спама, Режиссёр Безвкусных Гардеробов, Пастух Потерянных Ножниц, Чемпион По Запутыванию Наушников, Император... Думаю, суть ты понял.\n\nО, а ещё по контракту я обязан упомянуть, что всё это НЕКАНОНИЧНО и я ни на что не влияю за пределами этой маленькой пасхалки, дабы мне не пришлось выслушивать очередной цикл лекций о цикле размножения каждого вида грибов в Эквестрии от §0Твайли§!.\n\nКлянусь, если я здесь из-за того, что наклеил записку «Пни меня» на Рэйнбоу Дэш... Это абсолютно того стоило!\n\nЕсли ты хочешь узнать хотя бы ничтожную часть моей предыстории, мне стоит начать с самого истока. Когда я родился в Континууме Кью... стоп, не та франшиза. Хм-м-м, о чём же мне рассказать? §PЛорен§! не дала мне особой предыстории, кроме как «будь хаотичным».\n\nЧто ж, пожалуй, напишу-ка я оду кабачкам: видите ли, они весьма полезны. Их можно пожарить, отдать нелюбимым друзьям, использовать как упор для двери, как... Нет, нет, это кажется неправильным, хоть это и от того же правообладателя...\n\nХм, тогда о чём вообще такой любопытный геймер, как ты, хочет услышать от меня любимого? Наверняка моя репутация опережает меня. Шоколадный дождь? Облака из сахарной ваты? Гигантские кролени, которые бегают вокруг и устраивают давку просто ради веселья? Ничего не припоминаешь? Нет? Ты вообще смотрел мультик?\n\n§R«Слишком девчачий?!»§! Но ты ведь сидишь перед экраном и смотришь, как милые пони и грифины рвут друг друга на части... о нет, теперь-то я знаю, зачем ты скачал этот мод. Что ж, не мне отговаривать того, кто тоже любит хаос. В таком случае, непременно продолжай, о великий правитель хаотичных намерений. А я просто возьму попкорн и посмотрю.\n\nВряд ли они позволят мне делать что-то ещё..."

