KLG_iwie_meowlin: "Айви Мяолин"
KLG_iwie_meowlin_trait: "Глава Забастовочного Комитета"
KLG_iwie_meowlin_desc: "§LПолитический радикализм этого кота не вызывает сомнения ни у кого. Однако в отличии от многих других радикалов — он действительно ценит политическую демократию и готов сотрудничать с нашим Правительством на выгодных для нас обоих условиях. Под его лаповодством рабочее движение остается значительным фактором внутренней политики и создает сильный противовес власти крупного бизнеса. Айви был готов согласится на такую систему и отказаться от идеи превратить Клуджтаун в социалистическое государство ради выгоды для рабочего класса — и как минимум за это ему нужно сказать большое спасибо.§!"
KLG_shadow_softpaws: "Шедоу Софтпаулс"
KLG_shadow_softpaws_trait: "Неуловимая тень"
KLG_shadow_softpaws_01_trait: "Неуловимая тень"
KLG_shadow_softpaws_desc: "§LВ свое время Шедоу считалась одной из самых ловких карманниц во всей Пантере. С приходом Короля Шторма она была вынуждена перебраться в Клуджтаун и стать одной из многочисленных шестерок для Верко. Но затем она услышала призыв своего старого друга Каппера восстать против тирана и откликнулась на него. Вместе они смогли освободить город от власти Мафии и сделать его жителей свободными. Шедоу до сих пор остается самой быстрой и ловкой кошкой во всей Западной Зебрике и при желании она способна проникнуть буквально куда угодно.§!"
KLG_chummer_tailspring: "Чаммер Тейлспринг"
KLG_chummer_tailspring_trait: "Преданный соратник"
KLG_chummer_tailspring_army_chief_trait: "Вдохновляющий командир"
KLG_chummer_tailspring_desc: "§LМного лет Каппер и Чаммер были друзьями не разлей вода. Однако все изменилось когда в лапы к двум мелким воришкам попал легендарный Малахит Несчастья из королевской сокровищницы Абиссинии. Чаммер оказался одурманен темной магией этого артефакта и попытался отобрать его у друга и сбежать на угнанном воздушном корабле. Однако обладание Малахитом едва не стоило ему жизни. Только чудом ему удалось пережить крушение и следующие несколько лет он провел на нижних уровнях где его приютила бедная рабочая семья алмазных псов. Это событие стало для него уроком на всю жизнь и теперь он останется верным своим друзьям чего бы с ним не случилось.§!"
KLG_admiral_fluffington: "Адмирал Флаффингтон"
KLG_admiral_fluffington_trait: "Деятельный организатор"
KLG_admiral_fluffington_theorist_trait: "Сторонник крупномасштабного планирования"
KLG_admiral_fluffington_high_command_trait: "Стратегический гений"
KLG_admiral_fluffington_desc: "§L"У этого кота всегда есть план". Именно так обычно говорят об Адмирале Флаффингтоне его друзья. Имя не должно вводить вас в заблуждение — на самом деле Адмирал никогда ничем не командовал и взял себе такое прозвище просто потому что оно привлекало внимание к его персоне. Однако аристократических манер этому коту было не занимать. Именно от него в команде Каппера всегда исходили самые здравые идеи и все его планы обычно проходили без сучка и задоринки — если конечно все выполнялось в точности. Каппер не просто так ввел его в свое правительство — этот весьма опытный в таких вещах педант как никто другой способен держать в лапах экономику целого города.§!"
KLG_molly_astra: "Молли Астра"
KLG_molly_astra_trait: "Маленькая шалунья"
KLG_molly_astra_theorist_trait: "Сторонница превосходства огневой мощи"
KLG_molly_astra_high_command_trait: "Грозная разрушительница"
KLG_molly_astra_desc: "§LМаленький рост и миловидная внешность Молли позволяет легко перепутать ее с котенком. Однако на самом деле эта карликовая кошка — один из самых опытных подрывников во всем городе. Ее умению обращения с взрывчаткой завидовали даже знаменитые грабители и сам Верко неоднократно нанимал ее в качестве медвежатника за весьма немалые деньги. Однако теперь малышка Молли готова направить свой талант в более мирное русло и позволить ему сделать жизнь в городе немного веселее. Хотя ее любовь ко всему что взрывается никуда не делась и при желании она способна обратить в горящие руины все что угодно ради безопасности ее друзей.§!"
KLG_big_maxis: "Большой Максис"
KLG_big_maxis_trait: "Здоровяк с золотым сердцем"
KLG_big_maxis_high_command_trait: "Гора мускулов"
KLG_big_maxis_desc: "§LЭтот милый здоровяк может показаться довольно грозным — но только если вы не знакомы с ним лично. В повседневной жизни Макс обычно довольно молчалив — потому что по своей душевной простоте он не способен врать или говорить обидные вещи. Каппер всегда ценил Макса за его доброту и честность и при этом был благодарен ему за спасение из множество передряг. Но каким бы хрупким и ранимым внутри он не был — вам определенно не стоит угрожать его друзьям. Потому что если вы это сделаете — то вам придется столкнуться с невероятной силой огромного кота размером в медведя и в несколько раз сильнее самого сильного быка.§!"

