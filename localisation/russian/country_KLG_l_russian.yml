KLG_gather_everyone: "Собрать всех"
KLG_gather_everyone_desc: "Господин Верко высоко ценит преданность своих младших партнеров. Ни один из них не готов поставить под сомнение его авторитет. Однако падение Короля Шторма не входило в его планы и возможные последствия этого во многом выгодного для города события могут оказаться непредсказуемыми."
KLG_dirt_under_our_paws: "Грязь под нашими лапами"
KLG_dirt_under_our_paws_desc: "Все эти жалкие попытки сопротивления власти Семьи — не более чем бессмысленное копошение насекомых. Мы не можем позволить себе показывать слабость — приближенные Верко требуют от него решительных мер и он понимает — настало время обрушить всю свою силу на оставшихся в городе врагов."
KLG_organize_fires: "Организовать пожары"
KLG_organize_fires_desc: "Большая часть нижнего города состоит из трущоб и главным строительным материалом для них является сухое дерево. И если в одном из этих районов "случайно" произойдет возгорание — ни у кого не будет повода обвинить в этом нас. И даже если кто-нибудь погибнет — причем здесь мы?"
KLG_arm_radicals: "Вооружить радикалов"
KLG_arm_radicals_desc: "Если говорить откровенно, Клуджтаун — это самый большой в мире притон для изгоев и преступников всех мастей. И некоторые из них питают особую нелюбовь к рабочему движению. И если мы предоставим их группировкам оружие и боеприпасы — они будут рады выполнить всю грязную работу за нас."
KLG_get_rid_of_witnesses: "Избавиться от свидетелей"
KLG_get_rid_of_witnesses_desc: "Факт нашего участия в недавних событиях с лидерами бунтовщиков уже известен всему городу. И это было бы просто прекрасно — но некоторые не слишком умные граждане имеют наглость открыто говорить об этом и провоцировать новые бунты. И это было довольно глупо с их стороны. Очень глупо."
KLG_accuse_socialists: "Обвинить социалистов"
KLG_accuse_socialists_desc: "Кто вообще сказал, что это мы виновны в гибели нескольких десятков лавочников? Вы вообще видели этих левых радикалов? Их ненависть к капитализму в любой форме определенно толкнула бы их на убийство мирных торговцев и мы готовы поручиться, что все эти преступления совершили именно они."
KLG_subjugation_through_torture: "Подчинение через пытки"
KLG_subjugation_through_torture_desc: "Хотя обычно в вопросах ведения "бизнеса" применение пыток считается слишком грубым и недостойным занятиям — необходимо предоставить нашим коллегам полную свободу в отношении подобных мер. Только так мы сможем эффективно "убеждать" некоторых особо непонятливых сотрудничать с нами."
KLG_crush_the_resistance: "Сокрушить сопротивление"
KLG_crush_the_resistance_desc: "Эта битва практически окончилась нашей победой. Почти все активные участники сопротивления были убиты и осталось только разгромить оставшиеся подпольные ячейки. К счастью — благодаря полученной от пленников информации мы точно знаем их расположение и готовы немедленно нанести удар."
KLG_deal_with_hostages: "Расправиться с заложниками"
KLG_deal_with_hostages_desc: "Сотни захваченных в плен социалистов все еще находятся у нас в руках и смиренно ожидают своей судьбы. Воля большинства из них была полностью сломана — однако Господин Верко все равно не может позволить им разгуливать на свободе. Они должны умереть и навсегда исчезнуть из истории города."
KLG_surgical_delicacy: "Хирургическая деликатность"
KLG_surgical_delicacy_desc: "Господин Верко весьма искушен в политике и опыт подсказывает ему единственно верную стратегию борьбы с поднимающими голову бунтовщиками. Не следует рубить сгоряча и провоцировать их на еще большие глупости — для победы необходимо грамотно заманить их в ловушку собственной слабости."
KLG_introduce_your_agents: "Внедрить своих агентов"
KLG_introduce_your_agents_desc: "В нынешней ситуации Каппер со своими демократами готов принимать в свое движение кого угодно — в том числе и довольно сомнительных персонажей. Сказывается его неопытность в политике и она же его и погубит — под видом ярых противников режима мы внедрим в его партию своих агентов."
KLG_find_and_buy_accomplices: "Найти и купить соучастников"
KLG_find_and_buy_accomplices_desc: "Далеко не все бунтовщики являются идейными сторонниками Каппера. Некоторые просто видят в этом возможность побольше заработать и если наши агенты выйдут с ними на связь — они определенно смогут уговорить их изменить сторону и предложить гораздо более выгодные условия сотрудничества."
KLG_compile_lists: "Составить списки"
KLG_compile_lists_desc: "С каждым днем все больше видных противников нашей власти раскрывает себя. Их имена становятся достоянием широкой общественности и что не менее важно — попадают в наши черные списки. А если ты оказался в черном списке у мафии Клуджтауна — рано или поздно возмездие настигнет тебя."
KLG_sow_discord_in_the_coalition: "Внести разлад в коалицию"
KLG_sow_discord_in_the_coalition_desc: "Среди протестующих никогда не было единого мнения по поводу будущего города. В то время как одни видят его демократической утопией свободного рынка — другие мечтают о построении социалистического государства. Стоит только немного поработать — и они перегрызут друг другу глотки."
KLG_intimidate_shopkeepers: "Запугать лавочников"
KLG_intimidate_shopkeepers_desc: "Торговля занимает важную часть экономики нашего города и именно мелкие лавочники в основном поддерживают Каппера. Однако этот кот забывает об одной особенности своего электората — у любого лавочника пропадает всякое желание протестовать при первой же угрозе существованию его бизнеса."
KLG_remove_the_tumor: "Удалить опухоль"
KLG_remove_the_tumor_desc: "Теперь — когда имена всех видных лидеров оппозиции хорошо нам известны и большая часть их сторонников не готова выходить на улицы на защиту своих героев — настало время обезглавить врага одним точным ударом. Нам понадобится всего одна ночь, чтобы раз и навсегда решить этот вопрос."
KLG_eliminate_kapper: "Ликвидировать Каппера"
KLG_eliminate_kapper_desc: "Каппер оказался намного более изворотливым, чем мы думали. Каким-то чудом он сумел избежать судьбы своих товарищей и уцелел во время операции по зачистке оппозиционного поля и до сих пор пытается мутить воду. Мы должны избавится от него — и на этот раз агенты точно не промахнуться."
KLG_restore_hierarchy: "Восстановить иерархию"
KLG_restore_hierarchy_desc: "Внутренние законы Мафии основаны на беспрекословном подчинении старшим и соблюдении негласного Кодекса Чести — священного для каждого члена семьи. Любой участник этой организации — от рядового исполнителя до личного консильери Господина Верко — обязан твердо следовать этому закону."
KLG_the_calm_after_the_storm: "Затишье после бури"
KLG_the_calm_after_the_storm_desc: "Правление Короля Шторма имело целый ряд негативных последствий для Клуджтауна. Однако благодаря плодотворному сотрудничеству между завоевателями и Господином Верко нам удалось значительно сгладить эти последствия и сегодня город практически вернулся к прежнему благополучному состоянию."
KLG_sell_slaves: "Продать рабов"
KLG_sell_slaves_desc: "Благодаря удачному расположению порты нашего города стали важным торговым узлом для перевозки рабов внутри Империи Короля Шторма. И некоторое  количество этого товара все еще остается в городе. Необходимо как можно скорее найти покупателя — прежде чем они сбегут или взбунтуются."
KLG_recruit_mercenaries: "Завербовать наемников"
KLG_recruit_mercenaries_desc: "Всевозможные авантюристы составляли основу армии Короля Шторма во многих его походах и большую часть гарнизона Западной Зебрики. После битвы при Эйн-Тротгуре многие из них предпочли остаться в городе и если у нас получится договорится с ними — это значительно упростит наше положение."
KLG_share_with_the_people: "Поделиться с народом"
KLG_share_with_the_people_desc: "Каждый день Семья получает огромные прибыли от своего "бизнеса" и Господин Верко желает отвергнуть обвинения оппозиции и щедро вознаградить простой народ за преданность. Миллионы золотых от продажи всех видов нелегальных товаров будут потрачены на улучшение благосостояния граждан."
KLG_the_mafia_is_immortal: "Мафия бессмертна"
KLG_the_mafia_is_immortal_desc: "Попытки оппозиции поднять народ против власти Господина Верко закончились их неизбежной гибелью. Бессменный лидер клана Белых Песков переиграл и уничтожил их всех как последних идиотов и укрепил власть Мафии над городом. Теперь никто не посмеет возражать против такого положения дел."
KLG_friend_that_we_need: "Друг, который нам нужен"
KLG_friend_that_we_need_desc: "Я ваш друг — вот он я. Это все, что вам нужно сейчас.\nЯ — ваш фрэнд, ваш амиго, я — спасение для вас.\nЯ пришел, чтоб во тьме указать вам, где свет.\nУспокойтесь и будьте послушными мне. И в этом весь секрет."
KLG_assemble_a_band: "Собрать команду"
KLG_assemble_a_band_desc: "Верные друзья Каппера снова воссоединились с ним спустя много лет. Каждому из них он доверяет как самому себе и именно они помогли ему освободить город от тирании Верко. Но теперь им предстоит еще более трудная задача — вместе создать новый, свободный и гармонический Клуджтаун."
KLG_negotiate_with_iwie_meowlin: "Договориться с Айви Мяолином"
KLG_negotiate_with_iwie_meowlin_desc: "Профсоюзные активисты Айви Мяолина были для нас ценными союзниками. За ними стоят голоса десятков тысяч рабочих с нижних уровней и если мы хотим создать действительно народное государства для всех и каждого — необходимо пригласить этого кота поучаствовать в его строительстве."
KLG_no_cooperation_with_commies: "Никакого сотрудничества с коммунистами"
KLG_no_cooperation_with_commies_desc: "Идеология Карамель Маркс несовместима с основополагающими принципами нашей Революции. Хотя социалисты сыграли свое роль в свержении Верко — мы не можем позволить им заменить криминальную диктатуру на диктатуру социалистической партии и ограничить права и свободы вольных торговцев."
KLG_reorganize_the_provisional_committees: "Реорганизовать временные комитеты"
KLG_reorganize_the_provisional_committees_desc: "Созданные благодаря народного инициативе органы власти все еще не являются полноценными частями единого государственного механизма. Их деятельности недостаточно для наведения порядка и поэтому их необходимо подчинить единому демократически избранному Правительству вольного города."
KLG_rebuild_the_town: "Восстановить город"
KLG_rebuild_the_town_desc: "Во время протестов некоторые городские здания были серьезно повреждены. Сотни жителей города остались без крыши над головой и без возможности заработать себе на кусок хлеба. Мы должны приложить все усилия для исправления последствий Революции и возвращения городу его прежнего вида."
KLG_declaration_of_the_rights_of_sentient_being: "Декларация прав разумных существ"
KLG_declaration_of_the_rights_of_sentient_being_desc: "Рабство было и остается отвратительным пережитком прошлого. Ни одно живое разумное существо не должно быть собственностью другого и наши друзья из Эквестрии поняли это очень давно. Однако в Клуджтауне работорговля сохранялась и процветала много лет. Настало время положить этому конец."
KLG_truly_free_economy: "Действительно свободная экономика"
KLG_truly_free_economy_desc: "Клуджтаун всегда привлекал вольных торговцев своим уникальным статусом. Однако далеко не всем были по душе установленные Мафией негласные правила и искусственные ограничения для конкурентов. Больше такого не будет и торговая гавань Западной Зебрики станет по-настоящему свободной."
KLG_lend_a_helping_paw: "Протянуть лапу помощи"
KLG_lend_a_helping_paw_desc: "За долгие годы правления Мафия выкачивала из простых жителей города огромные деньги. Теперь большая их часть покинула его вместе с беглыми криминальными авторитетами — но часть оказалось невозможно вывезти и теперь она принадлежит нам. Эти деньги должны быть возвращены народу."
KLG_town_is_waking_up: "Город просыпается"
KLG_town_is_waking_up_desc: "Переходное Правительство выполнило свою главную задачу. Вольный город окончательно избавился от последствий правления криминальных структур и был реорганизован в демократическую республику. Настало время провести первые свободные выборы и укрепить формирование гражданского общества."
KLG_revolution_has_happened: "Революция свершилась"
KLG_revolution_has_happened_desc: "Прогнозы Карамель Маркс вновь находят подтверждение. Хотя совсем недавно в это невозможно было поверить — но пролетариат под предводительством Рабочего Совета и авангарда Революции — Социалистической Демократической Рабочей Партии — все же сумел взять власть в свои лапы."
KLG_fate_of_tyrants: "Участь тиранов"
KLG_fate_of_tyrants_desc: "Верко и его банда были захвачены Революционной Гвардией и сейчас находятся под арестом. Их преступления перед трудовым народом велики и должны быть преданы справедливому возмездию. Их ожидает суровый приговор Революционного Трибунала и только тогда Революция сможет двигаться дальше."
KLG_protect_freedom_of_speech: "Защитить свободу слова"
KLG_protect_freedom_of_speech_desc: "Необходимо сохранять и поддерживать плюрализм революционной мысли. Только так мы можем быть уверены в верности избранного нами пути и избежать перерождение Революции в бюрократическую диктатуру контрреволюционного формализма и сохранить культуру всенародного управления."
KLG_decree_on_the_revolutionary_press: "Декрет о революционной печати"
KLG_decree_on_the_revolutionary_press_desc: "Революция обязана защищать себя в том числе и на страницах газет. Необходимо поставить все средства массовой информации под контроль демократически избранных Революционных Комитетов и не допускать публикации подрывающих основы пролетарской сознательности реакционных измышлений."
KLG_organize_council_elections: "Организовать выборы"
KLG_organize_council_elections_desc: "Нынешний состав правления Рабочего Совета категорически не соответствует интересам Революции. В рамках первых в истории города демократических выборов необходимо предоставить гражданам более широкий доступ к голосованию и выдвижению кандидатов из числа представителей рабочего класса."
KLG_expand_the_revolutionary_guard: "Расширить Революционную Гвардию"
KLG_expand_the_revolutionary_guard_desc: "Рабочие отряды самообороны отлично показали себя во время Революции и сразу после нее. Однако их количество до сих пор недостаточно для полноценного функционирования Революционной Гвардии в качестве института охраны общественного порядка."
KLG_new_economic_reality: "Новая экономическая реальность"
KLG_new_economic_reality_desc: "Революция освободила все угнетенные слои населения. Институты рабства и наемного рабства были сметены и навсегда ушли в историю. Однако необходимость защиты от реставрации этих институтов требует от бывших рабов и наемных работников полной самоотверженности и экономической мобилизации."
KLG_consolidation_of_resources: "Консолидация ресурсов"
KLG_consolidation_of_resources_desc: "На протяжении десятилетий ресурсы нашего города распродавались капиталистами и подлинным создателям этих благ перепадали жалкие крохи от полученных за это прибылей. Но теперь Революция распорядится этими ресурсами намного лучше и использует их для улучшения качества жизни населения."
KLG_expropriation_of_luxury_goods: "Экспроприация предметов роскоши"
KLG_expropriation_of_luxury_goods_desc: "Богатства приближенных к власти Мафии лиц исчисляется миллионами эквестрийских битов. Значительная часть этого богатства была конвертирована ими в статусное потребление — их огромные особняки ломились от дорогих вещей. Теперь все эти блага должны перейти в общенародное достояние."
KLG_we_will_destroy_all_the_world_of_violence: "Весь мир насилия мы разрушим"
KLG_we_will_destroy_all_the_world_of_violence_desc: "Установление и закрепление власти трудящихся в одном городе — это только начало. Революция должна распространиться и дальше и охватить собой всю территорию Западной Зебрики — от острова Мурсия до восточных границ Мейргипта — и принести свободу миллионам трудящихся на этих землях."

KLG_skydocks:0 "Небесные доки Клуджтауна"
KLG_skydocks_desc:0 "Воздушные корабли постоянно прибывают в Клуджтаун и отбывают из этого города. Они перевозят товары и пассажиров по всей Зебрике. Вполне естественно, что это облегчает торговлю и позволяет неплохо на ней зарабатывать. А то, что это открывает широкие возможности для контрабанды, нисколько не беспокоит правительство Клуджтауна."
KLG_black_market:0 "Чёрный рынок белых песков"
KLG_black_market_desc:0 "В Клуджтауне за хорошую цену можно купить всё. От экзотических наркотиков до закалённых наёмников, от рабов-должников до поддельных документов. Клуджтаун предлагает услуги, которые в большинстве других стран считают аморальными, а то и вовсе незаконными."
KLG_mafia_rule:0 "Мафия у власти"
KLG_mafia_rule_desc:0 "В Клуджтауне организованная преступность полностью вытеснила нормальное государство. Всё настолько плохо, что несчастные граждане теперь обращаются за помощью к криминальным авторитетам. Мафиози десятилетиями поддерживали стабильность в Клуджтауне, и они не очень-то жалуют тех, кто желает завоевать их земли."
KLG_mafia_rule_01:0 "Мафия у власти"
KLG_mafia_rule_01_desc:0 "В Клуджтауне организованная преступность полностью вытеснила нормальное государство. Всё настолько плохо, что несчастные граждане теперь обращаются за помощью к криминальным авторитетам. Мафиози десятилетиями поддерживали стабильность в Клуджтауне, и они не очень-то жалуют тех, кто желает завоевать их земли."
KLG_mafia_rule_02:0 "Мафия у власти"
KLG_mafia_rule_02_desc:0 "В Клуджтауне организованная преступность полностью вытеснила нормальное государство. Всё настолько плохо, что несчастные граждане теперь обращаются за помощью к криминальным авторитетам. Мафиози десятилетиями поддерживали стабильность в Клуджтауне, и они не очень-то жалуют тех, кто желает завоевать их земли."
KLG_army_of_mercenaries_idea: "Наемники Шторма"
KLG_army_of_mercenaries_idea_desc: "Во время своего похода Король Шторм собрал со всей Зебрики огромную армию разбойников и авантюристов и взамен на помощь в подчинении континента позволял им собирать дань с поверженных государств. Они привыкли к такому положению и не планируют адаптироваться к изменениям даже после гибели своей Империи. К счастью — мы всегда готовы предложить им аналогичные условия."
KLG_payments_for_slaves_idea: "Выплаты за рабов"
KLG_payments_for_slaves_idea_desc: "Мы продали заинтересованному покупателю несколько тысяч рабов и он щедро нам за них заплатил.\n"
KLG_mass_protest_idea_01: "Массовые протесты"
KLG_mass_protest_idea_01_desc: "После вывода войск Короля Шторма из города его жители внезапно почувствовали себя гораздо более смелым чем раньше. Оппозиционные силы разной степени радикальности собирают вокруг себя толпы недовольных граждан и провоцируют беспорядки и другие формы социального протеста. Многие из них хотели бы видеть Клуджтаун совершенно другим городом и они сделают все возможное, чтобы добиться этого."
KLG_mass_protest_idea_02: "Массовые протесты"
KLG_mass_protest_idea_02_desc: "После вывода войск Короля Шторма из города его жители внезапно почувствовали себя гораздо более смелым чем раньше. Оппозиционные силы разной степени радикальности собирают вокруг себя толпы недовольных граждан и провоцируют беспорядки и другие формы социального протеста. Многие из них хотели бы видеть Клуджтаун совершенно другим городом и они сделают все возможное, чтобы добиться этого."
KLG_nascent_administration: "Зарождающаяся администрация"
KLG_nascent_administration_desc: "Установление Переходной Демократической Администрации было сопряжено со многими трудностями. В Клуджтауне никогда не существовало полноценного сильного государства и его функции с самого начала выполняли различные криминальные и квази-криминальные структуры. Теперь Капперу и его команде предстоит создать новое государство с нуля и превратить город ушлых торговец и мелких воришек в полноценное гражданское общество."
KLG_free_economic_zone: "Свободная экономическая зона"
KLG_free_economic_zone_desc: "Главное преимущество Клуджтауна перед другими городами Западной Зебрики — отсутствие юрисдикции со стороны крупных государств. За надлежащую цену здесь можно приобрести буквально что угодно. Тысячи торговцев со всего континента предлагают на местных рынках самые редкие и экзотические товары — в том числе и не вполне легальные. А поскольку необходимости платить Мафии за возможность торговать больше нет — количество желающих предложить свой товар значительно увеличилось и цены стали более доступными."
KLG_rebuild_the_town_idea: "Восстановление города"
KLG_rebuild_the_town_idea_desc: "Сами сломали — сами и восстанавливаем. Все справедливо.\n"
KLG_new_republic: "Новая демократическая система"
KLG_new_republic_desc: "В основу новой системы управления вольного города положены принципы Гармонии и демократического либертарианского общежития. Каждый гражданин — от крупного промышленника до мелкого торговца или рабочего с завода — имеет равное право предлагать любые инициативы местного и общегородского управления и голосовать за них. Все основные решения принимаются только с согласия народа и могут быть отменены только всенародным голосованием."
KLG_scared_merchants_idea: "Запуганные торговцы"
KLG_scared_merchants_idea_desc: "Многие городские лавочники поняли наши непрозрачные намеки и перестали выходить на митинги. Однако это имеет и обратную сторону — они в принципе перестали выходить на улицу. И вот это уже не очень хорошо.\n"
KLG_board_of_the_workers_council: "Правление Рабочего Совета"
KLG_board_of_the_workers_council_desc: "После Революции вся исполнительная и законодательная власть временно перешла к Рабочему Совету под контролем Социалистической Демократической Рабочей Партии и независимых депутатов трудящихся. Совет правит городом посредством прямых декретов и распоряжений и контролирует их выполнение с помощью Революционной Гвардии — отрядам рабочей самообороны на всех крупных предприятиях во всех основных районах города. Обладает ли такая система длительным запасом прочности — трудно сказать. Однако едва ли Рабочий Совет можно считать легитимным органом власти до проведения первых демократических выборов."
KLG_proletarian_democracy: "Пролетарская демократия"
KLG_proletarian_democracy_desc: "В основе государственного управления Революционной Коммуны лежит классовый характер режима. Право избирать и быть избранными имеют только представители рабочего класса и они же занимают все ключевые посты в аппарате управления. А чтобы избранные таким образом народные депутаты со временем не выродились в отдельную бюрократическую касту — по закону они обязаны совмещать функции управления с основной рабочей профессией."
KLG_workers_state: "Рабочее государство"
KLG_workers_state_desc: "Согласно революционному декрету — рабочие обязаны принимать активное участие во внутренней политике своего государства и таким образом становится полноценными собственниками средств производства и результатов их коллективного труда. Основные экономические ресурсы Революционной Коммуны направлены на удовлетворение нужд рабочего класса и развитие социальной политики. Любые формы экономического неравенства в такой системе являются пережитками капиталистического общества и постепенно искореняются по мере неуклонного строительства нового социалистического демократического мира."
KLG_revolutionary_brigades: "Революционные бригады"
KLG_revolutionary_brigades_desc: "Созданные во время Революции бригады самообороны рабочего классы были преобразованы в новые вооруженные силы и силы народной милиции. При этом — каждый отдельный хранитель порядка одновременно является представителем рабочего класса и таким образом этот институт принципиально отличается от закрытой буржуазной полиции любого капиталистического государства. Единственная цель существования Революционных Бригад — обеспечение безопасности Коммуны и защита интересов трудящихся перед лицом внешней угрозы."
KLG_beating_heart_of_the_revolution: "Революционный дух"
KLG_beating_heart_of_the_revolution_desc: "Социалистическая Революция в Клуджтауне пробудила ото сна миллионы трудящихся по всей Западной Зебрике. Пример Айви Мяолина и его Революционной Коммуны станет первой искрой будущего пожара пролетарского восстания по всему региону. Однако это же заставляет реакционных политиков и их жестоких лакеев активнее бороться с любыми попытками поднять восстания против них. В ближайшее время они предпримут все попытки растоптать и уничтожить первое социалистическое государство на континенте и это может означать только одно — трудящимся Клуджтауна придется бороться за свое право владеть средствами производства и однажды они принесут свободу своим порабощенным братьям в других странах Западной Зебрики."
KLG_beating_heart_of_the_revolution_01: "Революционный дух"
KLG_beating_heart_of_the_revolution_01_desc: "Социалистическая Революция в Клуджтауне пробудила ото сна миллионы трудящихся по всей Западной Зебрике. Пример Айви Мяолина и его Революционной Коммуны станет первой искрой будущего пожара пролетарского восстания по всему региону. Однако это же заставляет реакционных политиков и их жестоких лакеев активнее бороться с любыми попытками поднять восстания против них. В ближайшее время они предпримут все попытки растоптать и уничтожить первое социалистическое государство на континенте и это может означать только одно — трудящимся Клуджтауна придется бороться за свое право владеть средствами производства и однажды они принесут свободу своим порабощенным братьям в других странах Западной Зебрики."
KLG_beating_heart_of_the_revolution_02: "Революционный дух"
KLG_beating_heart_of_the_revolution_02_desc: "Социалистическая Революция в Клуджтауне пробудила ото сна миллионы трудящихся по всей Западной Зебрике. Пример Айви Мяолина и его Революционной Коммуны станет первой искрой будущего пожара пролетарского восстания по всему региону. Однако это же заставляет реакционных политиков и их жестоких лакеев активнее бороться с любыми попытками поднять восстания против них. В ближайшее время они предпримут все попытки растоптать и уничтожить первое социалистическое государство на континенте и это может означать только одно — трудящимся Клуджтауна придется бороться за свое право владеть средствами производства и однажды они принесут свободу своим порабощенным братьям в других странах Западной Зебрики."

klugetown.1.t:0 "Демократические протесты"
klugetown.1.d:0 "На протяжении десятилетий правления семьи Верко Клуджтаун постепенно превратился из незначительного торгового узла в крупных промышленно развитый город со своей системой управления и негласными законами. Воля самого влиятельного дона была сопоставима с волей монарха и для десятков тысяч криминальных элементов это было естественным порядком вещей. Однако со временем город наводнили мелкие жулики и вполне себе мирные торговцы из других частей Западной Зебрики. И вместе с ними началось распространение совершенно новой политической мысли — либертарианского самоуправления.\n\nДо недавних пор Мафия оставалось самым сильным игроком внутри вольного города и все его обитатели были вынуждены признавать ее власть. Но с появлением Короля Шторма контроль над городом временно взяли его слуги и позиции Верко стали гораздо менее незыблемыми.\n\nОсвобождение города стало моментом истины для демократической оппозиции. Благодаря неожиданному визиту Принцессы Твайлайт Спаркл за несколько дней до битвы при Эйн-Тротгуре десятки тысяч существ смогли почувствовать свою силу и шанс изменить город к лучшему. Неформальным лидером этого движения стал молодой абиссинец и близкий друг Принцессы Твайлайт по имени Каппер — бывший мелкий воришка и участник той самой битвы при Эйн-Тротгуре.\n\nЕго слова находят отклик в душе у многих жителей города. Несправедливость существующей системы уже давно казалась им абсолютно очевидной — однако только Каппер набрался смелости говорить об этом открыто и открыто агитировать против Верко и его банды. Заявленная цель его компании — превратить Клуджтаун в настоящий вольный город по образцу Свободного Государства Каза и обеспечить гармонию и безопасность всем его жителям вне зависимости от их достатка или видовой принадлежности."
klugetown.1.a:0 "Мутная вода начинает бурлить."
klugetown.2.t:0 "Забастовки на нижних уровнях"
klugetown.2.d:0 "Расположенные глубоко под величественными зданиями города и торговыми площадями рабочие кварталы представляют из себя натуральные трущобы. Поскольку далеко не всем жителям города посчастливилось урвать свое место на внутреннем рынке — десятки тысяч были вынуждены поселиться здесь и в обмен на еду и подобие крыши над головой работать на подземных фабриках. Условия жизни и условия труда здесь мало отличаются от рабства. Мафия предпочитает не вмешиваться в дела своих деловых партнеров и не утруждает их хотя бы минимальным контролем.\n\nДо недавнего времени большая часть жителей верхнего города ничего не знали о страданиях рабочих. Однако еще во времена Правления Шторма загадочный абиссинец по имени Айви Мяолин стал довольно заметной фигурой. Под его лаповодством рабочие впервые организовали профсоюз и остановили работу одной из фабрик по производству оружия для армии завоевателя. Как только Король Шторм узнал об этом — он приказал открыть огонь по зданию фабрики и завались всех рабочих под ее обломками. В результате городу был нанесен серьезных ущерб и несколько десятков его жителей погибли. Однако Айви Мяолин выжил и продолжил вести социалистическую агитацию. По всему нижнему уровню активно распространялись листовки с цитатами Карамель Маркс и призывами совершить Революцию.\n\nНесколько недель назад на одной из фабрик по производству дорогих продуктов для абиссинской знати произошел неприятный инцидент — некачественное оборудование вышло из строя и один рабочий погиб. Несколько сотен его коллег на следующий день отказались выходить на работу. Вместо этого они вышли на забастовку и направились к зданию фабрики с целью захватить его. Сам Айви возглавлял бастующих в первых рядах и несколько раз был серьезно ранен — но невероятным образом его так и не удалось убить или заставить остановиться. Мордовороты из службы безопасности предприятий уже не могли справится с толпой рабочих и в панике покидали нижние уровни. Склады с товарами были захвачены и разграблены — целую ночь голодная толпа пировала на его догорающих обломках."
klugetown.2.a:0 "Это очень неприятно для бизнеса."
klugetown.3.t:0 "Семейное застолье"
klugetown.3.d:0 "Особняк Верко был самым заметным зданием в городе. Огромный Дом неизменно возвышался над плохо сколоченными домиками уличных торговцев и на их фоне выглядел настоящим произведением искусства. Этим вечером возле дома было припарковано несколько десятков автомобилей и во всех окнах первого этажа горел свет.\n\nГлавный зал особняка был украшен оригиналами картин знаменитых вингбардийских и аквелийских художников и экзотическими растениями в вазах из твизанийской керамики. Обтянутые кожей офиотавра стулья стояли вокруг длинного праздничного стола на резком полу из гринглифского красного дерева. Банкет был приготовлен для нескольких десятков гостей из самых влиятельных преступных группировок города и хозяин дома в полной мере продемонстрировал свою щедрость. Слуги угощали гостей деликатесами из разных стран и подавали только самое лучшее вино. Гости с нетерпением ждали появления Господина Верко. Они знали, что этот грандиозный пир был всего лишь небольшой формальностью перед его появлением и обсуждением последних новостей города.\n\nВерко вошел в комнату медленным шагом и молча занял свое место во главе стола. Никто из присутствующих не посмел произнести ни единого слова. На несколько минут в помещении повисла зловещая тишина.\n\n— Приветствую вас, господа. Надеюсь, мое небольшое опоздание не слишком утомило вас ожиданием, — произнес Верко своим обычным заигрывающим голосом и поднял над головой бокал вина. Гости многозначительно переглянулись. — Вот и чудесно. Сегодня я собрал вас всех по одному очень важному делу. С самого своего основания Клуджтаун был обителью нашего клана и никому другому не было дозволено помыкать нами. Однако авантюра Короля Шторма крайне губительно сказалась на положении нашего бизнеса и только вместе мы сможем вернуть себе и этому городу его былую славу. С сегодняшнего дня внутри клана не должно быть никаких конфликтов. Я лично буду за этим следить. А теперь мне бы хотелось поднять этот бокал за наше прекрасное будущее.\n\n— За будущее! — повторили гости и осушили свои бокалы. Вопреки надеждам и опасениям некоторых из них — перестановок в высших кругах так и не последовало. Все лидеры группировок сохранили свое положение в семье и ни один из них так и не был выбран новым консильери. Вместо этого Верко назначил своего персонального коллектора — носорога по имени Сал Морригат. При этом сыновья дона — Норберт и Даггетт — становились его глазами и ушами внутри организации и получали особый статус посредников между своим отцом и подчиненными ему капитанами."
klugetown.3.a:0 "Этот город принадлежит только нам."
klugetown.4.t:0 "Единый план действий"
klugetown.4.d:0 "Раскурив большую пуэрто-кабальскую сигару, Верко медленно выпустил изо рта дым и стряхнул остатки табака о край золотой пепельницы. Его молодые сыновья и будущие наследники огромной криминальной Империи — рассудительный Норберт и безумный Даггетт — нетерпеливо ерзали в креслах напротив рабочего стола отца. Не говоря ни слова, Верко положил перед ними стопку документов. Даггетт протянул за ними лапу и тут же получил по ней тростью — за все эти годы он так и не научился правильно себя вести в присутствии босса и не трогать чужие вещи без разрешения.\n\nВ документах содержалось два основных сценария для борьбы с поднимающими голову бунтовщиками. Первый предполагал создать для них иллюзию относительно безопасности и позволить проводить свои собрания и публично критиковать Мафию. Следовало заставить их поверить в возможность мирного демократического перехода и через постепенное внедрение своих агентов вычислить наиболее влиятельных лидеров оппозиции. Затем нанести несколько точечных ударов и положить конец их попыткам захватить власть в городе. Быстро и без особого шума.\n\nВторой вариант был гораздо более жестоким. По нему Мафия использовала все свои возможности для быстрой победы. Через провокации и убийства участников восстания и привлечение на свою сторону маргинальных элементов предполагалось запугать население и отбить у него всякое желание сопротивляться нашей власти. Этот вариант казался многим более предпочтительным — однако он таил в себе опасность радикализации протеста и его превращения в открытые боевые действия с непредсказуемым финалом.\n\nОба документа были составлены самим Верко и один из них содержал его собственный план. Но прежде чем его озвучить, он задал вопрос своим сыновьям, что они по этому поводу думают.\n\n— Первый план был бы гораздо предпочтительнее. — Спокойно ответил Норберт. — Нарастающий хаос был бы очень опасен для города и для нашего бизнеса. Если бы мы смогли решить эту проблему тихо и без большой крови — это было бы самым лучшим выходом из нынешней плачевной ситуации.\n\n— Ничего подобного! — Решительно возразил Даггетт. — Мы не можем позволить этим недоумкам поливать нас грязью и тем более не имеем право показывать перед ними свою слабость. Необходимо раздавить их всех как можно более сурово. Тогда все в этом городе будут знать — с нами лучше не шутить.\n\nВерко широко улыбнулся. Именно таких ответов он ожидал от своих сыновей. Они спорили еще несколько минут. Отец смотрел на них и мирно докуривал сигару. И только когда они наконец замолчали — он вынул из стопки документов лист со своим настоящим планом."
klugetown.4.a:0 "Мы должны действовать аккуратно."
klugetown.4.b:0 "Мафия покажет свое истинное лицо."
klugetown.5.t:0 "Транспортировка товара"
klugetown.5.d:0 "Молодая зебра проснулась от знакомого шума. Вместе с несколькими десятками других рабов она под конвоем проследовала в соседнюю комнату и заняла свое место на краю длинного стола. Надсмотрщик поставил перед ней тарелку с похлебкой из желтых листьев и маленький кусочек хлеба. Зебра вяло посмотрела на свой завтрак и начала жевать — все ее внутренности сводило от голода и она не могла остановиться — даже когда чувствовала во рту привкус горького сухого сорняка.\n\n— Набивайте брюхо и живо из комнаты по одному. — Скомандовала огромная крыса и для убедительности несколько раз ударила хлыстом по деревянному полу. Зебра суетливо начала доедать свою скудную трапезу и когда отведенное на завтрак время закончилось — повалила себе в рот все что смогла и последовала за другими рабами. К ее удивлению на этот раз их вели не на их обычное место работы. Они направлялись в доки. Это могло означать только одно — на них впервые за много лет нашелся покупатель и теперь их должны увести из этого проклятого всеми богами города.\n\nЗебра почувствовала странную смесь радости и тревоги. С одной стороны — с Клуджтауном ее не связывало ничего кроме горя и скорби и можно было бы по крайней мере наедятся, что новое место окажется лучше прежнего. Но с другой стороны — все могло оказаться совсем по-другому. Ее могли продать еще более жестокому господину и тогда ее судьба была бы предрешена.\n\nСегодня она с трудом могла вспомнить свою прошлую жизнь. В юности она была дочерью крестьянина из плодородной равнины Великих Озер и это время виделось ей потерянным раем. Затем — когда Король Шторм оккупировал их страну — она была захвачена в плен и продана в рабство одному из его офицеров. Этот офицер несколько лет возил ее собой и наконец во время службы в Клуджтауне продал ее одному местному криминальному авторитету.\n\nИ теперь в ее жизни начиналась новая глава. Она перебирала в голове все возможные варианты своего нового дома и каждый казался ей хуже предыдущего. Это могла быть Абиссиния. Или Кольтфаген. Тогда все могло бы оказаться не настолько плохо. Или Хироптерра. Про себя она молилась, чтобы это была не Хироптерра. Она отлично помнила рассказы про условия труда невольников этого государства и про их эксперименты на живых существах. Милосердный Заал, пусть это будет что угодно, но только не Хироптерра.\n\nНадсмотрщики согнали в трюм несколько сотен рабов и захлопнули за ними дверь. В полном темноту невольники почувствовали легкий толчок. Воздушный корабль отчалил от гавани Кладжтауна и направился..."
klugetown.5.a:0 "В Абиссинию."
klugetown.5.b:0 "В Кольтфаген."
klugetown.5.c:0 "В Хироптерру."
klugetown.6.t:0 "Охотники за удачей"
klugetown.6.d:0 "— Виски мне! — грозно прорычала молодая грифониха с что было сил ударила сжатыми когтями по столу. Бармен от оглушительного звука очнулся от полудрема и поспешил выполнить требования скандального гостя. Сидящий рядом старый кот с одним глазом кивнул давней подруге и сделал большой глоток из граненого стакана. Гретхель с завистью смотрела на него — с самого утра грифониха мучилась от адского похмелья и ей не терпелось наконец избавится от него. Даже если для этого придется отдать половину своего случайного заработка.\n\nКогда-то они могли себе позволить ни в чем себе не отказывать в этом городе. Вместе с армией Короля Шторма они находились здесь на правах его законных представителей и каждый торговец отдавал им часть своего заработка. Формально это были пошлины самому Королю — однако военный губернатор Клуджтауна по сути использовал их для оплаты услуг самих наемников и ради сокращения бюрократии позволил им кормить себя самостоятельно. И потому они совсем не сдерживали себя рамками законности. Гретхель и ее невольный собутыльник были в этом особенно хороши. Но теперь Короля Шторма не было и их основной источник дохода потерял всякий смысл. Некоторое время они еще жили на избытки наворованного — но даже они постепенно заканчивались.\n\nБармен поставил перед наемницей стакан виски и она жадно выпила все за несколько мгновений. В этот момент в бар вошел огромный белый медведь и неожиданно обратился к Гретхель и одноглазому коту.\n\n— Следуйте за мной. Господин Верко хочет с вами поговорить. — Произнес громила и непутевые охотники за удачей поднялись со своих кресел. Чего от них хотел этот странный бобер. Или кем он там вообще был. Решил наконец спросить с них за незаконное обогащение без его ведома? Или наоборот — задумал предложить сотрудничество. Алкоголь не слишком помогал им подумать об этом нормально — но они все равно последовали за огромным мишкой.\n\nВерко встретил их на крыльце своего особняка. Туда же прибыл и еще один их давний знакомый — кирин Вартас по прозвищу Поджигатель. Своей манерой выходить из себя при любом удобном случае и испепелять все вокруг он изрядно помотал местным торговцам нервы. Но добиваться своего этот рогатый жеребец определенно умел.\n\nПредложение было довольно простым — Верко собирался взять их к себе на работу. Теперь они должны были во всем подчинятся только ему и за это он обещал неплохие деньги. Однако о поборах с рядовых торговцев следовало забыть раз и навсегда — любой бизнес в этом городе находился под защитой Мафии. Хотя — если кто-нибудь попытается открыть лавочку без дозволения Верко — у него всегда будут под лапой опытные в этом отношении слуги."
klugetown.6.a:0 "Теперь они будут работать на нас."
klugetown.7.t:0 "Милосердный господин"
klugetown.7.d:0 "Под пристальным взором двух огромных полярных медведей в кабинет Верко вошел средних размеров ихтиоморф — существо наполовину рыба с толстыми задними лапами и длинными когтями на концах плавников. Все его тело содрогалось от сильного волнения и назойливый запах рабьего пота начал быстро распространятся по комнате. Верко сидел за столом и увлеченно рассматривал странного гостя.\n\n— Если вы по-по-позволите... — Неуверенно начал ихтиоморф. Верко уже знал про него все что было необходимо знать — но намеренно не подавал вида и слушал как будто бы с интересом. Хотя ни одно слово не было для него неожиданностью. — Я живу в этот городе уже почти шесть лет. За это время я ни разу никого не обманывал и всегда вовремя платил свои долги. Но недавно со мной произошла чудовищная несправедливость. Моя лавка вместе со всем товаром оказалась разбита пробегающей мимо группой из шести пони – за ними по видимому кто-то гнался. Потому что иначе я не могу объяснить — почему они даже не остановились чтобы извинится передо мной. Я пытался их найти и потребовать компенсации за нанесенный ущерб — но они как сквозь землю провалились.\n\n— И ты бы хотел, чтобы я нашел их и воздал по заслугам? — Вежливо поинтересовался Верко и ихтиоморф тут же замотал огромной головой.\n\n— Нет. Этого мне не нужно. Благодаря помощи одного своего друга мне удалось привести свои дела в порядок и сейчас моя лавка снова процветает. Однако этот самый друг... Я задолжал ему крупную сумму денег и он требует, чтобы я вернул их на этой неделе. Если я этого не сделаю — он скорее всего убьет меня или может быть еще хуже — заберет у меня мой бизнес. Сейчас у меня нет нужной суммы и в моей ситуации никто не согласится одолжить мне ее до следующего доходного месяца. У меня надежда только на вас.\n\nВерко поднялся с кресла и подошел к ихтиоморфу.\n\n— Ты пришел ко мне за помощью, — спокойно произнес он и положил свою правую лапу на чешую бедного торговца. — Но просишь без уважения. Ты даже не предложил мне свою дружбу — и рассчитываешь получить от меня денег?\n\n— Простите, господин Верко, — виновато промычал ихтиоморф. — Конечно же я виноват. Я хотел бы предложить вам свою дружбу и готов выполнить любое ваше условие. Если вы того пожелаете — я буду вашим верным слугой до конца своих дней. Только умоляю — помогите.\n\nВерко замолчал. Его правая лапа повисла в воздухе. Торговец понял намек и несколько раз поцеловал огромный бриллиант на золотом перстне."
klugetown.7.a:0 "Конечно же я помогу. Но не бесплатно."
klugetown.8.t:0 "Мафия бессмертна"
klugetown.8.d:0 "Толстая крысиная лапа осторожно отдернула вышитую золотыми нитками штору и Верко через окно взглянул на свой город. Наследие его семьи и настоящий рай для каждого верного ее законам существа. Он построил этот город своим многолетним трудом и ни за что не позволит уничтожить это идеальное творение. Все его враги лежали закопанные в безымянных могилах или тряслись от страха в самых глубоких норах и больше не представляли никакой угрозы.\n\nЭтот город принадлежал только ему одному и его сыновьям. Его прекрасным молодым мальчикам — Норберту и Даггетту. Одному из них в скором времени суждено было стать его наследником. Верко чувствовал это каждым мускулом своего дряхлого тела. Шрамы с каждым днем все больше напоминали о себе — все они хранили долгую историю его жизни. Неудачные покушения и перестрелки — их было бесконечно много. Десятки раз он оказывался на грани жизни и смерти. В него попадали пули и его еду травили самыми сильными ядами — но он все равно оставался жив. Вопреки всему он сохранил наследие своего отца и многократно его приумножил — но годы все же начинали брать свое.\n\nОднако у него все еще было несколько лет до окончательного угасания. За это время он должен был подготовить одного из своих сыновей к непростой роли лидера огромного преступного синдиката. Он должен был поделится с ним своей мудростью и научить его всегда поступать в интересах своей Семьи. Он должен был ввести будущего наследника в подобающий ему круг общения и позволить ему завоевать себе достаточно высокий авторитет. Он должен был сохранить все это для него — он должен был сделать очень много дел за эти несколько лет. Он должен был сделать все возможное для сохранения наследия своей Семьи.\n\nКогда-нибудь он покинет этот мир. Но слава вольного города Клуджтауна никогда не померкнет. Во все времена он будет оставаться единственным в своем роде городом подлинной чести и достоинства. Верко улыбался. Сегодня этот город принадлежал только ему. В его лапах была судьба всех его жителей. Но он никогда не был самовлюбленным тираном — таким как Король Шторм. Он всегда ценил и уважал Кодекс Чести преступного мира и никогда не поступался принципами. Никто из его партнеров никогда не посмел бы упрекнуть его в бесчестии. Он достойно прожил свою долгую жизнь — и на самом ее закате просто наслаждался видом этого чудесного места — самого знаменитого рынка во всей Западной Зебрике."
klugetown.8.a:0 "Этот город принадлежал только ему."
klugetown.9.t:0 "Черная кошка в темной комнате"
klugetown.9.d:0 "Каппер самонадеянно считал себя практически неуловимым и совершенно не беспокоился о безопасности. За столько лет жизни в этом неприветливом городе он успел нажить себе множество врагов — но никому из них еще не удавалось добраться до проворного кота. Но на этот раз удача оказалась не на его стороне. Один из мелких прислужников Верко поймал его по пути домой. Двое крепких существ набросились и он даже не успел как следует их рассмотреть. Единственным его воспоминанием был отвратительный резкий запах вперемешку с ароматом сонного раствора.\n\nОни бросили его в этот сырой подвал и по всей видимости пошли докладывать Верко о своем успехе. Каппер чувствовал себя хуже некуда. Но этот раз он не просто угодил в передрягу — он подвел сотни и тысячи тех кто доверился ему. Он собирался поднять их на борьбу против тирании — но в итоге просто подставил их под бандитские пули и не сумел ничего сделать. Это был его провал. Очередное доказательство его природного невезения.\n\nНо неожиданно сквозь непроглядную темному прорвался лучик света. Прогремел взрыв и возле выходящего на улицу окошка образовался небольшой лаз. Но ему — ловкому молодому коту — не составила бы труда протиснуться через него. И он уже собирался было убегать — но вдруг заметил рядом с проходом загадочный силуэт. Сначала он принял его за иллюзию — но потом убедился в реальности. Рядом с ним стояла высокая черная кошка.\n\n— Шедоу? — удивление в его голосе было невозможно скрыть. — Шедоу Софтпаулс? Это ты?\n\n— Конечно же я, глупенький! — Глаза черной кошки едва заметно заблестели в полумраке подвала. — Я слышала, что ты попал в беду, и прибежала так быстро как только смогла. А теперь, если позволишь, нам надо убираться отсюда как можно скорее.\n\nШедоу проскочила в дырку словно маленький комок черной шерсти и Каппер немедленно последовал за ней. Мордовороты того бандита услышали шум и со всех ног преследовали их несколько кварталов. Однако у них не было ни единого шанса — с первых же минут погони беглецы вырвались вперед и их было уже не остановить. С горечью на сердце они были вынуждены вернуться обратно с пустыми лапами. К счастью — их наниматель еще не успел доложить Верко о своем мимолетном достижении— иначе его судьба могла бы оказаться не самой приятной."
klugetown.9.a:0 "Старый друг вернулся в трудную минуту."
klugetown.10.t:0 "Штаб Сопротивления"
klugetown.10.d:0 "— А как ты узнала обо мне? — поинтересовался Каппер у своей неожиданной спасительницы. — Я в смысле... Мы ведь с тобой не виделись столько лет. И вдруг ты появляешься и так вовремя выручаешь меня из этой передряги. Как ты поняла что мне требуется помощь?\n\n— Тебе нужно благодарить не меня. — Спокойно ответила Шедоу и передала ему добытый где-то кусок хлеба. — Я просто следовала плану одного нашего общего знакомого. Кстати — он хотел бы поговорить с тобой. Если ты не против.\n\n— Общего знакомого? Я думал — ты предпочитаешь действовать в одиночку.\n\n— Раньше так и было. Но сегодня это касается не только меня одной. Речь идет о судьбе целого города. И поэтому нам следует держаться вместе — как в старые добрые времена.\n\nСпустя несколько часов они добрались до одного неприметного домика возле прохода на нижние уровни города. С первого взгляда он казался необитаемым — но внутри уже собралось несколько десятков существ и некоторые из них были хорошо знакомы Капперу. В том числе и покрытый шрамами белый полосатый кот в потрепанной курточки с выбитым правым глазом. Каппер смотрел на него и не верил. Его охватила целая буря эмоций и он никак не мог привести их в порядок. Меньше всего на свете он ожидал увидеть именно его.\n\n— Добро пожаловать... старый друг. — Сдавленно произнес белый кот и стыдливо опустил взгляд. — Я пойму если ты захочешь покинуть это место прямо сейчас. После всего что было — я не жду что ты согласишься простить меня. Но если тебе понадобится помощь в борьбу против Верко — мы готовы сделать все что в наших силах.\n\n— Чаммер? — спустя несколько секунд дар речи вернулся к Капперу и он в недоумении смотрел на белого кота. — Я думал что ты погиб.\n\n— Я выжил. Когда мой... наш корабль потерпел крушение — меня подобрала семья сталевара с одного из нижних уровней. Они помогли мне снова встать на лапы. Накормили и обогрели. Хотя сами были бедными и нуждались в помощи. Именно тогда я понял какую страшную ошибку совершил. У тебя есть полное право злиться на меня. Но позволь мне помочь тебе. Только вместе мы сможем одолеть Верко и его банду.\n\n— Чаммер прав. — Вмешалась в разговор Шедоу. — Нам нужно составить план и работать в команде. Верко без труда сможет разогнать и уничтожить нас поодиночке. Но если нас будет много — у него не останется выбора кроме как пойти на уступки.\n\nКаппер кивнул. Всего несколько часов назад ему казалось что все было кончено и все его надежды пойдут прахом. Но теперь он знал наверняка — у них есть шанс довести это дело до конца и завоевать свободу для каждого разумного существа в этом городе."
klugetown.10.a:0 "Спустя годы они встретились вновь."
klugetown.11.t:0 "Не грози нижнему кварталу"
klugetown.11.d:0 "Очередное собрание в центре города поначалу не привлекло особого внимания. По крайней мере — агенты Верко просто собирали информацию о собравшихся и не предпринимали никаких попыток остановить шествие к Центральной Площади. Однако на месте им неожиданно преградила дорогу группа из нескольких крупных полярных медведей. Все они были специально отобраны в личную гвардию самим Верко и часто выполняли для него еще и роль вышибал.\n\nСамый крупный медведь приблизился к толпе и потребовал немедленно расходится. Каппер решительно выступил вперед и заявил что будет говорить от имени всех свободных существ этого города. Несколько сотен голов высунулись из окон и начали с неподдельным интересом наблюдать за происходящим.\n\n— Даже если вы не позволите нам собираться и высказывать свое мнение — рано или поздно ваша тирания закончится. Король Шторм тоже считал свою власть незыблемой и наслаждался безнаказанностью — и где он теперь? Так и передайте своему господину. Он может силой заставить замолчать одного или даже некоторых из нас — но ему никогда не заглушить тысячи свободных голосов и не уничтожить волю народа к сопротивлению его беззаконной власти.\n\nБелый медведь слушал его с невозмутимым выражением лица и судя по всему так ничего и не понял. Рядовым исполнителям по должности не полагалось думать о таких серьезных вещах.\n\n— Уходите. Ими мы заставим вас уйти. — Низко прорычал медведь и Каппер вновь не сдвинулся с места. Тогда он подал знак огромной лапой и колонна медленно двинулась в сторону протестующих. Казалось — они не остановились бы даже если никто не начал отходить назад и просто затоптали бы всех протестующих.\n\nКаппер дал условный сигнал. Фигура огромного мускулистого кота прошла сквозь толпу протестующих и встала между ними и группой белых медведей. Лицо самого крупного из них скривилось в попытке осознать происходящее — прямо перед ними стоял кот едва ли не больше их самих по размеру с огромными мускулами и намерения у него явно были не самые добрые.\n\n— Взять его! — выкрикнул медведь после долгого и мучительного мыслительного процесса и сам первый побежал в лобовую атаку. Но как только он попытался ударить огромного кота — тот всего одним движением выбил у него из лап дубину. Медведь в шоке попытался встать в боевую стойку — но следующий же удар мгновенно отправил здоровяка в нокаут. Остальные медведи в ужасе и полном недоумении переглянулись. Огромный кот по имени Макс смотрел на них и одного только его взгляда было достаточно для понимания — с этим громилой лучше вообще не связываться."
klugetown.11.a:0 "Левый коронный — правый похоронный."
klugetown.12.t:0 "Ловкость лап и никакого обмана"
klugetown.12.d:0 "Каппер и Шедоу без труда добрались до нужного места. Это было одно из самых ярких зданий на одной из самых оживленных городских улиц. И даже при этом вывеска над покосившейся дверью выглядела уж слишком вычурной и пестрой. На ней были изображены стандартные атрибуты опытного фокусника в окружении разноцветных огней и большими буквами написано имя хозяина этого заведения.\n\n— Адмирал Флаффингтон... — с некоторой иронией в голосе произнесла Шедоу и повернулась к Капперу. — Это здесь.\n\n— Оу. Я и не думал что старина Флаф решил попробовать себя в шоу-бизнесе. Хотя... учитывая его способности. Это было вполне ожидаемо.\n\nВнутри средних размеров помещения — по всей видимости когда-то служившего одним из местных баров — было довольно темно и только сцена в дальнем углу была ярко освещена. На этой сцене высокий кот с усами в и одежде из прошлого века заканчивал свое представление. Немногочисленная публика начала громко аплодировать и кот несколько раз поклонился. В этот момент его взгляд остановился на двух новых посетителях и улыбка почти моментально пропала с его лица.\n\n— Представление окончено. Просьба всем опоздавшим покинуть заведение и подождать следующего сеанса.\n\n— Не прикидывайся, Флаф. Ты прекрасно знаешь, зачем мы здесь. — Высокий кот в ответ лишь тихонько фыркнул. Однако Шедоу и не думала отступать — она демонстративно заняла уверенную позу и не сводила с фокусника напряженный взгляд.\n\n— Нет. Я не буду участвовать в ваших авантюрах. — Решительно ответил Адмирал Флаффингтон. — Моя преступная жизнь осталась в прошлом. Если вы до сих пор промышляете мелкими кражами — поищите себе другого компаньона.\n\n— Мы здесь не для этого. В городе собирается всенародная стачка против Верко. Он уже стягивает в центр города все свои силы и планирует вооружить их с помощью купленного в Кольтфагене оружия. Воздушные корабли с ним скоро прибудут и тогда нам придется туго.\n\n— И чего же вы от меня хотите?\n\n— Ты должен помочь нам угнать эти корабли. От этого зависит судьба всего города. — Адмирал Флаффингтон взглянул на своих старых друзей и понял что они не врут. И хотя его маленький бизнес довольно неплохо процветал даже под властью Верко и его банды — он согласился помочь.\n\nНа следующий день из доков исчезло сразу несколько кораблей с оружием. Усиление охраны не помогло. Благодаря своим навыкам взломщика Адмирал Флаффингтон без труда проник на каждый из этих кораблей и при содействии агентов Сопротивления увел их подальше от города и драгоценный груз навеки затерялся в песках."
klugetown.12.a:0 "Теперь хищник останется без когтей."
klugetown.13.t:0 "Из искры возгорится пламя"
klugetown.13.d:0 "С каждым днем все больше существ присоединялось к народному движению против Мафии. Прошло всего несколько недель с момента начала активной стадии протестов — и за это они охватили буквально весь город. Протестующие перегораживали улицы и блокировали дома влиятельных сторонников Верко. Даже частные охранные агентства больше не справлялись с защитой безопасности своих клиентов. Возмущенные произволом со стороны криминальных структур существа разбивали окна их особняков и поджигали дорогие автомобили. Сам Верко вынужден был многократно усилить охрану своего поместья и превратил его фактически в неприступную крепость — с двумя десятками пулеметных точек и сотнями вооруженных солдат по периметру со всех сторон.\n\nОднако самым драматическим событием за последние несколько дней стало разрушение самой крупной и печально известной городской тюрьмы. За последние несколько месяцев в нее были помещены сотни активных участников Сопротивления и десятки из них были при этом жестоко избиты. От Каппера и его команды требовали решительных действий — заложников необходимо было освободить как можно скорее.\n\nРано утром возле тюрьмы собралась толпа в несколько тысяч представителей самых разных видом. Все они скандировали один и тот же лозунг — "Освободите наших товарищей". Охрана так и не решилась покинуть здание — вместе этого они забаррикадировались внутри и приготовились к обороне. Каппер понимал — штурмовать здание через единственный вход было бы слишком рискованно. Во время прорыва погибли бы многие участники такого штурма и это стало бы слишком высокой платой за освобождение узников.\n\nВместе с Чаммером и Шедоу они собирались разработать новый план — однако их давняя подруга Молли опередила их и все сделала сама. Эта карликовая кошка была известна своей любовью к пиротехнике и всему что взрывается. В былые времена даже сам Верко несколько раз нанимал ее в качестве медвежатника. Но теперь она была здесь — рядом со своими старыми друзьями — и у нее был свой отличный план. Всего за полчаса она заложила в основание тюрьмы несколько динамитных шашек и как только она их подорвала — вся конструкция начала медленно осыпаться. В стене образовался широкий проход и у охраны больше не было возможности остановить толпу от проникновения в здание. Каппер предложил им сдаться и не проливать кровь невинных — поскольку в этом уже не было никакого смысла. Охранники подчинились и были отпущены на свободу вместе со всеми кого они охраняли."
klugetown.13.a:0 "Следующая цель — особняк Верко."
klugetown.14.t:0 "Верко покидает город"
klugetown.14.d:0 "Крики разгневанной толпы были отчетливо слышны даже здесь — за несколько сотен метров от нее. Верко и его сыновья в спешке паковали вещи — этот город больше не мог служить для них домом и они вынуждены были убегать. Для этого у них уже все было готово — Сал Морригат уже подготовил для них воздушный корабль и перенес туда половину золотого запаса всего города. Вторая половина находилась в Банке одного очень надежного партнера и Верко до сих пор не сомневался в его надежности — но добраться туда через несколько десятков бунтующих улиц было совершенно невозможно.\n\nОгромное количество дорогих вещей пришлось оставить в доме. С собой Верко забрал всего несколько чемоданов с самым необходимым и ценным лично для себя — в том числе старый семейный альбом с его покойной супругой и подаренный ею много лет назад золотой сервиз.\n\nОднако к этому моменту особняк уже был заблокирован со всех сторон. Покинуть его обычным способом они не могли. Поэтому слуги провели их по тайному ходу прямо до частной пристани на другой стороне квартала. Здесь немногочисленная охрана все еще не пускала разгневанную толпу и частный воздушный корабль Верко стоял нетронутый и готовый к полету.\n\nВсе вещи были загружены в него с максимально возможной скоростью. Чуть вдалеке раздались звуки взрывов и топот сотен сапог. Толпа неумолимо приближалась и отчаливать надо было немедленно. Даггетт все время жаловался и требовал отпустить его и дать ему оружие для защиты собственности их семьи. Но Норберт всякий раз останавливал младшего брата и тот нехотя следовал указаниям отца.\n\nСпустя всего несколько минут корабль отчалил от пристани. Место назначения было неизвестно даже самому Верко. Из-за своих грязных дел он находился в розыске в половине международно признанных стран и в большей части непризнанных. К тому же политическая карта за последние несколько десятков лет менялась так часто — что у него не было уверенности ни в одном ранее совершенно безопасном месте.\n\nС другой стороны — со своими деньгами он мог осесть практически где угодно. Изменить имя и внешность и через давних знакомых из Нового Мейрленда или Кольтфагена оформить свои миллионы как законно полученные. Это был неплохой вариант. Но для Верко все они были в равной степени унизительными. Он мечтал закончить свою жизнь в созданном своими же лапами городе в окружении Семьи и передать наследство одному из своих сыновей — а теперь последние годы его жизни пройдут в изгнании и единственное что останется после него — печальное осознание итогов его правления и гибели всего что он успел построить."
klugetown.14.a:0 "Крысы бегут с тонущего корабля."
klugetown.15.t:0 "Оппозиция берет власть"
klugetown.15.d:0 "Оставшиеся в городе криминальные авторитеты со своими малочисленными бандами больше не могли сопротивляться толпе бунтовщиков. Без явного лидера у них не было никаких шансов. Каппер предложил им добровольно распустить свои боевые отряды в обмен на помилование и шанс начать жизнь с чистого листа — и многие из них согласились.\n\nНовая власть пообещала не преследовать бывших или действующих агентов криминальных структур и не проводить никаких люстраций — в противном случае огромную часть населения города можно было так или иначе заподозрить в работе на Верко. В том числе и самих лидеров оппозиции. Аресту и временному заключению подвергались лишь немногочисленные остатки высшего лаповодства Мафии и приближенные Верко. Их предполагалось судить на открытом процессе по делу о многочисленные преступлениях против народа. Однако Каппер не скрывал — на этом процессе не будет вынесено ни одного смертного приговора. Самых страшных преступников криминальной гавани ожидало в лучше случае несколько лет тюрьмы строго режима. Никому из лидеров оппозиции не хотелось начинать свое правление с репрессий — даже против тех кто объективно того заслуживал. Жители вольного города должны были увидеть настоящее лицо новой власти и быть готовыми доверить ей свои жизни и свое будущее.\n\nПостепенно началось формирование городской полиции и настоящей государственной власти. На местах были организованы временные комитеты для решения целого ряда важных вопросов — от восстановления разрушенной инфраструктуры до перераспределения собственности бежавших из города бандитов. Критерии отбора лиц для этих комитетов были довольно строгие — потенциальный кандидат должен был быть грамотным и иметь опыт в управлении небольшим бизнесом или хотя бы профсоюзом. На нижних уровнях комитеты практически полностью состояли из лидеров коммунистов. Рабочие голосовали за наиболее популярных из них в надежде превратить общегородскую систему управления в подобие сталлионградских советов и на их основе и дальше вести непримиримую борьбу против капитализма.\n\nКриминогенная обстановка в городе продолжала быть довольно трудной. Однако надежда на скорые позитивные перемены и чувство свободы давало огромному количество его обитателей не замечать этих трудностей. Этот день был для них настоящим праздником. Впервые с момента основания города их жизни не зависели от воли тиранов и они могли говорить и думать все что угодно."
klugetown.15.a:0 "Да здравствует Свободный Клуджтаун!"
klugetown.16.t:0 "Друг, который нам нужен"
klugetown.16.d:0 "На протяжении многих лет повседневная жизнь вольного города была наполнена коварством и жестокостью. Этот город был суров к слабым о смертельно опасен для них. Любой одиночка без денег рисковал погибнуть или быть проданным в рабство. Дружба была не более чем товаром — как и все остальное ее легко можно было купить или предложить и только существа с толстыми кошельками могли рассчитывать завести здесь друга. Особенно дорого ценилась дружба криминальных авторитетов. И получить ее можно было только одним способом — проявить себя ценным и готовым заплатить хорошие деньги партнером.\n\nНо потом на политической арене вольного города появился он — Каппер Дапперпаус. Молодой абиссинский эмигрант и мелкий безродный воришка из Пантеры — за свою недолгую жизнь он успел хлебнуть немало горя и совершить немало низких поступков. Но затем встреча с Элементами Гармонии навсегда изменила его судьбу. Именно они научили Каппера истинной дружбе — которую было невозможно купить за деньги. И когда армия Короля Шторма была изгнана из Западной Зебрике — этот кот вернулся в город и начал собирать вокруг себя первых единомышленников.\n\nЕго идеи очень быстро набирали популярность среди широких слоев населения. И Каппер использовал свой политический капитал не для приумножения богатства — вместо этого он сосредоточился на изменении отношения орбиталей вольного города друг к другу. На смену алчности и эгоизму должны были придти взаимное уважение и сострадание к слабым. Каппер демонстрировал эти качества на собственном примере и оставался другом для всех своих единомышленников. Благодаря ему и его друзьям десятки должников Верко смогли избежать проблем и выплатить все до последней копейки. Во время массовых протестов он лично стоял на баррикадах впереди всех и вдохновлял своих сторонников не боятся Верко. Его несколько раз хватали и бросали в холодные застенки — но он всегда находил способ выбраться и продолжать борьбу.\n\nИ теперь город наконец был освобожден. Но самое трудное еще только предстояло. Недостаточно было просто свергнуть Верко — каждому жителю города было необходимо уничтожить Верко внутри самого себя. Научиться дружить и ценить друг друга. Научиться говорить правду и ненавидеть ложь. Научится помогать слабым и не быть слепыми к чужому горю. Научится радоваться жизни и не верить в светлое будущее. Научиться быть щедрыми и никогда не предавать своих друзей.\n\nУ местных жителей не было никаких сомнений — именно Каппер должен был стать следующим городским главой. Потому что если кто и был способен обеспечить торжество гармонии в этом неприветливом месте — то это именно он."
klugetown.16.a:0 "Лучше друга нет!"
klugetown.17.t:0 "Шестеро друзей"
klugetown.17.d:0 "Главный банкетный зал бывшего особняка Верко выглядел совершенно не так как прежде. Все дорогие вещи были проданы в соседние страны ради получения денег на восстановления города — из всего великолепного убранства этой комнаты остались разве что удивительно красивые обои и резной пол — просто потому что вынести и продать все это было физически невозможно. Посреди комнаты вместо огромного стола из Кольтфагена стоял самый обычный — с одной из городских мебельных фабрик.\n\nШестеро абиссинцев доедали свой обед.\n\nЧаммер Тейлспринг был также молчалив как и всегда. Он так и не смог найти в себе сил поговорить с Каппером. Рядом сидела Шедоу и пыталась подбодрить старого друга — но ему становилось только хуже. Он понимал — даже если бы он нашел в себе силы попросить прощения — это все равно ничего бы не изменило. Совершенное им вероломство было слишком явным и не имело никакого даже призрачного оправдания.\n\n— Мне правда очень жаль. — Наконец произнес он и стыдливо опустил глаза к полу. Каппер отложил в сторону свой обед и многозначительно посмотрел на старого друга. В его глазах не было ни единого намека на злость или обиду. — Я пойму если ты больше не захочешь меня видеть.\n\n— Не захочешь видеть? Чаммер! Я думал что потерял тебя! — Белый кот медленно переводил взгляд с Каппера на остальных своих друзей и обратно. Он ожидал чего угодно от этого разговора — кроме такого искреннего дружелюбия. — Столько лет прошло. И теперь — когда мы все снова вместе — я ни за что не прогоню тебя.\n\n— То есть... Мы снова сможем стать друзьями? — Каппер уверенно кивнул. Малышка Молли радостно подпрыгнула на заботливо подложенных под нее подушках и захлопала маленькими лапками. Губы здоровяка Макса изогнулись в самой очаровательной улыбке которую только можно представить. Даже всего серьезный Адмирал Флаффингтон выглядел абсолютно счастливым.\n\n— Мы уже друзья. И никогда не переставали ими быть.\n\nПрошло всего несколько минут прежде чем все шестеро крепко обнялись. С того дня когда они впервые собрались все вместе на улицах Пантеры прошло больше десяти лет. Тогда они все еще были маленькими неразумными котятами. Но сегодня в этой комнате встретились шестеро взрослых котов с тяжелым грузом суровых испытаний за спиной. Неизменным оставалось только одно — их старая дружба."
klugetown.17.a:0 "Старые обиды остались в прошлом."
klugetown.18.t:0 "Черный кот с красным глазом"
klugetown.18.d:0 "Для укрепления уверенности рабочих в своих благородных намерениях Каппер согласился встретиться с их лидером и своим бывшим союзником Айви Мяолином на одном из нижних уровней. Более того — он пришел туда совсем один без намека на охрану. Хотя даже некоторые его соратники убеждали его этого не делать — нижние уровни и без того имели мрачную репутацию. А после начала массовых выступлений и забастовок еще ни одному эмиссару Верко не удавалось выбраться оттуда живым. Однако Каппер был непреклонен — социалисты очень помогли им добиться победы и если бы он не согласился на переговоры с ними — то показал бы себя тираном ничуть не лучше самого Верко.\n\nАйви Мяолином был именно таким как о нем говорили — среднего роста черный кот выдранными клоками шерсти на боках и на голове с яркими красными глазами. Говорил он всегда очень громко и резко — словно был не готов слушать никаких возражений. Практически при каждом таком выпаде его шерсть резко вставала дыбом и он всегда казался немного больше в глазах собеседника.\n\n— Вы ознакомились с нашими требованиями? — Спросил Айви и Каппер ответил утвердительно. За несколько дней до переговоров Центральный Забастовочный Комитет Нижних Уровней прислал ему копию документа с перечнем необходимых реформ в сфере трудового законодательства и государственного строительства. Среди них были — установление для всех работников городской промышленности 8-ми часового рабочего дня с ограничением рабочей недели до 48 часов. Введение оплачиваемого отпуска и повышение заработной платы. Легализация профсоюзной деятельности и включение революционных комитетов и забастовочных советов в государственного структуру управления на тех же правах что и для мелких торговцев. Обеспечение равного представительства рабочих и торговцев в городском совете. Амнистия для всех участников забастовок и полная отмена системы штрафов на предприятиях.\n\n— Мы согласны. — Ответил Каппер и передал лидеру коммунистов документ с решением Временной Демократической Администрации относительно Забастовочного Комитета. Под документом были поставлены все необходимые подписи и его содержание полностью удовлетворяло выдвинутые требования. Айви Мяолин был доволен таким результатом — теперь рабочие были полноценными участниками нового демократического процесса преобразования общества вольного города и хотя это была и не социалистическая демократия — в нынешних условиях они смогли добиться наиболее выгодного для себя результата."
klugetown.18.a:0 "В новом Клуджтауне будут рады всем."
klugetown.19.t:0 "Город просыпается"
klugetown.19.d:0 "Зунтар медленно приподнялся с кровати и одним движением копыта отключил надоедливый будильник. В соседней комнате все еще спала его жена с маленьким ребенком и он не хотел разбудить их раньше времени. Солнце все еще было довольно низко и холодный ветер пробивался сквозь стены его хлипкого жилища. Он должен был придти на рынок как можно скорее — чтобы самые удобные и популярные места не разобрали раньше. Всего за несколько минут он привел себя в порядок и взвалил на плечи седельные сумки.\n\nЗа последние полгода Клуджтаун очень сильно изменился. Когда Зунтар только приехал сюда после захвата Королем Штормом его родного Кольтфагена — ему приходилось каждый месяц платить семье Верко за возможность спокойно вести свои дела. Последствия неподчинения были ему хорошо известны — несколько раз прямо на его глазах мордовороты Мафии переворачивали лавки должников и избивали их до полусмерти при полном дозволении окружающих. Поэтому Зунтар платил вовремя. Даже когда поборы выросли и ему перестало хватить на нормальную еду — он был вынужден отдавать определенную сумму и ни одним медяком меньше.\n\nПочти три года назад он познакомился с самой замечательной кобылой на всем белом свете. Каждый день она приходила на рынок именно к нему и очень скоро они решили сыграть свадьбу. Однако это было невозможно — молодая зебра была рабыней местного криминального авторитета и он ни за что не позволил бы ей уйти. Когда же господин узнал о ее беременности — бешенству его не было предела. Несчастная зебра только чудом смогла избежать порки и спасти жизнь себе и своему малышу. Ее побег был обреченным делом — за годы существования этого города ни одному рабу не удавалось прятаться достаточно долго. Рано или поздно ее бы все равно нашли. Но она рассчитывала по крайней мере отсидеться до момента рождения их с Зунтаром будущего сына.\n\nНо потом власть в городе перешла ко Временному Правительству. Верко вместе со своими подручными бежал из города как последняя крыса и новая власть обещала провести реформы. И одним из первых ее решений была отмена рабства амнистия для всех беглых рабов. Как только это решение было публично озвучено на Центральной площади города — возлюбленная Зунтара пришла к нему и они в тот же вечер сыграли свадьбу.\n\n Теперь больше никто не боялся вести свои дела в этом городе. Когда Зунтар пришел на рынок и начал раскладывать на прилавке свои товары — остальные торговцы дружелюбно улыбались ему и желали удачного дня. Все заработные сегодня деньги принадлежали только ему и никто больше не имел права грабить его или угрожать ему или его семье."
klugetown.19.a:0 "Сегодня будет замечательный день."
klugetown.20.t:0 "Город засыпает"
klugetown.20.d:0 "Под покровом ночи несколько десятков фигур покинули особняк Верко. У каждой из них в кобуре был заряженный пистолет с несколькими десятками пуль — и каждую пулю необходимо было использовать строго по назначению. Из составленных службой безопасности списков было отобрано около двухсот имен наиболее влиятельных лидеров оппозиции. Этой ночью они должны были умереть. Навсегда исчезнуть с лица этого города и тем самым унести с собой в могилу надежду его обитателей на свержение власти Мафии. Всю операцию предполагалось выполнить за несколько часов. Как только наступила полночь — Верко закрыл за своими агентами входную дверь и отправился спать. Когда же он проснулся — ни один из его врагов больше никогда бы не смог открыть глаза.\n\nКаппер вернулся в штаб Сопротивления рано утром. Вместе с Шедоу они выполняли задание на другом конце города и во время облавы находились именно там. Однако после возвращения они увидели только полностью разгромленный дом и несколько десятков трупов внутри. Некоторые были все еще живы — но шансов на их спасение уже не было никакого. Каппер с ужасом смотрел на пробитое пулей навылет крошечное тело маленькой Молли и на прислонившегося к дальней стене Адмирала Флаффингтона с глубокой раной на животе.\n\n— Ка... Каппер... — С трудом прохрипел лежащий на полу и истекающий кровью Чаммер. Друзья беспомощно наклонились над его телом и попытались остановить кровь. — Это не поможет. Мне осталось совсем немного. Но у вас все еще есть возможность спастись. Уходите из города как можно скорее.\n\n— Нет! Мы спасем тебя! Мы спасем тебя и продолжим борьбу! — Кричал Каппер и напрасно пытался перевязать раны умирающего друга. Лицо Чаммера еще сильнее побледнело. Его глаза наполнились слезами и правая лапа с трудом поднялась и ухватилась за левую лапу друга.\n\n— Верко уже не победить. Все наши друзья мертвы. Он с самого начала все знал и просто играл с нами — и теперь его игра закончилась. Он убьет вас если вы останетесь здесь. Прошу вас — спасайтесь. Я не хочу чтобы вы тоже погибли. И еще... Каппер... — Его взгляд встретился со взглядом старого друга. — Прости меня. Прости меня за все.\n\nСпустя мгновение остатки жизни покинули его тело. Каппер тщетно пытался позвать его — но тот не отвечал. Он обреченно смотрел на друга и слезы сами потекли из его глаз. Шедоу стояла рядом и рыдала вместе с ним. Они понимали — Чаммер был абсолютно прав. У них больше не было возможности противостоять Верко и они должны были уйти. Уйти и оставить этот несчастный город в лапах жестокого тирана."
klugetown.20.a:0 "Наша тактика принесла нам победу."
klugetown.21.t:0 "Конец рыжего кота"
klugetown.21.d:0 "Всего за несколько часов портреты Каппера были развешаны на всех улицах города. Верко предлагал за его голову несколько тысяч золотых монет и в несколько раз больше — если ему приведут его главного врага живым. Разного рода охотники за головами и просто ушлые торговцы начали поиски беглеца. Улицы патрулировали днем и ночью — но его все равно нигде не было. Тогда в розыск была объявлена и его подруга Шедоу и на счет нее было строгое требование — привести ему черную кошку живой и здоровой.\n\nРасчет Верко был на благородство Каппера. Если бы его подруга оказалась в лапах Мафии — он непременно прибежал бы ее спасать и сам оказался бы в ловушке. Либо Верко мог потребовать от него добровольной капитуляции в обмен на жизнь и свободу подруги. Но и с этим вышла неудача — эти двое как будто сквозь землю провалились. Даже когда почти половина города искала их круглые сутки напролет — это не давало никаких результатов.\n\nИ только две недели спустя стало совершенно очевидно — они уже давно покинули город и добраться до них теперь невозможно. Как оказалось — всего через несколько часов после рейда на лидеров Сопротивления из воздушных доков пропал один воздушный корабль и согласно воспоминаниям немногочисленных свидетелей — он направлялся на север. И хотя никто не видел на палубе этого корабля Каппера и Шедоу — их причастность к его угону была совершенно очевидна.\n\nКуда они направились — никто не знает. Возможно — они полетели в сторону Горы Арис и нашли политическое убежище у своих старых товарищей времен битвы при Эйн-Тротгуре. Возможно — Эквестрия приняла их как политических беженцев. А возможно — они осели где-нибудь в Грифонии под вымышленными именами. В любом случае — даже надежные связи Верко в преступном мире не дали никаких результатов и не помогли определить их местонахождение.\n\nОднако он не стал отменять объявленную за их поимку награду. Это давало по крайней мере призрачную надежду на возможность расквитаться с ними в отдаленном будущем. Скорее всего — однажды найдется охотник за головами, который узнает их из сотен других котов и выполнит заказ из далекого пустынного города. Или во всяком случае — они будут вынуждены жить в постоянном страхе перед такой возможностью до конца своих дней."
klugetown.21.a:0 "И все-таки ему удалось от нас сбежать."
klugetown.22.t:0 "Разделяй и властвуй"
klugetown.22.d:0 "На первом этапе развития массовых протестов коалиция между либеральными гармонистами Каппера и социалистами Айви Мяолина казалась довольно крепкой. Левые нередко сообщали о своих планах в Единый Штаб Сопротивления и координировали свои действия с происходящим в торговой части города. Мяолин несколько раз отправлял наверх своих делегатов и обсуждал вопрос дальнейшего государственного устройства вольного города с лидерами мятежников и настаивал на важности сохранения профсоюзных структур и соблюдение прав рабочих в новом демократическом государстве.\n\nОднако благодаря грамотной работе агентов влияния Верко ситуативные союзники все больше отдалялись друг от друга. Все началось с отдельных конфликтов между рабочими и мелкими лавочниками в приграничных районах. Как правило — такие конфликты были инсценированы агентами Мафии. Но именно они довольно быстро поставили под сомнения возможность продуктивного союза между двумя настолько разными с политической точки зрения протестными группами.\n\nПровокации продолжались и набирали силу с каждым днем. При помощи своих агентов Верко подтолкнул некоторых лидером протеста на сотрудничество с фабрикантами с нижних уровней — якобы они тоже выступали против Мафии и были готовы оказать финансовую поддержку новой власти. Все это вызвало неудовольствие со стороны Айви Мяолина и он потребовал от Каппера немедленно это прекратить. Впервые они вели долгую переписку и пытались убедить друг друга в правильности своей позиции более чем несколько дней — и по итогу так ни к чему и не пришли. В ответ Айви Мяолин объявил Каппера таким же тираном и агентом крупной буржуазии как и Верко и велел прекратить любое сотрудничество с ним.\n\nПоследним же гвоздем в крышку гроба этого политического союза была облава на профсоюзных лидеров. Под лаповодством главы охранной службы был проведен рейд на нижние уровни и несмотря на весьма качественную конспирацию — мордовороты Верко без труда смогли найти штаб-квартиру профсоюзной коалиции и разом арестовать несколько десятков коммунистов. Все это не только практически похоронило социалистическое сопротивление и значительно ослабило забастовку на нижних уровнях — но и окончательно погубило саму возможность сотрудничества с гармонистами Каппера. Потому что именно их Айви Мяолин объявил виноватыми с произошедшем и лично дистанцировался от всех своих прошлых контактов с ними. Естественно — все доказательства причастности Каппера были сфабрикованы агентами влияния Мафии. Но это уже не имело никакого значения."
klugetown.22.a:0 "Это было очевидно с самого начала."
klugetown.23.t:0 "Тринадцать ударов дубиной"
klugetown.23.d:0 "Одной из наиболее активных социальных групп во время бунта стали мелкие торговцы. Из-за особенностей экономики вольного города именно они со своими семьями составляли значительную часть населения торгового района и выступали в качестве главного источника доходов для Мафии. Каждый из них обязан был платить определенную сумму за возможность вести свой бизнес на территории города. Формально это называлось "платой за безопасность" — хотя в действительности именно Мафия представляла для них наибольшую угрозу и любого, кто отказывался платить, ожидало суровое наказание.\n\nЗакономерно — многие из них мечтали о ликвидации мафиозных структур и обеспечения подлинной свободы предпринимательство на территории вольного города. Каппер был для них символом новой эпохи и надеждой на перемены и многие из них принимали непосредственное участие в протестах или молча симпатизировали им. Торговцы нередко укрывали лидеров и активных сторонников Сопротивления у себя дома или в подсобках своих магазинов и продавали им еду и все необходимое для подпольной жизни по весьма низким ценам — или даже предоставляли бесплатно с надеждой на возвращение "инвестиций" в будущем.\n\nОднако они забыли о возможностях Мафии. Благодаря помощи внедренных в ряды оппозиции агентов Верко уже знал имена некоторых таких торговцев и для укрепления своих позиций он потребовал "нанести им несколько неожиданных визитов". Самым главным требованием было сохранить им жизни — чтобы в будущем они все еще могли приносить городу деньги и чтобы у врагов не было мотивации бороться до последнего. Верко понимал — чрезмерная жестокость не подавит страх. Она вызовет ровно обратный эффект и заставит недовольных граждан ненавидеть его еще сильнее и еще упорнее бороться. Но если бы он воспользовался своей властью над их финансовым будущем — это могло бы стать ключом к быстрой и относительно бескровной победе.\n\nДесятки сотрудников охранной службы напали на торговцев прямо посреди белого дня. Они даже не пытались скрываться — их принадлежность к правящим мафиозным структурам уже фактически делала их неприкасаемыми. Прямо на глазах у своих жертв они громили их прилавки вместе с выставленными на них товарами и злобно хохотали при этом. На излете дня таким образом было уничтожено около двухсот точек и выброшено на ветер почти тридцать тысяч наличных денег в пересчете на эквестрийские биты. В связи с этим количество желающих помогать сторонникам Каппера среди малого бизнеса значительно сократилось."
klugetown.23.a:0 "Они почувствовали на себе нашу ярость."
klugetown.24.t:0 "Не стоит играть с огнем"
klugetown.24.d:0 "Забастовки охватили несколько крупных заводов на нижних уровнях. Рабочие взяли под контроль основные цеха и выгнали оттуда всех представителей прежней администрации. Владельцы завода обратились за помощью к Верко — но получили от него только упрек за невозможность уследить за собственными подчиненными. Глава города ясно дал понять — у него на эти заводы есть другие планы и он не станет оглядываться на интересы магнатов.\n\nИ очень скоро его планы стали очевидны для всех. Под видом участников забастовки на мятежные фабрики были внедрены несколько агентов и с помощью подкупа и шантажа им удалось добиться лояльности нескольких инженеров. Они и подсказали им способ организовать диверсию и успешно замаскировать ее под обыкновенный несчастный случай. Спустя всего несколько дней в одном из горячих цехов произошло "случайное" возгорание и всего за несколько минут огромное помещение полностью заволокло дымом. Огнетушители оказались неисправны — экономия владельцев завода на противопожарной безопасности теперь выходила боком бастующим рабочим. Истинные виновники инцидента — подкупленные агентами Верко инженеры — благополучно покинули здание всего за полчаса до него и к моменту распространения огня на соседние здания уже прибыли в торговый квартал за обещанной наградой.\n\nПожар не ограничился только одним зданием. За несколько часов загорелась большая часть одного из нижних уровней. Сотни его обитателей были застигнуты врасплох в своих домах или на рабочих местах и не смогли эвакуироваться — огонь поглотил их тела и не оставил даже праха. Десятки работников задохнулись в дыму в первые несколько минут пожара — другие умирали от полученных ожогов или последствий отравления дымом спустя несколько дней. К концу недели счет жертв данного инцидента приближался к тысячи. За все время существования города это была самая серьезная и самая разрушительная техногенная катастрофа из всех.\n\nПричастность Мафии к данному событию была для многих совершенно очевидна. И хотя сам Верко по возможности старался это отрицать — нагнетание страха и ненависти только играло ему на лапу. С другой стороны — началось явное нагнетание истерии по поводу повторения трагедии и для многих косвенными виновниками оказались сами рабочие — поскольку именно их действия привели к такому радикальному ответу со стороны Мафии и если бы они даже не начинали свою забастовку — все эти жертвы можно было бы предотвратить. Верко был доволен таким результатом — теперь он спокойно мог использовать эти настроения для дальнейшей борьбы против коммунистов."
klugetown.24.a:0 "Они обязаны смириться с неизбежностью."
klugetown.25.t:0 "Слишком любопытная зебра"
klugetown.25.d:0 "Занути всю свою жизнь проработал на фабрике по производству внутренней механики для воздушных кораблей. Его рабочий день традиционно начинался рано утром и заканчивался поздним вечером. За всю неделю у него в лучшем случае был один выходной — который он всегда старался проводить в компании друзей за кружечкой алкоголя. Семьи у него не было — единственная возлюбленная бросила его после очередного запоя и вышла замуж за его старого приятеля — гораздо более умеренного в употреблении спиртных напитков. Это заставило Занути уйти в еще более длительный запой и только несколько недель назад товарищам удалось уговорить его остановится.\n\nЗанути никогда не был сторонником социализма. Его никогда не видели на собраниях профсоюзных активистов и он никогда не принимал от них листовки и не распространял их. Однако когда в один из дней весь завод синхронно вышел на забастовку — Занути также присоединился к ней. Во многом просто чтобы не выглядеть дураком в глазах товарищей — потому что во время выступления лидера коммунистов Айви Мяолина перед толпой бастующих рабочих он не понял ни единого слова.\n\nЗабастовка продолжалась несколько дней. Затем активисты Рабочего Совета начали собирать добровольцев в ряды Революционной Гвардии и один из приятелей Занути вступил туда в первых рядах. Сам Занути даже не задумывался об этом — однако когда товарищ позвал его и предложил за вступление бутылку джина — тот согласился без тени сомнения. Занути дали в копыта старенькую винтовку и приказали сопровождать митинг в поддержку социалистических реформ. И хотя он до сих пор не понимал значение этого слова — свою работу он выполнял довольно неплохо.\n\nНо потом на горизонте появились они — солдаты службы безопасности Верко. Они напали на шествие рабочих и открыли по нему огонь. Революционная Гвардия попыталась атаковать их в ответ — но после короткой перестрелки была вынуждена отступить. Битва продолжалась еще несколько минут. Занути не был ранен — однако сильно отстал от своих товарищей и был немедленно арестован.\n\nНа допросе ему пригрозили пытками. Он честно признался что совершенно ничего не знает о планах Мяолина и имеет весьма скудные представления о социализма и вообще обо всем происходящим. Однако надзирателям это не понравилось и его начали бить. Пытки продолжались несколько дней и так ничего не дали. Занути выглядел после них просто отвратительно — на нем буквально не было живого места. Спустя еще несколько дней он умер от потери крови. Солдаты загрузили его тело в мешок из-под картошки и тайно закопали в пустыне далеко за городом."
klugetown.25.a:0 "Грубовато — но другого выбора нет."
klugetown.26.t:0 "Возмездие"
klugetown.26.d:0 "Благодаря финансовой поддержке своего отца и других пострадавших от коммунистического мятежа предпринимателей Даггет сумел собрать под своим командованием по меньше мере пять тысяч бандитов. Многие из них также были эмигрантами в первом поколениями — бывшими активистами различных праворадикальных партий в своих странах и их ненависть к социалистам и либералам была еще сильнее чем у обычных наемников.\n\nЭта в некоторой степени армия была собрана в торговом квартале и вооружена по последнему слову техники. Оружие для нее было специально закуплено сериями по несколько мелких партий в Гиппогрифии и Новом Мейрленде. Оно никогда не давало осечек и позволяла сразить потенциального противника наповал всего одной пулей. Этого уже было достаточно для проведения финальной операции против социалистов и их сторонников по всему городу. Верко отдал приказ примерно около полудня — в это время участники забастовки как раз возвращались на улицы и начинали громко скандировать свои коммунистические лозунги. Даггет первым выступил вперед и за ним последовали все остальные.\n\nСтрельба неожиданно развернулась в центре города и уже через несколько минут толпу протестующих захлестнула паника. Несколько десятков из них пали мертвыми в первые несколько минут. Горячая кровь медленно растекалась по асфальту и хлюпала под ногами палачей. Отчаянные создания кидались в переулки — но даже там пули карателей настигали и убивали их. Спустя всего десять минут все оставшиеся в живых протестующие покинули площадь.\n\nДаггет приказал разделить свой отряд и преследовать каждого убегающего социалиста. Сам же он во главе самого крупного подразделения направился в сторону прохода на нижние уровни. Из докладов полевых агентов ему уже было известно местоположение секретной квартиры Рабочего Совета и он планировало добраться туда первым и захватить в плен самого лидера коммунистов Айви Мяолина. Однако на месте ему пришлось прорываться с боем через уличные баррикады — рабочие построили их всего за несколько часов и некоторое время успешно держали оборону. Но преимущество было не на их стороне и штаб партии был в конечном итоге захвачен. Почти половина членов Рабочего Совета погибли во время штурма — остальных Даггет приказал заковать в кандалы и под конвоем доставить в особняк отца.\n\nРасправы над протестующими продолжались до самого вечера. Во всех районах города пластами лежали десятки и сотни трупов. Никто так и не решился покинуть свой дом и достойно захоронить жертв этого кровавого дня — еще почти целую неделю они так и продолжили обреченно валяться на залитом кровью асфальте."
klugetown.26.a:0 "Больше никто не выступит против нас."
klugetown.27.t:0 "Расправа"
klugetown.27.d:0 "Тайные подвалы особняка Верко были огромными мрачными помещениями без окон и с очень хорошей звукоизоляцией. Именно сюда обычно привозили недоброжелателей босса и как правило они не выходили отсюда живыми — если только между ними и хозяином дома не удавалось добиться выгодного ему соглашения. Подвалы были разделены на несколько крупных помещений без единого предмета мебели.\n\nИ сегодня эти подвалы оказались переполнены. Несколько десятков лидером Сопротивления были доставлены сюда и смиренно ожидали своей судьбы. Среди них особенно привлекали к себе внимание Каппер со своей постоянной командой и лидер социалистов Айви Мяолин. Все они некогда были хорошо известны в городе и их имена произносили с уважением и надеждой. Но теперь они должны были исчезнуть — навсегда сгинуть из истории города и не оставить после себя даже посмертной надписи на могильной плите.\n\n— Значит — все закончится именно так. — Холодно констатировала всегда серьезная Шедоу Софтпаулс. Каппер многозначительно кивнул и повернулся к сидящему рядом Айви. Хотя они были знакомы совсем недолго — Каппер успел проникнуться искренним уважением к этому черному коту и его самоотверженной борьбе за интересы пролетариата. Хотя идеи коммунизма не были близки самому Капперу — он по крайней мере мог уважать лидера коммунистов за честность и смелость.\n\nДаггет вошел в комнату вместе с двумя головорезами и велел заложникам по одному выходить в соседнее помещение. Первым вывели Адмирала Флаффингтона. Спустя несколько секунд в тишине раздался громкий хлопок и звук падающего на холодную плитку тела. Каппер тихо опустил глаза и молча простился с убитым другом. Затем огромная крыса схватила за шкирку маленькую Молли и утащила ее вслед за другими узниками. Даже самому крепкому из присутствующих было больно на это смотреть.\n\nШедоу вывели из комнаты позже других. Перед окончанием своего жизненного пути она последний раз взглянула на Каппера и их глаза впервые встретились так явно. Каппер увидел в них тень давно зародившегося чувство и понимал — что сам испытывал тоже самое все это время. Давняя подруга могла бы стать для него чем-то большим — но теперь это уже не имело никакого смысла. Очередной выстрел прервал его размышления и в комнате остались только он и Айви Мяолин. Их выводили последними. В помещении для казни они увидели лежащие пластами тела своих друзей и с трудом сдерживали слезы. В последний раз они многозначительно переглянулись и закрыли глаза."
klugetown.27.a:0 "Они поплатились за свои преступления."
klugetown.28.t:0 "Штаб Сопротивления разгромлен"
klugetown.28.d:0 "Службе безопасности Верко понадобилось всего несколько дней для обнаружения точного места сбора видных представителей оппозиции. Их штаб находился в одном из многочисленных бесхозных зданий недалеко от прохода на нижние уровни и как правило они собирались там исключительно при свете дня — чтобы их было труднее обнаружить случайному наблюдателю с улицы. Однако один из мелких воришек этого района сообщил о них куда следовало и получил за это неплохое денежное вознаграждение. Приказ о ликвидации мятежного гнезда был отдан немедленно и младший сын Верко Даггет лично отправился туда во главе отряда головорезов.\n\nЗдание было окружено со всех сторон и как только первый участник собрания покинул его и вышел на улицы — на него тут же накинулись со всех сторон. Отряд Даггета ворвался внутрь и начал беспорядочно палить во всех присутствующих. Несколько лидеров сопротивления были убиты в первые же мгновения. Другие пытались бежать и попадали в лапы налетчиков — однако некоторые в общей суматохе все же смогли проскочить в подготовленные заранее тайные проходы. Каратели пытались последовать за ними — но это ни к чему не привело. Почти половина лаповодящего состава Сопротивления все еще оставалась на свободе.\n\nВерко был не слишком доволен таким провалом своего сына. Но с другой стороны — от этого рейда и не ожидалось ликвидации всех мятежников одним ударом. Тем более что имена многих из них до сих пор не были известны. Среди погибших и взятых в заложники все еще оставалось предостаточно серьезных фигур и это определенно должно было внести разлад в оставшиеся силы протестующих и заставить их действовать гораздо более опрометчиво.\n\nОтносительно мирное протестное движение практически прекратило свою деятельность. Однако вместо него значительно усилилось другое — гораздо более радикальное. На нижних уровнях коммунисты собирали вокруг себя все больше сторонников и призывали ко все более радикальным действиям. И события в торговом квартале заставили рабочих гораздо активнее присоединяться к боевым группам Революционной Гвардии. Всего через три дня после удачного рейда было организовано сразу несколько покушений на представителей Мафии при администрации бастующих предприятий и одно из них завершилось убийством близкого друга и давнего партнера Верко по бизнесу. Кроме того — ходили слухи о возможных переговорах между лидером коммунистов Айви Мяолином с остатками штаба из торговых районов о формировании единого Революционного Фронта против под предводительством Социалистической Демократической Рабочей Партии."
klugetown.28.a:0 "Беглецы скрываются на нижних уровнях."
klugetown.29.t:0 "Программа Единого Революционного Фронта"
klugetown.29.d:0 "Звук разбивающегося стекла заставил Верко подскочить с кровати. Прямо на дорогом хиндийском ковре в его спальне лежало нечто круглое средних размеров с медленно сгорающим фитилем. Старый бандит мгновенно все понял и со всех лап бросился к выходу — у него оставалось несколько минут прежде чем весь этаж взлетит на воздух. По дороге он едва не сбил поднимающего наверх дворецкого и остановился только на противоположной стороне дома. Его сердце быстро колотилось от ожидания взрыва. Однако ничего не произошло. Спустя почти пять минут Верко распорядился отправить наверх группу саперов. Даже если бомба не взорвалась — она все еще могла это сделать при одном неосторожном движении.\n\nОднако саперы вернулись к нему с неожиданной новостью — это была вовсе не бомба. Вернее — внутри нее не было никакой начинки. Вместо этого фитиль спокойно догорел и ничего не сделал. Внутри бомбы было спрятано всего несколько листков бумаги и они при этом остались совершенно нетронутыми. Судя по всему — это было послание от отправителя этого странного "подарка".\n\nВерко приказал извлечь из бомбы листы бумаги и передать их ему. Он рассчитывал прочитать в них послание от одного из своих давних соперников или иного недоброжелателя — однако все оказалось намного хуже. Автором этого документа был лидер коммунистов Айви Мяолин и в нем содержалась опубликованная несколько дней назад в подпольной социалистической газете программа Единого Революционного Фронта. Верко читал и не мог поверить своим глазам:\n\n1. Немедленное освобождение всех заложников и ликвидация всех вооруженных криминальных группировок на территории Вольного Города Клуджтаун. Единственными источниками власти и насилия должны оставаться подконтрольные народу и рабочему классу Революционные Бригады.\n\n2. Конфискация имущества лидеров преступных кланов и связанных с ними капиталистов. Создание единого экономического совета национализированных предприятий и передача контроля над ними в лапы советов рабочих преследователей и региональных комитетов СДРПК.\n\n3. Немедленный арест и проведение следствия по делу о нарушении фундаментальных прав личности со стороны лидеров криминальных группировок. Публичное вынесение и исполнение приговоров этим лицам без возможности обжалования.\n\nИ самым неприятным были вовсе не сами формулировки — невероятно дерзкие в своей фантастической наглости. Самым неприятным был способ их передачи. Потому что если коммунисты смогли отправить своих диверсантов в самое сердце торгового квартала и закинуть муляж бомбы в окно особняка Верко — то что им помешает в следующий раз закинуть туда уже настоящую бомбу?"
klugetown.29.a:0 "Ситуация меняется в худшую сторону."
klugetown.30.t:0 "Айви Мяолин выступает на главной площади"
klugetown.30.d:0 "Это казалось практически невозможным. Всего несколько дней назад Центральная Площадь города находилась под полным контролем сил Верко и все попытки протестующих пробиться туда оканчивались для них весьма печально. Однако рано утром того самого дня Верко сообщили о наступлении Революционной Гвардии на основные части торгового квартала. Туда немедленно были стянуты силы со всего города — однако красные к тому моменту уже успели построить баррикады и занять оборону на нескольких крупных улицах и во всех примыкающих к ним переулках. Попытки службы безопасности добраться до площади были встречены волной шквального огня из множества самодельных винтовок и потерей нескольких сотрудников.\n\nБлиже к полудню на площадь прибыл и сам лидер коммунистов Айви Мяолин. Каким образом ему удалось добраться из нижних кварталов до занятых коммунистами районов без прямой связи между этими частями города — сказать довольно трудно. Однако как только он там появился — на площадь стянулись по меньше мере несколько десятков тысяч зевак самого разного возраста и биологического вида. Здесь были все — от котов и зебр до минотавров и разумных членистоногих. И все они с большим энтузиазмом слушали выступление Айви Мяолина из первых рядов.\n\n— Товарищи! Сегодня в самом сердце нашего города происходит историческая битва против тирании разбойника Верко и деспотичного капитализма. Преступные группировки и сросшийся с ними финансовый капитал много лет угнетали рабочий класс нашего славного города. Но сегодня наше терпение подошло к концу. В этой битве мы готовы пойти до конца и либо погибнуть в бою за правое дело — либо подарить всем вам свободу и низвергнуть проклятую буржуазную власть. Именно поэтому сегодня я — согласно вверенному мне мандату председателя Социалистической Демократической Рабочей Партии Клуджтауна и от имени ее Центрального Комитета — провозглашаю основополагающие принципы нашей Социалистической Революции.\n\nМы требуем свободы профсоюзной и политической деятельности для всех представителей рабочего класса! Мы требуем установление директивного ограничения рабочего времени на уровне восьми часов в день и не более сорока двух часов в неделю для всех работников всех предприятий города! Мы требуем призвать к ответу бандитов и капиталистов за их преступления против трудового народа! Мы требуем передачи власти демократически избранным советам рабочих представителей и провозглашение социалистической Революционной Коммуны! Да здравствует Революция! Да здравствует социализм!"
klugetown.30.a:0 "Какого черта его еще не пристрелили?"
klugetown.31.t:0 "Общенациональная забастовка"
klugetown.31.d:0 "Операции по умиротворению нижний уровней проходили в полном соответствие с планом Верко. Или по крайней мере — ему самому хотелось так думать. Недавний инцидент с захватом целого квартала торгового района был максимально неприятным — но спустя некоторое время службе безопасности все же удалось вернуть себе контроль над Центральной Площадью города. Правда — к большому сожалению — лидер всего этого балагана к тому моменту уже скрылся и поймать его так и не удалось.\n\nОднако сейчас господа в высоких кабинетах старались об этом не думать. Подходило время для ужина и они надеялись побаловать себя несколькими сменами традиционных для такого случая блюд — в том числе знаменитое мясо со специями по старинному аквелийскому рецепту. Но когда все уже было готово и оставалось только подать на стол блюда — из кухни пришло неожиданное известие. Практически все поставки с утра прекратились и для приготовления ужина пришлось использовать только домашние запасы. В результате меню было значительно упрощено и походило скорее на обед среднего торговца нежели представителя высшей иерархии криминальных структур.\n\nВерко немедленно потребовал объяснений этому безобразию. Дворецкий некоторое время пытался молчать — но затем был вынужден раскрыть господину всю горькую правду. Несколько дней назад с подачи Социалистической Демократической Рабочей Партии по всему городу началась забастовка. В ней принимали участие практически все наемные работники — в том числе и грузчики в воздушных доках. В результате огромная часть продукции так и не была доставлена на рынок и осталась гнить на складе — и даже постоянный поставщик особняка Верко столкнулся с одномоментной потерей большей части своего персонала и был вынужден остановить торговлю во избежание еще больших убытков.\n\nЗа считанные дни забастовка практически полностью парализовала городскую жизнь. Рабочие выходили на улицы с самодельными плакатами в сопровождении отрядов Революционной Гвардии и просто отбирали у торговцев еду без всякой оплаты. В особых полевых кухнях на нижнем уровне можно было бесплатно получить тарелку горячего супа и несколько кусочков хлеба — даже если ты не был участником забастовки. Айви Мяолин назвал такое положение "полевым коммунизмом" и рассчитывал в скором времени взять торговый квартал измором. Без возможности получения товаров для продажи у них оставался только один выход — спускаться на нижние уровни и пользоваться услугами профсоюзных структур. Для агентов и сторонников Верко такой возможности не было — и они просто не находили себе места. Общество пребывало в состоянии полного социального коллапса."
klugetown.31.a:0 "Да сделайте вы уже хоть что-нибудь!"
klugetown.32.t:0 "Покушение на Верко"
klugetown.32.d:0 "Ситуация в городе становился все более напряженной с каждым днем. Революционные бригады стремительно пополняли свои ряды за счет бастующих рабочих и брали под контроль целые кварталы. Всех агентов Верко и сотрудников его личной службы безопасности постепенно выгоняли даже из собственных домов — и они были вынуждены искать убежище за стенами элитных особняков самых состоятельных жителей города. Однако даже там никто не мог поручиться за их безопасность. Активисты Социалистической Партии каждый день собирались под окнами и запускали в них большие камни и кирпичи. Нередко вместе с ними приходили и несколько вооруженных красных гвардейцев — и просто так разогнать эту толпу было невозможно.\n\nВ связи с этим некоторые давние партнеры Верко рекомендовали ему на время покинуть город. По крайней мере — до момента наведения на его территории хотя бы относительного порядка. У него для этого даже было отличное место — небольшой двухэтажный домик на берегу моря недалеко от границ Мейндалуссии. Если бы он только пожелал — частный воздушный корабль доставил бы его туда менее чем за сутки. И хотя самому Верко поначалу эта затея не нравилась — после очередного разбитого окна и пролетевшего буквально в нескольких метрах от него камня он согласился.\n\nМежду его особняком и доками был длинный и не самый безопасный путь. Поэтому большую его часть он проведал в составе длинного кортежа их автомобилей с закрытыми окнами. О перемещении по городу босса Мафии не было известно никому кроме нескольких приближенных и его сыновей — которые ехали вместе с ним в одной машине. То есть — ничего не предвещало беды. Однако неожиданно их автомобиль сильно тряхнуло и они вынуждены были остановится. Верко выскочил на улицу и увидел вокруг себя только горящие остовы остальных автомобилей в колонне. На этот раз коммунистические диверсанты действовали наверняка и использовали по меньшей мере несколько десятков бомб одновременно.\n\nПерестрелка между террористами и службой охраны продолжалась несколько минут. За это время один из нападающих увидел Верко и попытался выстрелить в него — но пуля пролетела мимо. Тогда он крикнул другому — и тот уже смог прицелиться получше. Криминальный босс был легко ранен в плечо — однако ни о каком движении в сторону пристани больше не могло идти и речи. Всем оставшимся в живых участникам операции пришлось возвращаться домой. Доктор быстро обработал и перевязал рану Верко и по его прогнозам она должна была затянуться менее чем за одну неделю. Однако теперь единственным относительно безопасным местом для него был только его особняк — любая попытка выбраться в город легко могла закончится его гибелью."
klugetown.32.a:0 "Это определенно слишком далеко зашло."
klugetown.33.t:0 "Революция [GetYear] года"
klugetown.33.d:0 "Айви Мяолин сидел в темном помещении цеха одного из бастующих заводов и ловил на себе многозначительные взгляды других членов Центрального Комитета недавно организованной партии. Принятие самого судьбоносного для них решения теперь зависело только от него. Несколько часов назад Рабочий Совет большинством голосов выдвинул предложение о полномасштабном восстании с захватом всего торгового квартала и окончательным закреплением власти трудящихся над всем вольным городом. Большая часть региональных советов поддержали это предложение. Однако в рядах партии не было единого мнения на этот счет и голоса разделились практически поровну — и потому бремя принятия решения теперь было на председателе.\n\nС одной стороны — более идеального момента сложно было придумать. За последние несколько месяцев рабочее движение добилось огромных успехов и находилось на пике своего могущества. Дальше — только его постепенное вырождение и медленное наступление Верко. Если они не выступят сегодня — их исторический шанс окажется упущен. Но с другой стороны — этот шанс все равно был невелик. И в случае провала эта авантюра похоронила бы партию вместе со всеми рабочими советами и навсегда уничтожила перспективу строительства социализма в Западной Зебрике. Необходимо было пойти на риск — или отказаться от него.\n\nНо в итоге Айви принял единственно верное решение. Выступать нужно немедленно. Верко скорее всего уже крепко спит — и под покровом ночи Революция выломает дверь его роскошного особняка и навсегда положит конец тирании преступников и капиталистов над рабочим классом. Начать восстание по всей территории города — такова была директива партии и Рабочего Совета.\n\nМенее чем за один час революционные бригады покинули свои цеха и заняли все ключевые объекты в городе. Гарнизон службы охраны пытался сопротивляться и несколько часов вел оборону против превосходящих сил врага — но в итоге был захвачен в плен и разоружен в полном составе. Вместе с его оружием толпа направилась в сторону особняка Верко. Все произошло настолько быстро — что соглядатай Мафии с трудом успел добежать до своего господина на несколько минут раньше появления толпы. Верко проснулся и немедленно услышал за окном шум. Как можно скорее он попытался переодеться из пижамы в костюм и собрать все необходимое для побега. Но прежде чем он успел даже подумать об этом — революционная гвардия уже ворвалась на первый этаж и быстро продвигалась в его сторону. Айви Мяолин лично распахнул дверь спальни Верко и застал самое могущественное существо в городе со спущенными штанами в состоянии дикого первобытного страха. Норберт и Даггетт были пойманы несколько минут спустя и также арестованы новым Революционным Правительством Клуджтауна."
klugetown.33.a:0 "Рабочий класс завоевал себе свободу!"
klugetown.34.t:0 "Смерть старого порядка"
klugetown.34.d:0 "Верко сидел на холодном полу со связанными за спиной лапами. Рядом с ним были его сыновья и верный слуга Сал Морригат — а также множество других криминальных авторитетов вольного города. На телах некоторых из них были видны следы борьбы — они до последнего сопротивлялись революционной гвардии и поплатились за это в лучшем случае половиной зубов. Рабочие с большим восторгом пинали своих мучителей и издевались над ними. Верко точно знал — ничего хорошего их не ждет. В глазах восставшего народа они не заслуживали милости.\n\nВсе помещение выглядело сырым и крайне неуютным. Раньше это был подвал службы охраны самого Верко — именно сюда его агенты приводили пойманных им бунтовщиков и часто запытывали их до смерти в попытках получить больше информации. На некоторых камнях все еще виднелись следы крови и засечки от пыточных инструментов. Теперь же в подвалах оказались их владельцы — и одна только мысль об этом внушала многим из них подлинный ужас. Даггетт громко кричал и требовал немедленно освободить его — и даже Норберт на этот раз не пытался успокоить брата. Он просто сидел рядом с отцом и молчал.\n\nВсего было собрано порядка пяти сотен созданий — в основном это были представители высшей преступной иерархии и наиболее жестокие исполнители младшего звена — а также несколько десятков приближенных к ним магнатов и собственников крупных предприятий. Все они заочно предстали перед Особым Революционным Трибуналом и были приговорены к смертной казни.\n\nВ комнату вошел крепкого вида кот с большим количеством шрамов на теле. Очевидно — раньше он был работником на одном из заводов и получил все эти повреждения за годы контакта с небезопасным оборудованием. Взгляд кота был полон ненависти и презрения. За его спиной двое революционных гвардейцев начали заряжать свои винтовки. Сухим голосом он прочитал короткий текст приговора и без капли сожаления отдал приказ открыть огонь.\n\nУ Даггетта началась истерика — он попытался набросится на своего палача и грозно обнажил когти. Однако первый же выстрел заставил его замолчать. Безжизненное тело огромный крысы с легким стуком рухнуло на каменный пол. Из глаз Верко впервые с момента смерти его любимой жены полились слезы. Норберт был убит пулей несколько секунд спустя. Один за другим тираны и мучители вольного города встречали свою смерть. Верко остался последним — в полном отчаянии он смотрел на тела своих сыновей и беззвучно рыдал об их несчастной судьбе. Прозвучал последний выстрел — и его страдания оборвались вместе с жизнью."
klugetown.34.a:0 "Так вершится революционное правосудие."
klugetown.35.t:0 "Революционные бригады рабочего класса"
klugetown.35.d:0 "Ситуация в городе оставляла желать лучшего. После Революции существующие до этого институты управления посыпались окончательно и население оказалось трудно удерживать в определенных рамках. Увеличение уровня преступности и остановка целого ряда отраслей экономики способствовала прекращению торговли и возникновению черного рынка. Инфляция превысила все мыслимые значения и особенно сильно это сказывалось на населении торгового квартала. Необходимо было что-то делать и как можно скорее.\n\nПлан экономического восстановления вольного города был создан Рабочим Советом при участии целого ряда специалистов из числа бывших экономических советников из управления национализированных предприятий. Благодаря своему опыту они вновь заняли места в управлении и постепенно налаживали производство в совершенно новых условиях. Однако необходимо было также обеспечить безопасность граждан и остановить дальнейшую эскалацию насилия и маргинализацию общественной жизни.\n\nАйви Мяолин выдвинул предложение о сохранении особого статуса Революционной Гвардии и ее превращение в регулярные боевые и милицейские части внутри вольного города. В соответствие с идеями Карамель Маркс — регулярная армия должна быть распущена и заменена всенародным ополчением. А поскольку единой централизованной армии в Клуджтауне никогда не было и ее с самого начала подменяли частные криминальные структуры — вопрос о создании подлинного социалистического органа общественной безопасности вставал как никогда остро.\n\nВсего под контролем Рабочего Совета было по меньше мере двадцать шесть крупных бригад. Однако этого критически не хватало. Необходимо было подготовить в несколько раз больше и направить по крайней мере несколько сотен рабочих в торговый квартал. При этом либертарное крыло оппозиции настаивало на сокращении времени обязательной службе и принудительной ротации кадров — чтобы работники не становились аналогом профессиональной буржуазной полиции и могли совмещать свой основной род деятельности с охраной общественного порядка. Айви Мяолин вынужден был согласится с этим требованием и таким образом потребность в кадрах увеличилась еще в несколько раз.\n\nНаселение торгового квартала поначалу относилось к пришлым рабочим бригадам с явной неприятием и даже враждебностью. Однако уже через несколько дней ситуация начала постепенно меняться. Уровень преступности во всех основных районах города стал падать и рядовые граждане постепенно привыкли к народной милиции. Правление Рабочего Совета оказалось не таким страшным как многие себе представляли — или по крайней мере так могло показаться на первый взгляд."
klugetown.35.a:0 "Крысы будут бояться и ненавидеть нас."
klugetown.36.t:0 "Назначения по итогам выборов"
klugetown.36.d:0 "Первые выборы в революционные рабочие советы прошли в довольно нервозной обстановке. Нижние уровни пребывали в состоянии глубокого экономического упадка и в целом город довольно сильно пострадал от действий Мафии против социалистического подполья и ответных ударов во время Революции.\n\nОднако это был важный этап создания полноценного рабочего государства и Айви Мяолин настаивал на проведении выборов именно сейчас и создании нового постоянного Партийного Комитета и Комитета Управления при Рабочем Совете. Необходимо было ввести в него больше представителей пролетариата и беспартийных сторонников Революции — для размывания уже набирающего силу централистского движения. Мяолин хорошо помнил последствия строгой идеологической централизации в Сталлионграде и к чему она привела так любимое многими детище Стила Сталлиона в копытах оторванных от рабочего класса бюрократов. Повторение этого сценария в Клуджтауне не было выгодно Айви Мяолину и потому он решил позаботиться о расширении принципов классовой социалистической демократии до более прогрессивных стандартов.\n\nСреди избранных лиц были представители самых разных биологических видов и рабочих профессий. С некоторыми из них Мяолин был лично знаком уже как минимум несколько лет — а некоторых видел в первый раз в жизни. Однако все они были представителями рабочего класса и это было их главным преимуществом перед многими другими революционными политиками. Хотя сам Айви Мяолин был представителем аристократической фамилии — он отрицал возможность подлинной рабочей демократии без прямого участия пролетариата в управлении государством. Именно это позволило ему более решительно требовать от организаторов выборов составление списков на основании классовой принадлежности и таким образом обеспечить доминирование пролетариата в будущей системе управления революционной республикой.\n\nСразу после оглашения результатов выборов и формирования обновленного кабинета Мяолин встретился со своими новыми коллегами и долго обсуждал с ними дальнейшие перспективы революции. Каждый из них произвел на него впечатление грамотного и способного собеседника — хотя многие из них с трудом смогли бы вспомнить некоторые базовые положения марксисткой теории. Однако для него намного более важными критериями были честность и преданность идеалам Революции. По его же собственным словам — неопытность в политических вопросах была предпочтительнее строгого идеологического формализма и ее спокойно можно было компенсировать более широким участием трудящихся масс в управлении государством."
klugetown.36.a:0 "Именно они поведут Революцию вперед."
klugetown.37.t:0 "Каппер покидает Клуджтаун"
klugetown.37.d:0 "Фигуры шестерых котов суетились вокруг любезно предоставленного им в личное пользование воздушного корабля. Добродушный великан Макс помогал своим друзьям заносить внутрь все тяжелые вещи, пока остальные готовились к отлету. Айви Мяолин появился на пристани совершенно неожиданно. Он пришел сюда абсолютно один и ничего при этом не опасался — хотя ближайшие соратники рекомендовали ему передвигаться по городу только в сопровождении нескольких революционных гвардейцев.\n\nКаппер стоял на причале возле корабля и с явным сожалением смотрел на город — уже почти три года это место было домом для него и его друзей и даже оккупация войсками Короля Шторма не заставила их покинуть это место. Но теперь они приняли твердое решение уехать. Его поддержали все друзья Каппера и он сам. Мяолин узнал об этом одним из первых и не только не стал препятствовать этому — но и согласился предоставить им все необходимое для долгого полета. Именно поэтому когда лидер Революции неожиданно появился в доках — для Каппера это вовсе не было неприятным сюрпризом.\n\n— Зачем ты здесь? — непринужденно спросил Каппер и Мяолин настолько же непринужденно ответил что просто пришел попрощаться. Предстоящий диалог был слишком неприятен для них обоих и они отлично это понимали. Но Мяолин все же задал вопрос первым и Каппер был вынужден не него ответить. — Как бы сильно мне не хотелось остаться — я просто не могу этого сделать. Новый Клуджтаун мне не подходит. Идеалы вашей Революции слишком радикальны для меня и моих друзей. Вы своими лапами строите совершенно не тот город в котором мы хотели бы жить — и этот новый мир нам совсем не нравится. Не принимай это как личное. Ты — прекрасный кот и отличный собеседник. Но я не могу и не хочу принимать твои правила и жить в построенном тобой идеальном мире. Это просто не по мне. Я надеюсь — ты не станешь обижаться на меня за это.\n\n— Я понимаю. — Ответил Айви Мяолин без единого намека на недовольство. — Идеи пролетарской Революции могут отпугивать таких молодых идеалистов как ты. Это абсолютно нормально. Но Революция — это единственный способ достижения социального прогресса. Рано или поздно мы все придем к понимаю этой истины. Это просто неизбежно.\n\n— Если это так — значит когда-нибудь мы снова встретимся. — Спокойно ответил Каппер и с чемоданом направился в сторону трапа. — Но пока что я вынужден с тобой попрощаться. — Айви проводил Каппера глазами и тяжело вздохнул. Шедоу на палубе дала сигнал на взлет и лидер Революции молча наблюдал за медленно удаляющимся силуэтом воздушного корабля."
klugetown.37.a:0 "Революция никого не удерживает."
klugetown.38.t:0 "Манифест вольного города"
klugetown.38.d:0 "С момента Революции прошло больше полугода. Все основные социалистические реформы были проведены и новое государство родилось из руин старого клептократического режима. Пролетарская демократия была установлена и защищена лидером Революции Айви Мяолином и впервые в истории Зебрики социализм был провозглашен и установлен на территории независимого государства.\n\nПервые декреты Революционного Правительства были направлены на улучшение качества жизни трудящихся и преодоление капитализма на его территории. Все крупные предприятия были национализированы и переданы в управление демократически избранным комитетам и профсоюзным организациям. Мелкая торговля была поставлена под контроль государства для борьбы со спекуляцией и незаконным оборотом оружия и наркотиков. Огромные прибыли — которые раньше шли на приобретение местной элитой предметов роскоши и выводились в иностранные банки — были направлены на строительство социальной инфраструктуры и реорганизацию жилищного фонда. Согласно данным Рабочего Совета — более половины жителей города все еще влачили жалкое существование в трущобах или в домах без центрального отопления и электричества.\n\nАйви Мяолин поставил грандиозную задачу — преодолеть бедность и решить проблему социального неравенства менее чем за три года. Для этого все общество должно было быть вовлечено в социальное строительство и строительство обновленных институтов управления. Широкое демократическое участие на всех уровнях позволило бы оперативно принимать решения и грамотно распределять значительные ресурсы сугубо на необходимые простому народу вещи. Любые проявления гедонизма следовало искоренить — в особенности внутри самой Социалистической Демократической Рабочей Партии и Рабочего Совета. Лидеры Революции должны были вдохновлять трудящиеся массы своим собственным примером и составлять единое целое с ними — для этого значительная часть нового аппарата управления была составлена исключительно из рабочих.\n\nОднако Революция открывала новые возможности не только для одного города. Клуджтаун был всего лишь первым шагом на пути к освобождению всей Западной Зебрики от тирании капитализма. Айви Мяолин публично провозгласил конечную цель своего предприятия — распространить Революцию на территории Мейргипта и Абиссинии. В своем обращении ко всем трудящимся Западной Зебрики он подчеркнул необходимость объединения под знаменами социализма и совместную борьбу за единую демократическую федеративную республику — без различия культуры или биологической принадлежности."
klugetown.38.a:0 "Да здравствует Революционная Коммуна!"
klugetown.39.t:0 "Прибытие рабов из Клуджтауна"
klugetown.39.d:0 "Между нашим Правительством и фактически управляющими Вольным Городом Клуджтаун мафиозными структурами был заключен договор о покупке крупной партии рабов. Многие из них оставались в городе со времен его оккупации силами Короля Шторма и в целях обеспечения внутренней безопасности глава местного преступного синдиката решил продать их нам по довольно скромной цене.\n\nВ данный момент воздушные корабли с торговой меткой Вольного Города уже прибыли в нашу столицу и занимаются передачей товара его новым владельцам. Один из крупнейших рынков уже выставил большую их часть на торги и несколько состоятельных рабовладельцев выразили явную готовность перекупить их по более высокой цене нежели они были нам проданы. Таким образом — наше государство извлекло выгоду из данного предприятия."
klugetown.39.a:0 "Огромное спасибо."
klugetown.40.t:0 "Прибытие рабов из Клуджтауна"
klugetown.40.d:0 "Между нашим Правительством и фактически управляющими Вольным Городом Клуджтаун мафиозными структурами был заключен договор о покупке крупной партии рабов. Многие из них оставались в городе со времен его оккупации силами Короля Шторма и в целях обеспечения внутренней безопасности глава местного преступного синдиката решил продать их нам по довольно скромной цене.\n\nВ данный момент воздушные корабли с торговой меткой Вольного Города уже прибыли в нашу столицу и занимаются передачей товара его новым владельцам. Один из крупнейших рынков уже выставил большую их часть на торги и несколько состоятельных рабовладельцев выразили явную готовность перекупить их по более высокой цене нежели они были нам проданы. Таким образом — наше государство извлекло выгоду из данного предприятия."
klugetown.40.a:0 "Огромное спасибо."