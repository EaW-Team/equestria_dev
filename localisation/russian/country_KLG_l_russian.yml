l_russian:

KLG_GATHERING_STORM_DESC: "Много десятилетий назад на границе двух крупных региональных держав Западной Зебрики — Абиссинии и Мейргипта — различными криминальными элементами и вольными торговцами был основан Город Клуджтаун. Формально обе страны претендуют на эти территории — но благодаря их разногласиям местная Мафия продолжает контролировать регион. Даже завоевания Короля Шторма не сильно изменили для них ситуацию. Однако когда его гарнизоны покинули город — обнажилось огромное количество внутренних проблем. Сумеем ли власть Мафии устоять или же у города появятся новые лидеры?"

EAW_WS_KLG:0 "[Root.GetNameDefCap] - Криминальная гавань"
EAW_WS_KLG_desc:0 "Еще в далеком 943 году ПИЛ это был всего лишь средних размеров торговый узел вдалеке от пограничников §3Абиссинии§! с несколькими десятками домиков и одним трактиром с дешевым пойлом. Но затем этот трактир и землю вокруг него купил могущественный криминальный авторитет — §gКарло Родриго Мор§!. Этот представитель малого народа разумных грызунов не только сумел найти верный подход к региональной власти и уговорить их закрыть глаза на некоторые его незаконные действия — он фактически создал §Yнезависимое государство§! без международной юрисдикции.\n\nВ 977 году ПИЛ §gКарло§! умер и передал бразды правления §8Клуджтауном§! своему сыну §gВерко§!. Под его лаповодством город был значительно расширен. §3Абиссиния§! несколько раз предпринимала попытки вернуть его в сферу своего влияния — но всякий раз терпела неудачу. Причинами этого были недовольство со стороны §YМейргипта§! и внутреннее сопротивление некоторых дворян — для которых в частности рынки §8Вольного Города§! были единственным способом получить нелегальные в §3Абиссинии§! вещества. Как говорил об этом сам §gВерко§! — "Один из главных залогов безопасности нашего бизнеса — это вне всяких сомнений производство §Yкошачьей мяты§!".\n\nВо время вторжения §CКороля Шторма§! в §3Абиссинию§! §gВерко§! не стал оказывать никакого сопротивления. Вместо этого он довольно легко сумел договорится с завоевателем и даже получить от него военную помощь в виде постоянного гарнизона из наемников. В обмен рынки §8Клуджтауна§! предоставляли армии §CКороля§! весьма приятную скидку на все виды оружия. Незадолго до §YБитвы при Эйн-Тротгуре§! §PЭлементы Гармонии§! прибыли в город с неофициальным визитом и едва не были проданы в рабством местным жителем по имени §PКаппер Дапперпаус§!. Однако в последний момент он передумал и вместо этого помог им добраться до §YГоры Арис§!. Совместно с силами §YГиппогрифии§! и восставшими против §CКороля Шторма§! пиратскими бандами из Макавии §PЭлементы Гармонии§! смогли одержать победу на армией Шторма и убить его самого.\n\nИмперия начала разваливаться и это не лучшим образом сказалось на внутренней стабильности §8Вольного Города§!. Вместе с §Pгармонистами§! голову постепенно начинают поднимать и §Rсоциалисты§! во главе с известным левым радикалом §RАйви Мяолином§! и если §gВерко§! намерен удержать власть — ему придется действовать быстро и решительно."

KLG_verko:0 "Верко"
KLG_verko_trait: "Проницательный торгаш"
KLG_verko_desc: "§YДата и место рождения:§! 948 ПИЛ, Клуджтаун\n\n§YБиография§!: Семья Верко была хорошо известна в криминальных кругах Абиссинии на протяжении нескольких поколений. На момент его рождения отец будущего криминального босса уже начинал строительство своего идеального города — примерно в середине 40-ых годов 10 века ПИЛ он обосновался на территории небольшого транспортного узла в пустыне между Мейргиптом и Абиссинией и под его управлением будущий Вольный Город Клуджтаун начал быстро расти и привлекать большое количество новых лиц.\n\nВерко унаследовал криминальную Империю отца в возрасте 29 лет. Уже тогда его имя наводило страх на многих обитателей Западной Зебрики или наоборот — внушало искренне уважение и благоверный трепет. Образ мышления этого криминального гения находится за гранью понимания многих его младших партнеров — однако его методы приносят Пустынному Картелю огромные деньги и потому они стараются не задавать лишних вопросов.\n\nПри желании Верко спокойно мог договорится с кем угодно. Даже во время оккупации города силами Короля Шторма ему удалось без особого труда уболтать завоевателя оставить ему полную власть над городом и фактически передать в пользование несколько подразделений его же собственной армии в обмен на некоторые дивиденды для его страны и несколько пожеланий приватного характера. Король Шторм был разгромлен и вся его Империя погибла вместе с ним — но Верко умудрился извлечь из этого выгоду и успешно нагреть лапы на наследии грозного завоевателя.\n\nДолгие годы управления нелегким семейным бизнесом были весьма удачными для него. Однако в последнее время он все больше чувствует неизбежное дряхление своего организма и задумывается о передаче дел одному из своих сыновей. Или по крайней мере — о подготовке к возможной передаче дел достойному наследнику после смерти."
KLG_capper:0 "Каппер Дапперпаус"
KLG_capper_trait:0 "Убежденный гармонист"
KLG_capper_desc: "§YДата и место рождения:§! 983 ПИЛ, Пантера\n\n§YБиография§!: Большую часть своей жизни Каппер Дапперпаус был хорошо известен разве что Королевской Жандармерии своего родного города. О его раннем детстве практически ничего не известно даже ему самому. Первые воспоминания Каппера были связаны с приютом для бездомных котят — именно там он впервые познакомился со своим лучшим другом Чаммером и остальными котами из одной из самых известных уличных банд Пантеры. Вместе они проникали в дома богатейших аристократов и банковские хранилища и за много лет никому так и не удалось поймать хотя бы одного из них.\n\nВторжение Короля Шторма в Абиссинию заставило Каппера и Чаммера в спешке покинуть Пантеру. Во время своего долгого путешествия они случайно стали обладателями одного из самых ценных сокровищ рода Клаомонов — Малахита Несчастья. Этот древний артефакт с довольно мрачной репутацией был среди многочисленных трофеев Штормовой Эскадры — но был утрачен в результате строго засекреченного инцидента на одном из воздушных кораблей. Вместе с Малахитом Несчастья друзья прибыли в Клуджтаун и попытались продать его местному криминальному авторитету Верко. Однако в самый последний момент одурманенный магией Малахита и возможностью быстро обогатиться Чаммер сорвал сделку и сбежал — и Каппер вынужден был взять на себя все их совместные обязательства перед Мафией и выплатить ей огромный денежный долг.\n\nПосле этого он старался не заводить себе новых друзей и просто выживать за счет воровства и обмана. Однако встреча с Элементами Гармонии радикально изменила его жизнь. Вместе с ними он участвовал в битве при Эйн-Тротгуре в составе добровольческого корпуса из Макавии и показал себя настоящим героем. Благодаря своим лидерским качествам он сумел завоевать доверие жителей вольного города и возглавить нацию после долгой и упорной борьбы за освобождение от власти Мафии. И теперь он будет стремится превратить Клуджтаун в Казу юга — оплот гармонии и свободного рынка в Западной Зебрике."
KLG_iwie_meowlin_leader: "Айви Мяолин"
KLG_true_radical_trait: "Настоящий радикал"
KLG_iwie_meowlin_leader_desc: "§YДата и место рождения:§! 975 ПИЛ, Тигерай\n\n§YБиография§!: Родителями Айви были представители древнего и некогда весьма могущественного дворянского рода из Южной Абиссинии. Однако к моменту его рождения от былого могущества прежней династии осталось одно воспоминание. Его отец занимал совершенно неприметную должность при дворе местного князя и воспитывал своего сына для государственной или военной службы. Однако Айви гораздо больше интересовали социальные науки и иностранная литература. В частности — во время обучения в Королевском Институте Пантеры один из преподавателей подарил ему запрещенное в Абиссинии издание "Капитала" Карамель Маркс на винбардийском языке.\n\nАйви отлично знал этот язык и знакомство с идеологией марксизма произвело на него особо яркое впечатление. Еще будучи студентом он пытался организовать в столице подпольную организацию революционеров и некоторое время даже состоял в Социалистической Партии Абиссинии — но затем покинул ее из-за разногласия с лаповодством по поводу Сталлионграда и его модели социалистического строительства.\n\nВ 1001 году Мяолин окончательно покинул Абиссинию и перебрался в Клуджтаун. Там он специально устроился на работу на одну из местных фабрик для сближения с рабочим классом и агитации среди своих коллег. За более чем пять лет здоровье молодого Айви было сильно подорвано тяжелым трудом — однако он даже не думал бросать свою идею о создании социалистического государства нового типа — отличного от партийной модели Стила Сталлиона и Альтидии Револьцовой. Под его началом в 1006 году — во время оккупации страны силами Короля Шторма — была создана подпольная Социалистическая Демократическая Рабочая Партия Клуджтауна. Сразу после начала массовых протестов Мяолин увидел в этом шанс осуществить социальный переворот и благодаря своим ораторским талантам и помощи верных товарищей он сумел низвергнуть власть Мафии и запустить в Клуджтауне один из самых смелых социальных экспериментов в истории Зебрики или даже всего мира."

KLG_banned_mafia_trait: "Коллапс системы"

KLG_sal_morrigat: "Сал Морригат"
KLG_sal_morrigat_trait: "Консильери"
KLG_sal_morrigat_desc: "§LМного лет назад Верко подобрал юного сироту Сала на улице и ввел его в свою семью. Этот представитель малочисленного народа разумных носорогов обладает огромной силой и огромной преданностью к приютившему его преступному клану и лично его лидеру. Долгое время его основной задачей было выбивание долгов из особо наглых партнеров с помощью запугивания и грубой силы. И он справлялся с этим просто великолепно. Однако с недавних пор Сал Морригат был возвышен до Консильери — второго существа во всем клане и вероятного приемника босса. Однако Сал никогда не стремился к власти в клане и он отлично понимает свою главную задачу — подготовить наследника Верко к его будущей роли.§!"
KLG_norbert: "Норберт"
KLG_norbert_trait: "Старший сын"
KLG_norbert_desc: "§LНорберт во многом похож на своего отца. Его острый ум и прагматичность заметно отличают его от многих других криминальных авторитетов Клуджтауна и именно это делает его наиболее вероятным наследником Верко в будущем. Однако некоторые капитаны считают Норберта слишком мягким и зацикленным на соблюдении Кодекса Чести преступного мира и предпочитают его более прямолинейного и жестокого брата Даггетта. Однако сам Норберт считает своего младшего брата откровенно недалеким и при любой удобной возможности демонстрирует ему свое интеллектуальное превосходство.§!"
KLG_daggett: "Даггетт"
KLG_daggett_trait: "Младший сын"
KLG_daggett_desc: "§LВерко не слишком любит говорить про своего младшего сына. Только иногда упоминает его в положительном ключе как "свою лучшую бешеную ищейку". Даггетту определенно не хватает прагматичности и проницательности своего отца и старшего брата и для многих членов клана он остается всего лишь молодым авантюристом с горячей головой и железным сердцем. Однако для наиболее жестких преступных группировок именно Даггетт воплощает в себе надежду на возведение криминальной сущности вольного города в абсолютную власть ножа и пистолета.§!"

KLG_gretchel_la_vignette: "Гретхель Ла Виньет"
KLG_gretchel_la_vignette_desc: "§YДата и место рождения:§! §L19 мая 985 ПИЛ, Аквила§!\n\n§YБиография§!: §LУдивительно — но далекие предки этой грифонихи были одними из самых влиятельных аквелийских дворян на заре зарождения Королевства. Однако спустя много лет ее отец промотал все их состояние и был вынужден продать свое поместья ради оплаты огромных долгов. Гретхель родилась в богадельне Аквилы и с раннего детства была вынуждена воровать чтобы выжить.\n\nВ 12 лет ее отправили в колонию для несовершеннолетних преступников и там она познакомилась с сыном одного известного разбойника и помогла ему организовать побег. В благодарность он помог ей влиться в банду и благодаря своему характеру она очень быстро завоевала там значительный авторитет. После неожиданной гибели главаря именно Гретхель была избрана его преемницей и превратила обычную лесную банду в группу охотников за наживой. Они работали на любого кто мог предложить достойную цену и во время своего путешествия по Зебрике записались в армию Короля Шторма.\n\nТак судьба привела Гретхель и ее банду в Клуджтаун и это позволило ей заключить сделку с неформальным главной этого города. И она готова служить ему верой и правдой — если у него достаточно денег для оплаты ее услуг.§!"
KLG_felix_mortimer: "Феликс Мортимер"
KLG_felix_mortimer_desc: "§YДата и место рождения:§! §L4 сентября 954 ПИЛ, Амхамура§!\n\n§YБиография§!: §LЖизнь изрядно помотала этого старика. В молодости Феликс был сыном крупного землевладельца в провинции Амхамура и на земле его родителей работали десятки невольников из соседнего Мейргипта. Однако неожиданно сильная засуха и последовавший за ней голод полностью уничтожил его будущее и будущее его семьи. Урожаи так и не взошли и половина рабов умерла от голода. Остальные присоединились к стихийному восстанию и штурмом взяли особняк своего господина. Отец и мать Феликса были убиты самым жестоким способом прямо у него на глазах. А его самого — молодого изнеженного котенка — просто выкинули на улицу.\n\nЧудом ему удалось не умереть и постепенно он привык к своей новой жизни. Вокруг него начали собираться такие же как и он обедневшие дворяне и бывшие землевладельцы и вместе они создали банду Белые Коты. Основным родом ее деятельности была поимка беглых рабов и убийства тех, кого их бывшие хозяева не хотели видеть живыми. Несколько раз его банда подавляла региональные восстания рабов с особой жестокостью. Слава Феликса Мортимера добралась даже до Короля Шторма и он лично принял его банду в состав своей армии. В Клуджтауне он оказался совершенно случайно — однако и здесь для такой легендарной личности найдется работа.§!"
KLG_vartas_the_arsonist: "Вартас Поджигатель"
KLG_vartas_the_arsonist_desc: "§YДата и место рождения:§! §L22 июня 979 ПИЛ, Долина Мейрконга§!\n\n§YБиография§!: §LДаже за одно совершенное этим жеребцом преступление на родине его ожидала бы смертная казнь по законам Конкорд. А он совершил их бесчисленное множество. Вартас родился в бедной рыболовной деревне на берегу великой реки Мейрконг и после пожара в его родном доме был вынужден уйти в изгнание. По неподтвержденным данным — причиной того пожара стал именно он и его врожденный горячий темперамент. Вартас начал собирать вокруг себя других отверженных нириков и вместе с ними нападать на торговые караваны и угрожать богатым торговцам.\n\nНекоторые время судьба даже связала его с радикальной группировкой Пути Южного Сияния Кирин Руж — но затем ему надоело ограничивать себя просторами одного только бедного Хамрина и он покинул его и направился на запад. Поднимающая голову армия Короля Шторма с радостью приняла Вартаса в свои ряды. Во время похода на Великие Озера местные зебры дали ему прозвище Огненный Демон. Сотни деревень были полностью сожжены отрядом Вартаса.\n\nПосле подчинения Западной Зебрики Король Шторм на некоторое время сделал его помощником военного губернатора Клуджтауна. Однако после неприятного инцидента с огнем он был понижен до простого офицера гарнизона. Но его мрачная репутация продолжала приносить пользу для контроля над городом — и Верко надеется использовать ее также как это делал Шторм.§!"

KLG_gretchel_la_vignette_trait: "Молодая разбойница"
KLG_felix_mortimer_trait: "Беспощадный мститель"
KLG_vartas_the_arsonist_trait: "Пылающий ужас"

KLG_gretchel_la_vignette_adv_desc: "§LДля Гретхель Ла Виньет никогда не существовало такого слова как "невозможно". За свою жизнь она столкнулась с таким количеством трудностей и прошла такое количество испытаний — что ее единственным страхом является невозможность накопить денег на бутылку крепкого алкоголя. Эта отвязная преступница никогда не даст себя в обиду и даже существам в несколько раз больше стоит обходить ее десятой дорогой — если их цели хотя бы немного пересекаются. Во многих городах Грифонии и Зебрики за голову  Ла Виньет назначена крупная награда — но даже это никогда не мешало ей посещать эти города просто ради удовольствия — потому что ни у кого в здравом уме не возникает мысли поднять на нее лапу.§!"
KLG_felix_mortimer_adv_desc: "§LОснова мировоззрения этого кота — его безграничная ненависть ко всем свободолюбивым рабам. После того как его родителей — богатых плантаторов из Абиссинии — убили во время рабского восстания, он поклялся уничтожить каждого кто дерзнет поднять лапу на своего хозяина или хотя бы задуматься об этом. Много лет он терроризировал беглых рабов со своей бандой Белая Кошка и его жестокость была запредельной даже по меркам того времени. Мрачная репутация дает ему определенное преимущество на поле боя и за столом переговоров — а качественное образование и военный талант делают из него незаменимого полководца и виртуозного боевого стратега.§!"
KLG_vartas_the_arsonist_adv_desc: "§LГлавная особенность Вартаса состоит в его видовой принадлежности. От природы вспыльчивы и способный выйти из себя по любому пустяку — он при этом является кирином и каждое его возмущение сопровождается бурным огнем и массовыми разрушениями. Во время битвы Вартас вводит себя в состояние берсерка и уничтожает все на своем пути не только своим оружием — но и своим собственным огнем. Один вид этого чудовищного нирика парализует ряды врагов и заставляет их в ужасе покидать поле боя. Однако пламя все равно настигало их — за свою жизнь Вартас сжег и растоптал бесчисленное множество самых разных существ и оставил физические и ментальные раны на телах и в душах многих других.§!"

