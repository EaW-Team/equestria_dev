KLG_chummer_tailspring_gen_desc: "§YДата и место рождения:§! §L5 апреля 979 ПИЛ, Пантера§!\n\n§YБиография§!: §LЧаммер познакомился с Каппером Дапперпаусом когда они оба еще были бездомными котятами на улицах Пантеры. Вскоре к ним присоединилось еще четверо котов и вместе они создали одну из самых известных уличных банд своего времени. Полиция безуспешно пыталась их поймать в течении многих лет — но они всякий раз ускользали от нее и во многом это была заслуга Чаммера. Как правило именно он брал на себя организацию очередного дела и вовремя придумывал новые пути отхода — если запланированные изначально оказывались недоступными.\n\nВо время вторжения Короля Шторма в Абиссинию Каппер вместе с Чаммером покинули Пантеру и несколько недель бродили по пустыни в поисках безопасного места. Именно тогда они добрались до Клуджтауна. Во время путешествия у них в лапах оказался похищенный из сокровищницы династии Клаомонов Малахит Несчастья. Каким образом флотилия Короля Шторма умудрилась потерять этот невероятно ценный артефакт — осталось загадкой даже для него самого. Но так или иначе теперь обладателями Малахита были двое уличных воришек из Пантеры. В Клуджтауне они сразу попытались продать его местному криминальному авторитету. Однако во время заключения сделки Чаммер неожиданно сорвал ее и похитил воздушный корабль покупателя. Во время погони корабль оказался подбит и через несколько часов рухнул в пустыне далеко за городом — а Каппер остался должен одному из самых влиятельных барыг города огромную сумму денег.\n\nЧаммер смог пережить крушение и через некоторое время его подобрала семья алмазных псов с нижних уровней. Они вылечили его и много месяцев делили с ним хлеб — даже когда им самим было практически нечего есть. Чаммер осознал свою вину перед другом и во время Революции всеми силами пытался искупить ее — и Каппер сумел простить Чаммера. И теперь они вместе собираются сделать этот город самым лучшим местом по всей Западной Зебрике.§!"
KLG_admiral_fluffington_gen_desc: "§YДата и место рождения:§! §L19 октября 972 ПИЛ, Пантера§!\n\n§YБиография§!: §LОткуда этот кот умудрился раздобыть свой удивительный костюм с черным котелком и где он научился таким изысканным манерам — остается только гадать. Потому что несмотря на свой внешний вид или на свое имя он никогда не был аристократом или адмиралом. На самом деле он придумал это прозвище исключительно как маркетинговый ход — потому что никому бы не захотелось слушать обычного кота по имени Флафф Мяукис. В команде Каппера Адмирал Флаффингтон был главным источником умных мыслей и мастером на все лапы. Если нужно было взломать трудный замок или угнать воздушную лодку — это была работенка по его части.\n\nПереезд Адмирала Флаффингтона в Клуджтаун был связан вовсе не с нападением Шторма — а с последующим за этим экономическим и политическим кризисом. Конфискованные у королевской семьи сокровища были главным источником финансирования многих социально значимых институтов и без них страна медленно погружалась в депрессию. Адмирал решил попытать счастье в вольном городе Западной Зебрике — но и здесь его ожидало разочарование. Местные криминальные боссы требовали от него платы за право демонстрировать свое мастерство и поэтому в том числе он был так рад видеть своих друзей в рядах революционеров. Для Адмирала Флаффингтона это был шанс создать хотя в одном уголке мира идеальное общество для таких как он — и сегодня его работа в этом направлении только начинается.§!"
KLG_molly_astra_gen_desc: "§YДата и место рождения:§! §L25 февраля 985 ПИЛ, Пантера§!\n\n§YБиография§!: §LМолли Астра принадлежит к немногочисленному и малоизвестному подвиду карликовых абиссинских кошек. Несведущие часто принимают их за обычных котят — однако Молли вовсе не такая милая, какой могла бы показаться. Ее опыт в использовании взрывчатки сделал ее одним из самых известных подрывников еще во времена до прихода на эти земли Короля Шторма — тогда она еще жила в Пантере. В Клуджтауне она пользовалась славой самого результативного медвежатника и все криминальные авторитеты — включая самого Верко — далеко не один раз обращались к ней за помощью. Сегодня под ее началом в рамках внешней разведки вольного города был создан особый отдел саботажа — который занимался организацией взрывов ключевых военных объектов на территории врага.\n\nОднако если не считать ее необычный род деятельности — Молли действительно является очень милой и доброй кошкой. Для всех своих друзей она была и остается идеальной младшей сестренкой. У нее всегда есть идеи — как поднять им настроение или помочь справится с жизненными трудностями. Молли всегда выслушает их и всегда даст верный совет. Именно за это Каппер ценил свою давнюю подругу и до сих пор иногда приходит к ней за помощью. И всякий раз когда она его обнимает и тихонько мурлыкает при этом — все неприятные мысли очень быстро уходят и мир снова кажется наполненным радостью.§!"
KLG_big_maxis_gen_desc: "§YДата и место рождения:§! §L9 декабря 977 ПИЛ, Пантера§!\n\n§YБиография§!: §LМакс очень мало рассказывает о своем прошлом — как и о причинах его огромного роста и физической силы практически никому не известно. Его родители были самыми обычными котами среднего размера — однако с самого рождения Макс стал расти невероятными для абиссинца темпами и уже к своему третьему дню рождения был ростом с родителей. Сверстники часто издевались над его размерами — он же благодаря своему воспитанию не решался давать им отпор. Хотя при желании мог бы легко одолеть в драке любого из них или даже всех сразу.\n\nОн присоединился к банде Каппера после того как вынужден был уйти из дома в возрасте двенадцати лет. Скромное жилище его родителей было просто не способно выдержать такой огромный вес. Для группы уличных воришек громила оказался как нельзя кстати — местная полиция предпочитала держаться от великана и его друзей как можно дальше. И если надо было пробить стену или вынести тяжеленный сейф — силач Макс легко справлялся с этим. В Клуджтауне местные относились к нему с куда большим уважением — по понятным причинам. Это помогло ему преодолеть давний страх перед общением и постепенно начать социализироваться. Встреча со старым другом сделала его одним из самых ярых сторонников гармонии. Макс чувствовал себя комфортно только в компании настоящих друзей — и ему бы хотелось помочь всем жителям города достичь того же благодаря гармонии и истинной магии дружбы.§!"

KLG_taiko_paumurr: "Тайко Паумурр"
KLG_taiko_paumurr_trait: "Профсоюзный лидер"
KLG_taiko_paumurr_desc: "§LС самого начала восстания Тайко был самым влиятельным и амбициозным профсоюзным лидером. До этого он несколько лет выполнял роль младшего менеджера и отлично знал потребности своих подчиненных и по возможности старался ослабить давление со стороны собственника. Опыт управления позволил ему создать один из самых сильных профсоюзов во всем городе и направить всю его силу на помощь Айви Мяолину и его политической партии. При этом сам Тайко принципиально остается на позиции беспартийной поддержки рабочего класса и отказывается от вступления в любые иные политические организации кроме собственной профсоюзной коалиции.§!"
KLG_zabgunar_zongo: "Забгунар Зонго"
KLG_zabgunar_zongo_trait: "Свободный жеребец"
KLG_zabgunar_zongo_desc: "§LДо недавнего времени Забгунар не знал свободной жизни. Его родители были пойманы и проданы в рабство в Абиссинии за много лет до его рождения и хозяин разлучил его с семьей в возрасте нескольких месяцев. Жеребенок был продан фабриканту из Клуджтауна и прожил у него следующие двадцать лет. За это время Забгунар повидал все прелести рабской жизни и поклялся любой ценой отвоевать себе свободу и передать ее своим будущим детям. Во время восстания коммунистов он первым поднял копыто на своего господина и присоединился к сформированному из беглых рабов отряду Революционной Гвардии. История его борьбы сделала его знаменитой фигурой среди других освобожденных Революцией рабов и позволила ему избраться в региональный совет как представителя этой социальной группы.§!"
KLG_hammer_steel: "Хаммер Стил"
KLG_hammer_steel_trait: "Убежденный централист"
KLG_hammer_steel_desc: "§LДо Революции многие считали Хаммера выходцем из Мейргипта — однако в действительности до своей эмиграции в Зебрику он долгое время жил в Эквестрии и в Советской Северяне. Он был одним из активистов Коммунистической Партии во время Зимней Революции и Стил Сталлион лично благодарил его за организацию Красной Гвардии в Ладимире — позже переименованном в честь Карамель Маркс. Однако после смерти Сталлиона и прихода к власти Генерального Секретаря Альтидии Револьцовой он оказался в числе первой волны левой эмиграции после публичной критики генсека. Хаммер стремится в полной мере реализовать политическую программу Сталлиона в рамках Революции в Клуджтауне и пользуется доверием Айви Мяолина — хотя и не сходится с ним по целому ряду позиций.§!"
KLG_white_castor: "Уайт Кастор"
KLG_white_castor_trait: "Стойкий автономист"
KLG_white_castor_desc: "§LОдин из самых известных социологов своего времени и профессор Королевского Института Мейргипта — Уайт Кастор перебрался в Клуджтаун незадолго до Революции для изучения феномена криминального города и немедленно оказался втянут в самую гущу событий. Его симпатии с самого начала были на стороне Айви Мяолина и во время протестов его можно было увидеть на баррикадах вместе с простыми трудящимися. Именно он консультировал Рабочий Совет при составлении программы Революционных преобразований и на данный момент является видным представителем и негласным лидером Либертарной оппозиции. Айви Мяолин высоко ценит знания и опыт Уайт Кастора и часто прислушивается к его советам — однако многие централисты считают его потенциальной угрозой для дальнейшего распространения Революции.§!"
KLG_greit_morgen: "Грайт Морген"
KLG_greit_morgen_trait: "Иностранный доброволец"
KLG_greit_morgen_desc: "§LВо времена бурной молодости Грайт Морген был сторонником Республиканской Революции и участвовал во взятии Грифенхейма войсками Маршала Кемерская. При этом он скорее склонялся к социализму и когда начался конфликт между левым крылом Республиканской Партии и Правительством Республики он присоединился к красным и вместе с ними ушел на север — в основанный недавно город Скайнавия. Однако и там ему не удалось добиться значительных успехов на выборах — но удалось получить неплохие связи среди коммунистов по всей Грифонии. Коллеги считали Грайта слишком зацикленным на Революционной Войне и не позволяли ему занимать высокие должности — поскольку это могло бы втянуть молодую Республику в ненужные для нее конфликты. Однако когда после Революции в Клуджтаун начали стягиваться левые со всего мира — именно Грайт организовал и возглавил программу иностранных добровольцев для защиты завоеваний Революционной Коммуны.§!"
KLG_yaffirat_nashirr: "Яффират Наширр"
KLG_yaffirat_nashirr_trait: "Пламенный революционер"
KLG_yaffirat_nashirr_desc: "§LАсстирия никогда не была особо приветлива к социалистам и любым проявлениям левой мысли — однако с приходом к власти Короля Асбанипала в действие вступил закон об искоренении иностранного влияния и все сторонники идей Карамель Маркс были объявлены государственными преступниками. Яффират провел почти десять лет в тюрьме за распространение социалистических идей и просидел бы там всю оставшуюся жизнь — но ему удалось сбежать и перебраться сначала в Абиссинию — а затем в Клуджтаун. Он познакомился с Айви Мяолином случайно и у них быстро завязалась крепкая дружба. Яффират был главным организатором подполья во время подготовки в Революции и в дальнейшем был назначен Советом на должность копытоводителя внешней разведки молодой социалистической республики. Его основной задачей на этом посту стало налаживание контактов с представителями запрещенных левых партий в соседних странах и координация их действий с нашей властью.§!"

klugetown_news.1.t:0 "[KLG.GetNameDef]!"
klugetown_news.1.d:0 "[This.GetNewspaperHeader]Совершенно непостижимым образом печально известные преступники и негодяи Клуджтауна завоевали Абиссинию и Мейргипет. Пока международные наблюдатели в шоке пытаются осознать произошедшее, [KLG.GetLeader] — новый глава администрации, обещает скорый экономический рост и расширение свобод для всех.\nСвободный город превратился в свободную территорию, где верховенство закона полностью вытеснено властью мафии. Клуджтаун печально прославился грубым игнорированием всех международных норм, и пока неясно, как это новое государство будет действовать на мировой арене. В любом случае, кажется вероятным, что Клуджтаун, или же [KLG.GetNameDef], продолжит быть открытой территорией."
klugetown_news.1.a:0 "Как им это удалось!?"
klugetown_news.1.b:0 "Клуджтаун останется открытым навечно!"

klugetown_news.2.t:0 "Гармоническая Революция в Клуджтауне"
klugetown_news.2.d:0 "[This.GetNewspaperHeader]Неожиданная новость о реорганизации Вольного Города Клуджтаун после побега лидера одной из самых влиятельных криминальных группировок в Западной Зебрике сегодня стала одной из самых обсуждаемых в мире. Временное Правительство во главе с Каппером Дапперпаусом объявило об окончании переходного периода и организовало первые за много лет выборы Бургомистра.\n\nОжидаемо для всех эту должность занял сам лидер Революции. Политические противники уже называют его агентом влияния Кантерлота в Западной Зебрике и марионеткой Селестии. Однако сами жители вольного города судя по всему доверяют своему новому лидеру."
klugetown_news.2.a:0 "Гармония вновь празднует победу."
klugetown_news.2.b:0 "Новая эра для нашего города."

klugetown_news.3.t:0 "Революционная Коммуна Клуджтауна"
klugetown_news.3.d:0 "[This.GetNewspaperHeader]Значительные перемены во внешней и внутренней политике Вольного Города Клуджтаун вызывают опасения в регионе Западная Зебрика. После прихода к власти радикально левой Социалистической Демократической Рабочей Партии ее лидер — известный коммунист Айви Мяолин — объявил о намерении распространить Революцию на весь регион и тем самым фактически объявил себя врагом сразу нескольких государств.\n\nЦелый ряд социалистических активистов в разных странах выражают явную симпатию Революционной Коммуне Клуджтауна — однако большая часть видит в амбициях лидера коммунистов очевидную угрозу стабильности в регионе."
klugetown_news.3.a:0 "Этого безумца нужно остановить."
klugetown_news.3.b:0 "Да здравствует Революция!"

