KLG_mafia_code_of_honor_cat: "Власть Мафии"
KLG_mafia_code_of_honor_cat_desc: "Уже много лет город Клуджтаун находится под властью Мафии. Главные принципы нынешней системы управления были заложены задолго до основания города и неукоснительно соблюдались в виде священного для каждого криминального элемента §YКодекса Чести§!. За его нарушение следовало самое суровое наказание — изгнание из Семьи.\n\nОднако на практике положения этого Кодекса соблюдаются далеко не всегда. И особенно по отношению к так называемым законопослушным гражданам — которые не пользуются защитой Мафии.\n\nНаиболее разумные ее представители — §gРеспектабельная Мафия§! — предпочитают решать такие вопросы более деликатными методами и не убивать своих потенциальных клиентом без острой необходимости.\n\nС другой стороны — §1Жестокая Мафия§! в значительной степени полагается на совершенно иные методы укрепления власти. Ее представители нередко переступают даже через некоторые положения Кодекса Чести — но только когда не это касается других представителей Мафии и их приспешников."
KLG_promote_neutrality: "Усилить §gРеспектабельную Мафию§!"
KLG_promote_neutrality_desc: "Респектабельная Мафия в основном рассчитывает на более системный подход к удержанию власти над городом. Ее представители выше всего ценят честность в вопросах ведения бизнеса и готовы закрывать глаза на некоторые недостатки своих партнеров при условии соблюдения ими принятых на себя обязательств. Члены Респектабельной Мафии предпочитают решать все вопросы тихо и прибегают к открытому террору только в крайнем случае."
KLG_promote_fascism: "Усилить §1Жестокую Мафию§!"
KLG_promote_fascism_desc: "Жестокая Мафия использует все возможности преступного мира для запугивания своих врагов и потенциальных должников — от поджогов до заказных убийств. Все подобные акции осуществляются открыто и носят в том числе характер предупреждения. Жестокая Мафия не скрывает своей преступной сущности и гораздо меньше внимания уделяет соблюдению Кодекса Чести — наивысшим приоритетом для них были и остаются деньги."

KLG_harmony_uprising_cat: "Демократические протесты"
KLG_harmony_uprising_cat_desc: "Падение Короля Шторма и уход большей части его гарнизонов значительно ослабил контроль Мафии над Клуджтауном. Этим незамедлительно воспользовались ее враги из числа сторонников гармонии и демократического управления. На данный момент их неформальным лидером является абиссинец по имени §YКаппер Дапперпаус§! — бывший карманник и герой битвы при Эйн-Тротгуре.\n\n§YСила протестов§! на данный момент [Root.KLG_harmony_uprising_power_scrloc].\n\nИ хотя возможностей у них гораздо меньше чем у нас — с каждым днем к ним присоединяется все больше сторонников и в определенный момент эта ситуация может кардинально измениться и стать действительно опасной."
KLG_harmony_uprising_mission: "Коллапс системы власти"
KLG_harmony_uprising_mission_desc: "Начало массовых протестов обнажило многие ранее незаметные проблемы вольного города. Критическая масса скрытого недовольства режимом Верко накапливалась в течение многих лет и теперь — с появлением такой возможности после значительного ослабления позиций Мафии во время оккупации города силами Короля Шторма — стремительно распространяется среди широких слоев населения. Пока что Верко удерживает власть в своих лапах и не собирается просто так отказываться от нее. Но если ситуация окончательно выйдет из-под контроля и его жизни или жизни его сыновей будет угрожать опасность — он скорее всего предпочтет покинуть город и не рисковать. И это положит конец всей созданной им вертикали управления и окончательно развяжет лапы демократической оппозиции и Капперу."
KLG_agent_implementation: "Внедрение агентов в ряды оппозиции"
KLG_agent_implementation_desc: "В распоряжении Верко всегда есть несколько тысяч преданных лично ему и его семье существ самой непримечательной внешности без особых заслуг в преступном мире. При желании они спокойно могут сойти за самого обыкновенного гражданина и войти в доверие к тому, от кого их нанимателю необходимо избавиться. На этот раз Верко отправит своих агентов на нижние уровни. Их задание — притвориться противниками режима и попробовать войти в круг доверенных лиц лидеров протеста. Это позволит нам быстрее узнать их имена и саботировать некоторые мероприятия оппозиции через предоставление им фальшивых данных и использование полученной от агентов информации о них."
KLG_use_agents: "Использовать наших агентов ([Root.KLG_stage_of_infiltration_scrloc] из §G5§!)"
KLG_use_agents_desc: "Когда в рядах оппозиции окажется достаточно верных нам существ — мы будем готовы привести в исполнение первый этап своего плана. Необходимо по возможности вывести из игры наиболее активных лидеров и сделать это можно самыми разными способами. Например — передать ему ложную информацию о расположении патрулей охранного агентства Верко и таким образом направить ему прямо им в лапы. Или подлить ему в стакан чего-нибудь сильнодействующего и наблюдать за его агонией. Конечно — это скорее всего приведет к раскрытию агента и сыграть свою роль повторно он не сможет — но это позволит нам выиграть время и лучше подготовится к выполнению второго этапа."

KLG_communism_uprising_cat: "Революция на пороге"
KLG_communism_uprising_cat_desc: "Падение Короля Шторма и уход большей части его гарнизонов значительно ослабил контроль Мафии над Клуджтауном. Попытки подавить демократический протест силой привели к его значительно рационализации и увеличению количества сторонников §YСоциалистической Демократической Рабочей Партии Клуджтауна§!. Ее лидер §YАйви Мяолин§! прямо заявляет о необходимости свержения капиталистического строя и установления в городе диктатуры пролетариата.\n\n§RЕсли популярность коммунизма увеличится до более чем 40% — остановить Революцию будет уже практически невозможно.§!\n\nСитуация меняется очень быстро и если мы не сможем ничего предпринять в связи с этой неприятной ситуацией — коммунисты скоро захватят власть и не встретят практически никакого сопротивления со стороны населения."
KLG_communism_uprising_mission: "Социалистическая Революция"
KLG_communism_uprising_mission_desc: "С момента начала массовых протестов Социалистическая Партия набрала значительный политический капитал. В том числе благодаря жестокой политики городских властей и их маниакальному стремлению подавить все более умеренные демократические движения. В результате большая часть оппозиции объединилась вокруг фигуры коммуниста Айви Мяолина и это позволило ему мобилизовать большое количество партийных активистов и вооружить их достаточным количество оружия для свержения власти Верко и установления в Клуджтауне социалистической республики."
KLG_carry_out_arrests_of_protesters: "Провести аресты протестующих"
KLG_carry_out_arrests_of_protesters_desc: "Наиболее серьезную опасность на данный момент представляют активисты Социалистической Демократической Рабочей Партии. Каждый день они совершают налеты на офисы наших партнеров и громят отделения службы безопасности. Рейды быстрого реагирования далеко не всегда оказываются достаточно быстрыми для предотвращения нового политического теракта со стороны коммунистов. Однако нам удалось установить имена некоторых из них и определить их актуальное место жительства. Необходимо арестовать их и сделать это публично — чтобы последствия таких выходок стали максимально очевидными для всех сторонников Айви Мяолина и его боевиков."
KLG_subject_the_arrested_to_torture: "Подвергнуть арестованных пыткам"
KLG_subject_the_arrested_to_torture_desc: "Десятки сторонников Революции на данный момент находятся в лапах у службы безопасности и несмотря на все попытки добиться от них ответов без насилия — они предпочитают молчать. Следовательно — мы обязаны заставить их говорить любой ценой. У наших сторонников есть на этот счет несколько весьма "экстравагантных" методов."

