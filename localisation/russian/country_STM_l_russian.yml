### Designer Loc ###

STM_hailstorm_trucks:0 "Сноучейн"
STM_hailstorm_trucks_desc:0 "Сноучейн относительно молодая компания по меркам Глаза Бури. Прежде она была личным предприятием Иквуса Хэйлсторма, но с тех пор выкупила у него финансовую и операционную независимость. Наша великая столица видела взлёты и падения многих фирм, однако появление личного автотранспорта породило колоссальный спрос, ради удовлетворения которого Сноучейн и по сей день только наращивает производство. Быть может, однажды её значимость померкнет, но нынешняя фактическая монополия на выпуск автомобилей вряд ли исчезнет в обозримом будущем."

STM_hailstorm_trucks_2:0 "Сноучейн"
STM_hailstorm_trucks_2_desc:0 "Сноучейн относительно молодая компания по меркам Глаза Бури. Прежде она была личным предприятием Иквуса Хэйлсторма, но с тех пор выкупила у него финансовую и операционную независимость. Наша великая столица видела взлёты и падения многих фирм, однако появление личного автотранспорта породило колоссальный спрос, ради удовлетворения которого Сноучейн и по сей день только наращивает производство. Быть может, однажды её значимость померкнет, но нынешняя фактическая монополия на выпуск автомобилей вряд ли исчезнет в обозримом будущем."

STM_mio_trait_hailstorm_truck_res:0 "Переработка металлолома в грузовые кузова"

STM_mio_trait_hailstorm_truck_rel:0 "Дополнительные панели для доступа к двигателю"

STM_mio_trait_hailstorm_truck_cost:0 "Новшества гражданского производства"

STM_hailstorm_tanks:0 "Хэйлбейн"
STM_hailstorm_tanks_desc:0 "Хотя танки никогда не входили в число любимых технических новинок Короля Шторма, Иквус Хэйлсторм в годы его правления лично курировал создание танкового конструкторского бюро. Хэйлбейн, подобно Сноучейну, в ходе гражданской войны выскользнул из-под прямого контроля плутократа, что в финансовом плане пошло предприятию даже на пользу. К несчастью, конструкторы Хэйлсторма никуда не делись, и инженерам приходится мириться с их... своеобразными техническими подходами, чтобы их работа имела хоть какой-то толк."

STM_hailstorm_tanks_2:0 "Хэйлбейн"
STM_hailstorm_tanks_2_desc:0 "Хотя танки никогда не входили в число любимых технических новинок Короля Шторма, Иквус Хэйлсторм в годы его правления лично курировал создание танкового конструкторского бюро. Хэйлбейн, подобно Сноучейну, в ходе гражданской войны выскользнул из-под прямого контроля плутократа, что в финансовом плане пошло предприятию даже на пользу. К несчастью, конструкторы Хэйлсторма никуда не делись, и инженерам приходится мириться с их... своеобразными техническими подходами, чтобы их работа имела хоть какой-то толк."

