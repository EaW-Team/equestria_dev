 # Characters
 EQS_SOL_daybreaker:0 "Daybreaker"
 POLITICS_DAYBREAKER_DESC:0 "§YBorn§!: Time Immemorial\n\n§YBiography§!: Myths and fables tell of two regal sisters who ruled together, creating harmony for all the land. The eldest used her alicorn powers to raise the sun at dawn; the younger brought out the moon to begin the night. While it is obvious today that the tales speak of the Royal Pony Sisters who rule Equestria, few, if any concrete facts are known about their history.\n\nFor over a thousand years, Princess Celestia has safeguarded her ponies, and the land of Equestria. Doing it solely from the goodness of her own heart, she didn't ask for any compensation, nor demanded their absolute loyalty. Everything the Princess wished was for her little ponies to be protected. Contemporary times, however, are not kind to the ideals of friendship and harmony, with the growing threats on all sides leaving very little room for pleasantries.\n\nThus came the ascension of Daybreaker. Infuriated by the gall of her enemies, the former Princess, now Empress, wasted little time in reorganising the state to something far greater. Many ponies protest in the face of sudden, radical changes, but Daybreaker cares little for the complaints of a minority: all she needs is a devoted herd ready obey her every order.\n\n§YPortrait By§!: Twotail813"
 EQS_SOL_furlong:0 "Agent Furlong"
 #EQS_SOL_aunt_orange:0 "Orange Rind"
 EQS_SOL_abacus_cinch:0 "Abacus Cinch"

 # Character Bios
 SOL_sunrise_sparkle_desc:0 "§LWhere Twilight Sparkle was kind and considerate, Sunrise Sparkle replaces much of it with an obsessive mania around detail, order, and dedication. Everypony who knew Sunrise when she was called Twilight still acknowledges it's her, since she still spends time with those she considers friends as she can while not studying under Daybreaker's supervision. While there is speculation that she can no longer wield the Element of Magic, that does not discount that she retains her encyclopedic knowledge of spellcasting and has only grown more powerful since she was enlightened. She has abandoned her role in Ponyville to fully pursue her duty to the Empress and her quick wit and ability to absorb information makes her the ideal aide. Along with her duties as Daybreaker's student, she has expressed a desire to enforce Daybreaker's will in Canterlot, a position that has only elevated her in the eyes of all those loyal to the Empress further.§!"
 SOL_sunrise_sparkle_army_desc:0 "§LWhere Twilight Sparkle was kind and considerate, Sunrise Sparkle replaces much of it with an obsessive mania around detail, order, and dedication. Everypony who knew Sunrise when she was called Twilight still acknowledges it's her, since she still spends time with those she considers friends as she can while not studying under Daybreaker's supervision. While there is speculation that she can no longer wield the Element of Magic, that does not discount that she retains her encyclopedic knowledge of spellcasting and has only grown more powerful since she was enlightened. She has abandoned her role in Ponyville to fully pursue her duty to the Empress and her quick wit and ability to absorb information makes her the ideal aide. Along with her duties as Daybreaker's student, she has expressed a desire to enforce Daybreaker's will in Canterlot, a position that has only elevated her in the eyes of all those loyal to the Empress further.§!"
 SOL_sunrise_sparkle_field_marshal:0 "§YBorn:§! TODO\n\n§YRank:§! §LDaybreaker's Prized Student§!\n\n§YBiography:§! §LTwilight Sparkle would never fight. Twilight Sparkle would never eagerly seek new offensive tactics. Twilight Sparkle would never savour breaking Princess Celestia's enemies, seeing them flee, hearing the lamentations of their spouses, and sowing their land with salt. But Sunrise Sparkle is not Twilight, nor is Daybreaker Sun Celestia.\n\nWith the war that came to Equestria's borders, Twilight applied herself to at least being aware of many military tactics, even if she was averse to them, unlike Prince Blueblood. Much of this lay untapped, only used as token advice or educated guesses when she was called upon by Celestia, but this knowledge has gained a use after she was finally enlightened by the Empress. Where Twilight was once a caring and empathetic pony, who wished to see friendship overcome all, Sunrise has seen the reality of the modern world through the eyes of her teacher. Friendship cannot win wars, nor can it prevent sedition from inside the ranks. Order must be instilled to keep the peace, and as she learns more from Daybreaker, her passion for protecting ponies and the Empire only grows.\n\nAs the Empress's only student and most faithful and loyal pony, she has been placed in immense positions of power and responsibility. Since her ascension, she has poured herself into every book on warfare, every historical battle, and spoken with every military theorist that would answer her. In theory, she is one of the most dangerous foes that could be faced on the battlefield, combining both her head knowledge with her extensive talent in magic, but book experience can only get one so far. Still, her gusto with which she has taken to her tasks has given her a chance to test those skill. Like her former life where she learned as much as she could about friendship, she has determined she'll become the foremost pony on warfare. When that day arrives, the enemies of Order shall tremble!§!\n\n§YPortrait By:§! §LScroup§!"
 
 # National spirits
 SOL_bat_resistance:0 "Lunarist Resistance"
 SOL_bat_resistance_desc:0 "Thestrals and their allies are causing immense disruption to the security of the Empire. This growing movement defying the Empire is causing the Empress great annoyance. If no action is taken against them, their resistance will degrade our military performance and civil stability. Such impudence must be swiftly eliminated."
 SOL_permanent_emergency:0 "Indefinite State of Emergency"
 SOL_permanent_emergency_desc:0 "Our Empire does not stand on steady ground so long as it remains far from victory. A permanent emergency keeps the Empire vigilant, but such vigilance should not last too long. The Empress demands that we commit all possible effort to winning so that we may enjoy a strong peace, free from the threats to harmony."
 SOL_media_control:0 "The Imperial Service for Supervision of Communications, Information Technology and Mass Media"
 SOL_media_control_desc:0 "Daybreaker has graciously decreed the formation of a government agency responsible for reviewing all public media. It is possible the Foal Free Press incident from several years ago motivated this act. There are now strict guidelines for what kind of information is allowed to be published, and any piece of media violating these guidelines is destroyed along with all possible copies."
