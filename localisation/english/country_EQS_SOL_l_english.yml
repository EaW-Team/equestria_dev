 solarempiresparkles.1.t:0 "Class Reunions"
 solarempiresparkles.1.desc:0 "Everything was wrong! Everything! All of it! Ponies were happy! HAPPY! There's no way they could be happy!\n\nAs the thoughts rushed through Twilight Sparkle's mind akin to a dam bursting and sweeping away all beneath it, she met the gaze of one of the servants of Canterlot Castle. The mare appeared... content. Which was clearly impossible! Nopony could be content under—no, she wouldn't think about that. Not even as she was dragged by two guards, her horn useless while hugged by an inhibitor ring.\n\nIt had to be all a dream. She was in the throes of some nightmare that Princess Luna would come zooming in to shatter any moment. It'd all be better.\n\nA pair of hairs from her mane sprung out while an anxious chuckle escaped her throat. Everything was going to be fine. Fine! Nothing wrong. No horrendous collapse of Equestrian society to worry about! Nope! Going swimmingly!\n\nWHAM!\n\nWithout realizing it, she and her guards had already reached the towering throne room doors and her escorts shoved them open, all the while keeping her tightly within their grasp. For a moment, she swore that the room itself was ablaze as vibrant oranges and deep reds danced across the walls, even the stained glass windows. On top of that, the overbearing heat coaxed a layer of sweat to shine on her coat. Yet it was not, in fact, on fire. Only the rows upon rows of cauldrons, giant tongues of flame leaping from them, fed the inferno. Centered on the throne at the very end of the room, Daybreaker Sun sat, nonchalantly leaning against her throne's back.\n\nTwilight was announced, then hauled forward. Collapsing to the carpet that led up to Daybreaker's dais, she blinked back tears, mumbling on repeat, "This can't be happening!"\n\nCackling, Daybreaker rose and sauntered to Twilight. "Oh, my faithful student, I can assure you it is." She cupped Twilight's snout in her forehooves. Laced in the light of both her mane and the flaming pillars, she appeared almost silhouetted and with little more than twin, burning bulbs for eyes. Yet her voice was still hers. Still Celestia's...\n\n"Soon you'll see—"\n\n"I won't! You're not her! You're"—Twilight choked—"You're a—"\n\n"Monster?" Daybreaker rolled her eyes. "Please! No need to be so dramatic." She motioned to the guards. "I think you need a bit more time to cook, don't you?""
 solarempiresparkles.1.a:0 ""You'll see in time.""

 solarempiresparkles.2.t:0 "Personal Tutoring"
 solarempiresparkles.2.desc:0 "Daybreaker would almost shed a tear. Almost, anyway.\n\nWatching from the exterior of Twilight's cell, Daybreaker observed her former student. She didn't need to be a changeling to sense the anger or the fear radiating off Twilight. The huddled fetal position and the panicked petting of her tail was enough of an indicator for that. It evoked a sigh. When she unlocked the cell door herself, she retained her confident swagger as she peered over her nose at Twilight.\n\nSilence reigned supreme.\n\nIn time, when Twilight was thoroughly curled into a ball, Daybreaker simply stated, "Twilight."\n\n"Don't talk to me! You're not her!" Twilight shot upright, a strained laugh from her bouncing through the cell. "I should have seen it all coming! I could have helped you." She sniffed. "But... now..."\n\n"Your 'help' would have done nothing, Twilight." Daybreaker refrained from adding that it would have been useless. As much as seeing a grown mare cry was amusing once or twice, shattering Twilight too quickly could drive her further away. Caressing her emotional wounds, though...\n\nTwilight glared at Daybreaker. "You completely went off the rails! I... I thought that if I could—" She let out a scream, which she buried in her tail. "You're getting me to talk! Take it easy, Twilight. Just think happy, calm thoughts, and..." She started to pump a hoof in and out, taking great gulps of air as she did. "It'll be okay. It'll be okay."\n\nDaybreaker clicked her tongue. "Did you really believe that you'd help by keeping those same, old, tired laws, Twilight?" Jabbing a hoof out the tiny window of the cell, she repeated, "Did you? I kept them safe when traitors could be in their midst! You would have had them hug it out so they could be stabbed in the back!"\n\n"Are you crazy?! What am I saying? Of course you are!" Twilight gritted her teeth. "You won't trick me like that! Keep me here! Kill me! I won't be tricked!"\n\nMeeting Twilight's scowl, Daybreaker only sighed. "Oh, my misguided student.""
 solarempiresparkles.2.a:0 ""You will listen. And you will learn.""
 solarempiresparkles.2.b:0 ""So you have chosen the hard way.""

 solarempiresparkles.3.t:0 "Subversions"
 solarempiresparkles.3.desc:0 ""Get out!"\n\n"No." With the air of a cat that had just bagged itself a dozen mice, Daybreaker waltzed into Twilight's holding cell. While her student was glaring daggers at her, Daybreaker brushed of a speck or two of dirt that had gotten on her fur. Disappointing, to say the least.\n\nBar the rickety cot in the room and a window to hardly see out of, the cell was devoid of even the barest of necessities. On the cot itself, Twilight rested uncomfortably on her back, chained and her magic inhibited. Despite her position, it didn't seem to ward off her anger. One of her arteries on her neck pulsed regularly, visible from her straining snarl. She remained quiet.\n\nDaybreaker took another step inside. "Why would I want to do that, Twilight?" She ignored Twilight's protest. "We've not spoken in so long." Slipping in a mocking cadence to her tone, she smiled and bore her fangs. "Did you really think that I wouldn't want to talk with my favourite student?"\n\nTwilight bristled. "If you want me to beg or fight you, you're not getting anything."\n\n"Fine. Then simple yes or no answers, Twilight." Daybreaker held up a hoof. "Were my ponies in danger? Yes, of course they were. Did I try everything I could before we became embroiled in war? Yes. Did that accomplish what I had built Equestria on for over a thousand years? No." She leered toward Twilight. "I'm open to other options, Twilight. You believe friendship can solve all problems. Where has friendship gotten us? Nowhere!"\n\nSearching the cracked cobblestone rocks that made up the cell floor, Twilight stuttered a murmur, "But friendship stopped it all before."\n\n"Think, Twilight!" Daybreaker tapped a hoof to her forehead. "The world is moving past that. I see that. Everypony sees that." She exhaled, her mane, which had grown more violent and thrashing, settled. "Where do you think it will get you? If you stop me, do you think my ponies will see you as—"\n\n"No!" Twilight shook her head. "Sometimes, ponies are wrong! When they see how they've been tricked, they'll know that if they just work together, if they put out a hoof in friendship, everything can be solved. We could have talked more, found a solution." Steeling herself, she glared at Daybreaker. "But you were too scared."\n\nBreaking into a sharp laugh, Daybreaker proclaimed, "And you didn't fear for your friends?" Twilight continued to stare at her. "Would you forgive yourself if they were hurt, or worse, Twilight?" Daybreaker drifted to the cell door. "I hope you can live with yourself if they are."
 solarempiresparkles.3.a:0 ""But you can keep them safe.""
 solarempiresparkles.3.b:0 ""But we can work to keep everypony safe.""

 solarempiresparkles.4.t:0 "High Workplace Approval"
 solarempiresparkles.4.desc:0 "There were an almost infinite number of possibilities that Daybreaker had run through of how Twilight would entertain herself while she percolated. Scrutinizing a piece of wall to the point of making it crumble to dust wasn't one of them, and it wasn't like she'd be very successful in that endeavour, anyway. When she walked in to Twilight's cell, the young alicorn was glaring daggers into the exterior wall, her back facing the barred entrance. Various strands of mane stuck out at angles, and some of her fur was matted. She appeared to ignore Daybreaker, instead pulling at the end of her frayed locks on repeat.\n\nShe cleared her throat. Twilight spun around, anxiety replaced with defiance that blazed like an inferno in her eyes. Although she saw Daybreaker's guest, she stayed silent. "Abyssinian got your tongue, Twilight?" Daybreaker snickered. "I presumed you'd be happy to see Raven." She glanced to her long-standing aide, who was tactfully cleaning her glasses. "Not going to say 'hello?'"\n\nTwilight frowned. "What did you do to her?"\n\n"Moi?" Daybreaker placed a hoof on her chest. Exaggerating a shocked gasp, she scoffed and focused on Raven. "I did nothing! Raven's gladly serving under me." She grinned, ostensibly in a friendly manner, although she fed the faintest amount of condescension into her stance.\n\nLooking like she'd been stabbed in the chest, Twilight drew back and exclaimed, "That's... How?!" She gazed imploringly at Raven. "Y-You're working with her?! She's approved mass arrests and more!"\n\nWith a sideways glance, Raven shifted away from Twilight. "They were criminals," she finally admitted. She looked to Daybreaker. "Twilight, they... they DID endanger others. Hundreds of lives were saved." She sighed. "She treats us fairly." At that, Daybreaker beamed at Twilight.\n\n"Raven and I meet weekly to chat over tea." With a whimsical breath, Daybreaker sauntered to Twilight. Halting and holding back from placing a reassuring hoof on Twilight's withers, she observed Twilight grit her teeth, working her jaw side to side. "She found a new special somepony last week, and—"\n\n"You think that you'll trick me?!" Twilight crossed her forearms and shunned Daybreaker. "She works under you. Like she'd admit your faults in front of you!" Raven winced and stepped away, toward the entrance. "Y-You could have tried to see what was forcing those ponies to turn to crime, not just toss them into prison! Friendship could have solved it." When Daybreaker opened her mouth, Twilight snapped, "Just leave me alone!""
 solarempiresparkles.4.a:0 ""You could solve it all, Twilight.""
 solarempiresparkles.4.b:0 ""You could have kept the peace, Twilight.""

 solarempiresparkles.5.t:0 "Practical Assessments"
 solarempiresparkles.5.desc:0 ""My, Twilight, it looks like you could use a bit of sun!" Cackling at her corny quip, Daybreaker resettled herself on her throne as two soldiers escorted Twilight Sparkle inside. Aside from an inhibitor ring on her horn, Twilight was unrestrained. When she was taken directly to the bottom of Daybreaker's dais, she knelt after one of the armoured stallions thrust a forehoof onto her back. Twilight squeezed her eyes shut.\n\nPaler and a tad gaunter, her eyes still burned with resistance, although Daybreaker could see a deadness creeping into them. She shot Twilight a lopsided smirk. "Not getting enough time out in it? It'll make your bones brittle, you know." She bared her fangs. Twilight said nothing in response.\n\n"Ugh, you're no fun." Inspecting a hoof, Daybreaker lost whatever mirth she held grew stern, forehead wrinkling in a scowl. "You won't even ask me why you were brought here. Not the least bit curious?"\n\n"You just want to gloat." Twilight almost spat out the words. Still, beneath them, a tinge of despair crept in. Daybreaker merely shook her head.\n\n"No, my faithful student, I wanted you to help me." Twilight broke into a fit of laughter. An entire section of her mane contorted and clumped up and she started to twitch one of her ears constantly. While a raging furnace seared Daybreaker's ribcage, she forced her cool to overpower it. "There's a friendship problem."\n\nAs those words left her lips, she saw Twilight perk up. Eyeing Daybreaker cautiously, she slowly replied, "What kind? Who?" Some of the anger that radiated off her in her body language vanished. In fact, her tail wagged instinctively but she clamped it down in an instant.\n\nDaybreaker grinned. "Eager, aren't you?" Nonchalantly rubbing one of her shoed hooves on her chest, she permitted the moment to draw out. Finally, when Twilight appeared ready to collapse from an adrenaline crash, she stated, "Are there specific kinds of friendship problems? Fine. Blueblood is in charge of army logistics and Wind Rider now leads the air force's. They have been at each other's throats for stealing supplies. Fix it." She waved Twilight off. "If you think that friendship can still win out, prove it."\n\n"Turning around? Just like that?" Twilight arched an eyebrow. "There's a catch."\n\n"No catch," replied Daybreaker with a toothy smile. "But we'll keep that inhibitor on. No escapes, after all.""
 solarempiresparkles.5.a:0 ""Remember there's always a paper trail.""
 solarempiresparkles.5.b:0 ""Remember that I'm always a good motivator.""

 solarempiresparkles.6.t:0 "Mid-Term Exams"
 solarempiresparkles.6.desc:0 "She could really use Spike.\n\nRushing between multiple blackboards, Twilight Sparkle scratched off another series of solutions to the friendship problem that had been dropped in her hooves. It wasn't that she hadn't searched for a way to escape, but when at least two if not more soldiers were watching her at any one time, and she didn't have any use of magic, she was dead in the water. Throat hitching at the realization again, she used the fear and dread to fuel her manic galloping.\n\nBlueblood despised Wind Rider. Wind Rider hated Blueblood. Apparently it all started when Wind Rider had used a set of boxes marked with Blueblood's family crest for the air force. That escalated to Blueblood confiscating the next two shipments meant for Wind Rider, and then Wind Rider redirecting the an entire delivery route from one of the supply factories for the army.\n\nIn her teeth, she held a piece of chalk and swiped across another set of ideas. Some diagrams and notes on them were the only reason she preserved the blackboards, though. Across the hall from her brainstorming room that she had been led to, the two ponies in question agreed to talk things through. Twilight had offered to be there, but her guards prevented that. She'd instead given one of the senior servants of the castle instructions on how to approach any number of reactions and scenarios. Even with her absent, her tried and true lists of methods for bridging misunderstandings and humbling some proud ponies succeeded every time she put them into practice. There was no reason to think they'd fail her this time.\n\nHumming to herself, she visualized a potential escape vector if Daybreaker was distracted by the two new friends. If she couldn't get free, then Blueblood and Wind Rider would hopefully—\n\n"Ungrateful hack!"\n\nTwilight winced at Blueblood's shout. Wind Rider retorted at the insult, and soon both voices melded into one, and Twilight's heart sank. Checking her chalkboard, she groaned. Her tested method... failed. She fell onto her haunches. Through blurry vision, she saw the senior servant dart out of the room the pair had met in.\n\n"No," she murmured. "No, no, no, no!" Stroking at her tail, she searched the floor. It was supposed to work. Having ponies see things from the other's eyes—figuratively—always produced an understanding. How could this not? She whimpered and whined and Daybreaker's glowing mane graced her vision.\n\nThe door to the talks opened. It creaked closed. In moments, the fighting ceased.\n\nTwilight wept."
 solarempiresparkles.6.a:0 "There's always an angle..."
 solarempiresparkles.6.b:0 "Speaking for Daybreaker could have done a lot..."

 solarempiresparkles.7.t:0 "Student Detention"
 solarempiresparkles.7.desc:0 ""That didn't happen, that didn't happen, that didn't happen!" Curled tightly into a ball, Twilight Sparkle blinked back burning tears that threatened to cascade over at any moment. After being hauled back to her cell when Daybreaker had found her a mess in her planning room, she had been left to simmer for who knew how long. At one point, natural light filtered into her confinements, but now it was dimly illuminated by one of the lights in the jail corridor.\n\nSure, Blueblood and Wind Rider were tough, but her friends had joked about patenting the technique she'd used. It had solved an almost bloody rivalry between Carrot Top and Parsnip Seed over land rights. It'd left an amicable solution to the Plums' vineyard and Green Harvest over expansion into protected land across the river. There was no way it could fail. Unless...\n\nShe pushed the niggling thought out of her mind, and she sniffed and wiped her muzzle when Daybreaker strode inside. Daybreaker cut her off before she could even start. "That was"—she bent in laughter—"That was truly SOMETHING to see, my faithful student!" She approached, hooves clinking on the stonework. "Now do you see how things have changed?"\n\nDaybreaker was baiting her. She had to be. But still, Twilight couldn't just let it go without defending what little there was left of Equestria's legacy. Through a scratchy throat, she exclaimed, "You must have spoken with them! Something to make me think—"\n\n"Twilight, I did nothing of the sort." Daybreaker rolled her eyes. "Do you honestly believe me so unscrupulous? Ah, of course you do."\n\nFlattening her ears against her head, Twilight growled, "Maybe you're right. About them! But there are others to stop you!"\n\n"What? Like you? Your friends?" Throwing her head back in another cackle, Daybreaker caught her breath and sneered at Twilight. "What friends, Twilight? You're alone. IF you were to escape, where would you go? Whom would you seek?" She leaned down, twin, sparking candles raging in the black pits of her pupils. "Maybe you'd topple me, but then what? Ponies trust me. You'd have committed regicide. Would you have their trust? Would you have to imprison them? Where would your vaunted friendship be then? Could you live with ending me and ruling like a tyrant?"\n\n"I wouldn't!"\n\n"But you would. For peace. For friendship and harmony. You would. Where would that leave you?" Daybreaker's grin grew smugger. Twilight hung her head. "Twilight," she began at last, but stopped when Twilight snarled.\n\nIn a rattly voice, Twilight shrieked, "You can't trick me!" Daybreaker left without a word, yet with a knowing smile all the same."
 solarempiresparkles.7.a:0 ""You could fix it all, Twilight.""
 solarempiresparkles.7.b:0 ""You can fix it with me, Twilight.""

 solarempiresparkles.8.t:0 "Make-up Tests"
 solarempiresparkles.8.desc:0 "Although she expected many reactions from Twilight, sitting up was not one of them. Retaining a neutral expression, Daybreaker cleared the doorway to the young alicorn's cell, a humble plate of pancakes which she had made herself hovering in her magic. Across the room, the haggard and slowly atrophying Twilight eyed the breakfast with a ravenous glint. From reports by the guards, Twilight had neglected to consume much of anything for days after she had had her last discussion with her precious student. Crying and wailing had been a common detail as well.\n\nWhile Twilight's fur was at points crusty from dried tears and matted from sweat and grime, there was still a hint of that young filly from so many years prior. A lost, confused, misguided little filly.\n\nAnd a useful one.\n\nOffering the pancakes without a word, she sat and watched Twilight as she lustfully took in the pastries, restraining herself despite twitching toward the plate a few times. As confusion took further hold, Daybreaker rolled her eyes and snapped, "Yes, because I would do something subtle when I'm right here with you." She sighed. "My faithful student, simply eat it."\n\n"I'm not your student," Twilight finally grumbled with a shaky, petulant tone.\n\n"But you can, and you will be." Forcefully placing the plate next to Twilight, she scrutinized the princess. "You know I'm right. I can tell." She indicated the scrunched expression and searching jitter in Twilight's eyes. "But let's go through it again. Stand against me, stop me, and you'll have to deal with all those who are loyal to me. No friendship can save you from that. You'll have killed me. You'll have killed friendship and harmony in the process."\n\n"I-I-I—" Twilight nibbled at her lip.\n\n"And if you topple me and rule in my stead, what will you do to them? They won't follow you. You'd have to crack down on them." Cupping a forehoof under Twilight's snout, Daybreaker dried a few tears that streamed down Twilight's cheeks, etching ruts in the fur. "Just like I have to sometimes crack down on those beneath me, like Blueblood and Wind Rider. They listened to authority, to order." She grinned. "Not friendship. Order. You can learn what's needed, too, my faithful student."\n\nWhining and gritting her teeth, Twilight jerked away from Daybreaker, keeping her face scrunched tight. Sobs racked her body and incoherent blubbers drifted up from her. As she curled into a tighter ball, Daybreaker grinned as butterflies flitted in her stomach. She drew Twilight into an embrace, refusing to chortle until she left.\n\nTwilight wailed and buried her head into Daybreaker's chest. She was like putty in the Empress's hooves."
 solarempiresparkles.8.a:0 ""With your mind, you can keep them all in order, Twilight.""
 solarempiresparkles.8.b:0 ""With my help, you can do anything you want, Twilight.""

 solarempiresparkles.20.t:0 "Enlightenment Achieved"
 solarempiresparkles.20.desc:0 ""When do I start, Empress?" Twilight Sparkle inquired, a pep in her step as she trotted next to Daybreaker. The pair were wandering through one of the smaller gardens on the castle grounds, not a solitary escort in sight. Brushing back some of her mane, she ruffled her feathers and nervously checked the sky, as if some danger to her or Daybreaker would miraculously fall from it.\n\nDaybreaker grinned. Casually stretching herself, she wandered to stand in front of a statue, a frown growing across her muzzle. This was one of the art pieces she'd missed. No matter, it would serve an excellent test. Meeting the confident gaze of the sculpture of her sister, she swiveled around. "You can start now, my faithful student." She stepped aside, revealing Luna's statue.\n\nTwilight arched an eyebrow. "Really? That?" She shrugged and lit her horn. Defensively, Daybreaker fed a smidgen of energy into her own, just in case, but when Twilight's field leapt toward the statue and suddenly cracked off the head with a burst of energy, she nixed it. "Better?" She fidgeted her wings again.\n\n"No remorse?" Daybreaker inspected the smoking remainder of the old sculpture.\n\n"Well, I hope that Princess Luna understands eventually, too." Twilight's cheeks tinged red. However, she bounced back almost instantly as she pranced up beside Daybreaker again. "But when are you going to send me out? I have a whole checklist of items to start with." Said checklist appeared in a "pop" of magic. Half a dozen quills and three bottles of ink also arrived with it. "Section one—"\n\nAs Daybreaker's mane whipped on its own, Twilight paused, then coughed into a hoof. "Maybe I shouldn't waste your time with that." Daybreaker's silence spoke volumes. "Okay, well, I still think I'm able to go. I'm feeling better, and—"\n\nCutting Twilight off with a swipe of a forehoof across her neck, Daybreaker barked, "You leave when I say you do!" Twilight went quiet. Daybreaker hummed to herself. Her student was wholly patient. Of course, she'd been trained to be a such, even before the Empire. Although she could tell Twilight was restless by the agitated flicking of her tail, Daybreaker pondered. Twilight was reborn. She understood as Daybreaker did. She was a new pony.\n\nAnd a new pony needed a new name. The perfect one came to mind."
 solarempiresparkles.20.a:0 ""Twilight falls so that Sunrise may arrive.""

 solarempiresparkles.21.t:0 "Reflecting the Light"
 solarempiresparkles.21.desc:0 "TODO: Sunrise meets with Daybreaker looking different, and explains that she has used magic to alter her appearance to reflect how she's grown to understand her role and Daybreaker's logic; with a new name, she feels a new look is in order, and is quite excited for others' reactions"
 solarempiresparkles.21.a:0 "It definitely fits you more."

