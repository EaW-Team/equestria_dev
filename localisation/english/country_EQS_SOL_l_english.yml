 SOL_dealing_with_resistance_desc:0 "Our new order has brought with it large groups of ponies that still hang onto their outdated perception of harmony. It is of utmost importance to crush this resistance and destroy their will before they can pose any serious threat to our nation.\n\nCurrently, the resistance is [Root.SOL_resistance_strength]. If §Pharmonic popularity§! rises too high or §Ystability§! falls too low, a §Rfull-scale civil war§! might break out."
