 solarempire.17.b:0 "Purifying fire shall cleanse them of their sins."
 
 solarempire.18.t:0 "The Sword and Shield of the Sun"
 solarempire.18.d:0 "TODO daybreaker watches over a marching column of soldiers with blueblood by her side. she suddenly starts monologuing about how ponies have always looked to alicorns to save them from their own failures and weaknesses, and that this is her key to power. without alicorns, ponykind is doomed into infighting and become prey for their enemies. only strength and power can keep ponykind united and strong. blueblood then says hes glad to hear Db still cares about her little ponies so much. DB responds by cackling like he just said the funniest fucking joke ever told."
 solarempire.18.a:0 "All who challenge the sun will burn."
 
 solarempire.19.t:0 "She Who Goes Forth Shining"
 solarempire.19.d:0 "TODO Kibitz (pony from the comics go read them, celestias royal scheduling advisor) has been summoned to DBs throne room (do not expplicitly mention canterlot). On the way there he sees lunas pet opossum Tiberius. Kibitz gets a little emotional and takes the opossum, saying he will take care of it now that its owner isnt here, putting him in his pocket. He then arrives in the throne room and sees it is being extensively renovated. DB herself seems odd, wearing more regalia than usual and with fanaticism in her eyes and wide grin. Kibitz asked what she wanted and she says kibitz must make preparations for a religious ceremony formally marking daybreaker's ascension to godhood. Kibitz is taken aback and asks if she has gone completely insane. Daybreaker laughs and says her mind is as clear as day. Tiberius then comes out of Kibitz' pocket, and while he initally tries to hide it, he sees disdain in DB's eyes and says what would her sister think of her now. The last thing the two see are DB's horn blinding them by shining as brilliantly as the sun."
 solarempire.19.a:0 "Gods care not for the opinions of mortals."
 
