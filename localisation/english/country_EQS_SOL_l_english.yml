 SOL_twiggles_corruption_category:0 "The Wayward Student"
 SOL_twiggles_corruption_category_desc:0 "Of all the ponies that should have understood our Empress's decisions, her faithful student would have been obvious, yet she has remained the most resistant to §YDaybreaker's§! new order. Rather than listen, rather than understand, she has openly defied the Empress and sought to destroy her reign before she could hope to form the Empire into a powerful force to defend ponies, friendship, and harmony.\n\nHowever, the Empress is nothing if not merciful. While she has every right to punish §PTwilight Sparkle§! for her insolence, she has decided to §Oenlighten§! her student and provide further lessons. It is only a matter of time before Twilight's resistance is §Rshattered§! and she will finally step into the light and become what she was always meant to be.\n\nTwilight's resistance is currently: [SOLGetTwigglesResistance]\nTwilight's current desire to serve Daybreaker is as: [SOLGetTwigglesClass]"
