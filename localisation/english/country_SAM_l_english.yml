### Leader Desc ###
SAM_VANISTO_DESC:0 "§YBiography§!: Only one and a half years after the end of the Summer Revolution, the rule of Manfred Vanistö threatens to send Sambar into civil war once more. The "Iron Regent", as he is called, has hung on to power through a combination of treachery, intimidation, and bloodlust, and has refused to allow the young Yaril of Sambar to inherit at any costs, despite the deer already of an age to succeed the throne as is his right. Nobles and monarchists stand outraged that the regent will not give up even an inch of his power to the rightful ruler of the country, while an increasingly discontent agrarian population plots another revolution in the shadows, and continues to harass noble holdings across the country, reject conscription, and demand the restoration of a true people's ruler, selected among the ranks of the native Hindians.\n\nThe road ahead is treacherous, but with the power of the navy and the settlers behind him, a ship to Olenia might not be in order for the Iron Regent after all.\n\n§YPortrait by§!: MonAx" #Rewrite this eventually

  #Manfred and Fam

SAM_husband_man: "Thorold Brocketson" 
SAM_manfred_daughter: "Vanessa Manfreda Vanisto"
SAM_manfred_daughter_desc: ""

  #Navy
SAM_girlboss_admiral: "Agnes Olafdottir"
SAM_girlboss_admiral_desc: "§YBiography§!: Agnes Halfdottir is the current grand admiral of the Sambari navy. She comes from a long line of Olenian vikings and makes this fact known to anyone who speaks to her.\nAgnes is a loyal defender of the status quo and will not accept anything but complete Olenian domination over Sambar."


SAM_thorfinn: "Thorfinn"

  #Army
SAM_kirin_cop: "Iris Copper"
SAM_kirin_cop_desc: "§YBiography§!: Iris Copper is the current head of the Sambari army. From a second generation Kirin immigrant family, Iris felt great admiration towards the vikings for their bravery and strenght. He was however rejected by the navy due to his Kirin heritage. Feeling angry and wanting to get back at them, he joined the nation's national guard and quickly rose up through the ranks.\nDuring the summer revolution Iris Copper lead a group of loyalist forces within the interior.\nIris Copper is very popular within the troops, and his removal might lead to a revolt within our the nation's army."

SAM_askeladd: "Askellad"

