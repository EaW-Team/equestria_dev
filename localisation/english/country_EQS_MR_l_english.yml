marks_revolution_equal.1.t:0 "Ponyville Incident"
marks_revolution_equal.1.d:0 "TODO: A pony worked for several years without a single complaint, but then they refused to renew his contract and hired another pony with a “more suitable cutie mark” in his place, and they didn’t even give him a chance to prove himself because “marks don’t make mistakes.” While it's not the first time this happened, the growing popularity of the Blank Flanks Forever movement, BFF, due to a point of divergence on the episode, and it happening in the main area of said movement lead to the news spread like wildfire, which becomes known as the Ponyville Incident."
marks_revolution_equal.1.a:0 "TODO: This won’t lead to anything good."

