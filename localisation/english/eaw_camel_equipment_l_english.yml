 ### INF ###

 CME_melee_equipment_0:0 "Old Camelian Arms"
 CME_melee_equipment_0_short:0 "Old Camelian Arms"
 CME_melee_equipment_0_desc:0 "The unsung legions of the Heroic Age, from the earliest warrior bands detailed in the Xronikalar, to Iltasadum's Empire of antiquity, all the way to the advent of industrial modernity, made use of a fairly consistent set of arms; across the Eastern half of Zebrica, camel mercenaries and armies were known for their distinctive halberds, making use of their bigger size to scatter enemy formations with heavy charges. And of course, no self-respecting camel went long without a dagger, always their the sidearm of choice."
 CME_melee_equipment_1:0 "'Yong'in Zarbasi' Muzzle-loading Rifle"
 CME_melee_equipment_1_short:0 "'Yong'in Zarbasi'"
 CME_melee_equipment_1_desc:0 "Taken almost entirely from an early Colthagian design that made its way down the Diamond Road, the Yong'in Zarbasi, meaning Firestrike, is a simple muzzle-loading rifle, whose most redeeming quality is packing a serious punch for its size. However, the weapon's extreme inaccuracy and low rate of fire mean its the most effective use would be in mass mobilized ranks of riflecamels, the kind of standing army Camelia hasn't had until recently. As such, it's been largely relegated to a skirmish and ambush weapon, only used briefly before transitioning to melee."
 CME_infantry_equipment_0:0 "'Bluebolt' Breech-loaded Rifle"
 CME_infantry_equipment_0_short:0 "GCA 'Bluebolt'"
 CME_infantry_equipment_0_desc:0 "A mass-produced rifle first brought to Camelia by the Storm King's legions, it soon found itself in the feet of camel raiding parties that looted weapon caches, and by sawing off the trigger guard, the Bluebolt could be made an exceedingly good fit for camel forces. Reliable on the field, accurate at medium ranges, easy to clear and maintain, easy to repair with replacement parts, and providing a much more streamlined training process; everything an aspiring modern army looking to get its footing needs."
 CME_infantry_equipment_1:0 "GCA 'Oqsoqollarning Ovozlari' Bolt-action"
 CME_infantry_equipment_1_short:0 "GCA-OO"
 CME_infantry_equipment_1_desc:0 "Named 'the voices of the Elders' for its exceedingly loud and ringing fire, the first field-tested bolt-action Camelian rifle provides increased rate of fire at a minor cost in accuracy compared to earlier designs, though the flexibility of the design has allowed for the spread of specialized modifications, such as scoped and more accurate variants. The base model itself is easy to mass produce, and can be used effectively with a variety of pistols, bayonets, grenades and other assorted sidearms."
 CME_infantry_equipment_2:0 "GCA 'Kaogingi Soyasi' Machine Gun"
 CME_infantry_equipment_2_short:0 "GCA Kaogingi"
 CME_infantry_equipment_2_desc:0 "An ambitious machine gun design, it was nicknamed 'The Shadow of Kaogingi' in honor of the chronicle of the same in the Xronikalar, in which the city's archers were said to have been so numerous that their arrows snuffed out the sunlight in the battlefield when it was atacked. Not as grandiose in its application, the Kaogingi nevertheless does not disappoint, and provides reliable sustained fire that excels in close-quarter and point defense operations."
 CME_infantry_equipment_3:0 "GCA Furna Pattern Machine Gun Emplacement"
 CME_infantry_equipment_3_short:0 "GCA 'Furna'"
 CME_infantry_equipment_3_desc:0 "An advancement in small arms towards a more flexible and wide-ranged set of battle operations, the Furna Pattern anti-materiel heavy rounds excel in allowing infantry to punch above their weight and hold fortified positions against mechanized army advancements, a much needed innovation as Zebrican armies begin implementing combined arms warfare with tanks and armored trucks. A well placed burst can pierce lower end plating and tank tracks, making this new model of machine gun essential for lone infantry squadrons."
 CME_infantry_equipment_x:0 "GCA 'Shamol Qo'Shig'i' Semi-Automatic, Model 5"
 CME_infantry_equipment_x_short:0 "GCA Shamol-5"
 CME_infantry_equipment_x_desc:0 "The so-called 'Song on the Wind' is a functional and utilitarian design that most prides itself on its universal applicability in military operations and versatile fire modes. There are few infantry arms niches that Shamol pattern rifles cannot fulfill satisfactorily, and combined with their streamlined production protocols, it has easily become the most iconic modern rifle fielded by the Grand Camelian Arsenal."
 CME_infantry_equipment_x_2:0 "GCA 'Shamol Qo'Shig'i' Semi-Automatic, Model 12"
 CME_infantry_equipment_x_2_short:0 "GCA Shamol-12"
 CME_infantry_equipment_x_2_desc:0 "With the army settling into a standardized modern field doctrine, the Shamol platform has become fully entrenched in the armed forces as the go-to infantry service rifle for the modern camel soldier, refined with lighter polymer components and a refurbished internal mechanism for more a more portable and reliable weapon. It is, in every respect, the pinnacle of its model line, fit for action in virtually all battlefield conditions."
 CME_magical_equipment_1:0 "SDB 'Kurunai' Rifle"
 CME_magical_equipment_1_short:0 "SDB 'Kurunai'"
 CME_magical_equipment_1_desc:0 "Typical thaumaturgical applications do not come as naturally to camelkind as they do to some other races, but necessity and ingenuity in equal measure have produced a most unique magical weapon nonetheless: so named for the Kurunai caravan that initially prototyped it, refined by the Starwatchers' Design Bureau, it shoots conventional rifle rounds using an alchemical compound mixture and an intrically rifled barrel to propel shots with a much meatier punch and increased accuracy. Though reliable, it remains costly to manufacture."
 CME_magical_equipment_2:0 "SDB Quyosh Karnay Prototype"
 CME_magical_equipment_2_short:0 "SDB-QK"
 CME_magical_equipment_2_desc:0 "The Sunspeaker prototype is a daring application of Camelian divination magic in combination with a streamlined firearm design. A runic enchantment along the barrel rifling imbues ammunition with pseudoprescience, guiding the shot and stabilizing the arc to such a degree as to entirely flatten the typical cone of fire. As a result, the weapons is supernaturally accurate, and a trained riflecamel can make their shot ring true well outside the retalliatory range of enemy forces."
 CME_magical_equipment_3:0 "SDB Quyosh Karnay Model 10"
 CME_magical_equipment_3_short:0 "SDB-QK10"
 CME_magical_equipment_3_desc:0 "Having field-tested and refined the Sunspeaker platform for a wider range of applications, further thaumaturgically enhanced materials now gift this line of weapons with such a strong pseudoprescience that from the perspective of the soldier, the weapon essentially tells them when to pull the trigger all on its own. In addition to a lighter frame and easier production methods, the weapon also supports a better rate of fire without sacrificing its godly precision."
 CME_magical_equipment_4:0 "SDB Quyosh Karnay Definitive Model"
 CME_magical_equipment_4_short:0 "SDB-QKD"
 CME_magical_equipment_4_desc:0 "Material science has been melded with divination to such a degree that the latest QK rifle barely requires a clear line of sight, with moderately profficient infantry personnel able to maintain decent pressure on the enemy even through the thick haze of a duststorm or the fog of a heavy bombardment. In the feet of a veteran markscamel, being in the Sunspeaker's sights is a death sentence as guaranteed as the rising and setting of the sun itself."

