 CME_artillery_equipment_0:0 "Early Blackpowder Cannon"
 CME_artillery_equipment_0_short:0 "Blackpowder Cannon"
 CME_artillery_equipment_0_desc:0 "Driven by the particularities of Camelian geography, early artillery pieces could not make use of a traditional wheeled platform base, since without the flexibility of rubber tires, any attempt at a wheel based heavy load carriage would inevitably sink into the soft sand. As such, the earliest Camelian artillery designs made use of a complex cast iron toothed track, not unlike that of a modern tank, soldered with a solid hardwood base and combined with a durable tail that drags behind the carriage and provides a solid emplacement."
