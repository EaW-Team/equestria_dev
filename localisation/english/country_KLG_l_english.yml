KLG_chummer_tailspring_gen_desc: "§YDate and place of birth:§! §LApril 5, 979 AL, Panthera§!\n\n§YBiography§!: §LChummer met Capper Dapperpaws when they were both still homeless kittens on the streets of Panthera. Soon four more cats joined them, and together they created one of the most famous street gangs of their time. The police tried unsuccessfully to catch them for many years — but they slipped away every time, and that was largely thanks to Chummer. As a rule, it was he who took on the organization of the next job and timely devised new escape routes if the originally planned ones turned out to be unavailable.\n\nDuring the Storm King's invasion of Abyssinia, Capper and Chummer left Panthera and wandered the desert for several weeks in search of a safe place. It was then that they reached Kludgetown. During the journey, the Malachite of Misfortune, stolen from the treasury of the Claomon dynasty, ended up in their paws. How the Storm King's flotilla managed to lose this incredibly valuable artifact remained a mystery even to him. But one way or another, the owners of the Malachite were now two street thieves from Panthera. In Kludgetown, they immediately tried to sell it to the local crime lord. However, during the closing of the deal, Chummer unexpectedly disrupted it and stole the buyer's airship. During the chase, the ship was shot down and a few hours later crashed in the desert far outside the city — while Capper was left owing one of the city's most influential racketeers a huge sum of money.\n\nChummer managed to survive the crash, and after some time he was taken in by a diamond dog family from the lower levels. They healed him and shared their bread with him for many months — even when they themselves had almost nothing to eat. Chummer realized his guilt before his friend and during the Revolution tried with all his might to redeem it — and Capper managed to forgive Chummer. And now they are going to make this city the best place in all of Western Zebrica together.§!"
KLG_admiral_fluffington_gen_desc: "§YDate and place of birth:§! §L19 October 972 AL, Panthera§!\n\n§YBiography§!: §LWhere this cat managed to get his amazing suit with a black bowler hat and where he learned such exquisite manners remains anyone's guess. Because despite his appearance or his name, he has never been an aristocrat or an admiral. In fact, he came up with this nickname solely as a marketing ploy — because no one would want to listen to an ordinary cat named Fluff Meowicis. In Capper's team, Admiral Fluffington was the main source of clever thoughts and a jack-of-all-trades. If a difficult lock needed to be picked or an airship hijacked, that was a job right up his alley.\n\nAdmiral Fluffington's move to Kludgetown was not connected to the Storm attack at all, but rather to the economic and political crisis that followed it. The treasures confiscated from the royal family were the main source of financing for many socially significant institutions, and without them, the country was slowly plunging into depression. The Admiral decided to try his luck in the free city of Western Zebrica — but disappointment awaited him here as well. The local crime bosses demanded payment from him for the right to demonstrate his skill, and that is partly why he was so glad to see his friends in the ranks of the revolutionaries. For Admiral Fluffington, this was a chance to create an ideal society for people like him in at least one corner of the world — and today his work in this direction is only beginning.§!"
KLG_molly_astra_gen_desc: "§YDate and place of birth:§! §LFebruary 25, 985 AL, Panthera§!\n\n§YBiography§!: §LMolly Astra belongs to a small and little-known subspecies of dwarf Abyssinian cats. The uninitiated often mistake them for ordinary kittens — but Molly is not nearly as cute as she might seem. Her experience in using explosives made her one of the most famous demolitions experts even back in the times before the Storm King came to these lands — when she still lived in Panthera. In Kludgetown, she enjoyed the fame of the most successful safe-cracker, and all crime lords — including Verko himself — turned to her for help more than once. Today, under her leadership, a special sabotage department has been created within the free city's foreign intelligence, which deals with organizing explosions at key military targets on enemy territory.\n\nHowever, aside from her unusual line of work, Molly is truly a very sweet and kind cat. For all her friends, she was and remains the ideal younger sister. She always has ideas on how to cheer them up or help them cope with life's difficulties. Molly will always listen to them and always give sound advice. That is precisely why Capper valued his longtime friend and still sometimes comes to her for help. And whenever she hugs him and purrs quietly while doing so, all unpleasant thoughts go away very quickly and the world once again seems filled with joy.§!"
KLG_big_maxis_gen_desc: "§YDate and place of birth:§! §LDecember 9, 977 AL, Panthera§!\n\n§YBiography§!: §LMax talks very little about his past — just as almost nothing is known about the reasons for his huge height and physical strength. His parents were completely ordinary cats of average size — but from birth Max began to grow at a rate unbelievable for an Abyssinian, and by his third birthday he was already as tall as his parents. Peers often mocked his size — yet, thanks to his upbringing, he hesitated to fight back against them. Although if he wanted to, he could easily defeat any of them in a fight, or even all of them at once.\n\nHe joined Capper's gang after being forced to leave home at the age of twelve. His parents' modest dwelling simply wasn't able to withstand such enormous weight. For a group of street thieves, the bruiser came in very handy — the local police preferred to stay as far away from the giant and his friends as possible. And if a wall needed to be breached or a heavy safe carried out, Max the strongman handled it easily. In Kludgetown, the locals treated him with much greater respect — for obvious reasons. This helped him overcome his long-standing fear of communication and gradually begin to socialize. Meeting his old friend made him one of the most ardent proponents of harmony. Max felt comfortable only in the company of true friends — and he would like to help all the city's inhabitants achieve the same through harmony and the true magic of friendship.§!"

KLG_taiko_paumurr: "Taiko Paumurr"
KLG_taiko_paumurr_trait: "Union Leader"
KLG_taiko_paumurr_desc: "§LFrom the very beginning of the uprising, Taiko was the most influential and ambitious union leader. Prior to that, he served as a junior manager for several years and knew the needs of his subordinates inside out, trying whenever possible to ease the pressure from the owner. Management experience allowed him to create one of the strongest unions in the entire city and direct all its strength to help Ivy Meowlin and his political party. At the same time, Taiko himself remains on principle in the position of non-partisan support for the working class and refuses to join any other political organizations besides his own trade union coalition.§!"
KLG_zabgunar_zongo: "Zabgunar Zongo"
KLG_zabgunar_zongo_trait: "Free Stallion"
KLG_zabgunar_zongo_desc: "§LUntil recently, Zabgunar knew no free life. His parents were caught and sold into slavery in Abyssinia many years before his birth, and the master separated him from his family at the age of several months. The foal was sold to a manufacturer from Kludgetown and lived with him for the next twenty years. During this time, Zabgunar saw all the charms of slave life and swore at all costs to win back his freedom and pass it on to his future children. During the communist uprising, he was the first to raise a hoof against his master and joined a Revolutionary Guard detachment formed from escaped slaves. The story of his struggle made him a famous figure among other slaves liberated by the Revolution and allowed him to be elected to the regional council as a representative of this social group.§!"
KLG_hammer_steel: "Hammer Steel"
KLG_hammer_steel_trait: "Convinced Centralist"
KLG_hammer_steel_desc: "§LBefore the Revolution, many considered Hammer to be from Meergipt — but in reality, before his emigration to Zebrica, he lived for a long time in Equestria and Soviet Northumbria. He was one of the Communist Party activists during the Winter Revolution, and Steel Stallion personally thanked him for organizing the Red Guard in Ladimir — later renamed in honor of Caramel Marx. However, after Stallion's death and the coming to power of General Secretary Altidia Revolzova, he found himself among the first wave of left-wing emigration after publicly criticizing the General Secretary. Hammer strives to fully implement Stallion's political program within the framework of the Revolution in Kludgetown and enjoys Ivy Meowlin's trust — although he disagrees with him on a number of positions.§!"
KLG_white_castor: "White Castor"
KLG_white_castor_trait: "Staunch Autonomist"
KLG_white_castor_desc: "§LOne of the most famous sociologists of his time and a professor at the Royal Institute of Meergipt — White Castor moved to Kludgetown shortly before the Revolution to study the phenomenon of the criminal city and immediately found himself dragged into the thick of events. His sympathies from the very beginning were on Ivy Meowlin's side, and during the protests he could be seen on the barricades alongside ordinary working people. It was he who advised the Workers' Council when drafting the program of Revolutionary transformations and is currently a prominent representative and unofficial leader of the Libertarian opposition. Ivy Meowlin highly appreciates White Castor's knowledge and experience and often listens to his advice — however, many centralists consider him a potential threat to the further spread of the Revolution.§!"
KLG_greit_morgen: "Greit Morgen"
KLG_greit_morgen_trait: "Foreign Volunteer"
KLG_greit_morgen_desc: "§LDuring his turbulent youth, Greit Morgen was a supporter of the Republican Revolution and participated in the capture of Greifenheim by Marshal Kemerer's troops. At the same time, he leaned more towards socialism, and when the conflict began between the left wing of the Republican Party and the Republic's Government, he joined the reds and went north with them — to the recently founded city of Skynavia. However, even there he failed to achieve significant success in elections — but managed to secure good connections among communists across all of Griffonia. Colleagues considered Greit to be too fixated on Revolutionary War and did not allow him to hold high positions — as this could have drawn the young Republic into unnecessary conflicts. However, when leftists from all over the world began flocking to Kludgetown after the Revolution, it was Greit who organized and led the foreign volunteers program to defend the conquests of the Revolutionary Commune.§!"
KLG_yaffirat_nashirr: "Yaffirat Nashirr"
KLG_yaffirat_nashirr_trait: "Fiery Revolutionary"
KLG_yaffirat_nashirr_desc: "§LAsstyria was never particularly welcoming to socialists and any manifestations of left-wing thought — however, with the accession of King Asbanipal to power, the law on eradicating foreign influence came into effect, and all supporters of Caramel Marx's ideas were declared state criminals. Yaffirat spent almost ten years in prison for distributing socialist ideas and would have sat there for the rest of his life — but he managed to escape and move first to Abyssinia — and then to Kludgetown. He met Ivy Meowlin by chance, and they quickly struck up a strong friendship. Yaffirat was the main organizer of the underground during the preparation for the Revolution and was subsequently appointed by the Council to the post of hoof-leader of foreign intelligence for the young socialist republic. His main task in this post was establishing contacts with representatives of banned left-wing parties in neighboring countries and coordinating their actions with our government.§!"

klugetown_news.1.t:0 "[KLG.GetNameDef]!"
klugetown_news.1.d:0 "[This.GetNewspaperHeader]In a completely incomprehensible manner, Kludgetown's notorious criminals and scoundrels have conquered Abyssinia and Meergipt. While international observers in shock try to comprehend what happened, [KLG.GetLeader] — the new head of administration, promises prompt economic growth and the expansion of freedoms for all.\nThe free city has turned into a free territory where the rule of law has been completely supplanted by mafia rule. Kludgetown is infamous for its gross disregard of all international norms, and it is not yet clear how this new state will act on the world stage. In any case, it seems likely that Kludgetown, or [KLG.GetNameDef], will continue to be an open territory."
klugetown_news.1.a:0 "How did they manage this!?"
klugetown_news.1.b:0 "Kludgetown will remain open forever!"

klugetown_news.2.t:0 "Harmonic Revolution in Kludgetown"
klugetown_news.2.d:0 "[This.GetNewspaperHeader]The unexpected news of the reorganization of the Free City of Kludgetown following the escape of the leader of one of the most influential criminal syndicates in Western Zebrica has become one of the most discussed topics in the world today. The Provisional Government led by Capper Dapperpaws has announced the end of the transition period and organized the first election of the Burgomaster in many years.\n\nAs expected by everyone, the leader of the Revolution himself took this post. Political opponents are already calling him Canterlot's agent of influence in Western Zebrica and Celestia's puppet. However, the inhabitants of the free city themselves seem to trust their new leader."
klugetown_news.2.a:0 "Harmony triumphs once again."
klugetown_news.2.b:0 "A new era for our city."

klugetown_news.3.t:0 "Revolutionary Commune of Kludgetown"
klugetown_news.3.d:0 "[This.GetNewspaperHeader]Significant changes in the foreign and domestic policy of the Free City of Kludgetown are causing concern in the Western Zebrica region. After the radical-left Social Democratic Workers' Party came to power, its leader — the famous communist Ivy Meowlin — announced his intention to spread the Revolution to the entire region and thus effectively declared himself an enemy of several states at once.\n\nA number of socialist activists in various countries express clear sympathy for the Revolutionary Commune of Kludgetown — however, most see the communist leader's ambitions as an obvious threat to stability in the region."
klugetown_news.3.a:0 "This madman must be stopped."
klugetown_news.3.b:0 "Long live the Revolution!"

