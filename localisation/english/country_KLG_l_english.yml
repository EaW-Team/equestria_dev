KLG_gather_everyone: "Gather Everyone"
KLG_gather_everyone_desc: "Lord Verko highly values the loyalty of his junior partners. None of them are ready to question his authority. However, the fall of the Storm King was not in his plans, and the possible consequences of this event, which is largely beneficial for the city, may prove unpredictable."
KLG_dirt_under_our_paws: "Dirt Under Our Paws"
KLG_dirt_under_our_paws_desc: "All these pathetic attempts at resisting the Family's rule are nothing more than the meaningless scuttling of insects. We cannot afford to show weakness — Verko's inner circle demands decisive measures from him, and he realizes — the time has come to unleash all our might upon the enemies remaining in the city."
KLG_organize_fires: "Organize Fires"
KLG_organize_fires_desc: "Most of the lower city consists of slums, and dry wood is the main building material for them. And if a fire 'accidentally' breaks out in one of these districts, no one will have a reason to blame us for it. And even if someone dies — what does that have to do with us?"
KLG_arm_radicals: "Arm Radicals"
KLG_arm_radicals_desc: "Frankly speaking, Kludgetown is the world's largest haven for outcasts and criminals of all stripes. And some of them harbor a special dislike for the labor movement. And if we provide their gangs with weapons and ammunition, they will be glad to do all the dirty work for us."
KLG_get_rid_of_witnesses: "Get Rid of Witnesses"
KLG_get_rid_of_witnesses_desc: "The fact of our participation in the recent events with the rebel leaders is already known to the whole city. And that would be just fine — but some not-very-smart citizens have the audacity to talk about it openly and provoke new riots. And that was rather foolish on their part. Very foolish."
KLG_accuse_socialists: "Accuse Socialists"
KLG_accuse_socialists_desc: "Who even said that we are to blame for the deaths of several dozen shopkeepers? Have you even seen these left-wing radicals? Their hatred of capitalism in any form would definitely have pushed them to murder peaceful merchants, and we are ready to vouch that it was they who committed all these crimes."
KLG_subjugation_through_torture: "Subjugation Through Torture"
KLG_subjugation_through_torture_desc: "Although normally in matters of conducting 'business' the use of torture is considered too crude and unworthy of an occupation, it is necessary to grant our colleagues complete freedom regarding such measures. Only thus can we effectively 'persuade' certain particularly uncomprehending individuals to cooperate with us."
KLG_crush_the_resistance: "Crush the Resistance"
KLG_crush_the_resistance_desc: "This battle has practically ended in our victory. Almost all active participants of the resistance have been killed, and it remains only to smash the remaining underground cells. Fortunately — thanks to the information obtained from prisoners, we know their exact location and are ready to strike immediately."
KLG_deal_with_hostages: "Deal with Hostages"
KLG_deal_with_hostages_desc: "Hundreds of captured socialists are still in our hands and meekly await their fate. The will of most of them has been completely broken — but Lord Verko still cannot let them roam free. They must die and disappear from the history of the city forever."
KLG_surgical_delicacy: "Surgical Delicacy"
KLG_surgical_delicacy_desc: "Lord Verko is very sophisticated in politics, and experience suggests the only correct strategy for fighting the rising rebels. One should not act hastily and provoke them into even greater follies — to win, it is necessary to skillfully lure them into the trap of their own weakness."
KLG_introduce_your_agents: "Infiltrate Our Agents"
KLG_introduce_your_agents_desc: "In the current situation, Capper and his democrats are ready to accept anyone into their movement — including rather dubious characters. His inexperience in politics is showing, and it will ruin him — under the guise of ardent opponents of the regime, we will infiltrate our agents into his party."
KLG_find_and_buy_accomplices: "Find and Buy Accomplices"
KLG_find_and_buy_accomplices_desc: "Far from all rebels are ideological supporters of Capper. Some simply see this as an opportunity to earn more, and if our agents contact them, they will definitely be able to persuade them to change sides and offer much more favorable terms of cooperation."
KLG_compile_lists: "Compile Lists"
KLG_compile_lists_desc: "Every day more and more prominent opponents of our rule reveal themselves. Their names become public property and, what is equally important, end up on our blacklists. And if you end up on the blacklist of the Kludgetown mafia, sooner or later retribution will catch up with you."
KLG_sow_discord_in_the_coalition: "Sow Discord in the Coalition"
KLG_sow_discord_in_the_coalition_desc: "There has never been a consensus among the protesters regarding the future of the city. While some envision it as a democratic free-market utopia, others dream of building a socialist state. It only takes a little work — and they will tear each other's throats out."
KLG_intimidate_shopkeepers: "Intimidate Shopkeepers"
KLG_intimidate_shopkeepers_desc: "Trade occupies an important part of our city's economy, and small shopkeepers are the ones who mainly support Capper. However, this cat forgets one feature of his electorate — any shopkeeper loses all desire to protest at the very first threat to the existence of his business."
KLG_remove_the_tumor: "Remove the Tumor"
KLG_remove_the_tumor_desc: "Now — when the names of all prominent opposition leaders are well known to us and most of their supporters are not ready to take to the streets to defend their heroes — the time has come to behead the enemy with one precise blow. We will need just one night to resolve this issue once and for all."
KLG_eliminate_kapper: "Eliminate Capper"
KLG_eliminate_kapper_desc: "Capper turned out to be much more resourceful than we thought. By some miracle, he managed to escape the fate of his comrades and survived the operation to purge the opposition field and is still trying to muddy the waters. We must get rid of him — and this time the agents definitely won't miss."
KLG_restore_hierarchy: "Restore Hierarchy"
KLG_restore_hierarchy_desc: "The internal laws of the Mafia are based on unquestioning obedience to superiors and compliance with the unwritten Code of Honor — sacred to every member of the family. Any participant in this organization — from a rank-and-file operative to Lord Verko's personal consigliere — is obliged to strictly follow this law."
KLG_the_calm_after_the_storm: "The Calm After the Storm"
KLG_the_calm_after_the_storm_desc: "The Storm King's rule had a number of negative consequences for Kludgetown. However, thanks to the fruitful cooperation between the conquerors and Lord Verko, we managed to smooth out these consequences significantly, and today the city has practically returned to its former prosperous state."
KLG_sell_slaves: "Sell Slaves"
KLG_sell_slaves_desc: "Thanks to its favorable location, our city's ports have become an important trade hub for the transportation of slaves within the Storm King's Empire. And a certain amount of this commodity still remains in the city. We must find a buyer as soon as possible — before they escape or riot."
KLG_recruit_mercenaries: "Recruit Mercenaries"
KLG_recruit_mercenaries_desc: "All sorts of adventurers formed the backbone of the Storm King's army in many of his campaigns and made up the bulk of the Western Zebrica garrison. After the Battle of Aïn Trotghur, many of them chose to stay in the city, and if we can negotiate with them, it will significantly simplify our situation."
KLG_share_with_the_people: "Share with the People"
KLG_share_with_the_people_desc: "Every day the Family receives huge profits from its 'business', and Lord Verko wishes to reject the opposition's accusations and generously reward the common people for their loyalty. Millions in gold from the sale of all kinds of illegal goods will be spent on improving the welfare of the citizens."
KLG_the_mafia_is_immortal: "The Mafia is Immortal"
KLG_the_mafia_is_immortal_desc: "The opposition's attempts to rouse the people against Lord Verko's rule ended in their inevitable demise. The permanent leader of the White Sands clan outplayed and destroyed them all like utter idiots, strengthening the Mafia's rule over the city. Now no one will dare to object to this state of affairs."
KLG_friend_that_we_need: "The Friend We Need"
KLG_friend_that_we_need_desc: "I am your friend — here I am. That is all you need right now.\nI am your friend, your amigo, I am salvation for you.\nI have come to show you where the light is in the dark.\nCalm down and be obedient to me. And that's the whole secret."
KLG_assemble_a_band: "Assemble a Band"
KLG_assemble_a_band_desc: "Capper's loyal friends have reunited with him after many years. He trusts each of them as much as himself, and it was they who helped him liberate the city from Verko's tyranny. But now they face an even more difficult task — together to create a new, free, and harmonic Kludgetown."
KLG_negotiate_with_iwie_meowlin: "Negotiate with Ivy Meowlin"
KLG_negotiate_with_iwie_meowlin_desc: "Ivy Meowlin's trade union activists were valuable allies for us. Behind them stand the voices of tens of thousands of workers from the lower levels, and if we want to create a truly popular state for everyone and anyone, we must invite this cat to participate in its construction."
KLG_no_cooperation_with_commies: "No Cooperation with Communists"
KLG_no_cooperation_with_commies_desc: "Caramel Marx's ideology is incompatible with the fundamental principles of our Revolution. Although the socialists played their part in overthrowing Verko, we cannot allow them to replace the criminal dictatorship with a socialist party dictatorship and limit the rights and freedoms of free traders."
KLG_reorganize_the_provisional_committees: "Reorganize Provisional Committees"
KLG_reorganize_the_provisional_committees_desc: "The government bodies created through popular initiative are still not full-fledged parts of a single state mechanism. Their activities are not enough to restore order, and therefore they must be subordinated to a single democratically elected Government of the free city."
KLG_rebuild_the_town: "Rebuild the Town"
KLG_rebuild_the_town_desc: "During the protests, some city buildings were severely damaged. Hundreds of city residents were left homeless and without the opportunity to earn a crust of bread. We must make every effort to rectify the consequences of the Revolution and return the city to its former appearance."
KLG_declaration_of_the_rights_of_sentient_being: "Declaration of the Rights of Sentient Beings"
KLG_declaration_of_the_rights_of_sentient_being_desc: "Slavery was and remains a disgusting relic of the past. No living sentient being should be the property of another, and our friends from Equestria realized this a very long time ago. However, in Kludgetown, the slave trade persisted and flourished for many years. It is time to put an end to this."
KLG_truly_free_economy: "A Truly Free Economy"
KLG_truly_free_economy_desc: "Kludgetown has always attracted free traders with its unique status. However, not everyone liked the unwritten rules and artificial restrictions for competitors established by the Mafia. There will be no more of this, and the trade haven of Western Zebrica will become truly free."
KLG_lend_a_helping_paw: "Lend a Helping Paw"
KLG_lend_a_helping_paw_desc: "Over long years of rule, the Mafia pumped huge amounts of money out of the city's ordinary residents. Now most of it has left along with the fugitive crime lords — but some proved impossible to take out and now belongs to us. This money must be returned to the people."
KLG_town_is_waking_up: "The Town is Waking Up"
KLG_town_is_waking_up_desc: "The Transitional Government has fulfilled its main task. The free city finally got rid of the consequences of criminal rule and was reorganized into a democratic republic. It is time to hold the first free elections and strengthen the formation of civil society."
KLG_revolution_has_happened: "The Revolution Has Happened"
KLG_revolution_has_happened_desc: "Caramel Marx's predictions are once again confirmed. Although until very recently it was impossible to believe — the proletariat, led by the Workers' Council and the vanguard of the Revolution, the Social Democratic Workers' Party, has nevertheless managed to take power into its paws."
KLG_fate_of_tyrants: "Fate of Tyrants"
KLG_fate_of_tyrants_desc: "Verko and his gang were captured by the Revolutionary Guard and are currently under arrest. Their crimes against the working people are great and must be subjected to fair retribution. They await a harsh sentence from the Revolutionary Tribunal, and only then will the Revolution be able to move forward."
KLG_protect_freedom_of_speech: "Protect Freedom of Speech"
KLG_protect_freedom_of_speech_desc: "It is necessary to preserve and support the pluralism of revolutionary thought. Only thus can we be sure of the correctness of the path we have chosen, avoid the degeneration of the Revolution into a bureaucratic dictatorship of counter-revolutionary formalism, and preserve the culture of nationwide governance."
KLG_decree_on_the_revolutionary_press: "Decree on the Revolutionary Press"
KLG_decree_on_the_revolutionary_press_desc: "The Revolution is obligated to defend itself, including on the pages of newspapers. It is necessary to place all mass media under the control of democratically elected Revolutionary Committees and prevent the publication of reactionary fabrications undermining the foundations of proletarian consciousness."
KLG_organize_council_elections: "Organize Council Elections"
KLG_organize_council_elections_desc: "The current composition of the Workers' Council leadership categorically does not correspond to the interests of the Revolution. As part of the first democratic elections in the city's history, it is necessary to provide citizens with broader access to voting and nominating candidates from among the working class."
KLG_expand_the_revolutionary_guard: "Expand the Revolutionary Guard"
KLG_expand_the_revolutionary_guard_desc: "Worker self-defense squads showed themselves brilliantly during the Revolution and immediately after it. However, their numbers are still insufficient for the full functioning of the Revolutionary Guard as an institution of public order."
KLG_new_economic_reality: "New Economic Reality"
KLG_new_economic_reality_desc: "The Revolution has liberated all oppressed strata of the population. The institutions of slavery and wage slavery have been swept away and gone down in history forever. However, the need to protect against the restoration of these institutions requires complete dedication and economic mobilization from former slaves and wage workers."
KLG_consolidation_of_resources: "Consolidation of Resources"
KLG_consolidation_of_resources_desc: "For decades, our city's resources were sold off by capitalists, and the true creators of these goods received pitiful crumbs from the profits obtained thereby. But now the Revolution will manage these resources much better and use them to improve the quality of life of the population."
KLG_expropriation_of_luxury_goods: "Expropriation of Luxury Goods"
KLG_expropriation_of_luxury_goods_desc: "The wealth of individuals close to the Mafia's power is estimated at millions of Equestrian bits. A significant part of this wealth was converted by them into status consumption — their huge mansions were bursting with expensive things. Now all these goods must pass into public ownership."
KLG_we_will_destroy_all_the_world_of_violence: "We Shall Destroy All the World of Violence"
KLG_we_will_destroy_all_the_world_of_violence_desc: "Establishing and consolidating the power of the working people in a single city is only the beginning. The Revolution must spread further and encompass the entire territory of Western Zebrica — from the island of Murcia to the eastern borders of Meergipt — and bring freedom to millions of workers in these lands."

KLG_untamed_crime_idea: "Untamed Crime"
KLG_untamed_crime_idea_desc: "The occupation of Kludgetown by the Storm King's forces significantly weakened the mafia's control over various criminal groups, and especially over petty thieves and other 'freelancers' of the Free City. And if previously they all 'worked' exclusively under the patronage of Verko and his Family and didn't even think of encroaching on his partners, now practically no one can feel safe. Even merchants who faithfully pay off their debts to the Mafia are frequently subjected to armed attacks, and the longer this continues, the more the city comes to resemble an endless battlefield between gangs."
KLG_controlled_crime_idea: "Controlled Crime"
KLG_controlled_crime_idea_desc: "Not a single purse in this city can be stolen without the Family's knowledge, and not a single coin from that purse will go unnoticed by Verko and his henchmen. All criminals of this country — from petty pickpockets to leaders of large armed gangs — are under the direct control and patronage of a single criminal clan and strictly follow its most important rule: never, under any circumstances, raise a paw against the Family or any of its partners. The Code of Honor has the status of absolute law, and immediate and harsh punishment follows any violation of it. The only way to survive in such a place is to back down."
KLG_skydocks:0 "Kludgetown Sky Docks"
KLG_skydocks_desc:0 "Airships constantly arrive in Kludgetown and depart from this city. They transport goods and passengers across Zebrica. Naturally, this facilitates trade and allows for a decent profit from it. And the fact that this opens up wide opportunities for smuggling does not bother the Kludgetown government at all."
KLG_black_market:0 "White Sands Black Market"
KLG_black_market_desc:0 "In Kludgetown, you can buy anything for a good price. From exotic drugs to hardened mercenaries, from debtor slaves to forged documents. Kludgetown offers services that in most other countries are considered immoral or even completely illegal."
KLG_mafia_rule:0 "Mafia Rule"
KLG_mafia_rule_desc:0 "In Kludgetown, organized crime has completely supplanted the normal state. Things are so bad that unfortunate citizens now turn to crime lords for help. Mafiosi have maintained stability in Kludgetown for decades, and they don't look too kindly on those who wish to conquer their lands."
KLG_mafia_rule_01:0 "Mafia Rule"
KLG_mafia_rule_01_desc:0 "In Kludgetown, organized crime has completely supplanted the normal state. Things are so bad that unfortunate citizens now turn to crime lords for help. Mafiosi have maintained stability in Kludgetown for decades, and they don't look too kindly on those who wish to conquer their lands."
KLG_mafia_rule_02:0 "Mafia Rule"
KLG_mafia_rule_02_desc:0 "In Kludgetown, organized crime has completely supplanted the normal state. Things are so bad that unfortunate citizens now turn to crime lords for help. Mafiosi have maintained stability in Kludgetown for decades, and they don't look too kindly on those who wish to conquer their lands."
KLG_army_of_mercenaries_idea: "Storm's Mercenaries"
KLG_army_of_mercenaries_idea_desc: "During his campaign, the Storm King gathered a huge army of bandits and adventurers from all over Zebrica and, in exchange for help in subduing the continent, allowed them to collect tribute from defeated states. They are accustomed to this state of affairs and do not plan to adapt to changes even after the destruction of their Empire. Fortunately, we are always ready to offer them similar terms."
KLG_payments_for_slaves_idea: "Payments for Slaves"
KLG_payments_for_slaves_idea_desc: "We sold several thousand slaves to an interested buyer, and he paid us generously for them.\n"
KLG_mass_protest_idea_01: "Mass Protests"
KLG_mass_protest_idea_01_desc: "Following the withdrawal of the Storm King's troops from the city, its residents suddenly felt much bolder than before. Opposition forces of varying degrees of radicalism are gathering crowds of disgruntled citizens around themselves and provoking riots and other forms of social protest. Many of them would like to see Kludgetown as a completely different city, and they will do everything possible to achieve this."
KLG_mass_protest_idea_02: "Mass Protests"
KLG_mass_protest_idea_02_desc: "Following the withdrawal of the Storm King's troops from the city, its residents suddenly felt much bolder than before. Opposition forces of varying degrees of radicalism are gathering crowds of disgruntled citizens around themselves and provoking riots and other forms of social protest. Many of them would like to see Kludgetown as a completely different city, and they will do everything possible to achieve this."
KLG_nascent_administration: "Nascent Administration"
KLG_nascent_administration_desc: "The establishment of the Transitional Democratic Administration was fraught with many difficulties. A full-fledged strong state never existed in Kludgetown, and its functions were performed from the very beginning by various criminal and quasi-criminal structures. Now Capper and his team have to create a new state from scratch and turn a city of savvy traders and petty thieves into a full-fledged civil society."
KLG_free_economic_zone: "Free Economic Zone"
KLG_free_economic_zone_desc: "Kludgetown's main advantage over other cities of Western Zebrica is the absence of jurisdiction by major states. For the right price, literally anything can be acquired here. Thousands of merchants from across the continent offer the rarest and most exotic goods on local markets — including some not entirely legal ones. And since there is no longer any need to pay the Mafia for the opportunity to trade, the number of people willing to offer their goods has increased significantly, and prices have become more affordable."
KLG_rebuild_the_town_idea: "Rebuilding the Town"
KLG_rebuild_the_town_idea_desc: "We broke it ourselves — we'll rebuild it ourselves. Only fair.\n"
KLG_new_republic: "New Democratic System"
KLG_new_republic_desc: "The new governance system of the free city is based on the principles of Harmony and democratic libertarian community living. Every citizen — from a major industrialist to a petty merchant or factory worker — has an equal right to propose any initiatives of local and city-wide governance and vote for them. All major decisions are made only with the consent of the people and can only be repealed by a nationwide vote."
KLG_scared_merchants_idea: "Scared Merchants"
KLG_scared_merchants_idea_desc: "Many city shopkeepers understood our opaque hints and stopped attending rallies. However, this has a flip side — they have essentially stopped going outside at all. And that is no longer very good.\n"
KLG_board_of_the_workers_council: "Workers' Council Board"
KLG_board_of_the_workers_council_desc: "After the Revolution, all executive and legislative power temporarily passed to the Workers' Council under the control of the Social Democratic Workers' Party and independent working-class deputies. The Council rules the city through direct decrees and orders and controls their implementation with the aid of the Revolutionary Guard — worker self-defense squads at all major enterprises in all main districts of the city. Whether such a system has long-term durability is hard to say. However, the Workers' Council can hardly be considered a legitimate authority prior to holding the first democratic elections."
KLG_proletarian_democracy: "Proletarian Democracy"
KLG_proletarian_democracy_desc: "The state governance of the Revolutionary Commune is based on the class character of the regime. Only representatives of the working class have the right to vote and be elected, and they occupy all key posts in the administrative apparatus. And so that the people's deputies elected in this way do not degenerate into a separate bureaucratic caste over time, they are legally required to combine administrative functions with a primary working profession."
KLG_workers_state: "Workers' State"
KLG_workers_state_desc: "According to the revolutionary decree, workers are required to take an active part in the internal politics of their state and thus become full owners of the means of production and the results of their collective labor. The main economic resources of the Revolutionary Commune are directed toward satisfying the needs of the working class and developing social policy. Any forms of economic inequality in such a system are relics of capitalist society and are gradually eradicated as the new socialist democratic world steadily is built."
KLG_revolutionary_brigades: "Revolutionary Brigades"
KLG_revolutionary_brigades_desc: "The working-class self-defense brigades created during the Revolution have been transformed into new armed forces and people's militia forces. At the same time, every individual keeper of order is simultaneously a representative of the working class, and thus this institution fundamentally differs from the closed bourgeois police of any capitalist state. The sole purpose of the Revolutionary Brigades' existence is ensuring the security of the Commune and defending the interests of the working people in the face of external threat."
KLG_beating_heart_of_the_revolution: "Revolutionary Spirit"
KLG_beating_heart_of_the_revolution_desc: "The Socialist Revolution in Kludgetown has awakened millions of workers across Western Zebrica from their sleep. Ivy Meowlin and his Revolutionary Commune's example will become the first spark of the future conflagration of proletarian uprising throughout the region. However, this also forces reactionary politicians and their brutal lackeys to fight more actively against any attempts to raise uprisings against them. In the near future, they will make every attempt to trample and destroy the first socialist state on the continent, and this can mean only one thing — the working people of Kludgetown will have to fight for their right to own the means of production, and one day they will bring freedom to their enslaved brothers in other lands of Western Zebrica."
KLG_beating_heart_of_the_revolution_01: "Revolutionary Spirit"
KLG_beating_heart_of_the_revolution_01_desc: "The Socialist Revolution in Kludgetown has awakened millions of workers across Western Zebrica from their sleep. Ivy Meowlin and his Revolutionary Commune's example will become the first spark of the future conflagration of proletarian uprising throughout the region. However, this also forces reactionary politicians and their brutal lackeys to fight more actively against any attempts to raise uprisings against them. In the near future, they will make every attempt to trample and destroy the first socialist state on the continent, and this can mean only one thing — the working people of Kludgetown will have to fight for their right to own the means of production, and one day they will bring freedom to their enslaved brothers in other lands of Western Zebrica."
KLG_beating_heart_of_the_revolution_02: "Revolutionary Spirit"
KLG_beating_heart_of_the_revolution_02_desc: "The Socialist Revolution in Kludgetown has awakened millions of workers across Western Zebrica from their sleep. Ivy Meowlin and his Revolutionary Commune's example will become the first spark of the future conflagration of proletarian uprising throughout the region. However, this also forces reactionary politicians and their brutal lackeys to fight more actively against any attempts to raise uprisings against them. In the near future, they will make every attempt to trample and destroy the first socialist state on the continent, and this can mean only one thing — the working people of Kludgetown will have to fight for their right to own the means of production, and one day they will bring freedom to their enslaved brothers in other lands of Western Zebrica."

klugetown.1.t:0 "Democratic protests"
klugetown.1.d:0 "For decades under the rule of the Verko crime family, Klugetown gradually transformed from an insignificant trading post into a major industrially developed city with its own system of governance and unwritten laws. The will of the most influential Don was comparable to that of a monarch, and for the thousands of criminals who called Klugetown home, it was the natural order of things. However, over time, the city became flooded with petty crooks and largely peaceful merchants from other parts of Western Zebrica. As the city grew, an entirely new political ideology began to spread. Libertarian self-governance.\n\nUntil recently, the Mafia remained the strongest player within the free city, with all inhabitants forced to acknowledge its power. But with the arrival of the Storm King, control over the city was temporarily seized by his servants, leading many to question the true extent of Verko’s grip.\n\nThe liberation of the city became a moment of truth for the democratic opposition. Thanks to an unexpected visit by Princess Twilight Sparkle a few days before the Battle of Ain Trotgourait, tens of thousands of creatures finally realized their power, seeing for the first time a chance to change the city for the better. The informal leader of this movement became known as Capper, a young Abyssinian who despite a history of petty crime, quickly became a close friend of Princess Twilight Sparkle after his participation in the Battle of Ain Tortgourait .\n\nHis words resonate with many city residents. The injustice of the existing system had long been obvious to many, however only Capper had the courage to speak about it openly and campaign against Verko and his gang. The declared goal of his campaign is to transform Klugetown into a truly free city modeled after the Kása Free State and to ensure harmony and safety for all its residents, regardless of wealth or species."
klugetown.1.a:0 "The murky water begins to boil."
klugetown.2.t:0 "Strife Among the Undercity"
klugetown.2.d:0 "Buried deep beneath the city's gilded spires and bustling marketplaces, the labor quarters are nothing short of a squalid abyss. For the tens of thousands not fortunate enough to carve out a life in the surface markets, these slums are the only option. A place where they toil in subterranean factories in exchange for meager rations and a crumbling roof. Here, the line between labor and slavery blurs. The Mafia, preferring not to inconvenience its business partners, maintains a policy of total non-interference, leaving the factories entirely unregulated. \n\nUntil recently, the residents of the Upper City knew nothing of this suffering. However, during the reign of the Storm King, a mysterious Abyssinian named Iwie Meowlin emerged as a notable figure. Under his leadership, the workers organized their first union and halted production at a munitions plant. When the Storm King learned of the strike, his response was swift and merciless: he ordered his forces to open fire on the building, burying every worker inside beneath the rubble. The city suffered heavy damage and dozens perished, but Iwie Meowlin miraculously survived. He has since continued his socialist agitation, flooding the Undercity with leaflets filled with the teachings of Caramel Marks and calls for total Revolution.\n\nThe breaking point came weeks ago at a factory producing delicacies for the Abyssinian nobility. A piece of dilapidated equipment failed, resulting in a worker's death. The following day, hundreds of his colleagues refused to work. Instead, they marched on the factory to seize control of it. Iwie himself led the charge at the front lines, and despite sustaining several serious wounds, he stayed on his feet, seemingly impossible to kill or deter. The security 'thugs' hired by the firm, unable to withstand the fury of the mob, abandoned the district in a panic. The warehouses were stormed and ransacked, and for one long night, a starving crowd feasted upon the smoldering ruins of their oppression." 
klugetown.2.a:0 "This is a disaster for business."
klugetown.3.t:0 "A Family Dinner"
klugetown.3.d:0 "Verko’s mansion was the most imposing structure in the city. The massive estate loomed perpetually over the lowly shacks of the street vendors, standing out against the squalor as a true masterpiece of architecture. This evening, dozens of automobiles were parked outside the gates, and every window on the ground floor glowed with golden light.\n\nThe mansion’s Great Hall was adorned with original masterpieces by renowned Wingbardian and Aquileian painters, alongside exotic flora displayed in Kirian ceramic vases. Elaborately upholstered chairs surrounded a long banquet table set upon a polished floor of mahogany. The feast was prepared for dozens of guests from the city’s most influential criminal syndicates, with Verko sparing no expense in demonstrating his wealth. Servants plied the guests with international delicacies and only the finest vintages. The attendees waited with bated breath for Verko’s arrival; they knew this banquet was merely a polite formality preceding his entrance and the discussion of the city's latest affairs.\n\nVerko entered the room with a slow, measured stride and silently took his place at the head of the table. None of those present dared to utter a single word. For several minutes, an ominous silence hung over the chamber.\n\n"Greetings, gentlemen. I trust my slight delay has not tried your patience," Verko said in his usual playful tone, raising a glass of wine. The guests exchanged meaningful glances. "Splendid. Today I have gathered you all for a matter of great importance. Since its very founding, Kludgetown has been the domain of our clan, and we have allowed no one else to dictate terms to us. However, the Storm King’s venture has been catastrophic for our business, and only together can we restore this city to its former glory. From this day forward, there shall be no internal conflict within the clan: I personally shall see to it. Now, I would like to raise this glass to our bright future. \n\n"To the future!" the guests echoed, draining their glasses. Contrary to the hopes and fears of some, no reshuffling of the inner circle followed. The syndicate leaders all retained their positions within the family, and not one of them was chosen as the new consigliere. Instead, Verko appointed his personal collector, a Rhinoceros named Sal Morrigat. Meanwhile, the Don’s sons, Norbert and Daggett, were to become his eyes and ears within the organization, granted the special status of intermediaries between their father and his subordinate captains."
klugetown.3.a:0 "This city Belongs Only to Us."
klugetown.4.t:0 "A Unified Action Plan"
klugetown.4.d:0 "Having lit a large Puerto-Caballo cigar, Verko slowly exhaled smoke from his mouth and flicked the tobacco remnants against the edge of a golden ash tray. His young sons and future heirs to the huge criminal Empire — the sensible Norbert and the mad Daggett — squirmed impatiently in armchairs opposite their father's desk. Without saying a word, Verko placed a stack of documents before them. Daggett reached a paw out for them and immediately got hit on it with a cane — over all these years he had never learned to behave properly in the boss's presence and not touch other people's things without permission.\n\nThe documents contained two main scenarios for fighting the rising rebels. The first involved creating an illusion of relative safety for them and allowing them to hold their meetings and publicly criticize the Mafia. It was necessary to make them believe in the possibility of a peaceful democratic transition and, through the gradual introduction of our agents, figure out the most influential opposition leaders. Then deliver several targeted blows and put an end to their attempts to seize power in the city. Quickly and without much fuss.\n\nThe second option was much more brutal. According to it, the Mafia would use all its capabilities for a quick victory. Through provocations and the murder of uprising participants and attracting marginal elements to our side, it was intended to intimidate the population and beat out any desire to resist our rule. This option seemed preferable to many — but it harbored the danger of radicalization of the protest and its transformation into open combat operations with an unpredictable finale.\n\nBoth documents were drafted by Verko himself, and one of them contained his own plan. But before voicing it, he asked his sons what they thought about it.\n\n— The first plan would be much preferable, — Norbert answered calmly. — Growing chaos would be very dangerous for the city and for our business. If we could resolve this issue quietly and without major bloodshed, that would be the best way out of our current deplorable situation.\n\n— Nonsense! — Daggett retorted resolutely. — We cannot allow these morons to drag our name through the mud, and even less do we have the right to show weakness before them. We must crush them all as harshly as possible. Then everyone in this city will know — it's better not to mess with us.\n\nVerko smiled broadly. Exactly such answers he expected from his sons. They argued for a few more minutes. The father watched them and calmly finished smoking his cigar. And only when they finally fell silent — he pulled out the sheet with his real plan from the stack of documents."
klugetown.4.a:0 "We must act carefully."
klugetown.4.b:0 "The Mafia will show its true face."
klugetown.5.t:0 "Transportation of Cargo"
klugetown.5.d:0 "The young zebra woke up from the familiar noise. Along with several dozen other slaves, she followed under guard into the next room and took her place at the edge of a long table. The guard placed a plate of yellow leaf porridge and a small piece of bread in front of her. The zebra looked listlessly at her breakfast and began to chew — her insides were churning with hunger and she couldn't stop — even when she felt the taste of bitter dry weed in her mouth.\n\n— Stuff your bellies and get out of the room one by one. — Commanded the huge rat, striking the wooden floor several times with a whip for emphasis. The zebra hurriedly began to finish her meager meal, and when the time allotted for breakfast ended — shoved everything she could into her mouth and followed the other slaves. To her surprise, this time they were not being led to their usual place of work. They were heading to the docks. This could mean only one thing — for the first time in many years, a buyer had been found for them, and now they were to be taken away from this city cursed by all gods.\n\nThe zebra felt a strange mixture of joy and anxiety. On the one hand — nothing connected her to Kludgetown except grief and sorrow, and she could at least hope that the new place would turn out better than the old one. But on the other hand — everything could turn out completely differently. She could be sold to an even more cruel master, and then her fate would be sealed.\n\nToday she could barely remember her past life. In her youth, she was the daughter of a peasant from the fertile plains of the Great Lakes, and that time seemed to her a lost paradise. Then — when the Storm King occupied their country — she was captured and sold into slavery to one of his officers. This officer took her with him for several years and finally, during his service in Kludgetown, sold her to a local crime lord.\n\nAnd now a new chapter was beginning in her life. She ran through all possible options for her new home in her head, and each seemed worse than the previous one. It could be Abyssinia. Or Coltvaagen. Then things might not turn out so badly. Or Chiropterra. To herself she prayed that it wouldn't be Chiropterra. She remembered well the stories about the working conditions of slaves in that state and about their experiments on living beings. Merciful Zaal, let it be anything, but not Chiropterra.\n\nEnforcers drove several hundred slaves into the hold and slammed the door behind them. In complete darkness, the slaves felt a slight jolt. The airship departed from the harbor of Kludgetown and headed..."
klugetown.5.a:0 "To Abyssinia."
klugetown.5.b:0 "To Coltvaagen."
klugetown.5.c:0 "To Chiropterra."
klugetown.6.t:0 "Fortune Hunters"
klugetown.6.d:0 "— Whisky! — growled the young griffin menacingly, striking the table with clenched claws with all her might. Awakened from a doze by the deafening sound, the bartender hurried to fulfill the scandalous guest's demand. An old one-eyed cat sitting nearby nodded to his longtime companion and took a large gulp from a faceted glass. Gretchel looked at her with envy — since early morning, the griffin had been tormented by a hellish hangover, and she was eager to finally get rid of it. Even if it meant giving up half of her accidental earnings.\n\nOnce upon a time, they could afford to deny themselves nothing in this city. Along with the Storm King's army, they were here as his legitimate representatives, and every merchant gave them a part of their earnings. Formally, these were duties to the King himself — however, the military governor of Kludgetown essentially used them to pay for the mercenaries' own services and, for the sake of reducing bureaucracy, allowed them to feed themselves. And therefore they didn't restrain themselves by the bounds of legality at all. Gretchel and her involuntary drinking companion were especially good at this. But now the Storm King was gone, and their main source of income had lost all meaning. For some time they still lived on the remnants of what they had stolen — but even those were gradually running out.\n\nBrought a glass of whisky by the bartender, the mercenary drank it greedily in a few moments. At that moment, a huge white bear entered the bar and unexpectedly addressed Gretchel and the one-eyed cat.\n\n— Follow me. Lord Verko wants to talk to you. — Said the bruiser, and the miscreant fortune hunters rose from their armchairs. What could this strange beaver want from them? Or whatever he was anyway. Had he finally decided to hold them accountable for illegal enrichment without his knowledge? Or conversely — intended to offer cooperation. Alcohol didn't help them think about this normally — but they followed the huge bear anyway.\n\nVerko met them on the porch of his mansion. Another old acquaintance of theirs also arrived there — the kirin Vartas, nicknamed the Arsonist. With his manner of flying off the handle at any convenient opportunity and incinerating everything around him, he had thoroughly frayed the local merchants' nerves. But this horned stallion certainly knew how to get his way.\n\nThe offer was quite simple — Verko was going to take them into his employ. Now they were to obey him in everything, and in exchange he promised good money. However, extortions from ordinary shopkeepers were to be forgotten once and for all — any business in this city was under the protection of the Mafia. Although — if anyone tried to open a shop without Verko's permission, he would always have servants experienced in this matter close at paw."
klugetown.6.a:0 "Now they will work for us."
klugetown.7.t:0 "The Merciful Lord"
klugetown.7.d:0 "Under the fixed gaze of two huge polar bears, a medium-sized ichthyomorph entered Verko's office — a half-fish creature with thick hind legs and long claws at the ends of its fins. His entire body was shaking from intense agitation, and the intrusive smell of slave sweat quickly began to spread through the room. Verko sat at his desk, engrossed in examining the strange guest.\n\n— If you pe-pe-permit... — the ichthyomorph began uncertainly. Verko already knew everything necessary about him, but deliberately didn't show it and listened as if with interest. Although not a single word came as a surprise to him. — I have lived in this city for almost six years. During this time, I have never deceived anyone and have always paid my debts on time. But recently a monstrous injustice happened to me. My shop, along with all its goods, was smashed by a group of six ponies running past — apparently someone was chasing them. Because otherwise I cannot explain why they didn't even stop to apologize to me. I tried to find them and demand compensation for the damage done — but they vanished into thin air.\n\n— And you would like me to find them and render what is due? — Verko inquired politely, and the ichthyomorph immediately shook his huge head.\n\n— No. I don't need that. Thanks to the help of a friend of mine, I managed to get my affairs in order, and now my shop is thriving again. However, this very friend... I owe him a large sum of money, and he demands that I return it this week. If I don't do this, he will most likely kill me or, maybe even worse, take my business away from me. Right now I don't have the required amount, and in my situation no one will agree to lend it to me until the next profitable month. My only hope is you.\n\nVerko rose from his armchair and walked over to the ichthyomorph.\n\n— You came to me for help, — he said calmly, placing his right paw on the poor merchant's scales. — But you ask without respect. You didn't even offer me your friendship — and you expect to get money from me?\n\n— Forgive me, Lord Verko, — the ichthyomorph whimpered guiltily. — Of course I am at fault. I would like to offer you my friendship and am ready to fulfill any condition of yours. If you so desire, I will be your faithful servant to the end of my days. Only I implore you — help.\n\nVerko fell silent. His right paw hung in the air. The merchant caught the hint and kissed the huge diamond on the golden ring several times."
klugetown.7.a:0 "Of course I will help. But not for free."
klugetown.8.t:0 "The Mafia is Immortal"
klugetown.8.d:0 "A thick rat paw carefully pulled back the gold-embroidered curtain, and Verko looked out the window at his city. The legacy of his family and a true paradise for every being faithful to its laws. He had built this city with his many years of labor and would never allow this ideal creation to be destroyed. All his enemies lay buried in nameless graves or shook with fear in the deepest burrows, posing no further threat.\n\nThis city belonged to him alone and to his sons. His wonderful young boys — Norbert and Daggett. One of them was destined soon to become his successor. Verko felt this with every muscle of his decrepit body. The scars reminded him of themselves more and more each day — all of them held the long history of his life. Failed assassination attempts and shootouts — there were endlessly many of them. Dozens of times he found himself on the verge of life and death. Bullets hit him, and his food was poisoned with the strongest poisons — but he still remained alive. Against all odds, he preserved his father's legacy and multiplied it many times over — but the years were nevertheless beginning to take their toll.\n\nHowever, he still had a few years before his final fading. During this time, he had to prepare one of his sons for the difficult role of leader of a huge criminal syndicate. He had to share his wisdom with him and teach him always to act in the interests of his Family. He had to introduce the future heir to the circle of acquaintances appropriate for him and allow him to win a sufficiently high authority. He had to preserve all this for him — he had to do a great many things over these few years. He had to do everything possible to preserve his Family's legacy.\n\nSomeday he would leave this world. But the glory of the free city of Kludgetown would never fade. At all times it would remain the one and only city of true honor and dignity. Verko smiled. Today this city belonged to him alone. In his paws lay the fate of all its inhabitants. But he was never a self-absorbed tyrant — like the Storm King. He always valued and respected the criminal underworld's Code of Honor and never compromised his principles. None of his partners would ever dare reproach him for dishonor. He had lived his long life with dignity — and at its very sunset was simply enjoying the view of this wonderful place — the most famous market in all of Western Zebrica."
klugetown.8.a:0 "This city belonged to him alone."
klugetown.9.t:0 "A Black Cat in a Dark Room"
klugetown.9.d:0 "Capper presumptuously considered himself practically elusive and did not worry about safety at all. Over so many years of living in this inhospitable city, he had managed to make many enemies — but none of them had yet managed to get to the nimble cat. But this time luck was not on his side. One of Verko's petty henchmen caught him on his way home. Two sturdy beings pounced on him, and he didn't even have time to get a good look at them. His only memory was a disgusting pungent smell mixed with the aroma of sleeping potion.\n\nThey threw him into this damp basement and, most likely, went to report their success to Verko. Capper felt worse than bad. This time he hadn't just gotten into a scrape — he had let down hundreds and thousands of those who trusted him. He was going to rouse them to fight against tyranny — but in the end he simply exposed them to bandit bullets and failed to do anything. This was his failure. Another proof of his natural bad luck.\n\nBut suddenly a ray of light broke through the impenetrable darkness. An explosion thundered, and a small crawl space formed near the window leading to the street. But for him — a nimble young cat — it wouldn't be hard to squeeze through it. And he was already about to run away — when suddenly he noticed a mysterious silhouette near the passage. At first he took it for an illusion — but then made sure it was real. Standing next to him was a tall black cat.\n\n— Shadow? — surprise in his voice was impossible to hide. — Shadow Softpaws? Is that you?\n\n— Of course it's me, you silly! — The black cat's eyes gleamed barely noticeably in the semi-darkness of the basement. — I heard you got into trouble and rushed here as fast as I could. And now, if you'll allow, we need to get out of here as quickly as possible.\n\nShadow slipped through the hole like a small ball of black wool, and Capper immediately followed her. That bandit's thugs heard the noise and chased them for several blocks at top speed. However, they didn't have a single chance — from the very first moments of the chase, the fugitives pulled ahead, and there was no stopping them. With bitterness in their hearts, they were forced to return empty-handed. Fortunately — their employer hadn't yet managed to report his fleeting achievement to Verko — otherwise his fate might not have been the most pleasant."
klugetown.9.a:0 "An old friend has returned in a time of need."
klugetown.10.t:0 "Resistance Headquarters"
klugetown.10.d:0 "— And how did you find out about me? — Capper asked his unexpected savior. — I mean... You and I haven't seen each other for so many years. And suddenly you appear and rescue me from this scrape just in time. How did you know I needed help?\n\n— You shouldn't thank me. — Shadow replied calmly, handing him a piece of bread she had obtained somewhere. — I was just following the plan of a mutual acquaintance of ours. By the way — he would like to talk to you. If you don't mind.\n\n— A mutual acquaintance? I thought — you preferred to act alone.\n\n— It used to be like that. But today this concerns not just me alone. We are talking about the fate of an entire city. And therefore we should stick together — like in the good old days.\n\nA few hours later, they reached an inconspicuous house near the passage to the lower levels of the city. At first glance, it seemed uninhabited — but inside, several dozen beings had already gathered, and some of them were well known to Capper. Including a scarred white striped cat in a tattered jacket with a missing right eye. Capper looked at him in disbelief. A whole storm of emotions overwhelmed him, and he couldn't get them in order. Least of all in the world did he expect to see him specifically.\n\n— Welcome... old friend. — The white cat said constrainedly, lowering his gaze shamefacedly. — I'll understand if you want to leave this place right now. After everything that happened — I don't expect you to agree to forgive me. But if you need help in the fight against Verko — we are ready to do everything in our power.\n\n— Chummer? — after a few seconds speech returned to Capper, and he looked perplexedly at the white cat. — I thought you died.\n\n— I survived. When my... our ship crashed, a steelworker's family from one of the lower levels took me in. They helped me get back on my paws. Fed and warmed me. Even though they themselves were poor and needed help. It was then that I realized what a terrible mistake I had made. You have every right to be angry with me. But let me help you. Only together can we defeat Verko and his gang.\n\n— Chummer is right. — Shadow intervened. — We need to make a plan and work as a team. Verko will easily be able to disperse and destroy us one by one. But if there are many of us, he won't have any choice left but to make concessions.\n\nCapper nodded. Just a few hours ago it seemed to him that everything was over and all his hopes would go to dust. But now he knew for sure — they had a chance to see this through to the end and win freedom for every sentient being in this city."
klugetown.10.a:0 "Years later, they met again."
klugetown.11.t:0 "Don't Threaten the Lower District"
klugetown.11.d:0 "Another gathering in the city center did not initially attract much attention. At least — Verko's agents simply gathered information about those assembled and made no attempt to stop the procession to Central Square. However, on the spot, they were unexpectedly blocked by a group of several large polar bears. All of them were specially selected into Verko's personal guard and often served as bouncers for him as well.\n\nThe largest bear approached the crowd and demanded that they disperse immediately. Capper resolutely stepped forward and stated that he would speak on behalf of all the free beings of this city. Several hundred heads poked out of windows and began to watch what was happening with genuine interest.\n\n— Even if you don't allow us to gather and express our opinion — sooner or later your tyranny will end. The Storm King also considered his power unshakable and enjoyed impunity — and where is he now? Tell that to your master. He can use force to silence one or even some of us — but he will never drown out thousands of free voices and destroy the people's will to resist his lawless rule.\n\nThe polar bear listened to him with an impassive expression and apparently didn't understand a damn thing. Rank-and-file enforcers weren't supposed by their job description to think about such serious matters.\n\n— Leave. Or we will make you leave. — The bear growled low, and Capper once again didn't budge. Then he gave a sign with a huge paw, and the column slowly moved toward the protesters. It seemed — they wouldn't have stopped even if no one started stepping back and would simply have trampled all the protesters.\n\nCapper gave a prearranged signal. The figure of a huge muscular cat walked through the crowd of protesters and stood between them and the group of polar bears. The face of the largest one contorted in an attempt to comprehend what was happening — right in front of them stood a cat scarcely smaller than themselves in size, with huge muscles, and his intentions were clearly not the most benevolent.\n\n— Take him! — shouted the bear after a long and agonizing mental process, and he himself was the first to run into a frontal attack. But the moment he tried to strike the huge cat, the latter knocked the club out of his paws with a single movement. The bear tried to take a fighting stance in shock — but the very next strike instantly knocked the bruiser out. The rest of the bears exchanged glances in terror and utter bewilderment. A huge cat named Max looked at them, and just one look from him was enough to understand — it's better not to mess with this brute at all."
klugetown.11.a:0 "Left hook — right funeral."
klugetown.12.t:0 "Quick Paws and No Trickery"
klugetown.12.d:0 "Capper and Shadow reached the right place without difficulty. It was one of the brightest buildings on one of the busiest city streets. And even then, the sign over the sagging door looked much too pretentious and flashy. It depicted the standard attributes of an experienced illusionist surrounded by colorful lights, and the owner's name was written in large letters.\n\n— Admiral Fluffington... — Shadow said with a certain irony in her voice and turned to Capper.\n\n— Oh. I didn't think old Fluff decided to try his hand at show business. Although... considering his abilities, that was quite expected.\n\nInside the medium-sized room — which apparently once served as one of the local bars — it was quite dark, and only the stage in the far corner was brightly lit. On this stage, a tall cat with whiskers and clothing from a past century was finishing his performance. The small audience began to applaud loudly, and the cat bowed several times. At that moment, his gaze stopped on the two new visitors, and the smile almost instantly vanished from his face.\n\n— The show is over. All latecomers are requested to leave the establishment and wait for the next session.\n\n— Don't pretend, Fluff. You know perfectly well why we're here. — The tall cat merely snorted quietly in response. However, Shadow had no intention of backing down — she ostentatiously assumed a confident posture and kept a tense gaze fixed on the illusionist.\n\n— No. I won't participate in your escapades. — Admiral Fluffington replied resolutely. — My criminal life is in the past. If you are still dabbling in petty theft, go find yourself another companion.\n\n— We're not here for that. A nationwide strike against Verko is gathering in the city. He's already pulling all his forces into the city center and plans to arm them with weapons bought in Coltvaagen. Airships carrying them will arrive soon, and then we'll be in trouble.\n\n— And what do you want from me?\n\n— You must help us hijack those ships. The fate of the entire city depends on it. — Admiral Fluffington looked at his old friends and realized they weren't lying. And although his small business was doing quite well even under the rule of Verko and his gang, he agreed to help.\n\nThe next day, several weapon-carrying ships disappeared from the docks. Increasing security didn't help. Thanks to his safecracking skills, Admiral Fluffington easily infiltrated each of those ships and, with the assistance of Resistance agents, led them far away from the city, losing the precious cargo forever in the sands."
klugetown.12.a:0 "Now the predator will remain clawless."
klugetown.13.t:0 "From a Spark a Flame Shall Grow"
klugetown.13.d:0 "Every day, more and more beings joined the popular movement against the Mafia. Only a few weeks had passed since the start of the active phase of protests — and by now they had engulfed virtually the entire city. Protesters barricaded streets and blocked the homes of influential supporters of Verko. Even private security agencies could no longer cope with protecting the safety of their clients. Beings outraged by the lawlessness of the criminal structures smashed the windows of their mansions and set fire to expensive cars. Verko himself was forced to massively reinforce his estate's security, turning it into a virtually impregnable fortress — with two dozen machine-gun nests and hundreds of armed soldiers along the perimeter on all sides.\n\nHowever, the most dramatic event of the past few days was the destruction of the largest and most infamous city prison. Over the past few months, hundreds of active Resistance participants had been placed inside it, and dozens of them had been brutally beaten in the process. Capper and his team were demanded to take decisive action — the hostages had to be freed as soon as possible.\n\nEarly in the morning, a crowd of several thousand representatives of various species gathered near the prison. All of them chanted the same slogan — 'Free our comrades.' The guards never dared to leave the building — instead, they barricaded themselves inside and prepared for defense. Capper understood — storming the building through the single entrance would be too risky. During a breakthrough, many participants of such an assault would die, and that would be too high a price to pay for liberating the prisoners.\n\nTogether with Chummer and Shadow, they were going to develop a new plan — but their longtime friend Molly beat them to it and did everything herself. This dwarf cat was known for her love of pyrotechnics and everything that explodes. In the old days, even Verko himself had hired her as a safecracker several times. But now she was here — alongside her old friends — and she had an excellent plan of her own. In just half an hour, she planted several sticks of dynamite at the base of the prison, and as soon as she detonated them, the entire structure began to slowly crumble. A wide passage formed in the wall, and the guards no longer had any way to stop the crowd from entering the building. Capper offered them surrender and not to spill the blood of the innocent — since there was no longer any point in it. The guards complied and were set free along with everyone they had been guarding."
klugetown.13.a:0 "Next target — Verko's mansion."
klugetown.14.t:0 "Verko Leaves the City"
klugetown.14.d:0 "The shouts of the angry crowd could be clearly heard even here — a few hundred meters away. Verko and his sons were hurriedly packing their things — this city could no longer serve as a home for them, and they were forced to flee. Everything was already prepared for this — Sal Morrigat had already prepared an airship for them and carried half of the city's entire gold reserve onto it. The second half was in a Bank belonging to a very reliable partner, and Verko still had no doubts about his reliability — but getting there through dozens of rioting streets was utterly impossible.\n\nA huge number of expensive things had to be left behind in the house. Verko took only a few suitcases with the most essential and personally valuable items — including an old family album with his late wife and a golden tea set she had given him many years ago.\n\nHowever, by this moment the mansion was already blocked off from all sides. They couldn't leave it the usual way. Therefore, servants led them through a secret passage right to a private dock on the other side of the quarter. Here the small guard was still holding back the angry crowd, and Verko's private airship stood untouched and ready for flight.\n\nAll things were loaded onto it as quickly as possible. In the distance, the sounds of explosions and the stomping of hundreds of boots echoed. The crowd was relentlessly approaching, and they had to cast off immediately. Daggett kept complaining and demanding to be let go and given weapons to protect their family's property. But Norbert stopped his younger brother every time, and the latter reluctantly followed his father's instructions.\n\nJust a few minutes later, the ship cast off from the dock. The destination was unknown even to Verko himself. Because of his dirty deeds, he was wanted in half of the internationally recognized countries and most of the unrecognized ones. Besides, the political map over the past few decades had changed so frequently that he couldn't be sure of any previously completely safe place.\n\nOn the other hand — with his money, he could settle almost anywhere. Change his name and appearance and, through longtime acquaintances from New Meerland or Coltvaagen, register his millions as legally obtained. It was not a bad option. But for Verko, all of them were equally humiliating. He dreamed of ending his life in a city created by his own paws, surrounded by his Family, and passing the inheritance to one of his sons — and now the last years of his life would pass in exile, and the only thing left after him would be a sad realization of the outcomes of his rule and the destruction of everything he had managed to build."
klugetown.14.a:0 "Rats flee the sinking ship."
klugetown.15.t:0 "The Opposition Takes Power"
klugetown.15.d:0 "The crime lords remaining in the city with their meager gangs could no longer resist the crowd of rioters. Without a clear leader, they had no chances. Capper offered them to voluntarily disband their militant squads in exchange for a pardon and a chance to start life with a clean slate — and many of them agreed.\n\nThe new authorities promised not to persecute former or current agents of criminal structures and not to carry out any lustration — otherwise, a huge part of the city's population could be suspected of working for Verko one way or another. Including the opposition leaders themselves. Only the few remnants of the Mafia's top leadership and Verko's associates were subjected to arrest and temporary detention. They were to be tried in an open trial on charges of numerous crimes against the people. However, Capper made no secret of it — not a single death sentence would be handed down in this trial. At best, the most terrible criminals of the criminal haven awaited several years of strict-regime prison. None of the opposition leaders wanted to start their rule with repressions — even against those who objectively deserved it. The residents of the free city had to see the true face of the new government and be ready to entrust it with their lives and their future.\n\nGradually, the formation of the city police and real state power began. Temporary committees were organized locally to resolve a range of important issues — from restoring damaged infrastructure to redistributing the property of bandits who had fled the city. The criteria for selecting individuals for these committees were quite strict — a potential candidate had to be literate and have experience in managing a small business or at least a trade union. On the lower levels, the committees consisted almost entirely of communist leaders. Workers voted for the most popular ones among them in the hope of turning the city-wide governance system into something resembling Stalliongrad's soviets and using them as a base to continue their irreconcilable struggle against capitalism.\n\nThe crime situation in the city continued to be quite difficult. However, the hope for speedy positive changes and the sense of freedom allowed a huge number of its inhabitants not to notice these difficulties. This day was a real holiday for them. For the first time since the city's foundation, their lives did not depend on the will of tyrants, and they could say and think whatever they pleased."
klugetown.15.a:0 "Long Live Free Kludgetown!"
klugetown.16.t:0 "Friend that we need"
klugetown.16.d:0 "For many years, the daily life of the free city was filled with treachery and cruelty. This city was harsh to the weak and mortally dangerous for them. Any loner without money risked perishing or being sold into slavery. Friendship was nothing more than a commodity — like everything else, it could easily be bought or offered, and only beings with fat wallets could expect to make a friend here. The friendship of crime lords was valued especially dearly. And it could be obtained in only one way — by proving oneself a valuable partner ready to pay good money.\n\nBut then he appeared on the free city's political arena — Capper Dapperpaws. A young Abyssinian immigrant and petty rootless thief from Panthera — in his short life he had managed to experience plenty of grief and commit plenty of base deeds. But then a meeting with the Elements of Harmony changed his fate forever. They were the ones who taught Capper true friendship — which couldn't be bought with money. And when the Storm King's army was driven out of Western Zebrica, this cat returned to the city and began gathering his first like-minded allies around himself.\n\nHis ideas very quickly gained popularity among wide sections of the population. And Capper used his political capital not to multiply wealth — instead, he focused on changing the attitude of the free city's denizens toward each other. Greed and selfishness were to be replaced by mutual respect and compassion for the weak. Capper demonstrated these qualities by his own personal example and remained a friend to all his like-minded followers. Thanks to him and his friends, dozens of Verko's debtors managed to avoid trouble and pay off everything down to the last penny. During the mass protests, he personally stood on the barricades at the very front and inspired his supporters not to fear Verko. He was seized and thrown into cold dungeons several times — but he always found a way to get out and continue the fight.\n\nAnd now the city was finally liberated. But the hardest part was yet to come. It wasn't enough just to overthrow Verko — every resident of the city needed to destroy the Verko inside themselves. To learn how to be friends and value each other. To learn how to speak the truth and hate lies. To learn to help the weak and not be blind to other people's grief. To learn to rejoice in life and believe in a bright future. To learn to be generous and never betray your friends.\n\nThe local residents had no doubts — Capper was the one who had to become the next city leader. Because if anyone was capable of ensuring the triumph of harmony in this inhospitable place, it was precisely him."
klugetown.16.a:0 "He's a friend indeed!"
klugetown.17.t:0 "Band of Six"
klugetown.17.d:0 "The main banquet hall of the former Verko mansion looked completely different than before. All the expensive items had been sold to neighboring countries to obtain money for the city's restoration — of all the magnificent furnishings of this room, perhaps only the surprisingly beautiful wallpaper and the carved floor remained — simply because carrying all that out and selling it was physically impossible. In the middle of the room, instead of the huge table from Coltvaagen, stood a very ordinary one — from one of the city's furniture factories.\n\nSix Abyssinians were finishing their lunch.\n\nChummer Tailspring was as taciturn as ever. He had never been able to find the strength to speak with Capper. Shadow sat nearby, trying to cheer up her old friend — but it was only getting worse for him. He understood — even if he had found the strength to ask for forgiveness, it still wouldn't have changed anything. The perfidy he had committed was too glaring and had no even ghostly justification.\n\n— I'm really very sorry. — He finally said, shamefacedly lowering his eyes to the floor. Capper set aside his lunch and looked meaningfully at his old friend. There was not a single hint of anger or resentment in his eyes. — I'll understand if you don't want to see me anymore.\n\n— Don't want to see you? Chummer! I thought I'd lost you! — The white cat slowly shifted his gaze from Capper to the rest of his friends and back. He had expected anything from this conversation — except such sincere friendliness. — So many years have passed. And now — when we are all together again — I won't chase you away for anything.\n\n— You mean... We can be friends again? — Capper nodded confidently. Little Molly jumped up joyfully on the pillows carefully placed under her and clapped her small paws. Big Maxis's lips curved into the most charming smile imaginable. Even the ever-serious Admiral Fluffington looked absolutely happy.\n\n— We are already friends. And we never stopped being them.\n\nIt took only a few minutes before all six embraced tightly. More than ten years had passed since the day they first gathered together on the streets of Panthera. Back then, they were still small, unreasonable kittens. But today, six adult cats with a heavy burden of harsh trials behind them met in this room. Only one thing remained unchanged — their old friendship."
klugetown.17.a:0 "Old grievances are a thing of the past."
klugetown.18.t:0 "A Black Cat with a Red Eye"
klugetown.18.d:0 "To strengthen the workers' confidence in his noble intentions, Capper agreed to meet with their leader and his former ally Ivy Meowlin on one of the lower levels. Moreover — he came there completely alone, without a hint of protection. Although even some of his associates urged him not to do this — the lower levels already had a gloomy reputation. And after the start of mass rallies and strikes, not a single Verko emissary had yet managed to get out of there alive. However, Capper was adamant — the socialists had helped them achieve victory greatly, and if he hadn't agreed to negotiations with them, he would have proven himself a tyrant no better than Verko himself.\n\nIvy Meowlin was exactly as they said he was — a medium-sized black cat with torn clumps of fur on his sides and head, and bright red eyes. He always spoke very loudly and sharply — as if he weren't prepared to listen to any objections. With almost every such outburst, his fur stood bristlingly on end, and he always seemed slightly larger in the eyes of his interlocutor.\n\n— Have you reviewed our demands? — Ivy asked, and Capper answered in the affirmative. A few days before the negotiations, the Central Strike Committee of the Lower Levels had sent him a copy of a document listing the necessary reforms in labor legislation and state building. Among them were: establishing an 8-hour workday for all workers in city industry with the workweek limited to 48 hours; introducing paid leave and raising wages; legalizing trade union activities and incorporating revolutionary committees and strike soviets into the state management structure on the same rights as for petty merchants; ensuring equal representation of workers and merchants in the city council; amnesty for all strike participants and the complete abolition of the fine system at enterprises.\n\n— We agree. — Capper replied and handed the communist leader the document with the Transitional Democratic Administration's decision regarding the Strike Committee. All necessary signatures were placed on the document, and its contents fully satisfied the demands put forward. Ivy Meowlin was pleased with this result — now the workers were full participants in the new democratic process of transforming the free city's society, and although this was not socialist democracy, under current conditions they had achieved the most favorable outcome for themselves."
klugetown.18.a:0 "Everyone will be welcome in the new Kludgetown."
klugetown.19.t:0 "The Town is Waking Up"
klugetown.19.d:0 "Zuntar slowly rose from his bed and with a single movement of his hoof turned off the annoying alarm clock. In the next room, his wife and small child were still sleeping, and he didn't want to wake them up ahead of time. The sun was still quite low, and the cold wind made its way through the walls of his flimsy dwelling. He had to get to the market as soon as possible — so the most convenient and popular spots wouldn't be taken beforehand. In just a few minutes he tidied himself up and hoisted the saddlebags onto his shoulders.\n\nOver the past six months, Kludgetown had changed very much. When Zuntar had first arrived here after the Storm King's conquest of his native Coltvaagen, he had to pay Verko's family every month for the opportunity to conduct his business in peace. The consequences of disobedience were well known to him — several times right before his eyes, the Mafia's thugs overturned debtors' stalls and beat them nearly to death with the full permission of those around them. Therefore, Zuntar paid on time. Even when the extortions grew and he stopped having enough for normal food, he was forced to give a certain amount and not a single copper less.\n\nAlmost three years ago, he met the most wonderful mare in all the wide world. Every day she came to the market specifically to see him, and very soon they decided to tie the knot. However, that was impossible — the young zebra was a slave of the local crime lord, and he would never have allowed her to leave. When the master learned of her pregnancy, his fury knew no bounds. Only by a miracle did the unfortunate zebra manage to avoid flogging and save her own life and that of her baby. Her escape was a doomed affair — over the years of this city's existence, not a single slave had managed to hide long enough. Sooner or later she would have been found anyway. But she hoped at least to sit it out until the birth of her and Zuntar's future son.\n\nBut then power in the city passed to the Provisional Government. Verko, along with his henchmen, fled the city like the last rat, and the new government promised to carry out reforms. And one of its very first decisions was the abolition of slavery and an amnesty for all runaway slaves. As soon as this decision was publicly voiced in the city's Central Square, Zuntar's beloved came to him, and they got married that very evening.\n\nNow no one was afraid to conduct their business in this city anymore. When Zuntar came to the market and began laying out his goods on the counter, the other merchants smiled amicably at him and wished him a successful day. All the money earned today belonged to him alone, and no one else had the right to rob him or threaten him or his family."
klugetown.19.a:0 "Today is going to be a wonderful day."
klugetown.20.t:0 "The Town is Falling Asleep"
klugetown.20.d:0 "Under the cover of night, several dozen figures left Verko's mansion. Each of them had a loaded pistol with a couple of dozen bullets in their holster — and every bullet had to be used strictly for its intended purpose. From the lists compiled by the security service, about two hundred names of the most influential opposition leaders were selected. This night they were to die. To disappear forever from the face of this city and thereby take with them to the grave its inhabitants' hope of overthrowing the Mafia's rule. The entire operation was supposed to be carried out in a few hours. As soon as midnight struck, Verko closed the front door behind his agents and went to sleep. When he woke up, not a single one of his enemies would ever be able to open their eyes again.\n\nCapper returned to the Resistance headquarters early in the morning. Together with Shadow, they had been carrying out a mission on the other side of the city and were right there during the raid. However, upon returning, they saw only a completely smashed house and several dozen corpses inside. Some were still alive — but there were no longer any chances of saving them. Capper looked in horror at little Molly's tiny body pierced right through by a bullet and at Admiral Fluffington leaning against the far wall with a deep wound in his abdomen.\n\n— Ca... Capper... — Chummer wheezed with difficulty, lying on the floor and bleeding out. His friends leaned helplessly over his body and tried to stop the blood. — It won't help. I don't have much time left. But you still have a chance to save yourselves. Leave the city as soon as possible.\n\n— No! We'll save you! We'll save you and continue the fight! — Capper shouted, trying in vain to bandage the dying friend's wounds. Chummer's face grew even paler. His eyes filled with tears, and his right paw rose with difficulty and grabbed his friend's left paw.\n\n— Verko can no longer be defeated. All our friends are dead. He knew everything from the very beginning and was just playing with us — and now his game is over. He will kill you if you stay here. Please — save yourselves. I don't want you to die too. And also... Capper... — His gaze met his old friend's gaze. — Forgive me. Forgive me for everything.\n\nAn instant later, the remnants of life left his body. Capper called out to him in vain — but he did not answer. He looked doomedly at his friend, and tears flowed from his eyes by themselves. Shadow stood nearby and wept along with him. They understood — Chummer was absolutely right. They no longer had the ability to resist Verko, and they had to leave. Leave and abandon this unfortunate city in the clutches of a cruel tyrant."
klugetown.20.a:0 "Our tactics brought us victory."
klugetown.21.t:0 "The End of the Red Cat"
klugetown.21.d:0 "In just a few hours, Capper's portraits were plastered across all the city's streets. Verko offered several thousand gold coins for his head, and several times more if his main enemy was brought to him alive. Bounty hunters of various kinds and ordinary savvy merchants began searching for the fugitive. The streets were patrolled day and night — but he was nowhere to be found. Then a wanted notice was also issued for his friend Shadow, and there was a strict requirement regarding her — to bring him the black cat alive and well.\n\nVerko's calculation relied on Capper's nobility. If his friend fell into the Mafia's clutches, he would certainly come running to save her and would end up trapped himself. Or Verko could demand his voluntary surrender in exchange for his friend's life and freedom. But that failed too — those two seemed to have vanished into thin air. Even when nearly half the city searched for them round the clock, it yielded no results.\n\nAnd only two weeks later it became completely obvious — they had left the city long ago, and reaching them now was impossible. As it turned out, just a few hours after the raid on the Resistance leaders, one airship disappeared from the sky docks, and according to the recollections of the few witnesses — it was heading north. And although no one saw Capper and Shadow on the deck of that ship, their involvement in its hijacking was completely obvious.\n\nWhere they headed — no one knows. Perhaps — they flew toward Mount Aris and found political asylum with their old comrades from the time of the Battle of Aïn Trotghur. Perhaps — Equestria accepted them as political refugees. Or perhaps — they settled somewhere in Griffonia under assumed names. In either case — even Verko's reliable connections in the criminal underworld yielded no results and failed to determine their whereabouts.\n\nHowever, he did not cancel the reward announced for their capture. This offered at least an illusory hope of the possibility of settling scores with them in the distant future. Most likely — one day a bounty hunter would be found who would recognize them out of hundreds of other cats and fulfill the contract from a distant desert city. Or at any rate — they would be forced to live in constant fear of such a possibility until the end of their days."
klugetown.21.a:0 "And yet he managed to escape from us."
klugetown.22.t:0 "Divide and Conquer"
klugetown.22.d:0 "At the initial stage of the development of mass protests, the coalition between Capper's liberal harmonists and Ivy Meowlin's socialists seemed quite strong. The leftists frequently reported their plans to the Unified Resistance Headquarters and coordinated their actions with events in the city's commercial district. Meowlin sent his delegates upstairs several times and discussed the issue of the free city's future state system with the rebel leaders, insisting on the importance of preserving trade union structures and respecting workers' rights in the new democratic state.\n\nHowever, thanks to the competent work of Verko's agents of influence, the situational allies drifted further and further apart. It all started with isolated conflicts between workers and petty shopkeepers in border areas. As a rule — such conflicts were staged by Mafia agents. But it was they who rather quickly called into question the possibility of a productive alliance between two politically disparate protest groups.\n\nProvocations continued and gathered strength every day. With the help of his agents, Verko pushed certain protest leaders into cooperating with factory owners from the lower levels — supposedly they were also opposed to the Mafia and ready to provide financial support to the new government. All this caused displeasure on the part of Ivy Meowlin, and he demanded that Capper put an immediate stop to it. For the first time, they engaged in lengthy correspondence, trying to convince each other of the correctness of their position for more than several days — and ultimately came to nothing. In response, Ivy Meowlin declared Capper to be just as much of a tyrant and agent of the big bourgeoisie as Verko and ordered all cooperation with him to be cut off.\n\nThe final nail in the coffin of this political alliance was the raid on trade union leaders. Under the leadership of the security service head, a raid was carried out on the lower levels, and despite very high-quality conspiracy, Verko's thugs easily managed to find the trade union coalition's headquarters and arrest several dozen communists at once. All this not only practically buried the socialist resistance and significantly weakened the strike on the lower levels — but also completely destroyed the very possibility of cooperating with Capper's harmonists. Because it was them whom Ivy Meowlin blamed for what happened and personally distanced himself from all his past contacts with them. Naturally — all evidence of Capper's involvement was fabricated by the Mafia's agents of influence. But that no longer mattered."
klugetown.22.a:0 "This was obvious from the very beginning."
klugetown.23.t:0 "Thirteen Blows of the Club"
klugetown.23.d:0 "One of the most active social groups during the riot were petty merchants. Due to the peculiarities of the free city's economy, they and their families constituted a significant portion of the commercial district's population and acted as the main source of income for the Mafia. Each of them was obligated to pay a certain amount for the opportunity to conduct their business within the city territory. Formally this was called 'paying for security' — although in reality the Mafia itself posed the greatest threat to them, and anyone who refused to pay faced harsh punishment.\n\nNaturally — many of them dreamed of liquidating the mafia structures and ensuring genuine freedom of enterprise within the free city. Capper was a symbol of a new era and a hope for change to them, and many of them took direct part in the protests or silently sympathized with them. Merchants frequently sheltered Resistance leaders and active supporters in their homes or in the backrooms of their shops and sold them food and everything necessary for underground life at very low prices — or even provided them for free with the hope of returning 'investments' in the future.\n\nHowever, they forgot about the Mafia's capabilities. With the help of agents infiltrated into the opposition's ranks, Verko already knew the names of some such merchants and, to strengthen his positions, demanded to 'pay them a few unexpected visits.' The main requirement was to spare their lives — so that in the future they could still bring money to the city and so that enemies would have no motivation to fight to the bitter end. Verko understood — excessive cruelty would not suppress fear. It would cause the exact opposite effect and make disgruntled citizens hate him even more stubbornly and fight harder. But if he used his power over their financial future, it could become the key to a quick and relatively bloodless victory.\n\nDozens of security service personnel attacked merchants in broad daylight. They didn't even try to hide — their affiliation with the ruling mafia structures already effectively made them untouchable. Right before their victims' eyes, they smashed their stalls along with the goods displayed on them and cackled maliciously. By the end of the day, about two hundred locations had been destroyed in this manner, and nearly thirty thousand in cash, converted to Equestrian bits, thrown to the winds. Consequently, the number of people willing to help Capper's supporters among small business dropped significantly."
klugetown.23.a:0 "They felt our fury firsthand."
klugetown.24.t:0 "Don't Play with Fire"
klugetown.24.d:0 "Strikes engulfed several large plants on the lower levels. Workers took control of the main workshops and drove out all representatives of the former administration. The factory owners turned to Verko for help — but received only a reprimand from him for being unable to keep track of their own subordinates. The city boss made it clear — he had other plans for these plants and wasn't going to look back at the magnates' interests.\n\nAnd very soon his plans became obvious to everyone. Disguised as strike participants, several agents were infiltrated into the rebellious factories, and with the help of bribery and blackmail, they managed to secure the loyalty of several engineers. They were the ones who suggested how to organize sabotage and successfully disguise it as an ordinary accident. Just a few days later, a 'random' fire broke out in one of the hot workshops, and within minutes the huge room was completely choked with smoke. The fire extinguishers turned out to be faulty — the factory owners' thrift on fire safety was now coming back to haunt the striking workers. The true culprits of the incident — the engineers bribed by Verko's agents — safely left the building half an hour before it happened and, by the time the fire spread to neighboring buildings, had already arrived in the commercial district for their promised reward.\n\nThe fire was not limited to just one building. Within a few hours, a large part of one of the lower levels caught fire. Hundreds of its inhabitants were caught unawares in their homes or workplaces and couldn't evacuate — the fire consumed their bodies and didn't leave even ash. Dozens of workers suffocated in the smoke within the first few minutes of the fire — others died from sustained burns or the effects of smoke inhalation days later. By the end of the week, the death toll from this incident approached a thousand. Throughout the city's entire existence, this was the most serious and destructive industrial catastrophe of all.\n\nThe Mafia's involvement in this event was completely obvious to many. And although Verko tried to deny it wherever possible, the escalation of fear and hatred only played into his hands. On the other hand — a clear hysteria began to build up regarding a repetition of the tragedy, and to many, the indirect culprits turned out to be the workers themselves, since it was their actions that led to such a radical response from the Mafia, and if they hadn't even started their strike, all these casualties could have been prevented. Verko was pleased with this result — now he could calmly use these sentiments for further struggle against the communists."
klugetown.24.a:0 "They must reconcile themselves to the inevitable."
klugetown.25.t:0 "An Overly Curious Zebra"
klugetown.25.d:0 "Zanuti had worked his entire life at a factory producing internal mechanics for airships. His workday traditionally began early in the morning and ended late at night. For the entire week he had at best one day off — which he always tried to spend in the company of friends over a mug of alcohol. He had no family — his only beloved had left him after another drinking binge and married his old acquaintance, who was much more moderate in consuming alcoholic beverages. This caused Zanuti to plunge into an even longer binge, and only a few weeks ago did his comrades manage to persuade him to stop.\n\nZanuti was never a supporter of socialism. He was never seen at trade union activist gatherings, and he never accepted leaflets from them or distributed them. However, when one day the entire plant simultaneously went on strike, Zanuti joined it as well. Largely just so as not to look like a fool in his comrades' eyes, because during the communist leader Ivy Meowlin's speech to the crowd of striking workers, he hadn't understood a single word.\n\nThe strike lasted for several days. Then the Workers' Council activists began gathering volunteers into the ranks of the Revolutionary Guard, and one of Zanuti's buddies joined in the front rows. Zanuti himself hadn't even thought about it — but when his buddy called him over and offered a bottle of gin for joining, he agreed without a shadow of a doubt. Zanuti was handed an old rifle and ordered to escort a rally in support of socialist reforms. And although he still didn't understand the meaning of the word, he did his job quite well.\n\nBut then they appeared on the horizon — Verko's security service soldiers. They attacked the workers' procession and opened fire on it. The Revolutionary Guard tried to attack them in response — but after a short firefight was forced to retreat. The battle lasted a few more minutes. Zanuti wasn't wounded — but he fell far behind his comrades and was immediately arrested.\n\nDuring interrogation, he was threatened with torture. He confessed honestly that he knew absolutely nothing about Meowlin's plans and had very meager notions of socialism and generally everything happening. However, the wardens didn't like that, and they started beating him. The torture lasted for several days and yielded nothing. Zanuti looked simply atrocious after them — there literally wasn't a living space left on him. A few days later he died from blood loss. The soldiers loaded his body into a potato sack and secretly buried it in the desert far outside the city."
klugetown.25.a:0 "A bit crude — but there's no other choice."
klugetown.26.t:0 "Retribution"
klugetown.26.d:0 "Thanks to financial support from his father and other entrepreneurs who suffered from the communist mutiny, Daggett managed to gather under his command at least five thousand bandits. Many of them were also first-generation immigrants — former activists of various far-right parties in their countries, and their hatred for socialists and liberals was even stronger than that of ordinary mercenaries.\n\nThis somewhat-army was assembled in the commercial district and armed with state-of-the-art equipment. Weapons for it were specially purchased in series of several small batches in Hippogriffia and New Meerland. It never misfired and allowed striking a potential opponent dead with just a single bullet. This was already sufficient to carry out the final operation against the socialists and their supporters throughout the city. Verko gave the order around noon — at this time strike participants were just returning to the streets and starting to chant their communist slogans loudly. Daggett stepped forward first, followed by all the others.\n\nShooting unexpectedly broke out in the center of the city, and within minutes panic overwhelmed the crowd of protesters. Several dozen of them fell dead in the very first minutes. Warm blood slowly spread across the asphalt and squelched under the executioners' feet. Desperate beings rushed into alleys — but even there the punishers' bullets caught up with and killed them. Just ten minutes later, all surviving protesters had left the square.\n\nDaggett ordered his squad to split up and pursue every fleeing socialist. He himself, heading the largest unit, directed himself toward the passage to the lower levels. From field agents' reports, he already knew the location of the Workers' Council's safehouse and planned to get there first and capture the communist leader Ivy Meowlin himself. However, on the spot, he had to fight his way through street barricades — workers had built them in just a few hours and successfully held defense for some time. But the advantage wasn't on their side, and the party headquarters was ultimately captured. Nearly half of the Workers' Council members died during the assault — the rest Daggett ordered to be put in chains and escorted to his father's mansion.\n\nRepressions against protesters continued until evening. In all districts of the city, dozens and hundreds of corpses lay in layers. No one dared leave their homes and properly bury the victims of this bloody day — for nearly a whole week they continued to lie doomedly on the blood-soaked asphalt."
klugetown.26.a:0 "No one else will oppose us."
klugetown.27.t:0 "Execution"
klugetown.27.d:0 "The secret basements of Verko's mansion were huge, gloomy rooms without windows and with very good soundproofing. It was here that the boss's ill-wishers were usually brought, and as rule they didn't leave here alive — unless a mutually beneficial agreement could be reached between them and the master of the house. The basements were divided into several large rooms without a single piece of furniture.\n\nAnd today those basements were overflowing. Several dozen Resistance leaders were brought here and meekly awaited their fate. Among them, Capper with his regular team and the socialist leader Ivy Meowlin particularly drew attention to themselves. All of them had once been well known in the city, and their names were spoken with respect and hope. But now they were to vanish — to disappear forever from the city's history and leave not even a tombstone inscription behind them.\n\n— So — everything ends exactly like this. — The ever-serious Shadow Softpaws stated coldly. Capper nodded meaningfully and turned to Ivy sitting nearby. Although they hadn't known each other very long, Capper had managed to develop a sincere respect for this black cat and his selfless struggle for the proletariat's interests. Although the ideas of communism weren't close to Capper himself, he could at least respect the communist leader for honesty and courage.\n\nDaggett entered the room with two thugs and told the hostages to go out into the next room one by one. Admiral Fluffington was brought out first. A few seconds later, a loud pop and the sound of a body falling onto cold tiling echoed in silence. Capper lowered his eyes quietly and bade a silent farewell to his murdered friend. Then a huge rat grabbed little Molly by the scruff of the neck and dragged her after the other prisoners. It was painful to watch for even the toughest person present.\n\nShadow was taken out of the room later than the others. Before the end of her life journey, she glanced at Capper for the last time, and their eyes met so clearly for the first time. Capper saw a shadow of a long-germinated feeling in them and understood — that he himself had felt the same way this whole time. His longtime friend could have become something more to him — but now that no longer made any sense. Another gunshot interrupted his reflections, and only he and Ivy Meowlin remained in the room. They were led out last. In the execution room they saw the piled-up bodies of their friends and could barely hold back their tears. For the last time they exchanged meaningful glances and closed their eyes."
klugetown.27.a:0 "They paid for their crimes."
klugetown.28.t:0 "Resistance Headquarters Destroyed"
klugetown.28.d:0 "Verko's security service took just a few days to locate the exact gathering place of prominent opposition representatives. Their headquarters was in one of the many abandoned buildings near the passage to the lower levels, and as a rule they gathered there exclusively in daylight — making it harder for casual observers from the street to spot them. However, one of the district's petty thieves reported them where it belonged and received a good monetary reward for it. The order to liquidate the rebellious nest was given immediately, and Verko's youngest son Daggett personally went there at the head of a squad of thugs.\n\nThe building was surrounded from all sides, and as the first meeting participant left it and stepped onto the streets, they immediately pounced on him from all sides. Daggett's squad burst inside and began firing wildly at everyone present. Several resistance leaders were killed in the very first moments. Others tried to flee and fell into the raiders' clutches — yet some managed to slip through into pre-prepared secret passages amidst the general confusion. The punishers tried to follow them — but it led to nothing. Nearly half of the Resistance's leading composition still remained at large.\n\nVerko wasn't too pleased with such a failure by his son. But on the other hand — the liquidation of all rebels in a single blow wasn't expected from this raid anyway. Especially since the names of many of them were still unknown. There were still plenty of serious figures among the killed and taken hostage, and this was definitely bound to sow discord among the remaining protest forces and force them to act much more rashly.\n\nThe relatively peaceful protest movement practically ceased its activities. However, instead of it, another — much more radical one — intensified significantly. On the lower levels, communists were gathering more and more supporters around themselves and calling for increasingly radical actions. And events in the commercial district prompted workers to join the Revolutionary Guard's combat groups much more actively. Just three days after the successful raid, several assassination attempts against Mafia representatives at the administration of striking enterprises were organized at once, and one of them ended in the murder of Verko's close friend and longtime business partner. Furthermore — rumors circulated about possible negotiations between communist leader Ivy Meowlin and the remaining headquarters from the commercial districts regarding the formation of a united Revolutionary Front under the leadership of the Social Democratic Workers' Party."
klugetown.28.a:0 "Fugitives are hiding on the lower levels."
klugetown.29.t:0 "Program of the United Revolutionary Front"
klugetown.29.d:0 "The sound of shattering glass made Verko jump out of bed. Right on the expensive Hindi carpet in his bedroom lay something round and medium-sized with a slowly burning fuse. The old gangster instantly understood everything and rushed to the exit with all his paws — he had a few minutes before the entire floor blew up. On the way, he nearly knocked down the butler coming up and stopped only on the opposite side of the house. His heart beat fast in anticipation of the explosion. However, nothing happened. After almost five minutes, Verko ordered a sapper group to be sent upstairs. Even if the bomb hadn't exploded, it could still do so at any careless movement.\n\nHowever, the sappers returned to him with unexpected news — it wasn't a bomb at all. Or rather — there was no filling inside it. Instead, the fuse calmly burned down and did nothing. A few sheets of paper were hidden inside the bomb, and they remained completely untouched. Apparently, it was a message from the sender of this strange 'gift'.\n\nVerko ordered the sheets of paper to be extracted from the bomb and handed over to him. He expected to read a message in them from one of his long-time rivals or another ill-wisher — but everything turned out much worse. The author of this document was the communist leader Ivy Meowlin, and it contained the program of the United Revolutionary Front published a few days earlier in the underground socialist newspaper. Verko read and couldn't believe his eyes:\n\n1. Immediate release of all hostages and liquidation of all armed criminal groups on the territory of the Free City of Kludgetown. The only sources of power and violence must remain the Revolutionary Brigades controlled by the people and the working class.\n\n2. Confiscation of the property of criminal clan leaders and capitalists associated with them. Creation of a unified economic council of nationalized enterprises and transfer of control over them into the hands of the workers' prosecution soviets and regional committees of the SDWPK.\n\n3. Immediate arrest and investigation of the case of violation of fundamental personal rights by the leaders of criminal groups. Public sentencing and execution of sentences for these persons without the right of appeal.\n\nAnd the most unpleasant thing wasn't even the wording itself — incredibly brazen in its fantastic audacity. The most unpleasant thing was the method of delivery. Because if the communists managed to send their saboteurs to the very heart of the commercial district and throw a bomb dummy into the window of Verko's mansion — then what would stop them from throwing a real bomb there next time?"
klugetown.29.a:0 "The situation is changing for the worse."
klugetown.30.t:0 "Ivy Meowlin Speaks in the Main Square"
klugetown.30.d:0 "It seemed practically impossible. Just a few days ago, the city's Central Square was under the complete control of Verko's forces, and all attempts by protesters to break through there ended very poorly for them. However, early in the morning of that very day, Verko was reported on the advance of the Revolutionary Guard on the main parts of the commercial district. Forces from all over the city were immediately pulled there — but by that time the reds had already managed to build barricades and take up defense on several large streets and in all alleys adjacent to them. Security service attempts to reach the square were met with a wave of heavy fire from numerous homemade rifles and the loss of several employees.\n\nAround noon, the communist leader Ivy Meowlin himself arrived at the square. How he managed to get from the lower quarters to the areas occupied by the communists without a direct connection between these parts of the city is rather hard to say. However, as soon as he appeared there, at least several tens of thousands of onlookers of all ages and biological species gathered in the square. Everyone was here — from cats and zebras to minotaurs and sentient arthropods. And all of them listened with great enthusiasm to Ivy Meowlin's speech from the front rows.\n\n— Comrades! Today, in the very heart of our city, a historical battle is taking place against the tyranny of the bandit Verko and despotic capitalism. Criminal syndicates and financial capital fused with them have oppressed the working class of our glorious city for many years. But today our patience has come to an end. In this battle we are ready to go all the way and either die in battle for a righteous cause — or grant freedom to all of you and overthrow the damned bourgeois power. That is why today I — in accordance with the mandate entrusted to me as chairman of the Social Democratic Workers' Party of Kludgetown and on behalf of its Central Committee — proclaim the fundamental principles of our Socialist Revolution.\n\nWe demand freedom of trade union and political activity for all representatives of the working class! We demand the establishment of a directive limitation of working hours at the level of eight hours a day and no more than forty-two hours a week for all workers of all enterprises in the city! We demand calling bandits and capitalists to account for their crimes against the working people! We demand the transfer of power to democratically elected soviets of workers' representatives and the proclamation of the socialist Revolutionary Commune! Long live the Revolution! Long live socialism!"
klugetown.30.a:0 "Why the hell hasn't he been shot yet?"
klugetown.31.t:0 "Nationwide Strike"
klugetown.31.d:0 "Operations to pacify the lower levels proceeded in full accordance with Verko's plan. Or at least — he himself liked to think so. The recent incident involving the seizure of an entire quarter of the commercial district was extremely unpleasant — but after some time the security service nevertheless managed to regain control over the city's Central Square. True — to the great regret — the leader of this whole circus had already escaped by that time, and he could not be caught.\n\nHowever, now the gentlemen in high offices tried not to think about this. Dinner time was approaching, and they hoped to treat themselves to several courses of traditional dishes for such an occasion — including the famous spiced meat according to an old Aquileian recipe. But when everything was ready and only serving the dishes to the table remained, unexpected news came from the kitchen. Practically all supplies had ceased since morning, and for preparing dinner they had to use only home reserves. As a result, the menu was significantly simplified and resembled more the lunch of an average merchant than a representative of the higher hierarchy of criminal structures.\n\nVerko immediately demanded an explanation for this outrage. The butler tried to remain silent for some time, but then was forced to reveal the whole bitter truth to the master. A few days ago, at the instigation of the Social Democratic Workers' Party, a strike began across the entire city. Practically all wage workers took part in it — including loaders in the air docks. As a result, a huge portion of the products was never delivered to the market and was left to rot in the warehouse — and even Verko's mansion's permanent supplier faced the simultaneous loss of most of his staff and was forced to stop trading to avoid even greater losses.\n\nWithin days, the strike practically paralyzed urban life. Workers took to the streets with homemade placards accompanied by Revolutionary Guard detachments and simply took food from merchants without any payment. In special field kitchens on the lower level, one could receive a plate of hot soup and a few pieces of bread for free — even if you weren't a strike participant. Ivy Meowlin called this situation 'field communism' and expected to starve out the commercial district soon. Without the ability to obtain goods for sale, they had only one way out — to descend to the lower levels and use the services of trade union structures. For Verko's agents and supporters, there was no such possibility — and they simply didn't know what to do with themselves. Society was in a state of complete social collapse."
klugetown.31.a:0 "Do something already!"
klugetown.32.t:0 "Assassination Attempt on Verko"
klugetown.32.d:0 "The situation in the city was becoming more tense with each passing day. Revolutionary brigades were rapidly replenishing their ranks at the expense of striking workers and taking control of entire quarters. All of Verko's agents and employees of his personal security service were gradually driven out even from their own homes — and they were forced to seek shelter behind the walls of the elite mansions of the city's wealthiest residents. However, even there no one could guarantee their safety. Socialist Party activists gathered under the windows every day and hurled large stones and bricks at them. Frequently, several armed red guards came with them as well — and dispersing this crowd just like that was impossible.\n\nIn this regard, some of Verko's long-time partners recommended that he temporarily leave the city. At least — until the moment relative order was restored on its territory. He even had an excellent place for this — a small two-story house on the seashore near the borders of Meyndallusia. If he only so desired, a private airship would deliver him there in less than a day. And although Verko himself didn't like this idea at first — after another broken window and a stone flying literally a few meters from him, he agreed.\n\nBetween his mansion and the docks lay a long and not very safe path. Therefore, most of it he spent as part of a long convoy of cars with closed windows. No one except a few close associates and his sons — who rode with him in the same car — knew about the Mafia boss's movement through the city. That is — nothing portended trouble. However, suddenly their car jolted heavily, and they were forced to stop. Verko jumped out onto the street and saw around him only the burning skeletons of the remaining cars in the convoy. This time communist saboteurs acted with certainty and used at least several dozen bombs simultaneously.\n\nShootout between terrorists and the security service lasted a few minutes. During this time, one of the attackers saw Verko and tried to shoot him — but the bullet missed. Then he shouted to another, and the latter managed to aim better. The crime boss was lightly wounded in the shoulder — but no movement toward the pier could be discussed any longer. All surviving operation participants had to return home. The doctor quickly treated and bandaged Verko's wound, and according to his forecasts, it should have healed in less than a week. However, now his mansion was the only relatively safe place for him — any attempt to get out into the city could easily end in his death."
klugetown.32.a:0 "This has definitely gone too far."
klugetown.33.t:0 "Revolution of [GetYear]"
klugetown.33.d:0 "Ivy Meowlin sat in the dark room of one of the striking factories' workshops, catching significant glances from other members of the Central Committee of the recently organized party. Making the most fateful decision for them now depended solely on him. A few hours ago, the Workers' Council by a majority vote put forward a proposal for a full-scale uprising with the seizure of the entire commercial district and the final consolidation of workers' power over the entire free city. Most of the regional councils supported this proposal. However, within the party there was no consensus on this matter, and votes were split almost evenly — and therefore the burden of decision-making now rested on the chairman.\n\nOn the one hand — a more ideal moment was hard to imagine. Over the past few months, the labor movement had achieved enormous success and was at the peak of its power. Further ahead — only its gradual degeneration and the slow advance of Verko. If they didn't strike today — their historical chance would be lost. But on the other hand — this chance was still small. And in case of failure, this adventure would bury the party along with all workers' soviets and destroy the prospect of building socialism in Western Zebrica forever. It was necessary to take a risk — or abandon it.\n\nBut in the end Ivy made the only correct decision. Striking must be done immediately. Verko was likely already fast asleep — and under the cover of night, the Revolution would break down the door of his luxury mansion and put an end forever to the tyranny of criminals and capitalists over the working class. To start an uprising across the entire city — such was the directive of the party and the Workers' Council.\n\nIn less than an hour, the revolutionary brigades left their workshops and seized all key objects in the city. The security service garrison tried to resist and fought a defense against superior enemy forces for several hours — but in the end was captured and disarmed in full composition. With their weapons, the crowd headed toward Verko's mansion. Everything happened so quickly — that the Mafia spy barely managed to run to his master a few minutes before the crowd appeared. Verko woke up and immediately heard noise outside his window. As quickly as possible, he tried to change from pajamas into a suit and gather everything necessary for escape. But before he even had time to think about this — the revolutionary guard had already burst onto the first floor and was advancing quickly towards him. Ivy Meowlin personally threw open the door of Verko's bedroom and caught the most powerful being in the city with his pants down in a state of wild primal fear. Norbert and Daggett were caught a few minutes later and also arrested by the new Revolutionary Government of Kludgetown."
klugetown.33.a:0 "The working class has won its freedom!"
klugetown.34.t:0 "Death of the Old Order"
klugetown.34.d:0 "Verko sat on the cold floor with his paws tied behind his back. Next to him were his sons and loyal servant Sal Morrigat — as well as many other crime lords of the free city. On the bodies of some of them, traces of struggle were visible — they had resisted the revolutionary guard to the last and paid for it with at least half their teeth. Workers kicked their torturers with great enthusiasm and mocked them. Verko knew for sure — nothing good awaited them. In the eyes of the risen people, they deserved no mercy.\n\nThe entire room looked damp and extremely uncomfortable. Formerly this was the basement of Verko's own security service — it was here that his agents brought captured rebels and often tortured them to death in attempts to get more information. On some stones, traces of blood and notches from torture instruments could still be seen. Now, however, the basements held their owners — and the mere thought of this inspired genuine terror in many of them. Daggett shouted loudly, demanding his immediate release — and even Norbert this time didn't try to calm his brother. He simply sat next to his father and remained silent.\n\nAbout five hundred beings were gathered in total — mainly representatives of the higher criminal hierarchy and the most cruel junior operatives — as well as several dozen close magnates and owners of large enterprises. All of them were tried in absentia by the Special Revolutionary Tribunal and sentenced to death.\n\nA sturdy-looking cat with a large number of scars on his body entered the room. Obviously — previously he had been a worker at one of the factories and received all these injuries over years of contact with unsafe equipment. The cat's gaze was full of hate and contempt. Behind his back, two revolutionary guards began loading their rifles. In a dry voice, he read out the short text of the sentence and gave the order to open fire without a drop of regret.\n\nDaggett fell into hysterics — he tried to pounce on his executioner and menacingly bared his claws. However, the very first shot made him be silent. The lifeless body of the huge rat collapsed onto the stone floor with a slight thud. Tears poured from Verko's eyes for the first time since the death of his beloved wife. Norbert was killed by a bullet a few seconds later. One by one, the tyrants and torturers of the free city met their death. Verko remained the last one — in absolute despair he looked at the bodies of his sons and wept silently over their unfortunate fate. The final shot rang out — and his sufferings ended along with his life."
klugetown.34.a:0 "Thus revolutionary justice is served."
klugetown.35.t:0 "Revolutionary Brigades of the Working Class"
klugetown.35.d:0 "The situation in the city left much to be desired. After the Revolution, previously existing management institutions finally collapsed, and the population proved difficult to keep within certain bounds. The increase in crime levels and the shutdown of a number of economic sectors contributed to the cessation of trade and the emergence of a black market. Inflation exceeded all conceivable values, and this affected the population of the commercial district particularly severely. Something had to be done, and as soon as possible.\n\nFree city economic recovery plan was created by the Workers' Council with the participation of a number of specialists from among former economic advisors from the administration of nationalized enterprises. Thanks to their experience, they once again took management positions and gradually established production under completely new conditions. However, it was also necessary to ensure citizens' safety and stop the further escalation of violence and the marginalization of public life.\n\nIvy Meowlin put forward a proposal to preserve the special status of the Revolutionary Guard and transform it into regular combat and militia units within the free city. In accordance with Caramel Marx's ideas — the regular army should be disbanded and replaced by a nationwide militia. And since Kludgetown never had a single centralized army and private criminal structures substituted it from the very beginning — the issue of creating a genuine socialist public safety organ arose more acutely than ever.\n\nUnder the Workers' Council's control there were at least twenty-six large brigades in total. However, this was critically insufficient. It was necessary to train several times more and send at least several hundred workers to the commercial district. At the same time, the libertarian wing of the opposition insisted on reducing mandatory service time and compulsory personnel rotation — so that workers wouldn't become an analog of a professional bourgeois police and could combine their main occupation with public order protection. Ivy Meowlin was forced to agree with this demand, and thus the demand for personnel multiplied several times over.\n\nThe population of the commercial district initially treated the incoming worker brigades with obvious rejection and even hostility. However, within a few days the situation began to change gradually. The crime rate in all main districts of the city began to fall, and ordinary citizens gradually grew accustomed to the people's militia. The rule of the Workers' Council turned out not to be as terrible as many imagined — or at least that might have seemed at first glance."
klugetown.35.a:0 "Rats will fear and hate us."
klugetown.36.t:0 "Appointments Following the Elections"
klugetown.36.d:0 "The first elections to the revolutionary workers' soviets took place in a rather nervous atmosphere. The lower levels were in a state of deep economic decline, and overall the city had suffered quite severely from the Mafia's actions against the socialist underground and retaliatory strikes during the Revolution.\n\nHowever, this was an important stage in creating a full-fledged workers' state, and Ivy Meowlin insisted on holding elections right now and creating a new permanent Party Committee and Management Committee under the Workers' Council. It was necessary to introduce more representatives of the proletariat and non-partisan supporters of the Revolution into it — to dilute the already gaining strength centralist movement. Meowlin remembered well the consequences of strict ideological centralization in Stalliongrad and what it led Steel Stallion's much-beloved brainchild to in the hooves of bureaucrats detached from the working class. Repeating this scenario in Kludgetown was not beneficial for Ivy Meowlin, and therefore he decided to take care of expanding the principles of class socialist democracy to more progressive standards.\n\nAmong the elected persons were representatives of various biological species and working professions. With some of them Meowlin had been personally acquainted for at least several years — while others he saw for the first time in his life. However, all of them were representatives of the working class, and this was their main advantage over many other revolutionary politicians. Although Ivy Meowlin himself was a representative of an aristocratic family, he denied the possibility of genuine workers' democracy without the direct participation of the proletariat in state governance. This is precisely what allowed him to demand more resolutely from the election organizers the compilation of lists based on class affiliation and thus ensure the proletariat's dominance in the future governance system of the revolutionary republic.\n\nImmediately after the announcement of the election results and the formation of the updated cabinet, Meowlin met with his new colleagues and discussed the future prospects of the revolution with them at length. Each of them gave him the impression of a competent and capable interlocutor — although many of them would have had difficulty recalling certain basic tenets of Marxist theory. However, honesty and devotion to the ideals of the Revolution were much more important criteria for him. In his own words — inexperience in political matters was preferable to strict ideological formalism and could easily be compensated by broader participation of the working masses in state governance."
klugetown.36.a:0 "They are the ones who will lead the Revolution forward."
klugetown.37.t:0 "Capper Leaves Kludgetown"
klugetown.37.d:0 "The figures of the six cats bustled around an airship kindly provided to them for personal use. The good-natured giant Max helped his friends load all heavy items inside while the rest prepared for departure. Ivy Meowlin appeared on the pier completely unexpectedly. He came here entirely alone and wasn't afraid of anything — even though his closest associates recommended that he travel around the city only accompanied by several revolutionary guards.\n\nCapper stood on the pier near the ship and looked at the city with obvious regret — for nearly three years this place had been home for him and his friends, and even the occupation by the Storm King's troops didn't make them leave this place. But now they had made a firm decision to leave. All of Capper's friends and he himself supported it. Meowlin found out about this one of the first and not only didn't try to hinder it — but also agreed to provide them with everything necessary for the long flight. That is why when the leader of the Revolution unexpectedly appeared in the docks — it wasn't an unpleasant surprise for Capper at all.\n\n— Why are you here? — Capper asked casually, and Meowlin answered just as casually that he had simply come to say goodbye. The upcoming dialogue was too unpleasant for both of them, and they understood this perfectly. But Meowlin still asked the question first, and Capper was forced to answer him. — No matter how much I'd like to stay — I simply can't do it. The new Kludgetown doesn't suit me. The ideals of your Revolution are too radical for me and my friends. You are building with your own paws a completely different city from the one we would like to live in — and we don't like this new world at all. Don't take it personally. You are a wonderful cat and an excellent conversationalist. But I cannot and do not want to accept your rules and live in the ideal world built by you. It's simply not for me. I hope — you won't hold a grudge against me for this.\n\n— I understand. — Ivy Meowlin replied without a single hint of displeasure. — The ideas of the proletarian Revolution can frighten young idealists like you. That's completely normal. But the Revolution is the only way to achieve social progress. Sooner or later we will all come to understand this truth. It's simply inevitable.\n\n— If that's so — then someday we'll meet again. — Capper replied calmly and headed toward the ramp with his suitcase. — But for now I am forced to say goodbye to you. — Ivy saw Capper off with his eyes and sighed heavily. Shadow on the deck gave the signal for takeoff, and the leader of the Revolution silently watched the slowly receding silhouette of the airship."
klugetown.37.a:0 "The Revolution holds no one back."
klugetown.38.t:0 "Manifesto of the Free City"
klugetown.38.d:0 "More than half a year had passed since the Revolution. All major socialist reforms had been carried out, and a new state was born from the ruins of the old kleptocratic regime. Proletarian democracy was established and defended by the leader of the Revolution Ivy Meowlin, and for the first time in Zebrica's history socialism was proclaimed and established on the territory of an independent state.\n\nFirst decrees of the Revolutionary Government aimed to improve the quality of life of working people and overcome capitalism on its territory. All large enterprises were nationalized and transferred to the management of democratically elected committees and trade union organizations. Small trade was placed under state control to combat speculation and the illegal trafficking of weapons and drugs. Huge profits — which previously went to the local elite purchasing luxury goods and were withdrawn to foreign banks — were directed toward building social infrastructure and reorganizing the housing stock. According to Workers' Council data — more than half of the city's residents still eked out a miserable existence in slums or houses without central heating and electricity.\n\nIvy Meowlin set a grandiose task — to overcome poverty and solve the problem of social inequality in less than three years. For this, the entire society had to be involved in social construction and the building of updated governance institutions. Broad democratic participation at all levels would allow prompt decision-making and competent resource distribution strictly on things essential to the common people. Any manifestations of hedonism were to be eradicated — especially within the Social Democratic Workers' Party itself and the Workers' Council. The leaders of the Revolution were to inspire the working masses by their own personal example and form a single whole with them — for this, a significant part of the new management apparatus was composed exclusively of workers.\n\nHowever, the Revolution opened up new opportunities not for a single city alone. Kludgetown was merely the first step on the path to liberating all of Western Zebrica from the tyranny of capitalism. Ivy Meowlin publicly proclaimed the ultimate goal of his enterprise — to spread the Revolution to the territories of Meergipt and Abyssinia. In his address to all working people of Western Zebrica, he emphasized the need for unity under the banners of socialism and joint struggle for a unified democratic federative republic — without distinction of culture or biological belonging."
klugetown.38.a:0 "Long live the Revolutionary Commune!"
klugetown.39.t:0 "Arrival of Slaves from Kludgetown"
klugetown.39.d:0 "An agreement was concluded between our Government and the mafia structures actually governing the Free City of Kludgetown for the purchase of a large batch of slaves. Many of them remained in the city since its occupation by the Storm King's forces, and in order to ensure internal security, the head of the local criminal syndicate decided to sell them to us at a rather modest price.\n\nAt present, airships bearing the Free City's trade mark have already arrived in our capital and are engaged in transferring the goods to their new owners. One of the largest markets has already put most of them up for auction, and several wealthy slave owners have expressed explicit readiness to buy them out at a higher price than they were sold to us. Thus — our state profited from this enterprise."
klugetown.39.a:0 "Thank you very much."
klugetown.40.t:0 "Arrival of Slaves from Kludgetown"
klugetown.40.d:0 "An agreement was concluded between our Government and the mafia structures actually governing the Free City of Kludgetown for the purchase of a large batch of slaves. Many of them remained in the city since its occupation by the Storm King's forces, and in order to ensure internal security, the head of the local criminal syndicate decided to sell them to us at a rather modest price.\n\nAt present, airships bearing the Free City's trade mark have already arrived in our capital and are engaged in transferring the goods to their new owners. One of the largest markets has already put most of them up for auction, and several wealthy slave owners have expressed explicit readiness to buy them out at a higher price than they were sold to us. Thus — our state profited from this enterprise."
klugetown.40.a:0 "Thank you very much."

