l_english:

KLG_GATHERING_STORM_DESC: "Many decades ago, on the border of two major regional powers of Western Zebrica—Abyssinia and Meergipt—Kludgetown was founded by various criminal elements and free traders. Formally, both countries claim these territories, but thanks to their disagreements, the local Mafia continues to control the region. Even the conquests of the Storm King did not change the situation much for them. However, when his garrisons left the city, a huge number of internal problems were exposed. Will the Mafia's rule be able to stand, or will the city get new leaders?"

EAW_WS_KLG:0 "[Root.GetNameDefCap] - Criminal Haven"
EAW_WS_KLG_desc:0 "Back in 943 AL, it was merely a medium-sized trade hub far from the border guards of §3Abyssinia§!, consisting of a few dozen houses and a single tavern with cheap swill. But then that tavern and the land around it were bought by a powerful crime lord — §gCarlo Rodrigo Mor§!. This representative of the small folk of sentient rodents not only managed to find the right approach to the regional authorities and persuade them to turn a blind eye to some of his illegal activities, but he effectively created an §Yindependent state§! without international jurisdiction.\n\nIn 977 AL, §gCarlo§! died and passed the reins of government of §8Kludgetown§! to his son §gVerko§!. Under his paw, the city was significantly expanded. §3Abyssinia§! made several attempts to bring it back into its sphere of influence, but failed every time. The reasons for this were dissatisfaction from §YMeergipt§! and the internal resistance of certain nobles, for whom, in particular, the markets of the §8Free City§! were the only way to obtain substances illegal in §3Abyssinia§!. As §gVerko§! himself put it — 'One of the main guarantees of our business's security is, without a doubt, the production of §Ycatnip§!'.\n\nDuring the §CStorm King§!'s invasion of §3Abyssinia§!, §gVerko§! did not offer any resistance. Instead, he quite easily managed to negotiate with the conqueror and even obtain military aid from him in the form of a permanent mercenary garrison. In exchange, the markets of §8Kludgetown§! provided the §CKing§!'s army with a very pleasant discount on all types of weapons. Shortly before the §YBattle of Aïn Trotghur§!, the §PElements of Harmony§! arrived in the city on an unofficial visit and were nearly sold into slavery by a local resident named §PCapper Dapperpaws§!. However, at the last moment he changed his mind and instead helped them get to §YMount Aris§!. Together with the forces of §YHippogriffia§! and pirate bands from Macawia that had risen up against the §CStorm King§!, the §PElements of Harmony§! were able to defeat the Storm King's army and kill him.\n\nThe empire began to collapse, and this did not affect the internal stability of the §8Free City§! in the best way. Along with the §Pharmonists§!, §Rsocialists§! led by the famous left-wing radical §RIvy Meowlin§! are gradually starting to raise their heads, and if §gVerko§! intends to retain power, he will have to act quickly and decisively."

KLG_verko:0 "Verko"
KLG_verko_trait: "Astute Merchant"
KLG_verko_desc: "§YDate and place of birth:§! 948 AL, Kludgetown\n\n§YBiography§!: Verko's family had been well known in Abyssinian criminal circles for generations. By the time of his birth, the future crime boss's father was already beginning the construction of his ideal city — around the mid-40s of the 10th century AL, he settled in a small transport hub in the desert between Meergipt and Abyssinia, and under his administration, the future Free City of Kludgetown began to grow rapidly and attract a large number of new faces.\n\nVerko inherited his father's criminal Empire at the age of 29. Even then, his name struck fear into many inhabitants of Western Zebrica, or conversely — inspired sincere respect and reverent awe. The mindset of this criminal genius is beyond the comprehension of many of his junior partners — but his methods bring the Desert Cartel enormous amounts of money, so they try not to ask unnecessary questions.\n\nIf he wanted to, Verko could easily negotiate with anyone. Even during the occupation of the city by the Storm King's forces, he managed without much effort to talk the conqueror into leaving him full power over the city and effectively handing over several units of his own army for his use, in exchange for some dividends for his country and a few private favors. The Storm King was defeated and his entire Empire perished with him — but Verko managed to profit from this and successfully warm his paws on the legacy of the formidable conqueror.\n\nLong years of managing the difficult family business were very successful for him. However, lately he has been feeling the inevitable decrepit decay of his body more and more and is thinking about passing the affairs to one of his sons. Or at least — about preparing for the possible transfer of affairs to a worthy heir after his death."
KLG_capper:0 "Capper Dapperpaws"
KLG_capper_trait:0 "Convinced Harmonist"
KLG_capper_desc: "§YDate and place of birth:§! 983 AL, Panthera\n\n§YBiography§!: For most of his life, Capper Dapperpaws was well known at best to the Royal Gendarmerie of his hometown. Almost nothing is known about his early childhood, even to himself. Capper's first memories were associated with an orphanage for homeless kittens — it was there that he first met his best friend Chummer and the other cats from one of Panthera's most famous street gangs. Together they infiltrated the homes of the wealthiest aristocrats and bank vaults, and for many years no one ever managed to catch even a single one of them.\n\nInvading Abyssinia by the Storm King forced Capper and Chummer to leave Panthera in a hurry. During their long journey, they accidentally became the owners of one of the most valuable treasures of the Claomon dynasty — the Malachite of Misfortune. This ancient artifact with a rather grim reputation was among the numerous trophies of the Storm Squadron — but was lost as a result of a strictly classified incident on one of the airships. Together with the Malachite of Misfortune, the friends arrived in Kludgetown and tried to sell it to the local crime lord Verko. However, at the very last moment, dazzled by the magic of the Malachite and the opportunity to get rich quick, Chummer disrupted the deal and fled — and Capper was forced to take upon himself all their joint obligations to the Mafia and pay off a huge monetary debt to it.\n\nAfter that, he tried not to make new friends and simply survive through theft and deception. However, meeting the Elements of Harmony radically changed his life. Together with them, he participated in the Battle of Aïn Trotghur as part of a volunteer corps from Macawia and proved himself a true hero. Thanks to his leadership qualities, he managed to win the trust of the free city's inhabitants and lead the nation after a long and stubborn struggle for liberation from the Mafia's rule. And now he will strive to turn Kludgetown into the Casah of the South — a stronghold of harmony and the free market in Western Zebrica."
KLG_iwie_meowlin_leader: "Ivy Meowlin"
KLG_true_radical_trait: "True Radical"
KLG_iwie_meowlin_leader_desc: "§YDate and place of birth:§! 975 AL, Tigeray\n\n§YBiography§!: Ivy's parents were representatives of an ancient and once very powerful noble family from Southern Abyssinia. However, by the time of his birth, nothing but a memory remained of the former dynasty's past power. His father held a completely inconspicuous position at the court of the local prince and raised his son for state or military service. However, Ivy was much more interested in social sciences and foreign literature. In particular, while studying at the Royal Institute of Panthera, one of the professors gave him an Abyssinia-banned edition of Caramel Marx's 'Capital' in the Winbardian language.\n\nIvy knew this language very well, and acquaintance with the ideology of Marxism made a particularly vivid impression on him. While still a student, he tried to organize an underground revolutionary organization in the capital and for some time even belonged to the Socialist Party of Abyssinia — but then left it due to disagreements with the leadership regarding Stalliongrad and its model of socialist construction.\n\nIn 1001 AL, Meowlin finally left Abyssinia and moved to Kludgetown. There he purposely got a job at one of the local factories to get closer to the working class and agitate among his colleagues. For more than five years, young Ivy's health was severely undermined by hard labor — but he didn't even think of abandoning his idea of creating a new-type socialist state, distinct from the party model of Steel Stallion and Altidia Revolzova. Under his leadership in 1006 — during the occupation of the country by the Storm King's forces — the underground Social Democratic Workers' Party of Kludgetown was created. Immediately after the start of mass protests, Meowlin saw this as a chance to carry out a social upheaval, and thanks to his oratory talents and the help of faithful comrades, he managed to overthrow the Mafia's rule and launch one of the boldest social experiments in the history of Zebrica or even the entire world in Kludgetown."

KLG_banned_mafia_trait: "System Collapse"

KLG_sal_morrigat: "Sal Morrigat"
KLG_sal_morrigat_trait: "Consigliere"
KLG_sal_morrigat_desc: "§LMany years ago, Verko picked up the young orphan Sal off the street and brought him into his family. This representative of the small race of sentient rhinoceroses possesses immense strength and tremendous loyalty to the criminal clan that sheltered him and to its leader personally. For a long time, his main task was shaking down debts from particularly insolent partners using intimidation and brute force. And he handled this simply magnificently. However, recently Sal Morrigat was elevated to Consigliere — the second being in the entire clan and the likely successor to the boss. Yet Sal never aspired to power within the clan, and he understands his main task perfectly well — to prepare Verko's heir for his future role.§!"
KLG_norbert: "Norbert"
KLG_norbert_trait: "Eldest Son"
KLG_norbert_desc: "§LNorbert is very much like his father. His sharp mind and pragmatism noticeably set him apart from many other crime lords of Kludgetown, and this is precisely what makes him Verko's most likely successor in the future. However, some captains consider Norbert too soft and fixated on observing the Underworld's Code of Honor, and prefer his more straightforward and cruel brother Daggett. However, Norbert himself considers his younger brother frankly dim-witted and at every convenient opportunity demonstrates his intellectual superiority to him.§!"
KLG_daggett: "Daggett"
KLG_daggett_trait: "Youngest Son"
KLG_daggett_desc: "§LVerko doesn't talk too much about his youngest son. He only occasionally mentions him in a positive light as 'his best rabid hound'. Daggett definitely lacks the pragmatism and insight of his father and older brother, and for many members of the clan he remains merely a young adventurer with a hot head and an iron heart. However, for the most ruthless criminal gangs, it is Daggett who embodies the hope for elevating the criminal essence of the free city to the absolute rule of the knife and pistol.§!"

KLG_gretchel_la_vignette: "Gretchel la Vignette"
KLG_gretchel_la_vignette_desc: "§YDate and place of birth:§! §LMay 19, 985 AL, Aquileia§!\n\n§YBiography§!: §LSurprisingly, this griffin's distant ancestors were among the most influential Aquileian nobles at the dawn of the Kingdom's emergence. However, many years later, her father squandered all their fortune and was forced to sell his estate to pay off huge debts. Gretchel was born in an Aquileian almshouse and from early childhood was forced to steal in order to survive.\n\nAt age 12, she was sent to a juvenile detention colony, where she met the son of a famous bandit and helped him organize an escape. In gratitude, he helped her integrate into the gang, and thanks to her character, she very quickly won significant authority there. Following the unexpected death of the leader, it was Gretchel who was chosen as his successor and turned an ordinary forest gang into a group of bounty hunters. They worked for anyone who could offer a decent price, and during their journey across Zebrica, they enlisted in the Storm King's army.\n\nThus fate brought Gretchel and her gang to Kludgetown, which allowed her to strike a deal with the informal head of this city. And she is ready to serve him faithfully and truly — if he has enough money to pay for her services.§!"
KLG_felix_mortimer: "Felix Mortimer"
KLG_felix_mortimer_desc: "§YDate and place of birth:§! §LSeptember 4, 954 AL, Amhamura§!\n\n§YBiography§!: §LLife has knocked this old man around quite a bit. In his youth, Felix was the son of a major landowner in the province of Amhamura, and dozens of slaves from neighboring Meergipt worked his parents' land. However, a sudden severe drought and the famine that followed completely destroyed his and his family's future. The crops never sprouted, and half the slaves died of starvation. The rest joined a spontaneous uprising and stormed their master's mansion. Felix's father and mother were killed in the most brutal way right before his eyes. And he himself — a young, pampered kitten — was simply thrown out into the street.\n\nBy a miracle, he managed not to die and gradually got used to his new life. Impoverished nobles and former landowners like himself began to gather around him, and together they created the White Cats gang. Its main activity was catching runaway slaves and killing those whom their former masters did not want to see alive. Several times his gang suppressed regional slave revolts with extreme brutality. Felix Mortimer's fame reached even the Storm King, who personally incorporated his gang into his army. He ended up in Kludgetown completely by chance — but even here, work will be found for such a legendary figure.§!"
KLG_vartas_the_arsonist: "Vartas the Arsonist"
KLG_vartas_the_arsonist_desc: "§LEven for a single crime committed by this stallion in his homeland, he would face the death penalty under Concordian laws. And he has committed countless numbers of them. Vartas was born in a poor fishing village on the banks of the great Meerkong River, and after a fire in his childhood home, he was forced into exile. According to unconfirmed reports, he himself and his inherent hot temper were the cause of that fire. Vartas began gathering other outcast nyrikas around him and attacking merchant caravans and threatening wealthy traders with them.\n\nFor a time, fate even linked him with the radical group of the Path of the Southern Aurora, Kirin Rouge — but then he grew tired of limiting himself to the expanses of poor Khamrin alone, and he left it and headed west. The rising army of the Storm King gladly welcomed Vartas into its ranks. During the campaign against the Great Lakes, the local zebras gave him the nickname the Fire Demon. Hundreds of villages were completely burned down by Vartas's detachment.\n\nAfter subduing Western Zebrica, the Storm King made him assistant military governor of Kludgetown for a time. However, after an unpleasant incident involving fire, he was demoted to a simple garrison officer. But his grim reputation continued to be useful for controlling the city — and Verko hopes to use it just as the Storm King did.§!"

KLG_gretchel_la_vignette_trait: "Young Bandit"
KLG_felix_mortimer_trait: "Merciless Avenger"
KLG_vartas_the_arsonist_trait: "Blazing Terror"

KLG_gretchel_la_vignette_adv_desc: "§LFor Gretchel la Vignette, there has never been such a word as 'impossible'. In her life, she has faced so many difficulties and gone through so many trials that her only fear is not being able to save up money for a bottle of strong alcohol. This reckless criminal will never let herself be wronged, and even creatures several times larger should give her a wide berth if their goals intersect even slightly. In many cities of Griffonia and Zebrica, a hefty bounty is placed on la Vignette's head — but even that has never stopped her from visiting these cities purely for pleasure, because no one in their right mind would ever think of raising a paw against her.§!"
KLG_felix_mortimer_adv_desc: "§LThe foundation of this cat's worldview is his boundless hatred for all freedom-loving slaves. After his parents — wealthy planters from Abyssinia — were killed during a slave revolt, he swore to destroy anyone who dares raise a paw against their master or even think about doing so. For many years he terrorized runaway slaves with his White Cat gang, and his cruelty was off the charts even by the standards of that time. His grim reputation gives him a certain advantage on the battlefield and at the negotiating table — and his quality education and military talent make him an indispensable commander and a virtuoso combat strategist.§!"
KLG_vartas_the_arsonist_adv_desc: "§LThe main feature of Vartas lies in his species. Naturally quick-tempered and capable of flying off the handle over any trifle, he is also a kirin, and every outburst of his is accompanied by fierce fire and massive destruction. During battle, Vartas drives himself into a berserk state and destroys everything in his path not only with his weapons, but with his own fire. The mere sight of this monstrous nyrika paralyzes enemy ranks and forces them to flee the battlefield in terror. However, the flames caught up with them anyway — throughout his life, Vartas has burned and trampled countless creatures of all kinds and left physical and mental scars on the bodies and souls of many others.§!"

KLG_gretchel_la_vignette_start_tool: "§YGretchel la Vignette§! will become a §Ygeneral§!.\n§YCan§! be assigned to the §Yhigh command§!:"
KLG_felix_mortimer_start_tool: " \n§YFelix Mortimer§! will become a §Ygeneral§!.\n§YCan§! be assigned to the §Yhigh command§!:"
KLG_vartas_the_arsonist_start_tool: " \n§YVartas the Arsonist§! will become a §Ygeneral§!.\n§YCan§! be assigned to the §Yhigh command§!:"

KLG_iwie_meowlin: "Ivy Meowlin"
KLG_iwie_meowlin_trait: "Head of the Strike Committee"
KLG_iwie_meowlin_desc: "§LNo one doubts this cat's political radicalism. However, unlike many other radicals, he truly values political democracy and is ready to cooperate with our Government on terms mutually beneficial to both of us. Under his leadership, the labor movement remains a significant factor in domestic politics and creates a strong counterweight to the power of big business. Ivy was ready to agree to such a system and abandon the idea of turning Kludgetown into a socialist state for the sake of the working class's benefit — and at the very least, he deserves a big thank you for that.§!"
KLG_shadow_softpaws: "Shadow Softpaws"
KLG_shadow_softpaws_trait: "Elusive Shadow"
KLG_shadow_softpaws_01_trait: "Elusive Shadow"
KLG_shadow_softpaws_desc: "§LIn her time, Shadow was considered one of the most dexterous pickpockets in all of Panthera. With the arrival of the Storm King, she was forced to move to Kludgetown and become one of Verko's numerous lackeys. But then she heard the call of her old friend Capper to rebel against the tyrant and answered it. Together they managed to liberate the city from the Mafia's rule and make its inhabitants free. Shadow still remains the fastest and most dexterous cat in all of Western Zebrica, and if she wishes, she can infiltrate literally anywhere.§!"
KLG_chummer_tailspring: "Chummer Tailspring"
KLG_chummer_tailspring_trait: "Devoted Comrade"
KLG_chummer_tailspring_army_chief_trait: "Inspiring Commander"
KLG_chummer_tailspring_desc: "§LFor many years, Capper and Chummer were thick as thieves. However, everything changed when the legendary Malachite of Misfortune from the Abyssinian royal treasury fell into the paws of the two petty thieves. Chummer became intoxicated by the dark magic of this artifact and tried to take it from his friend and escape on a stolen airship. However, possessing the Malachite nearly cost him his life. Only by a miracle did he manage to survive the crash, and he spent the next few years on the lower levels where a poor working family of diamond dogs sheltered him. This event became a lifelong lesson for him, and now he will remain loyal to his friends no matter what happens.§!"
KLG_admiral_fluffington: "Admiral Fluffington"
KLG_admiral_fluffington_trait: "Active Organizer"
KLG_admiral_fluffington_theorist_trait: "Proponent of Large-Scale Planning"
KLG_admiral_fluffington_high_command_trait: "Strategic Genius"
KLG_admiral_fluffington_desc: "§L'This cat always has a plan.' That is what Admiral Fluffington's friends usually say about him. The name shouldn't mislead you — in reality, the Admiral has never commanded anything and took that nickname simply because it drew attention to his person. However, this cat was not lacking in aristocratic manners. It was always from him in Capper's team that the soundest ideas emanated, and all his plans usually went off without a hitch — provided, of course, that everything was carried out precisely. Capper didn't bring him into his government for nothing — this pedant, very experienced in such matters, is capable of keeping the economy of an entire city in his paws like no one else.§!"
KLG_molly_astra: "Molly Astra"
KLG_molly_astra_trait: "Little Mischief-Maker"
KLG_molly_astra_theorist_trait: "Proponent of Firepower Supremacy"
KLG_molly_astra_high_command_trait: "Formidable Destroyer"
KLG_molly_astra_desc: "§LMolly's small stature and cute appearance make it easy to mistake her for a kitten. However, in reality, this dwarf cat is one of the most experienced demolitions experts in the entire city. Even famous burglars envied her skill with explosives, and Verko himself repeatedly hired her as a safe-cracker for quite substantial money. However, now little Molly is ready to channel her talent into a more peaceful direction and let it make life in the city a bit more cheerful. Although her love for everything that explodes hasn't gone anywhere, and if she wishes, she can turn anything into burning ruins for the sake of her friends' safety.§!"
KLG_big_maxis: "Big Maxis"
KLG_big_maxis_trait: "Gentle Giant"
KLG_big_maxis_high_command_trait: "Mountain of Muscle"
KLG_big_maxis_desc: "§LThis sweet giant might seem quite formidable — but only if you aren't personally acquainted with him. In everyday life, Max is usually quite taciturn because, in his simple-heartedness, he is incapable of lying or saying hurtful things. Capper has always appreciated Max for his kindness and honesty, while also being grateful to him for saving him from numerous scrapes. But no matter how fragile and vulnerable he might be on the inside, you definitely shouldn't threaten his friends. Because if you do, you'll have to face the incredible strength of a huge cat the size of a bear and several times stronger than the strongest bull.§!"

KLG_chummer_tailspring_not_army_chief: "§YChummer Tailspring§! is not an §YArmy Chief§!"
KLG_chummer_tailspring_not_political_advisor: "§YChummer Tailspring§! is not a §YPolitical Advisor§!"
KLG_admiral_fluffington_not_political_advisor: "§YAdmiral Fluffington§! is not a §YPolitical Advisor§!"
KLG_admiral_fluffington_not_theorist: "§YAdmiral Fluffington§! is not a §YMilitary Theorist§!"
KLG_admiral_fluffington_not_high_command: "§YAdmiral Fluffington§! is not in the §YHigh Command§!"
