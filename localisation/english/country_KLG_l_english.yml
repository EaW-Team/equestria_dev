KLG_mafia_code_of_honor_cat: "Mafia Rule"
KLG_mafia_code_of_honor_cat_desc: "For many years, the city of Kludgetown has been under the rule of the Mafia. The main principles of the current management system were laid down long before the founding of the city and were strictly observed in the form of the §YCode of Honor§!, sacred to every criminal element. Violation of it was followed by the harshest punishment — expulsion from the Family.\n\nHowever, in practice, the provisions of this Code are far from always observed. Especially in relation to so-called law-abiding citizens — who do not enjoy the protection of the Mafia.\n\nIts most reasonable representatives — the §gRespectable Mafia§! — prefer to resolve such issues by more delicate methods and not to kill their potential clients without extreme necessity.\n\nOn the other hand — the §1Brutal Mafia§! relies to a large extent on completely different methods of strengthening power. Its representatives often transgress even some provisions of the Code of Honor — but only when it does not concern other representatives of the Mafia and their minions."
KLG_promote_neutrality: "Strengthen the §gRespectable Mafia§!"
KLG_promote_neutrality_desc: "The Respectable Mafia mostly relies on a more systemic approach to maintaining power over the city. Its representatives value honesty in business matters above all and are ready to turn a blind eye to some shortcomings of their partners provided they fulfill their assumed obligations. Members of the Respectable Mafia prefer to resolve all issues quietly and resort to open terror only as a last resort."
KLG_promote_fascism: "Strengthen the §1Brutal Mafia§!"
KLG_promote_fascism_desc: "The Brutal Mafia uses all the capabilities of the criminal underworld to intimidate its enemies and potential debtors — from arson to contract killings. All such actions are carried out openly and also bear the character of a warning. The Brutal Mafia does not hide its criminal essence and pays much less attention to compliance with the Code of Honor — money has been and remains their highest priority."

KLG_harmony_uprising_cat: "Democratic Protests"
KLG_harmony_uprising_cat_desc: "The fall of the Storm King and the departure of most of his garrisons significantly weakened the Mafia's control over Kludgetown. This was immediately taken advantage of by its enemies among the supporters of harmony and democratic governance. At present, their informal leader is an Abyssinian named §YCapper Dapperpaws§! — a former pickpocket and hero of the Battle of Aïn Trotghur.\n\n§YThe strength of the protests§! is currently [Root.KLG_harmony_uprising_power_scrloc].\n\nAnd although they have far fewer resources than we do — every day more and more supporters join them, and at a certain point this situation can change dramatically and become truly dangerous."
KLG_harmony_uprising_mission: "Collapse of the Power System"
KLG_harmony_uprising_mission_desc: "The start of mass protests exposed many previously unnoticeable problems of the free city. A critical mass of hidden discontent with Verko's regime had been accumulating for many years and now — with the emergence of such an opportunity after a significant weakening of the Mafia's positions during the occupation of the city by the Storm King's forces — is rapidly spreading among wide sections of the population. For now, Verko holds power in his paws and is not going to give it up just like that. But if the situation finally gets out of control and his life or the lives of his sons is in danger, he will most likely choose to leave the city and not take risks. And this will put an end to the entire management vertical he created and finally untie the paws of the democratic opposition and Capper."
KLG_agent_implementation: "Infiltrate Agents into Opposition Ranks"
KLG_agent_implementation_desc: "Verko always has at his disposal several thousand beings of the most unremarkable appearance, personally loyal to him and his family, without special merits in the criminal world. If desired, they can easily pass for ordinary citizens and win the trust of the person their employer needs to get rid of. This time Verko will send his agents to the lower levels. Their mission is to pretend to be opponents of the regime and try to enter the inner circle of the protest leaders. This will allow us to find out their names faster and sabotage some of the opposition's activities by providing them with false data and using information about them obtained from agents."
KLG_use_agents: "Use Our Agents ([Root.KLG_stage_of_infiltration_scrloc] out of §G5§!)"
KLG_use_agents_desc: "When there are enough beings loyal to us in the opposition's ranks, we will be ready to execute the first stage of our plan. It is necessary to take the most active leaders out of the game if possible, and this can be done in various ways. For example — pass false information about the location of Verko's security agency patrols to them and thus lead them straight into his paws. Or slip something potent into their glass and watch their agony. Of course — this will most likely lead to the exposure of the agent and they won't be able to play their part again — but it will allow us to buy time and better prepare for the execution of the second stage."

KLG_communism_uprising_cat: "Revolution on the Threshold"
KLG_communism_uprising_cat_desc: "The fall of the Storm King and the departure of most of his garrisons significantly weakened the Mafia's control over Kludgetown. Attempts to suppress the democratic protest by force led to its significant radicalization and an increase in the number of supporters of the §YSocial Democratic Workers' Party of Kludgetown§!. Its leader §YIvy Meowlin§! directly declares the need to overthrow the capitalist system and establish a dictatorship of the proletariat in the city.\n\n§RIf the popularity of communism increases to more than 40% — it will be practically impossible to stop the Revolution.§!\n\nThe situation is changing very fast and if we cannot do anything about this unpleasant situation, the communists will soon seize power and encounter virtually no resistance from the population."
KLG_communism_uprising_mission: "Socialist Revolution"
KLG_communism_uprising_mission_desc: "Since the start of mass protests, the Socialist Party has gained significant political capital. Partly thanks to the brutal policy of the city authorities and their manic desire to suppress increasingly moderate democratic movements. As a result, most of the opposition united around the figure of the communist Ivy Meowlin, which allowed him to mobilize a large number of party activists and arm them with enough weapons to overthrow Verko's rule and establish a socialist republic in Kludgetown."
KLG_carry_out_arrests_of_protesters: "Arrest Protesters"
KLG_carry_out_arrests_of_protesters_desc: "The activists of the Social Democratic Workers' Party currently represent the most serious danger. Every day they carry out raids on our partners' offices and wreck security service branches. Rapid response raids are not always fast enough to prevent a new political terrorist attack by the communists. However, we have managed to establish the names of some of them and determine their current place of residence. We must arrest them and do it publicly — so that the consequences of such escapades become as obvious as possible to all supporters of Ivy Meowlin and his militants."
KLG_subject_the_arrested_to_torture: "Subject the Arrested to Torture"
KLG_subject_the_arrested_to_torture_desc: "Dozens of Revolution supporters are currently in the hands of the security service and, despite all attempts to get answers from them without violence, they prefer to remain silent. Consequently — we are obliged to make them speak at any cost. Our supporters have several rather 'extravagant' methods for this purpose."

