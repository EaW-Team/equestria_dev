 ###EVENTS###
 camel.flavor.3.t:0 "Discovery of Heavy-chain Antibodies"
 camel.flavor.3.d:0 "The rapid pace of scientific advancement marches on, and Camelia has strived not to be left behind. Recently, the advancement of biochemistry has allowed Camelkand scientists to discover an interesting quirk of Camelid biology when analyzing tissue samples of several different creatures. The majority of creatures in our world , both sapient and otherwise, rely on the same antibody template, a protein consisting of two light chains and two heavy chains. It is a reliable construct, hence its near universal adoption by most organisms, which allows the immune system to identify and neutralize a variety of antigens present in bacterial or viral cells.\n\nHowever, a sample analysis has revealed that Camelids - the broad family that binds camels, llamas and alpacas together - stand alone among the sapient species of the world in their capability of producing heavy-chain only antibodies, lacking the light chains characteristic of nearly all other antibodies. Research into the matter is ongoing, but the draft opinion of the researchers suggests that this was an adaptation to harsh environments, particularly to dry climates such as those of the Camelian basin and the Llambetian plateau.\n\nAs this is a brand new development in biological research, the possible applications of this knowledge remain purely theoretical, and the discovery amounts to an intriguing particularity of camelid biology. For now, the one bit of confirmed potential in this discovery is that these heavy-chain antibodies are much more robust than normal ones, and can thus be isolated and multiplied in vitro with much less effort, making further experimentation easier. With this in mind, while this quirk of our biological makeup might not amount to much by itself, its discovery alone has already bolstered further scientific research in Camelkand."
 camel.flavor.3.a:0 "A promising development."

 camel.flavor.4.t:0 "Green In the Wastelands"
 camel.flavor.4.d:0 "Many technological advancements have been made towards the development of Camelia in the last few years: the invention of geosynthetics and the refinement of planting techniques makes the stabilization of sandy desert soil possible, while irrigation techniques, electrification and mechanized construction make it possible to dig wells more efficiently, prospect for water resources, level terrain for building and connect far flung settlements across Camelia. Nowhere in our lands is technological advancement more visible than in the Burning Sands, the most desolate portion of our territory.\n\nFor centuries, the Burning Sands had been rightfully considered the most dangerous portion of the Camelian heartlands: it is located near the topological low point of the Camelian basin, where harsh winds create longlasting duststorms and some of the most blistering hot days in the whole of the planet's surface. Poor water access, even compared with the rest of the southern lands, and the land's strategic irrelevance to the Diamond Road have consistently made it the least travelled portion of Camelia, and its scarce inhabitants even more isolated and hardy than the rest of camelkind.\n\nIt has been the sight of the most experimental attempts at desert greening. Record breaking depths have been reached recently in digging for deep water aquifers, and the water has been strictly rationed to feed growing gardens, with selectively bred flora capable of resisting the ambient heat. The last vestiges of traditional nomadic life are coming to an end, as even in this frontier, Camelians settle newly built towns, refurbished with modern ammenities and connected to sprouting public services. Though the overall impact on the economy is insignificant, that even a land as hostile as the Burning Sands can finally be put to good use raises the spirits of every camel across our country; it reminds us that through grit, resilience and ingenuity, no challenge is beyond us."
 camel.flavor.4.a:0 "Hurray for the settlers, and for Camelia!"

 camel.flavor.5.t:0 "On The Progeny of Arakash"
 camel.flavor.5.d:0 "Written by a social historian at the University of Camelkand and published last year by a local printing house, \"On the Progeny of Arakash\" by Java Naim has steadily become an international bestseller among topical scholars. Trying his best to approach the topic from an impartial perspective, Java's work attempts to create a full chronology of the development of the camel people, bridging social history, anatomical studies and linguistics to outline the social, economic and political evolution of Camelian society, from its early nomadic roots, through the founding of Camelkand, the creation of urban society, the short-lived dynastic rules of Camelia, all the way to modernity. Abroad, the book has been nearly universally well received, though Java's chronology is somewhat disputed by some on account of the sparse archeological record, and his conclusions on the cultural identity of the camelian people is not entirely without criticism. In Camelia itself, Java's approach to Camelian religion has been met with a great deal of controversy, due to his choice to interpret to cult of the Vigilant Star and the Arakashic canon long since established in Camelia in a purely social fashion, treating Camelian religious beliefs as an extension of the cultural reality, and not as a concrete belief system about the function of the actual world.\n\n\"On the Progeny of Arakash\"'s popularity and thorough research into the ancestral roots of Camelian society make it an essential read as the first published Camelian scientific volume on social studies, and will surely earn its place in future classrooms both at home and across the world for any creature invested in the topic."
 camel.flavor.5.a:0 "Fascinating."

