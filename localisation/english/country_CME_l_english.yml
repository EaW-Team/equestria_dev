 CME_BLT_war:0 "Camelian Showdown"
 CME_BLT_war_desc:0 "The scryers tap into the infinite flow, and scour the manifold strands of destiny in search of answers. Across Camelia, from the highest peaks of the temple grounds to the lowest reaches of the basin, from the soothing shores of the Furna lake to the wind-scorched peripheries, every camel knows: all the paths converge into one."

